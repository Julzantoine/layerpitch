<!-- Barre repliée (réglage commun, layerpitch-shell.js) : posé avant l'affichage pour que la barre ne saute pas. -->
<script>try { if (localStorage.getItem('layerpitch_sidebar_collapsed') === '1') document.documentElement.classList.add('lp-sidebar-collapsed'); } catch (e) {}</script>
<!-- Langue dans l'adresse (27/10) : ?lang=en ou ?lang=fr (ex. layerpitch-backstage.html?tuto&lang=en) devient la langue mémorisée du Backstage,
     avant tout autre script ; le paramètre est ensuite retiré de l'adresse, pour qu'un rechargement (bouton FR/EN) ne le réimpose pas.
     Nouvelle langue un jour : l'ajouter à la liste ci-dessous (et dans layerpitch-i18n.js). -->
<script>try { const u = new URL(location.href), l = u.searchParams.get('lang'); if (l) { if (['fr', 'en'].includes(l)) localStorage.setItem('layerpitch_lang', l); u.searchParams.delete('lang'); history.replaceState(history.state, '', u.pathname + u.search.replace(/=(?=&|$)/g, '') + u.hash); } } catch (e) {}</script>
