<!DOCTYPE html>

<title>LayerPitch — Mes albums</title>
<!--
  Page fan des Adaptive OST (étape A.5, 26/09/2026) -- réservée à l'admin pendant la bêta (voir layerpitch-docs/feux-verts-admin.md).
  Une seule page, façon Spotify sans suggestions : bibliothèque à gauche, album au centre (onglets Morceaux / Atelier),
  lecteur permanent en bas qui continue pendant la navigation.
    - La BARRE enchaîne des VERSIONS (prises figées) lues en direct depuis leur journal (LayerCaptureRender.playTake) :
      par défaut la version du compositeur, ou celle que le fan a choisie pour ce morceau (album_track_settings.albumVersion).
      Un morceau sans aucune version est sauté.
    - L'ATELIER joue le morceau vivant (lecteur adaptatif habituel). L'enregistrement tourne en permanence : « Figer »
      garde ce que le fan vient d'entendre (décision du 26/09). L'atelier et la barre ne jouent jamais en même temps.
  La version du compositeur s'enregistre dans le Backstage (onglet Albums, étape A.7), jamais ici.
  Mode démo, en local seulement (localhost, ?demo=1&ids=t1,t2) : mêmes écrans, versions gardées en mémoire, sans connexion ;
  &official=t1 donne à t1 une fausse version du compositeur (tests).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="player.css?v=1791296070654">
<style>
  :root {
    --bg: #f5f6f8; --bg-card: #ffffff; --bg-side: #eef0f3; --border: #e2e2e6;
    --text: #24262b; --text-title: #24262b; --text-dim: #5f636b; --text-dimmer: #9a9ea6;
    --accent: #2f80c0; --accent-soft: #e6eef8; --on-accent: #ffffff;
    --seq-map-success: #2f8f5b; --seq-map-choice: #b8862e;
    --cover-empty: linear-gradient(135deg, #23262d, #3a3f48);
    --font-body: 'Inter', system-ui, sans-serif; --font-title: 'Space Grotesk', 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --bg-card: #1d2025; --bg-side: #191817; --border: #30343b;
    --text: #eceef2; --text-title: #f5f6f8; --text-dim: #a3a8b0; --text-dimmer: #737880;
    --accent: #5aa2e0; --accent-soft: #1f3346; --on-accent: #0d1620;
    --seq-map-success: #4fb57e; --seq-map-choice: #d4a64c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; }
  button { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 264px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; height: 100vh; height: 100dvh; }

  /* ---- Bibliothèque ---- */
  .side { grid-row: 1; background: var(--bg-side); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .side-head { display: flex; align-items: center; gap: 8px; padding: 18px 16px 10px; }
  .side-head h1 { font-family: var(--font-title); font-size: 18px; margin: 0; color: var(--text-title); }
  .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .side-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dimmer); padding: 8px 16px 6px; }
  .lib-scroll { flex: 1; min-height: 0; overflow: auto; }
  .lib { padding: 0 8px 8px; }
  .lib-new { padding: 2px 16px 14px; }
  .lib-item-sub { display: block; font-size: 11.5px; color: var(--text-dimmer); }
  .cover.pl-cover { display: grid; place-items: center; color: var(--on-accent); background: linear-gradient(135deg, var(--accent), #7a4a8c); font-size: 18px; border: 0; }
  .cover.pl-cover-lg { width: 184px; height: 184px; font-size: 64px; }
  .cover.pl-mosaic { display: grid; overflow: hidden; background: var(--bg-side); }
  .pl-mosaic.n2, .pl-mosaic.n3, .pl-mosaic.n4 { grid-template-columns: 1fr 1fr; }
  .pl-mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pl-mosaic.n3 img:first-child { grid-row: span 2; }
  .album-head .pl-mosaic { width: 184px; height: 184px; border-radius: 10px; flex: none; }
  .pl-title-input { font: inherit; color: inherit; background: var(--bg-card); border: 1px solid var(--accent); border-radius: 8px; padding: 0 8px; width: 100%; max-width: 560px; }
  .pl-menu { position: fixed; z-index: 1000; min-width: 220px; max-width: min(320px, calc(100vw - 16px)); max-height: 60vh; overflow: auto; background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.18); padding: 6px; }
  .pl-menu-title { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dimmer); padding: 6px 10px 4px; }
  .pl-menu button { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; overflow-wrap: anywhere; }
  .pl-menu button:hover, .pl-menu button:focus-visible { background: var(--accent-soft); color: var(--accent); outline: none; }
  .pl-menu-new { color: var(--accent); border-top: 1px solid var(--border) !important; border-radius: 0 0 6px 6px !important; margin-top: 4px; }
  .t-add, .t-order { width: 1%; white-space: nowrap; }
  .dl-status { position: fixed; right: 16px; bottom: 84px; z-index: 900; max-width: min(420px, calc(100vw - 32px)); background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.14); overflow-wrap: anywhere; }
  .dl-status[hidden] { display: none; }
  .lib-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .lib-item:hover { background: var(--bg-card); }
  .lib-item.active { background: var(--accent-soft); }
  .lib-item .cover { width: 42px; height: 42px; border-radius: 6px; flex: none; }
  .lib-item-title { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-item.active .lib-item-title { color: var(--accent); }
  .side-foot { padding: 10px 16px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .cover { background: var(--cover-empty); object-fit: cover; display: block; border: 1px solid var(--border); }

  /* ---- Centre ---- */
  .main { grid-row: 1; overflow: auto; min-width: 0; }
  .main-inner { max-width: 980px; margin: 0 auto; padding: 28px 32px 40px; }
  .album-head { display: flex; gap: 24px; align-items: flex-end; margin-bottom: 22px; }
  .album-head .cover { width: 184px; height: 184px; border-radius: 10px; flex: none; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  .album-kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }
  .album-title { font-family: var(--font-title); font-size: clamp(26px, 4vw, 44px); line-height: 1.05; margin: 6px 0 10px; color: var(--text-title); overflow-wrap: anywhere; }
  .album-pres { color: var(--text-dim); line-height: 1.6; white-space: pre-wrap; margin: 0; max-width: 60ch; }
  .album-actions { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
  .album-actions { flex-wrap: wrap; }
  .album-hint { font-size: 12.5px; color: var(--text-dim); max-width: 52ch; line-height: 1.5; }
  .play-album:disabled { opacity: .45; cursor: default; }
  .btn { border: 1px solid var(--border); background: var(--bg-card); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { color: var(--on-accent); filter: brightness(1.06); }
  .btn.danger:hover:not(:disabled) { border-color: #d0433a; color: #d0433a; }
  .play-album { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; font-size: 14px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--text-dim); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tab:focus-visible, .btn:focus-visible, .lib-item:focus-visible, .ctrl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tracks { width: 100%; border-collapse: collapse; }
  .tracks th { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dimmer); text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  .tracks td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tracks tr.playing .t-title { color: var(--accent); }
  .t-num { width: 40px; text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .t-play { border: 0; background: none; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; color: var(--text-dim); }
  .t-play:hover:not(:disabled) { color: var(--accent); background: var(--accent-soft); }
  .t-play:disabled { opacity: .3; cursor: default; }
  .t-title { font-weight: 600; }
  .t-sub { font-size: 12px; color: var(--text-dimmer); margin-top: 2px; }
  .t-version select { max-width: 100%; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; }
  .t-dur { width: 60px; text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .t-atelier { width: 1%; white-space: nowrap; }

  .atelier-intro { color: var(--text-dim); line-height: 1.55; margin: 14px 0 16px; max-width: 70ch; }
  .atelier-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .atelier-pick .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .freeze { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 6px; }
  .freeze input { flex: 1 1 200px; min-width: 0; border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; background: var(--bg-card); color: var(--text); font: inherit; }
  .msg { font-size: 13px; color: var(--text-dim); min-height: 1.3em; margin: 4px 0 18px; }
  .versions h3 { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dimmer); margin: 22px 0 8px; }
  .v-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .v-name { flex: 1 1 160px; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .v-name input { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; background: var(--bg-card); color: var(--text); font: inherit; }
  .v-meta { font-size: 12px; color: var(--text-dimmer); font-variant-numeric: tabular-nums; }
  .v-badge { font-family: var(--font-mono); font-size: 10px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 8px; }
  .empty { color: var(--text-dim); padding: 24px 0; }
  .notice { max-width: 420px; margin: 18vh auto 0; text-align: center; color: var(--text-dim); line-height: 1.6; }
  .notice a { color: var(--accent); }
  /* Cadre de carte du lecteur (repris de pack.html : propre à chaque page depuis le 27/09, voir player.css). */
  .track { border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); padding: 26px; margin-bottom: 16px; }
  .track.disabled { opacity: 0.5; }
  /* Le lecteur de l'atelier : carte du lecteur public, ouverte d'office. */
  #atelierPlayer .track { margin-bottom: 0; }

  /* ---- Barre de lecture ---- */
  .bar { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.3fr); gap: 20px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--border); background: var(--bg-card); }
  .now { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .now .cover { width: 48px; height: 48px; border-radius: 6px; flex: none; }
  .now-text { min-width: 0; }
  .now-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-sub { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctrl { display: flex; align-items: center; gap: 8px; }
  .ctrl button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--text-dim); }
  .ctrl button:hover:not(:disabled) { color: var(--text); }
  .ctrl button:disabled { opacity: .35; cursor: default; }
  .ctrl button.main { width: 42px; height: 42px; background: var(--text); color: var(--bg); }
  .ctrl button.main:hover { color: var(--bg); transform: scale(1.04); }
  .ctrl svg { width: 18px; height: 18px; fill: currentColor; }
  .prog { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .prog-track { height: 16px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .prog-rail { position: relative; height: 4px; width: 100%; background: var(--border); border-radius: 2px; }
  .prog-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 2px; }

  .side-head .theme-inline { display: none; }
  @media (max-width: 820px) {
    .side-head .theme-inline { display: inline-flex; margin-left: auto; }
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto; }
    .side { grid-row: 1; border-right: 0; border-bottom: 1px solid var(--border); }
    .side-head { padding: 12px 16px 4px; }
    .side-label { display: none; }
    .lib-scroll { display: flex; overflow-x: auto; align-items: center; padding: 4px 12px 10px; gap: 6px; }
    .lib { display: flex; gap: 6px; padding: 0; }
    .lib-new { padding: 0; flex: none; }
    .album-head .pl-mosaic, .album-head .cover.pl-cover-lg { width: 132px; height: 132px; font-size: 44px; }
    .lib-item { flex: none; width: auto; max-width: 220px; }
    .side-foot { display: none; }
    .main { grid-row: 2; }
    .main-inner { padding: 18px 16px 28px; }
    .album-head { flex-direction: column; align-items: flex-start; gap: 14px; }
    .album-head .cover { width: 132px; height: 132px; }
    .t-version, .tracks th.t-version, .t-atelier, .tracks th.t-atelier { display: none; }
    .bar { grid-row: 3; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 8px 16px 10px; }
    .prog { grid-column: 1 / -1; grid-row: 1; }
  }
</style>
</head>

<div class="app">
  <aside class="side" aria-label="Bibliothèque" id="side">
    <div class="side-head"><h1 id="heading">Mes albums</h1><span class="tag" id="betaTag">bêta · admin</span><button type="button" class="btn theme-inline" data-theme-toggle></button></div>
    <div class="lib-scroll">
      <div class="side-label" id="libLabel">Albums</div>
      <nav class="lib" id="lib"></nav>
      <div class="side-label pl-label"><span id="plLabel">Playlists</span></div>
      <nav class="lib" id="plList"></nav>
      <div class="lib-new"><button type="button" class="btn" id="newPlaylistBtn">+ Nouvelle playlist</button></div>
    </div>
    <div class="side-foot"><button type="button" class="btn" data-theme-toggle></button></div>
  </aside>
  <main class="main" id="main"><div class="main-inner" id="center"></div></main>
  <div class="dl-status" id="dlStatus" role="status" aria-live="polite" hidden></div>
  <footer class="bar" id="bar">
    <div class="now"><div class="cover" id="nowCover"></div><div class="now-text"><div class="now-title" id="nowTitle">—</div><div class="now-sub" id="nowSub"></div></div></div>
    <div class="ctrl">
      <button type="button" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button type="button" id="playBtn" class="main"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 5v14l12-7z"/></svg></button>

<script>
(async () => {
  const P = window.LayerPlayerCore, R = window.LayerCaptureRender;
  // Carte des chemins : même disposition « aérée » que les pages publiques (AdReel, pack) -- retour du 28/09, la
  // disposition compacte par défaut (celle du Backstage) donnait des boucles de flèches sous les nœuds.
  if (P && P.setSeqMapDensity) P.setSeqMapDensity('roomy');
  const $ = id => document.getElementById(id);
  const esc = P.escapeHtml;
  const params = new URLSearchParams(location.search);
  const IMAGES_BASE = 'https://media.layerpitch.com/images/';

  // ---- Langue (?lang=en, comme library.html) ----
  const lang = params.get('lang') === 'en' ? 'en' : 'fr';
  document.documentElement.lang = lang;
  function tr(key, vars) {
    const I = window.LAYERPITCH_I18N || {};
    const pick = d => d && ((d.fanAlbums && d.fanAlbums[key]) || (d.shared && d.shared[key]));
    let s = pick(I[lang]) || pick(I.fr) || key;
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  }
  document.title = tr('pageTitle');
  $('heading').textContent = tr('heading'); $('betaTag').textContent = tr('betaTag');
  $('libLabel').textContent = tr('albumsLabel'); $('plLabel').textContent = tr('playlists'); $('newPlaylistBtn').textContent = tr('newPlaylist');
  $('side').setAttribute('aria-label', tr('library'));
  $('prevBtn').setAttribute('aria-label', tr('prev')); $('nextBtn').setAttribute('aria-label', tr('next'));
  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const fetchBytes = url => window.LayerPlayerCore.fetchAudioBytes(url); // audio protégé : lien signé
  const coverHtml = (illustration, cls) => illustration
    ? `<img class="cover ${cls || ''}" src="${IMAGES_BASE}${esc(illustration)}" alt="">`
    : `<div class="cover ${cls || ''}"></div>`;
  const ICON_PLUS = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>';
  const ICON_PLAY_SM = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>';
  const ICON_DL = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M11 4h2v9l3.5-3.5 1.4 1.4L12 16.8l-5.9-5.9 1.4-1.4L11 13zM5 18h14v2H5z"/></svg>';
  const notifyError = e => window.LayerPitchNotify.error(tr('errorMsg', { error: e.message || e }));

  // ---- Thème clair / nuit : réglage commun à toutes les pages (layerpitch-appearance.js, 29/09) ; ce bouton en est un raccourci ----
  const A = window.LayerPitchAppearance;
  const syncThemeButtons = () => document.querySelectorAll('[data-theme-toggle]').forEach(b => { b.textContent = A.getTheme() === 'dark' ? tr('themeDay') : tr('themeNight'); });
  document.querySelectorAll('[data-theme-toggle]').forEach(b => b.onclick = () => A.setTheme(A.getTheme() === 'dark' ? 'light' : 'dark'));
  document.addEventListener('lp-appearance-change', syncThemeButtons);
  syncThemeButtons();

  const center = $('center');
  const notice = html => { center.innerHTML = `<div class="notice">${html}</div>`; };

  // ---- Données : la base (compte admin pendant la bêta) ou, en local seulement, une démo en mémoire ----
  const demo = params.get('demo') === '1' && ['localhost', '127.0.0.1'].includes(location.hostname);
  const store = demo ? demoStore(params.get('ids') || '') : dbStore();
  function dbStore() {
    const A = window.LayerPitchAlbums, L = window.LayerPitchPlaylists;
    const must = r => { if (r.error) throw new Error(r.error); return r; };
    const ok = r => { if (!r.ok) throw new Error(r.error); return r; };
    return {
      async albums() { return must(await A.listMyPurchases()).purchases.map(p => ({ id: p.albumId, title: p.title, illustration: p.illustration, presentation: lang === 'en' ? (p.presentationEn || p.presentationFr) : (p.presentationFr || p.presentationEn) })); },
      async album(id) { return must(await A.getMyAlbumVersions(id)); },
      async choices(id) { return must(await A.getMyAlbumSettings(id)).settings; },
      async setChoice(albumId, trackId, versionKey) { ok(await A.setMyAlbumTrackSettings(albumId, trackId, { albumVersion: versionKey })); },
      async save(albumId, trackId, name, take) { return ok(await A.saveMyTrackVersion(albumId, trackId, name, take)).id; },
      async rename(id, name) { ok(await A.renameMyTrackVersion(id, name)); },
      async remove(id) { ok(await A.deleteMyTrackVersion(id)); },
      async playlists() { return must(await L.getMyPlaylists()).playlists; },
      async createPlaylist(name) { return ok(await L.createMyPlaylist(name)).id; },
      async renamePlaylist(id, name) { ok(await L.renameMyPlaylist(id, name)); },
      async deletePlaylist(id) { ok(await L.deleteMyPlaylist(id)); },
      async addToPlaylist(pid, albumId, trackId, versionId) { return ok(await L.addToMyPlaylist(pid, albumId, trackId, versionId)).id; },
      async removeFromPlaylist(itemId) { ok(await L.removeFromMyPlaylist(itemId)); },
      async reorderPlaylist(pid, ids) { ok(await L.reorderMyPlaylist(pid, ids)); },
    };
  }
  function demoStore(ids) {
    const trackIds = ids.split(',').filter(Boolean), versions = [], official = {}, chosen = {}, lists = [];
    (params.get('official') || '').split(',').filter(Boolean).forEach(t => { official[t] = { v: 1, kind: 'layerpitch-take', trackId: t, duration: 21, voices: [], sfx: [] }; });
    let n = 0;
    const uid = p => p + (++n);
    const list = id => { const l = lists.find(x => x.id === id); if (!l) throw new Error('Playlist introuvable'); return l; };
    return {
      async albums() { return [{ id: 'demo', title: 'Album de démonstration', illustration: null, presentation: 'Mode démo local : rien n’est enregistré.' }]; },
      async album() { return { tracks: trackIds.map((t, i) => ({ trackId: t, position: i, official: official[t] || null })), versions: versions.slice().reverse() }; },
      async choices() { return trackIds.map(t => ({ trackId: t, settings: chosen[t] ? { albumVersion: chosen[t] } : {}, isCustom: !!chosen[t] })); },
      async setChoice(albumId, trackId, key) { chosen[trackId] = key; },
      async save(albumId, trackId, name, take) { const id = uid('v'); versions.push({ id, trackId, name, take, createdAt: new Date().toISOString() }); return id; },
      async rename(id, name) { const v = versions.find(x => x.id === id); if (v) v.name = name; },
      async remove(id) {
        const i = versions.findIndex(v => v.id === id); if (i >= 0) versions.splice(i, 1);
        lists.forEach(l => { l.items = l.items.filter(it => it.versionId !== id); }); // cascade, comme la base
      },
      async playlists() { return JSON.parse(JSON.stringify(lists)); },
      async createPlaylist(name) { const id = uid('p'); lists.push({ id, name, items: [] }); return id; },
      async renamePlaylist(id, name) { list(id).name = name; },
      async deletePlaylist(id) { lists.splice(lists.indexOf(list(id)), 1); },
      async addToPlaylist(pid, albumId, trackId, versionId) { const id = uid('i'); list(pid).items.push({ id, albumId, trackId, versionId: versionId || null }); return id; },
      async removeFromPlaylist(itemId) { lists.forEach(l => { l.items = l.items.filter(it => it.id !== itemId); }); },
      async reorderPlaylist(pid, order) { const l = list(pid); l.items = order.map(id => l.items.find(it => it.id === id)); },
    };
  }

  // ---- Accès : connecté ET admin pendant la bêta (hors démo locale) ----
  if (!demo) {
    const { session } = await window.LayerPitchAuth.getSession();
    if (!session) { notice(`${esc(tr('signedOut'))}<br><a href="bienvenue.html">${esc(tr('signInLink'))}</a>`); $('bar').hidden = true; return; }
    const { data: isAdmin } = await window.LayerPitchSupabaseClient.getClient().rpc('is_admin');
    if (!isAdmin) { notice(esc(tr('adminOnly'))); $('bar').hidden = true; return; }
  }

  P.setTakeRecording(true); // l'atelier enregistre en permanence : Figer garde ce qui vient d'être entendu
  const trackCache = {}, sfxCache = {};
  async function loadTrack(id) {
    if (!trackCache[id]) { const r = await window.LayerPitchTracks.getTrack(id); if (!r.track) throw new Error('track ' + id); trackCache[id] = r.track; }
    return trackCache[id];
  }

  // ---- État ----
  let albums = [], playlists = [];
  const albumCache = {};      // id -> { id, title, illustration, presentation, tracks: [{ track, official, choice }], versions }
  let view = null;            // { kind: 'album' | 'playlist', id }
  let album = null;           // album affiché (vue album)
  let tab = 'tracks';
  let atelierTrackId = null;
  let queue = [], qi = -1;    // file de la barre : [{ albumId, trackId, title, sub, take, key, cover, itemId? }]
  let queueSource = null;     // { kind: 'album' | 'playlist', id } : d'où vient la file (pour la tenir à jour)
  let ctrl = null, playing = false, starting = false, pausedAt = 0, turn = 0;

  try { [albums, playlists] = await Promise.all([store.albums(), store.playlists()]); }
  catch (e) { notice(esc(tr('errorMsg', { error: e.message }))); return; }

  // ---- Bibliothèque : albums, puis playlists ----
  const isView = (kind, id) => view && view.kind === kind && view.id === id;
  function renderLib() {
    $('lib').innerHTML = albums.length ? albums.map(a => `
      <button type="button" class="lib-item${isView('album', a.id) ? ' active' : ''}" data-album="${esc(a.id)}"${isView('album', a.id) ? ' aria-current="true"' : ''}>
        ${coverHtml(a.illustration)}<span class="lib-item-title">${esc(a.title || '—')}</span>
      </button>`).join('') : `<div class="empty" style="padding:8px">${esc(tr('libraryEmpty'))}</div>`;
    $('lib').querySelectorAll('[data-album]').forEach(b => b.onclick = () => openAlbum(b.dataset.album));
    $('plList').innerHTML = playlists.map(p => `
      <button type="button" class="lib-item${isView('playlist', p.id) ? ' active' : ''}" data-playlist="${esc(p.id)}"${isView('playlist', p.id) ? ' aria-current="true"' : ''}>
        <div class="cover pl-cover" aria-hidden="true">♫</div><span><span class="lib-item-title">${esc(p.name || '—')}</span><span class="lib-item-sub">${esc(countLabel(p.items.length))}</span></span>
      </button>`).join('');
    $('plList').querySelectorAll('[data-playlist]').forEach(b => b.onclick = () => openPlaylist(b.dataset.playlist));
  }
  const countLabel = n => n === 1 ? tr('playlistCountOne') : tr('playlistCount', { n });
  renderLib();
  $('newPlaylistBtn').onclick = () => createPlaylist(null);

  // ---- Albums et versions ----
  async function loadAlbumData(id) {
    if (albumCache[id]) return albumCache[id];
    const a = albums.find(x => x.id === id);
    if (!a) return null;
    const [data, choices] = await Promise.all([store.album(id), store.choices(id)]);
    const choiceOf = {};
    for (const c of choices || []) if (c.isCustom && c.settings && c.settings.albumVersion) choiceOf[c.trackId] = c.settings.albumVersion;
    const tracks = [];
    for (const t of data.tracks) tracks.push({ track: await loadTrack(t.trackId), official: t.official, choice: choiceOf[t.trackId] || null });
    // Sfx des morceaux : le lecteur les cherche dans sa bibliothèque.
    for (const t of tracks) for (const sid of (t.track.sfxIds || [])) {
      if (!sfxCache[sid]) { const r = await window.LayerPitchSfx.getSfx(sid); if (r && r.sfx) sfxCache[sid] = r.sfx; }
    }
    P.setSfxLibrary(Object.assign({}, sfxCache));
    albumCache[id] = { id, title: a.title, illustration: a.illustration, presentation: a.presentation, tracks, versions: data.versions };
    return albumCache[id];
  }
  const versionsOf = (al, trackId) => al.versions.filter(v => v.trackId === trackId); // plus récentes d'abord
  // Nom affiché : le nom donné, sinon « Version n » dans l'ordre de création (1 = la plus ancienne).
  function versionName(al, v) {
    if (v.name) return v.name;
    const all = versionsOf(al, v.trackId);
    return tr('versionN', { n: all.length - all.indexOf(v) });
  }
  // Version jouée dans l'album : le choix du fan s'il existe encore, sinon celle du compositeur, sinon la plus récente
  // du fan. null = aucune version (morceau sauté).
  function albumEntryKey(al, t) {
    const mine = versionsOf(al, t.track.id);
    if (t.choice === 'official' && t.official) return 'official';
    if (t.choice && mine.some(v => v.id === t.choice)) return t.choice;
    if (t.official) return 'official';
    return mine[0] ? mine[0].id : null;
  }
  function entryFor(al, t, key) {
    if (!key || !t) return null;
    const base = { albumId: al.id, trackId: t.track.id, title: t.track.title, key, cover: al.illustration, albumTitle: al.title };
    if (key === 'official') return t.official ? Object.assign(base, { sub: tr('officialVersion'), take: t.official }) : null;
    const v = al.versions.find(x => x.id === key);
    return v ? Object.assign(base, { sub: versionName(al, v), take: v.take }) : null;
  }
  const trackOf = (al, trackId) => al && al.tracks.find(x => x.track.id === trackId);

  async function openAlbum(id, keep) {
    if (!keep) center.innerHTML = `<div class="empty">${esc(tr('loading'))}</div>`;
    try {
      const al = await loadAlbumData(id);
      const changedAlbum = !album || album.id !== id;
      album = al; view = { kind: 'album', id };
      if (changedAlbum) { stopAtelier(); atelierMountedFor = null; atelierTrackId = al.tracks[0] ? al.tracks[0].track.id : null; if (!keep) tab = 'tracks'; }
      renderLib();
      render();
    } catch (e) { notice(esc(tr('errorMsg', { error: e.message }))); }
  }
  function render() {
    if (view && view.kind === 'playlist') { renderPlaylistView(); return; }
    center.innerHTML = `
      <header class="album-head">
        ${coverHtml(album.illustration)}
        <div>
          <div class="album-kicker">${esc(tr('albumKicker'))}</div>
          <h2 class="album-title">${esc(album.title || '—')}</h2>
          ${album.presentation ? `<p class="album-pres">${esc(album.presentation)}</p>` : ''}
        </div>
      </header>
      <div class="album-actions">
        <button type="button" class="btn primary play-album" id="playAlbumBtn">${ICON_PLAY_SM.replace('width="14" height="14"', 'width="16" height="16"')}${esc(tr('playAlbum'))}</button>
        <span class="album-hint" id="playAlbumHint" hidden>${esc(tr('noPlayableVersion'))}</span>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" id="tabTracks" aria-selected="${tab === 'tracks'}" aria-controls="panelTracks">${esc(tr('tabTracks'))}</button>
        <button type="button" class="tab" role="tab" id="tabAtelier" aria-selected="${tab === 'atelier'}" aria-controls="panelAtelier">${esc(tr('tabAtelier'))}</button>
      </div>
      <section id="panelTracks" role="tabpanel" aria-labelledby="tabTracks"${tab === 'tracks' ? '' : ' hidden'}></section>
      <section id="panelAtelier" role="tabpanel" aria-labelledby="tabAtelier"${tab === 'atelier' ? '' : ' hidden'}></section>`;
    $('playAlbumBtn').onclick = () => startQueue({ kind: 'album', id: album.id }, 0);
    $('tabTracks').onclick = () => switchTab('tracks');
    $('tabAtelier').onclick = () => switchTab('atelier');
    renderTracks();
    renderAtelier();
  }
  function switchTab(t) {
    tab = t;
    $('tabTracks').setAttribute('aria-selected', t === 'tracks'); $('tabAtelier').setAttribute('aria-selected', t === 'atelier');
    $('panelTracks').hidden = t !== 'tracks'; $('panelAtelier').hidden = t !== 'atelier';
  }

  // ---- Onglet Morceaux ----
  function renderTracks() {
    const box = $('panelTracks');
    if (!box || !album) return;
    // « Écouter l'album » n'enchaîne que les versions enregistrées : sans aucune, le bouton est grisé et on explique
    // quoi faire (retour du 28/09 : il lançait une file vide et affichait aussitôt « Fin de l'album »).
    const playable = album.tracks.some(t => entryFor(album, t, albumEntryKey(album, t)));
    if ($('playAlbumBtn')) $('playAlbumBtn').disabled = !playable;
    if ($('playAlbumHint')) $('playAlbumHint').hidden = playable;
    const now = queue[qi];
    box.innerHTML = `<table class="tracks">
      <thead><tr><th class="t-num">#</th><th></th><th>${esc(tr('colTitle'))}</th><th class="t-version">${esc(tr('colVersion'))}</th><th class="t-dur"></th><th class="t-add"></th><th class="t-atelier"></th></tr></thead>
      <tbody>${album.tracks.map((t, i) => {
        const key = albumEntryKey(album, t), e = entryFor(album, t, key), mine = versionsOf(album, t.track.id);
        const options = [t.official ? `<option value="official"${key === 'official' ? ' selected' : ''}>★ ${esc(tr('officialVersion'))}</option>` : '']
          .concat(mine.map(v => `<option value="${esc(v.id)}"${key === v.id ? ' selected' : ''}>${esc(versionName(album, v))} · ${fmt(v.take.duration)}</option>`)).join('');
        return `<tr class="${now && now.albumId === album.id && now.trackId === t.track.id ? 'playing' : ''}">
          <td class="t-num">${i + 1}</td>
          <td><button type="button" class="t-play" data-play="${esc(t.track.id)}" aria-label="${esc(tr('playThis'))} · ${esc(t.track.title)}"${e ? '' : ' disabled'}>${ICON_PLAY_SM}</button></td>
          <td><div class="t-title">${esc(t.track.title)}</div>${e ? `<div class="t-sub">${esc(e.sub)}</div>` : `<div class="t-sub">${esc(tr('noVersionYet'))}</div>`}</td>
          <td class="t-version">${options ? `<select data-choice="${esc(t.track.id)}" aria-label="${esc(tr('colVersion'))}">${options}</select>` : ''}</td>
          <td class="t-dur">${e ? fmt(e.take.duration) : ''}</td>
          <td class="t-add"><button type="button" class="t-play" data-add-track="${esc(t.track.id)}" aria-label="${esc(tr('addToPlaylist'))} · ${esc(t.track.title)}" title="${esc(tr('addToPlaylist'))}"${e ? '' : ' disabled'}>${ICON_PLUS}</button><button type="button" class="t-play" data-dl-track="${esc(t.track.id)}" aria-label="${esc(tr('download'))} · ${esc(t.track.title)}" title="${esc(tr('download'))}"${e ? '' : ' disabled'}>${ICON_DL}</button></td>
          <td class="t-atelier"><button type="button" class="btn" data-atelier="${esc(t.track.id)}">${esc(tr('openInAtelier'))}</button></td>
        </tr>`;
      }).join('')}</tbody></table>`;
    box.querySelectorAll('[data-play]').forEach(b => b.onclick = () => startQueue({ kind: 'album', id: album.id }, null, x => x.trackId === b.dataset.play));
    box.querySelectorAll('[data-choice]').forEach(s => s.onchange = () => chooseVersion(s.dataset.choice, s.value));
    box.querySelectorAll('[data-add-track]').forEach(b => b.onclick = () => {
      const t = trackOf(album, b.dataset.addTrack);
      openAddMenu(b, { albumId: album.id, trackId: t.track.id, key: albumEntryKey(album, t) });
    });
    box.querySelectorAll('[data-dl-track]').forEach(b => b.onclick = () => {
      const t = trackOf(album, b.dataset.dlTrack);
      openDownloadMenu(b, entryFor(album, t, albumEntryKey(album, t)));
    });
    box.querySelectorAll('[data-atelier]').forEach(b => b.onclick = () => { openAtelier(b.dataset.atelier); switchTab('atelier'); });
  }
  async function chooseVersion(trackId, key) {
    const t = trackOf(album, trackId);
    try { await store.setChoice(album.id, trackId, key); t.choice = key; }
    catch (e) { notifyError(e); }
    refreshQueue();
    renderTracks(); renderAtelierVersions();
  }

  // ---- Onglet Atelier : le morceau vivant, Figer, mes versions ----
  // Le lecteur vivant n'est reconstruit que lorsqu'on change de morceau (un rendu de la liste ne le coupe pas).
  let atelierMountedFor = null;
  function renderAtelier() {
    const box = $('panelAtelier');
    const t = trackOf(album, atelierTrackId);
    if (!t) { box.innerHTML = ''; return; }
    box.innerHTML = `
      <p class="atelier-intro">${esc(tr('atelierIntro'))}</p>
      <div class="atelier-pick" role="group" aria-label="${esc(tr('atelierTrack'))}">${album.tracks.map(x => `<button type="button" class="btn" data-pick="${esc(x.track.id)}" aria-pressed="${x.track.id === atelierTrackId}">${esc(x.track.title)}</button>`).join('')}</div>
      <div id="atelierPlayer"></div>
      <div class="freeze" style="margin-top:14px">
        <input type="text" id="freezeName" maxlength="120" placeholder="${esc(tr('freezeNamePlaceholder'))}" aria-label="${esc(tr('freezeNamePlaceholder'))}">
        <button type="button" class="btn primary" id="freezeBtn">${esc(tr('freezeBtn'))}</button>
      </div>
      <div class="msg" id="freezeMsg" role="status"></div>
      <div class="versions" id="atelierVersions"></div>`;
    box.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => openAtelier(b.dataset.pick));
    // Le lecteur vivant garde son état : on déplace son nœud existant au lieu de le reconstruire.
    if (atelierMountedFor && atelierMountedFor.trackId === atelierTrackId) $('atelierPlayer').appendChild(atelierMountedFor.row);
    else mountAtelierPlayer(t);
    $('freezeBtn').onclick = () => freeze(t);
    renderAtelierVersions();
  }
  function mountAtelierPlayer(t) {
    const row = P.buildTrackRow(t.track, null, false);
    $('atelierPlayer').appendChild(row);
    P.initTrackPlayer(t.track, row);
    atelierMountedFor = { trackId: t.track.id, row };
  }
  function openAtelier(trackId) {
    if (trackId !== atelierTrackId) { stopAtelier(); atelierTrackId = trackId; atelierMountedFor = null; }
    renderAtelier();
  }
  function stopAtelier() { if (atelierTrackId) document.dispatchEvent(new CustomEvent('stop-track', { detail: atelierTrackId })); }
  const currentTake = t => { const k = P.getTrackTake(t.track.id); return k && k.voices.length ? k : null; };
  const say = text => { const m = $('freezeMsg'); if (m) m.textContent = text; };
  async function freeze(t) {
    const take = currentTake(t);
    if (!take) { say(tr('freezeNothing')); return; }
    if (take.missing) { say(tr('freezeUnpublished')); return; }
    const btn = $('freezeBtn'); btn.disabled = true;
    try {
      await store.save(album.id, t.track.id, $('freezeName').value.trim(), take);
      await reloadVersions(album);
      $('freezeName').value = '';
      say(tr('freezeDone', { duration: fmt(take.duration) }));
    } catch (e) { say(tr('errorMsg', { error: e.message })); }
    finally { btn.disabled = false; }
  }
  // Recharge versions et version du compositeur d'un album, sans toucher au lecteur vivant.
  async function reloadVersions(al) {
    const data = await store.album(al.id);
    al.versions = data.versions;
    for (const t of al.tracks) { const d = data.tracks.find(x => x.trackId === t.track.id); t.official = d ? d.official : null; }
    refreshQueue();
    renderTracks(); renderAtelierVersions();
  }
  function renderAtelierVersions() {
    const box = $('atelierVersions');
    if (!box || !album) return;
    const t = trackOf(album, atelierTrackId);
    const key = albumEntryKey(album, t), mine = versionsOf(album, t.track.id), now = queue[qi];
    const row = (id, name, meta, canEdit) => `
      <div class="v-row" data-vrow="${esc(id)}">
        <button type="button" class="t-play" data-vplay="${esc(id)}" aria-label="${esc(tr('playThis'))} · ${esc(name)}">${ICON_PLAY_SM}</button>
        <span class="v-name" style="${now && now.albumId === album.id && now.key === id && now.trackId === t.track.id ? 'color:var(--accent)' : ''}">${esc(name)}</span>
        <span class="v-meta">${meta}</span>
        ${key === id ? `<span class="v-badge">${esc(tr('usedInAlbum'))}</span>` : `<button type="button" class="btn" data-vuse="${esc(id)}">${esc(tr('useInAlbum'))}</button>`}
        <button type="button" class="btn" data-vadd="${esc(id)}">${ICON_PLUS} ${esc(tr('addToPlaylist'))}</button>
        <button type="button" class="btn" data-vdl="${esc(id)}">${ICON_DL} ${esc(tr('download'))}</button>
        ${canEdit ? `<button type="button" class="btn" data-vrename="${esc(id)}">${esc(tr('renameBtn'))}</button><button type="button" class="btn danger" data-vdel="${esc(id)}">${esc(tr('deleteBtn'))}</button>` : ''}
      </div>`;
    box.innerHTML = (t.official ? row('official', '★ ' + tr('officialVersion'), fmt(t.official.duration), false) : '')
      + `<h3>${esc(tr('myVersions'))}</h3>`
      + (mine.length ? mine.map(v => row(v.id, versionName(album, v), `${fmt(v.take.duration)} · ${new Date(v.createdAt).toLocaleString(lang, { dateStyle: 'short', timeStyle: 'short' })}`, true)).join('')
        : `<div class="empty" style="padding:8px 0">${esc(tr('noMyVersions'))}</div>`);
    box.querySelectorAll('[data-vplay]').forEach(b => b.onclick = () => startQueue({ kind: 'album', id: album.id }, null, x => x.trackId === t.track.id, { trackId: t.track.id, key: b.dataset.vplay }));
    box.querySelectorAll('[data-vuse]').forEach(b => b.onclick = () => chooseVersion(t.track.id, b.dataset.vuse));
    box.querySelectorAll('[data-vadd]').forEach(b => b.onclick = () => openAddMenu(b, { albumId: album.id, trackId: t.track.id, key: b.dataset.vadd }));
    box.querySelectorAll('[data-vdl]').forEach(b => b.onclick = () => openDownloadMenu(b, entryFor(album, t, b.dataset.vdl)));
    box.querySelectorAll('[data-vdel]').forEach(b => b.onclick = () => deleteVersion(b.dataset.vdel));
    box.querySelectorAll('[data-vrename]').forEach(b => b.onclick = () => startRename(b.dataset.vrename));
  }
  function startRename(id) {
    const v = album.versions.find(x => x.id === id);
    const cell = document.querySelector(`[data-vrow="${CSS.escape(id)}"] .v-name`);
    cell.innerHTML = `<input type="text" maxlength="120" value="${esc(v.name || '')}" placeholder="${esc(versionName(album, v))}" aria-label="${esc(tr('renameBtn'))}">`;
    inlineEdit(cell.querySelector('input'), v.name || '', async name => { await store.rename(id, name); v.name = name; }, () => {
      refreshQueue(); renderTracks(); renderAtelierVersions(); if (view.kind === 'playlist') renderPlaylistView();
    });
  }
  // Champ de saisie sur place : Entrée ou sortie du champ = enregistrer, Échap = annuler ; `after` redessine.
  function inlineEdit(input, before, save, after) {
    input.focus(); input.select();
    let done = false;
    const commit = async keep => {
      if (done) return; done = true;
      const value = input.value.trim();
      if (keep && value !== before) { try { await save(value); } catch (e) { notifyError(e); } }
      after();
    };
    input.onkeydown = e => { if (e.key === 'Enter') commit(true); else if (e.key === 'Escape') commit(false); };
    input.onblur = () => commit(true);
  }
  async function deleteVersion(id) {
    const v = album.versions.find(x => x.id === id);
    if (!await window.LayerPitchNotify.confirm(tr('deleteConfirm', { name: versionName(album, v) }), { danger: true, okLabel: tr('deleteBtn') })) return;
    if (queue[qi] && queue[qi].key === id) { stopBar(); qi = -1; showNow(null); }
    try {
      await store.remove(id);
      playlists = await store.playlists(); // la version quitte aussi les playlists (suppression en cascade)
      renderLib();
      await reloadVersions(album);
    } catch (e) { notifyError(e); }
  }

  // ---- Playlists ----
  const playlistById = id => playlists.find(p => p.id === id);
  async function reloadPlaylists() { playlists = await store.playlists(); renderLib(); }
  async function createPlaylist(thenAdd) {
    try {
      const id = await store.createPlaylist(tr('playlistDefaultName', { n: playlists.length + 1 }));
      if (thenAdd) await store.addToPlaylist(id, thenAdd.albumId, thenAdd.trackId, thenAdd.key === 'official' ? null : thenAdd.key);
      await reloadPlaylists();
      if (thenAdd) window.LayerPitchNotify.success(tr('addedToPlaylist', { name: playlistById(id).name }));
      else await openPlaylist(id, true);
    } catch (e) { notifyError(e); }
  }
  // Menu « Ajouter à une playlist » : ses playlists, puis « Nouvelle playlist… » (créée avec ce morceau dedans).
  // Petit menu flottant sous (ou au-dessus de) son bouton : un seul ouvert à la fois, fermé par un clic ailleurs ou Échap.
  function closeAddMenu() { const m = $('plMenu'); if (m) m.remove(); menuAnchor = null; }
  let menuAnchor = null;
  function showMenu(anchor, html) {
    closeAddMenu();
    const m = document.createElement('div');
    m.id = 'plMenu'; m.className = 'pl-menu'; m.setAttribute('role', 'menu');
    m.innerHTML = html;
    document.body.appendChild(m);
    menuAnchor = anchor;
    const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
    m.style.left = Math.max(8, Math.min(innerWidth - mw - 8, r.right - mw)) + 'px';
    m.style.top = (r.bottom + mh + 8 > innerHeight ? Math.max(8, r.top - mh - 4) : r.bottom + 4) + 'px';
    const first = m.querySelector('button'); if (first) first.focus();
    return m;
  }
  function openAddMenu(anchor, what) {
    if (!what.key) return;
    const m = showMenu(anchor, `<div class="pl-menu-title">${esc(tr('addToPlaylist'))}</div>`
      + playlists.map(p => `<button type="button" role="menuitem" data-to="${esc(p.id)}">${esc(p.name || '—')}</button>`).join('')
      + `<button type="button" role="menuitem" data-to="" class="pl-menu-new">${ICON_PLUS} ${esc(tr('newPlaylistInMenu'))}</button>`);
    m.querySelectorAll('[data-to]').forEach(b => b.onclick = async () => {
      closeAddMenu();
      if (!b.dataset.to) { await createPlaylist(what); return; }
      try {
        await store.addToPlaylist(b.dataset.to, what.albumId, what.trackId, what.key === 'official' ? null : what.key);
        await reloadPlaylists();
        window.LayerPitchNotify.success(tr('addedToPlaylist', { name: playlistById(b.dataset.to).name }));
        if (isView('playlist', b.dataset.to)) renderPlaylistView();
        refreshQueue();
      } catch (e) { notifyError(e); }
    });
  }
  document.addEventListener('click', e => { const m = $('plMenu'); if (m && !m.contains(e.target) && !(menuAnchor && menuAnchor.contains(e.target))) closeAddMenu(); });

  // ---- Téléchargement d'une version (A.8, 27/09) : MP3 (320 kbit/s, étiquettes titre/album) ou WAV (sans perte) ----
  // Le fichier est fabriqué à la demande dans le navigateur, à partir du journal de la version (rendu identique à
  // l'écoute) : rien n'est stocké, les fichiers audio qu'une version utilise sont gardés côté serveur pour toujours.
  function openDownloadMenu(anchor, entry) {
    if (!entry) return;
    const m = showMenu(anchor, `<div class="pl-menu-title">${esc(tr('download'))}</div>
      <button type="button" role="menuitem" data-fmt="mp3">${esc(tr('downloadMp3'))}</button>
      <button type="button" role="menuitem" data-fmt="wav">${esc(tr('downloadWav'))}</button>`);
    m.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => { closeAddMenu(); downloadEntry(entry, b.dataset.fmt); });
  }
  let lameLoading = null;
  function loadLame() {
    if (window.lamejs) return Promise.resolve();
    if (!lameLoading) lameLoading = new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
      sc.onload = resolve;
      sc.onerror = () => { lameLoading = null; reject(new Error('lamejs')); };
      document.head.appendChild(sc);
    });
    return lameLoading;
  }
  const safeName = s => String(s || '').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120) || 'LayerPitch';
  let downloading = false;
  async function downloadEntry(entry, fmt) {
    if (downloading) { window.LayerPitchNotify.info(tr('downloadBusy')); return; }
    downloading = true;
    const label = `${entry.title} (${entry.sub})`;
    const status = $('dlStatus');
    const show = text => { status.hidden = false; status.textContent = text; };
    try {
      show(tr('downloadRendering', { name: label }));
      const [buffer] = await Promise.all([R.renderTake(entry.take, { fetchBytes }), fmt === 'mp3' ? loadLame() : null]);
      let bytes;
      if (fmt === 'mp3') {
        bytes = await R.encodeMp3(buffer, { tags: { title: label, album: entry.albumTitle || '' }, onProgress: f => show(tr('downloadEncoding', { name: label, pct: Math.round(f * 100) })) });
      } else bytes = R.encodeWav(buffer);
      const file = safeName(`${entry.albumTitle ? entry.albumTitle + ' - ' : ''}${label}`) + '.' + fmt;
      const url = URL.createObjectURL(new Blob([bytes], { type: fmt === 'mp3' ? 'audio/mpeg' : 'audio/wav' }));
      const a = document.createElement('a');
      a.href = url; a.download = file;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      status.hidden = true;
      window.LayerPitchNotify.success(tr('downloadDone', { file }));
    } catch (e) {
      status.hidden = true;
      notifyError(e);
    } finally { downloading = false; }
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAddMenu(); });

  // Entrées d'une playlist résolues en versions jouables (albums chargés à la demande) ; celles dont la version
  // n'existe plus sont écartées.
  async function playlistEntries(p) {
    const out = [];
    for (const it of p.items) {
      const al = await loadAlbumData(it.albumId).catch(() => null);
      const e = al ? entryFor(al, trackOf(al, it.trackId), it.versionId || 'official') : null;
      if (e) out.push(Object.assign(e, { itemId: it.id }));
    }
    return out;
  }
  async function openPlaylist(id, editName) {
    view = { kind: 'playlist', id };
    stopAtelier();
    renderLib();
    center.innerHTML = `<div class="empty">${esc(tr('loading'))}</div>`;
    await renderPlaylistView(editName);
  }
  async function renderPlaylistView(editName) {
    const p = playlistById(view.id);
    if (!p) { view = null; album ? openAlbum(album.id, true) : (albums[0] && openAlbum(albums[0].id)); return; }
    const entries = await playlistEntries(p);
    if (!isView('playlist', p.id)) return; // l'utilisateur est parti entre-temps
    const total = entries.reduce((s, e) => s + (e.take.duration || 0), 0);
    const covers = [...new Set(entries.map(e => e.cover).filter(Boolean))].slice(0, 4);
    const now = queue[qi];
    center.innerHTML = `
      <header class="album-head">
        ${covers.length ? `<div class="cover pl-mosaic n${covers.length}">${covers.map(c => `<img src="${IMAGES_BASE}${esc(c)}" alt="">`).join('')}</div>` : '<div class="cover pl-cover pl-cover-lg" aria-hidden="true">♫</div>'}
        <div>
          <div class="album-kicker">${esc(tr('playlistKicker'))}</div>
          <h2 class="album-title" id="plTitle">${esc(p.name || '—')}</h2>
          <p class="album-pres">${esc(countLabel(entries.length))}${entries.length ? ' · ' + fmt(total) : ''}</p>
        </div>
      </header>
      <div class="album-actions">
        <button type="button" class="btn primary play-album" id="playPlaylistBtn"${entries.length ? '' : ' disabled'}>${ICON_PLAY_SM.replace('width="14" height="14"', 'width="16" height="16"')}${esc(tr('playPlaylist'))}</button>
        <button type="button" class="btn" id="renamePlaylistBtn">${esc(tr('renamePlaylist'))}</button>
        <button type="button" class="btn danger" id="deletePlaylistBtn">${esc(tr('deletePlaylist'))}</button>
      </div>
      ${entries.length ? `<table class="tracks"><tbody>${entries.map((e, i) => `
        <tr class="${now && now.itemId === e.itemId ? 'playing' : ''}">
          <td class="t-num">${i + 1}</td>
          <td><button type="button" class="t-play" data-pl-play="${esc(e.itemId)}" aria-label="${esc(tr('playThis'))} · ${esc(e.title)}">${ICON_PLAY_SM}</button></td>
          <td><div class="t-title">${esc(e.title)}</div><div class="t-sub">${esc(e.albumTitle || '')} · ${esc(e.sub)}</div></td>
          <td class="t-dur">${fmt(e.take.duration)}</td>
          <td class="t-order">
            <button type="button" class="t-play" data-pl-move="${esc(e.itemId)}" data-dir="-1" aria-label="${esc(tr('moveUp'))}" title="${esc(tr('moveUp'))}"${i === 0 ? ' disabled' : ''}>↑</button>
            <button type="button" class="t-play" data-pl-move="${esc(e.itemId)}" data-dir="1" aria-label="${esc(tr('moveDown'))}" title="${esc(tr('moveDown'))}"${i === entries.length - 1 ? ' disabled' : ''}>↓</button>
            <button type="button" class="t-play" data-pl-dl="${esc(e.itemId)}" aria-label="${esc(tr('download'))} · ${esc(e.title)}" title="${esc(tr('download'))}">${ICON_DL}</button>
            <button type="button" class="t-play" data-pl-remove="${esc(e.itemId)}" aria-label="${esc(tr('removeFromPlaylist'))}" title="${esc(tr('removeFromPlaylist'))}">✕</button>
          </td>
        </tr>`).join('')}</tbody></table>` : `<div class="empty">${esc(tr('playlistEmpty'))}</div>`}`;
    const src = { kind: 'playlist', id: p.id };
    $('playPlaylistBtn').onclick = () => startQueue(src, 0);
    center.querySelectorAll('[data-pl-play]').forEach(b => b.onclick = () => startQueue(src, null, x => x.itemId === b.dataset.plPlay));
    center.querySelectorAll('[data-pl-dl]').forEach(b => b.onclick = () => openDownloadMenu(b, entries.find(e => e.itemId === b.dataset.plDl)));
    center.querySelectorAll('[data-pl-remove]').forEach(b => b.onclick = async () => {
      try { await store.removeFromPlaylist(b.dataset.plRemove); await reloadPlaylists(); refreshQueue(); renderPlaylistView(); } catch (e) { notifyError(e); }
    });
    center.querySelectorAll('[data-pl-move]').forEach(b => b.onclick = async () => {
      const ids = p.items.map(it => it.id), i = ids.indexOf(b.dataset.plMove), j = i + Number(b.dataset.dir);
      if (i < 0 || j < 0 || j >= ids.length) return;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      try { await store.reorderPlaylist(p.id, ids); await reloadPlaylists(); refreshQueue(); renderPlaylistView(); } catch (e) { notifyError(e); }
    });
    $('renamePlaylistBtn').onclick = () => renamePlaylistInline(p);
    $('deletePlaylistBtn').onclick = async () => {
      if (!await window.LayerPitchNotify.confirm(tr('deletePlaylistConfirm', { name: p.name || '—' }), { danger: true, okLabel: tr('deleteBtn') })) return;
      try {
        await store.deletePlaylist(p.id);
        if (queueSource && queueSource.kind === 'playlist' && queueSource.id === p.id) queueSource = null;
        await reloadPlaylists();
        view = null;
        openAlbum(album ? album.id : albums[0].id, !!album);
      } catch (e) { notifyError(e); }
    };
    if (editName) renamePlaylistInline(p);
  }
  function renamePlaylistInline(p) {
    const h = $('plTitle');
    h.innerHTML = `<input type="text" class="pl-title-input" maxlength="120" value="${esc(p.name || '')}" aria-label="${esc(tr('renamePlaylist'))}">`;
    inlineEdit(h.querySelector('input'), p.name || '', async name => { await store.renamePlaylist(p.id, name); }, async () => { await reloadPlaylists(); renderPlaylistView(); });
  }

  // ---- File de la barre : un album (tel que le fan l'a choisi) ou une playlist ----
  async function queueFor(source, override) {
    if (source.kind === 'playlist') { const p = playlistById(source.id); return p ? playlistEntries(p) : []; }
    const al = await loadAlbumData(source.id);
    return al.tracks.map(t => entryFor(al, t, override && override.trackId === t.track.id ? override.key : albumEntryKey(al, t))).filter(Boolean);
  }
  // Démarre la file : à l'index donné, ou à la première entrée qui vérifie `match`.
  async function startQueue(source, index, match, override) {
    queueSource = source;
    queue = await queueFor(source, override);
    playIndex(match ? queue.findIndex(match) : (index || 0));
  }
  const sameEntry = (a, b) => (a.itemId || b.itemId) ? a.itemId === b.itemId : (a.albumId === b.albumId && a.trackId === b.trackId);
  // Après un changement (choix, nom, ajout, suppression, ordre) : la file suit, sans couper ce qui joue.
  async function refreshQueue() {
    if (!queueSource || qi < 0 || !queue[qi]) return;
    const cur = queue[qi];
    const q = await queueFor(queueSource);
    const i = q.findIndex(e => sameEntry(e, cur));
    if (i >= 0) { q[i] = Object.assign({}, cur, { sub: q[i].sub }); qi = i; }
    else { qi = Math.min(qi, q.length); q.splice(qi, 0, cur); }
    queue = q;
    showNow(queue[qi]);
  }

  // ---- Barre : lecture en direct des versions ----
  const ICON_PLAY = '<path d="M7 5v14l12-7z"/>', ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  function setPlayIcon(isPlaying) { $('playIcon').innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY; $('playBtn').setAttribute('aria-label', tr(isPlaying ? 'pause' : 'play')); }
  function showNow(q, sub) {
    $('nowTitle').textContent = q ? q.title : '—';
    $('nowSub').textContent = sub != null ? sub : (q ? q.sub : tr('nothingPlaying'));
    $('nowCover').outerHTML = q && q.cover ? `<img class="cover" id="nowCover" src="${IMAGES_BASE}${esc(q.cover)}" alt="">` : '<div class="cover" id="nowCover"></div>';
    $('durEl').textContent = fmt(q ? q.take.duration : 0);
    $('progTrack').setAttribute('aria-valuemax', String(Math.round(q ? q.take.duration : 0)));
    $('prevBtn').disabled = !q; $('nextBtn').disabled = !q || qi + 1 >= queue.length;
  }
  function paintLists() {
    if (view && view.kind === 'playlist') {
      const now = queue[qi];
      center.querySelectorAll('[data-pl-play]').forEach(b => b.closest('tr').classList.toggle('playing', !!now && now.itemId === b.dataset.plPlay));
    } else { renderTracks(); renderAtelierVersions(); }
  }
  async function playIndex(i, from) {
    if (i < 0 || i >= queue.length) { stopBar(); qi = -1; showNow(null, tr('queueEnd')); paintLists(); return; }
    stopAtelier();
    if (ctrl) { ctrl.stop(); ctrl = null; }
    qi = i; starting = true; playing = true; pausedAt = from || 0;
    const q = queue[i], myTurn = ++turn;
    showNow(q, q.sub + ' · ' + tr('loadingVersion'));
    setPlayIcon(true);
    paintLists();
    try {
      const c = await R.playTake(q.take, { from: from || 0, fetchBytes, onEnd: () => { if (turn === myTurn) playIndex(qi + 1); } });
      if (turn !== myTurn) { c.stop(); return; }
      ctrl = c;
    } catch (e) { if (turn === myTurn) { showNow(q, tr('errorMsg', { error: e.message })); playing = false; starting = false; setPlayIcon(false); } return; }
    starting = false;
    showNow(q);
  }
  function pauseBar() { if (ctrl) { pausedAt = ctrl.position(); ctrl.stop(); ctrl = null; } playing = false; starting = false; turn++; setPlayIcon(false); if (queue[qi]) showNow(queue[qi]); }
  function stopBar() { if (ctrl) ctrl.stop(); ctrl = null; playing = false; starting = false; pausedAt = 0; turn++; setPlayIcon(false); }
  $('playBtn').onclick = () => {
    if (playing) pauseBar();
    else if (qi >= 0) playIndex(qi, pausedAt);
    else if (view) startQueue(view, 0);
  };
  $('nextBtn').onclick = () => { if (qi + 1 < queue.length) playIndex(qi + 1); };
  $('prevBtn').onclick = () => { if ((ctrl ? ctrl.position() : pausedAt) > 3 || qi === 0) playIndex(qi); else if (qi > 0) playIndex(qi - 1); };
  function seekTo(pos) {
    if (qi < 0) return;
    pos = Math.max(0, Math.min(queue[qi].take.duration, pos));
    if (playing) playIndex(qi, pos); else { pausedAt = pos; paint(pos); }
  }
  $('progTrack').onclick = e => {
    if (qi < 0) return;
    const r = $('progTrack').getBoundingClientRect();
    seekTo(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * queue[qi].take.duration);
  };
  $('progTrack').onkeydown = e => {
    if (qi < 0) return;
    const cur = ctrl ? ctrl.position() : pausedAt;
    if (e.key === 'ArrowRight') { seekTo(cur + 5); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { seekTo(cur - 5); e.preventDefault(); }
  };
  function paint(pos) {
    const d = qi >= 0 && queue[qi] ? queue[qi].take.duration : 0;
    $('posEl').textContent = fmt(pos);
    $('progFill').style.width = d ? Math.min(100, 100 * pos / d) + '%' : '0';
    $('progTrack').setAttribute('aria-valuenow', String(Math.round(pos)));
  }
  (function tick() { paint(ctrl ? ctrl.position() : pausedAt); requestAnimationFrame(tick); })();
  // Barre d'espace = lecture / pause de la barre (hors saisie et hors lecteur de l'atelier).
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.target.closest('input, textarea, select, button, [contenteditable], #atelierPlayer')) return;
    e.preventDefault(); $('playBtn').click();
  });
  // L'atelier et la barre ne jouent jamais en même temps : dès que l'atelier démarre, la barre se met en pause.
  document.addEventListener('layerpitch-capture-mark', e => { if (e.detail && e.detail.name === 'track_play' && (playing || starting)) pauseBar(); });

  showNow(null);
  setPlayIcon(false);
  if (albums.length) openAlbum(albums[0].id);
  else notice(esc(tr('libraryEmpty')));
})();
window.LayerPitchShell && window.LayerPitchShell.mount({ active: 'albums', crumbs: [{ label: window.LayerPitchShell.tr('item_albums') }], bare: true });
</script>
</body>
</html>
