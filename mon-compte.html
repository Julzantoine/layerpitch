<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">LayerPitch — Mon compte</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg: #f5f6f8; --bg-card: #ffffff; --border: #e2e2e6;
    --text: #24262b; --text-dim: #5f636b; --text-dimmer: #9a9ea6;
    --accent: #2f80c0; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); padding: 40px 20px 60px; }
  .page { max-width: 560px; margin: 0 auto; }
  a { color: var(--accent); }
  .back-link { display: inline-block; margin-bottom: 20px; font-size: 13px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 24px; margin-bottom: 24px; }
  h2 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; margin: 0 0 6px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; }
  .hint { font-size: 12.5px; line-height: 1.6; color: var(--text-dim); margin-bottom: 10px; }
  .status { font-size: 13px; margin: 8px 0; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 13px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn { padding: 9px 18px; border: none; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; font-size: 13px; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-small { padding: 5px 12px; font-size: 12px; }
  .msg { font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-top: 8px; }
  .msg.err { color: #b5442e; }
  .msg.ok { color: #2a7; }
  .invoice-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 12.5px; border-top: 1px solid var(--border); }
  .invoice-row:first-child { border-top: none; }
  .signin-box input { margin-bottom: 12px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .checkbox-row input { width: auto; }
  .checkbox-row span { font-size: 12px; color: var(--text-dim); }
  .btn.danger { border-color: #b23; color: #b23; }
</style>

<script>
const shellTr = k => (window.LayerPitchShell ? window.LayerPitchShell.tr(k) : k); // libellés de la barre commune
const content = document.getElementById('content');

// Suit la langue d'affichage choisie côté Backstage (15/09, retour direct de Jules-Antoine : cette
// page était intégralement en français en dur, quelle que soit la langue du Backstage) -- même clé
// localStorage que layerpitch-backstage.html/currentLang(), page atteinte depuis lui via
// "← Retour au backstage", donc même origine/storage.
function currentLang() { return localStorage.getItem('layerpitch_lang') || 'fr'; }
function tr(key, vars) {
  const I18N = window.LAYERPITCH_I18N || { fr: { shared: {}, monCompte: {} }, en: { shared: {}, monCompte: {} } };
  const dict = I18N[currentLang()] || I18N.fr;
  const dictFr = I18N.fr;
  let str = (dict.monCompte && dict.monCompte[key]) || (dict.shared && dict.shared[key])
    || (dictFr.monCompte && dictFr.monCompte[key]) || (dictFr.shared && dictFr.shared[key]) || key;
  if (vars) Object.keys(vars).forEach(k => { str = str.replace('{' + k + '}', vars[k]); });
  return str;
}
function applyI18n() {
  document.documentElement.lang = currentLang();
  document.title = tr('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = tr(el.dataset.i18n); if (v) el.textContent = v; });
}
applyI18n();

function planLabel(plan) { return { free: tr('planLabelFree'), starter: tr('planLabelStarter'), pro: tr('planLabelPro') }[plan] || plan; }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// LayerPitch n'a aucun mot de passe (connexion par lien magique + code à 8 chiffres uniquement,
// voir api/auth.js) — rien à "retrouver" ni à changer. Section volontairement simple : le but est
// d'éviter la confusion ("où est mon mot de passe ?"), pas de proposer un vrai changement d'identifiants.
// Suppression de compte (29/09) : carte « zone sensible » en bas de la rubrique Profil, visible seulement quand le feu vert est
// ouvert pour ce compte. Tout est revérifié par le serveur (request_account_deletion).
// Ventes (29/09) : lecture seule, feu vert 'sales_tab' ; jamais d'identité d'acheteur. Achats de test listés mais hors totaux.
async function salesCardHtml() {
  const { sales } = await LayerPitchAuth.getMySales();
  if (!sales || !sales.open) return '';
  const money = c => new Intl.NumberFormat(currentLang() === 'en' ? 'en-GB' : 'fr-FR', { style: 'currency', currency: 'EUR' }).format((c || 0) / 100);
  const rows = (sales.rows || []).map(r => `<tr${r.isTest ? ' style="opacity:.6"' : ''}>
      <td>${escapeHtml(new Date(r.purchasedAt).toLocaleDateString(currentLang()))}</td>
      <td>${escapeHtml(tr('salesKind_' + r.kind))}</td>
      <td>${escapeHtml(r.title || '')}${r.isTest ? ` <span class="hint">(${escapeHtml(tr('salesTest'))})</span>` : ''}</td>
      <td style="text-align:right">${escapeHtml(money(r.grossCents))}</td>
      <td style="text-align:right">${r.shareCents == null ? escapeHtml(tr('salesShareUnknown')) : escapeHtml(money(r.shareCents))}</td>
      <td>${escapeHtml(tr('salesStatus_' + r.status))}</td></tr>`).join('');
  return `<div class="card">
    <h2>${escapeHtml(tr('salesTitle'))}</h2>
    <div class="hint">${escapeHtml(tr('salesTotals', { n: sales.totals.count, gross: money(sales.totals.grossCents), share: money(sales.totals.shareCents) }))}</div>
    ${rows ? `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:10px">
      <thead><tr>${['Date', 'Type', 'Title', 'Gross', 'Share', 'Status'].map(c => `<th style="text-align:${c === 'Gross' || c === 'Share' ? 'right' : 'left'};padding:4px 6px;border-bottom:1px solid var(--border)">${escapeHtml(tr('salesCol' + c))}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody></table></div>` : `<div class="hint" style="margin-top:8px">${escapeHtml(tr('salesEmpty'))}</div>`}
  </div>`;
}
function reloadPage() { location.reload(); }
let deletionState = null;
async function deletionCardHtml() {
  const { status } = await LayerPitchAuth.getAccountDeletion();
  deletionState = status;
  if (!status || !status.open) return '';
  const list = ['delErases', 'delKept', 'delDelay'].map(k => `<li>${escapeHtml(tr(k))}</li>`).join('');
  const dateText = status.scheduledFor ? new Date(status.scheduledFor).toLocaleDateString(currentLang()) : '';
  let body;
  if (status.scheduledFor) {
    body = `<div class="status" style="color:#b23">${escapeHtml(tr('delPending', { date: dateText }))}</div>
      <div class="actions"><button class="btn" id="btnCancelDeletion" type="button">${escapeHtml(tr('delCancelBtn'))}</button></div>`;
  } else if ((status.blockers || []).length) {
    body = status.blockers.map(b => `<div class="hint" style="color:#b23">${escapeHtml(tr('delBlocker_' + b))}</div>`).join('');
  } else {
    body = `<label>${escapeHtml(tr('delTypeLabel'))}</label>
      <input type="text" id="delConfirm" autocomplete="off" placeholder="SUPPRIMER">
      <div class="actions"><button class="btn danger" id="btnRequestDeletion" type="button">${escapeHtml(tr('delRequestBtn'))}</button></div>`;
  }
  return `<div class="card" style="border-color:#b23">
    <h2>${escapeHtml(tr('delTitle'))}</h2>
    <ul class="hint" style="padding-left:18px;margin:8px 0">${list}</ul>
    ${body}
    <div class="msg" id="delMsg"></div>
  </div>`;
}
function wireDeletionCard() {
  const req = document.getElementById('btnRequestDeletion');
  const cancel = document.getElementById('btnCancelDeletion');
  const msg = document.getElementById('delMsg');
  if (req) req.addEventListener('click', async () => {
    const typed = document.getElementById('delConfirm').value.trim();
    if (typed !== 'SUPPRIMER') { msg.textContent = tr('delTypeError'); msg.className = 'msg err'; return; }
    if (!await window.LayerPitchNotify.confirm(tr('delFinalConfirm'), { okLabel: tr('delRequestBtn'), danger: true })) return;
    req.disabled = true; msg.textContent = '…';
    const { ok, error } = await LayerPitchAuth.requestAccountDeletion(typed);
    if (!ok) { msg.textContent = tr('errorPrefix', { message: error }); msg.className = 'msg err'; req.disabled = false; return; }
    reloadPage();
  });
  if (cancel) cancel.addEventListener('click', async () => {
    cancel.disabled = true;
    const { ok, error } = await LayerPitchAuth.cancelAccountDeletion();
    if (!ok) { msg.textContent = tr('errorPrefix', { message: error }); msg.className = 'msg err'; cancel.disabled = false; return; }
    reloadPage();
  });
}
function identifiantsCardHtml(session) {
  return `
    <div class="card">
      <h2>${tr('credentialsTitle')}</h2>
      <div class="hint">${tr('connectedEmailLine', { email: escapeHtml(session.user.email) })}</div>
      <div class="hint">${tr('noPasswordHint')}</div>
    </div>`;
}

// Adresse publique (27/09) : le compositeur choisit son nom dans l'adresse de ses pages (beta.layerpitch.com/<nom>/),
// jusqu'ici tiré de son email. Les anciennes adresses continuent de mener à ses pages (set_my_handle garde l'ancien nom).
// Droit : fonction custom_address de la matrice (même règle côté serveur, set_my_handle).
async function publicAddressCardHtml() {
  const { handle } = await LayerPitchAuth.getMyComposerHandle();
  if (!handle) return '';
  // 28/09 : droit lu dans la matrice (custom_address : Warrior et Boss, feu vert 'custom_address' — admin seulement d'ici là).
  let isAdmin = false, flagOpen = false;
  try {
    const client = window.LayerPitchSupabaseClient.getClient();
    const [ent, flags] = await Promise.all([client.rpc('my_entitlements'), client.rpc('my_feature_flags')]);
    isAdmin = !!(ent.data || []).find(r => r.feature === 'custom_address' && r.allowed);
    flagOpen = !!(flags.data || []).find(r => r.key === 'custom_address' && r.allowed);
  } catch (e) {}
  const url = `https://beta.layerpitch.com/${encodeURIComponent(handle)}/`;
  return `
    <div class="card">
      <h2>${tr('publicAddressTitle')}</h2>
      <div class="hint">${tr('publicAddressCurrent', { url: `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>` })}</div>
      <div class="signin-box" style="max-width:none;text-align:left">
        <label>${tr('publicAddressLabel')}</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="hint" style="margin:0">beta.layerpitch.com/</span>
          <input type="text" id="handleInput" value="${escapeHtml(handle)}" maxlength="30" autocomplete="off" spellcheck="false" style="flex:1 1 160px;min-width:0;margin:0"${isAdmin ? '' : ' disabled'}>
          <button class="btn" id="handleSaveBtn" type="button"${isAdmin ? '' : ' disabled'}>${tr('publicAddressSave')}</button>
        </div>
        <div class="msg" id="handleMsg"></div>
      </div>
      <div class="hint">${tr(isAdmin ? 'publicAddressHint' : (flagOpen ? 'publicAddressTierOnly' : 'publicAddressAdminOnly'))}</div>
    </div>`;
}
function wirePublicAddressCard() {
  const btn = document.getElementById('handleSaveBtn');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const input = document.getElementById('handleInput'), msg = document.getElementById('handleMsg');
    msg.textContent = '…'; msg.className = 'msg';
    const { data, error } = await window.LayerPitchSupabaseClient.getClient().rpc('set_my_handle', { p_handle: input.value });
    if (error) { msg.textContent = tr('errorPrefix', { message: error.message }); msg.className = 'msg err'; return; }
    input.value = data;
    msg.textContent = tr('publicAddressSaved', { url: `https://beta.layerpitch.com/${data}/` }); msg.className = 'msg ok';
  });
}

// Emails d'annonce (21 septembre) : quand Jules-Antoine envoie une annonce, un email part aux
// testeurs (Edge Function notify-admin-message) -- ce réglage permet de ne plus les recevoir. Case
// cochée par défaut ; la cloche du backstage, elle, continue de recevoir toutes les annonces.
async function notificationsCardHtml() {
  const { prefs, error } = await window.LayerPitchNotificationPrefs.getMyPrefs();
  if (error || !prefs) return `<div class="card"><h2>${tr('notificationsTitle')}</h2><div class="msg err">${tr('errorPrefix', { message: error || '?' })}</div></div>`;
  return `
    <div class="card">
      <h2>${tr('notificationsTitle')}</h2>
      <div class="hint">${tr('notificationsHint')}</div>
      <div class="checkbox-row">
        <input type="checkbox" id="emailAnnouncementsToggle" ${prefs.emailAnnouncements ? 'checked' : ''}>
        <span>${tr('notificationsCheckboxLabel')}</span>
      </div>
      <div class="msg" id="notificationsMsg"></div>
    </div>`;
}

function wireNotificationsCard() {
  const toggle = document.getElementById('emailAnnouncementsToggle');
  if (!toggle) return;
  toggle.addEventListener('change', async () => {
    const msg = document.getElementById('notificationsMsg');
    toggle.disabled = true; msg.textContent = '…'; msg.className = 'msg';
    const { ok, error } = await window.LayerPitchNotificationPrefs.setEmailAnnouncements(toggle.checked);
    if (!ok) toggle.checked = !toggle.checked;
    msg.textContent = ok ? tr('savedMsg') : tr('errorPrefix', { message: error });
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
    toggle.disabled = false;
  });
}

// Brouillon automatique du Backstage (30/09) : « ne plus m'avertir » = ignorer d'office un brouillon retrouvé. Réglage propre à ce
// navigateur (le brouillon l'est aussi) : localStorage, lu par le Backstage.
const DRAFT_AUTO_IGNORE_KEY = 'layerpitch_draft_auto_ignore';
function draftCardHtml() {
  let on = false;
  try { on = localStorage.getItem(DRAFT_AUTO_IGNORE_KEY) === '1'; } catch (e) { /* stockage indisponible */ }
  return `
    <div class="card">
      <h2>${tr('draftTitle')}</h2>
      <div class="hint">${tr('draftHint')}</div>
      <div class="checkbox-row">
        <input type="checkbox" id="draftAutoIgnoreToggle" ${on ? 'checked' : ''}>
        <span>${tr('draftCheckboxLabel')}</span>
      </div>
      <div class="msg" id="draftMsg"></div>
    </div>`;
}
function wireDraftCard() {
  const toggle = document.getElementById('draftAutoIgnoreToggle');
  if (!toggle) return;
  toggle.addEventListener('change', () => {
    const msg = document.getElementById('draftMsg');
    try {
      if (toggle.checked) localStorage.setItem(DRAFT_AUTO_IGNORE_KEY, '1'); else localStorage.removeItem(DRAFT_AUTO_IGNORE_KEY);
      msg.textContent = tr('savedMsg'); msg.className = 'msg ok';
    } catch (e) { toggle.checked = !toggle.checked; msg.textContent = tr('errorPrefix', { message: e.message }); msg.className = 'msg err'; }
  });
}

// Annuaire des compositeurs (23/10, migration 20261023010000) : case « être visible » (cochée d'office) et mots-clés choisis par le
// compositeur. Carte réservée aux comptes compositeur (les studios n'ont pas de fiche). Tant que le feu vert « composer_directory »
// n'est pas donné, la carte le dit : les réglages sont pris en compte dès l'ouverture.
async function directoryCardHtml() {
  const [{ settings }, { open }] = await Promise.all([window.LayerPitchComposers.getMyDirectory(), window.LayerPitchComposers.directoryStatus()]);
  if (!settings) return '';
  directorySettings = settings;
  return `
    <div class="card">
      <h2>${tr('directoryTitle')}</h2>
      <div class="hint">${tr('directoryHint')}</div>
      <div class="checkbox-row">
        <input type="checkbox" id="directoryOptInToggle" ${settings.optIn ? 'checked' : ''}>
        <span>${tr('directoryCheckboxLabel')}</span>
      </div>
      ${settings.photo ? `
      <div class="signin-box" style="max-width:none;text-align:left;margin-top:12px">
        <label>${tr('directoryPhotoLabel')}</label>
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          <div id="directoryPhotoCircle" style="position:relative;width:140px;height:140px;border-radius:50%;overflow:hidden;background:#23262d;cursor:grab;touch-action:none;flex:none"><img id="directoryPhotoImg" alt="" draggable="false" src="https://media.layerpitch.com/images/${escapeHtml(settings.photo)}" style="width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none"></div>
          <div style="flex:1 1 200px;min-width:0">
            <label for="directoryZoom" style="margin-top:0">${tr('directoryPhotoZoom')}</label>
            <input type="range" id="directoryZoom" min="1" max="3" step="0.05" value="1" style="width:100%">
            <button class="btn" id="directoryPhotoReset" type="button" style="margin-top:8px">${tr('directoryPhotoReset')}</button>
          </div>
        </div>
        <div class="hint" style="margin:8px 0 0">${tr('directoryPhotoHint')}</div>
      </div>` : ''}
      <div class="signin-box" style="max-width:none;text-align:left;margin-top:12px">
        <label for="directoryKeywordsInput">${tr('directoryKeywordsLabel')}</label>
        <input type="text" id="directoryKeywordsInput" value="${escapeHtml((settings.keywords || []).join(', '))}" placeholder="${escapeHtml(tr('directoryKeywordsPlaceholder'))}" autocomplete="off">
        <div class="hint" style="margin:0 0 10px">${tr('directoryKeywordsHint')}</div>
        <button class="btn" id="directorySaveBtn" type="button">${tr('directorySave')}</button>
      </div>
      <div class="msg" id="directoryMsg"></div>
      <div class="hint">${open ? `<a href="annuaire.html">${tr('directoryOpenLink')}</a>` : tr('directoryNotOpen')}</div>
    </div>`;
}
// Cadrage de la photo (25/10) : on fait glisser l'image dans le rond, le curseur règle le zoom ; même calcul que la page publique
// (layerpitch-photo-frame.js). frameTouched : tant qu'on n'y touche pas, l'enregistrement laisse le cadrage tel qu'il est.
let directoryFrame = null, directoryFrameTouched = false, directorySettings = null;
function wireDirectoryPhoto(settings) {
  const circle = document.getElementById('directoryPhotoCircle'), img = document.getElementById('directoryPhotoImg'), zoom = document.getElementById('directoryZoom');
  if (!circle || !img) return;
  const PF = window.LayerPitchPhotoFrame;
  directoryFrame = PF.normalize(settings.photoFrame); directoryFrameTouched = false;
  const draw = () => { img.setAttribute('style', PF.style(directoryFrame, img.naturalWidth, img.naturalHeight) + ';user-select:none;-webkit-user-drag:none'); zoom.value = directoryFrame.zoom; };
  if (img.complete && img.naturalWidth) draw(); else img.addEventListener('load', draw, { once: true });
  let drag = null;
  circle.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, start: PF.layout(directoryFrame, img.naturalWidth, img.naturalHeight) }; circle.setPointerCapture(e.pointerId); circle.style.cursor = 'grabbing'; });
  circle.addEventListener('pointermove', e => {
    if (!drag) return;
    const size = circle.clientWidth, l = drag.start;
    // Glisser l'image vers la droite montre ce qui est à sa gauche : le point central recule d'autant (en % de la taille affichée).
    directoryFrame = PF.normalize({ x: l.x - (e.clientX - drag.x) / size * 10000 / l.width, y: l.y - (e.clientY - drag.y) / size * 10000 / l.height, zoom: directoryFrame.zoom });
    const c = PF.layout(directoryFrame, img.naturalWidth, img.naturalHeight); directoryFrame.x = c.x; directoryFrame.y = c.y;
    directoryFrameTouched = true; draw();
  });
  const end = () => { drag = null; circle.style.cursor = 'grab'; };
  circle.addEventListener('pointerup', end); circle.addEventListener('pointercancel', end);
  zoom.addEventListener('input', () => { directoryFrame = PF.normalize({ x: directoryFrame.x, y: directoryFrame.y, zoom: Number(zoom.value) }); const c = PF.layout(directoryFrame, img.naturalWidth, img.naturalHeight); directoryFrame.x = c.x; directoryFrame.y = c.y; directoryFrameTouched = true; draw(); });
  document.getElementById('directoryPhotoReset').addEventListener('click', () => { directoryFrame = PF.normalize(null); directoryFrameTouched = true; draw(); });
}
function wireDirectoryCard() {
  const btn = document.getElementById('directorySaveBtn');
  if (!btn) return;
  if (directorySettings) wireDirectoryPhoto(directorySettings);
  btn.addEventListener('click', async () => {
    const msg = document.getElementById('directoryMsg');
    btn.disabled = true; msg.textContent = '…'; msg.className = 'msg';
    const keywords = document.getElementById('directoryKeywordsInput').value.split(/[,;\n]/).map(k => k.trim()).filter(Boolean);
    const { settings, error } = await window.LayerPitchComposers.setMyDirectory(document.getElementById('directoryOptInToggle').checked, keywords, directoryFrameTouched ? directoryFrame : undefined);
    if (!error) directoryFrameTouched = false;
    if (error) { msg.textContent = tr('errorPrefix', { message: error }); msg.className = 'msg err'; }
    else { document.getElementById('directoryKeywordsInput').value = (settings.keywords || []).join(', '); msg.textContent = tr('directorySaved'); msg.className = 'msg ok'; }
    btn.disabled = false;
  });
}

async function subscriptionCardHtml() {
  const { status, error } = await LayerPitchSubscriptions.getTrialStatus();
  if (error) return `<div class="card"><h2>${tr('subscriptionTitle')}</h2><div class="msg err">${tr('errorPrefix', { message: error })}</div></div>`;
  let statusText = tr('noProfileYet');
  if (status) {
    const trialEndsAt = status.trialEndsAt ? new Date(status.trialEndsAt) : null;
    const trialActive = trialEndsAt && trialEndsAt > new Date();
    if (trialActive) {
      const daysLeft = Math.max(1, Math.ceil((trialEndsAt - new Date()) / 86400000));
      statusText = tr('trialActiveStatus', { plan: planLabel(status.plan), days: daysLeft });
    } else if (trialEndsAt && status.plan === 'free') {
      statusText = tr('trialEndedStatus');
    } else {
      statusText = tr('currentPlanStatus', { plan: planLabel(status.plan) });
    }
  }
  // Abonnement payé en cours (28/09) : un seul abonnement ; changer de palier, résilier, carte, reçus = portail Stripe.
  const { billing } = await LayerPitchSubscriptions.myBilling();
  const sub = billing && billing.composer;
  if (sub && sub.active) {
    return `
    <div class="card">
      <h2>${tr('subscriptionTitle')}</h2>
      <div class="status" id="subscriptionStatus">${tr('currentPlanStatus', { plan: planLabel(sub.plan) })}</div>
      ${sub.cancelAt ? `<div class="hint">${tr('composerSubscriptionEnds', { date: new Date(sub.cancelAt).toLocaleDateString(currentLang()) })}</div>` : ''}
      ${sub.canManage ? `<div class="actions"><button class="btn primary" id="btnManageSubscription" type="button">${tr('manageSubscription')}</button></div>
      <div class="hint">${tr('manageSubscriptionHint')}</div>` : ''}
      <div class="msg" id="subscriptionMsg"></div>
    </div>`;
  }
  const disabledTitle = tr('planDisabledTitle');
  return `
    <div class="card">
      <h2>${tr('subscriptionTitle')}</h2>
      <div class="hint">${tr('subscriptionHint')}</div>
      <div class="status" id="subscriptionStatus">${statusText}</div>
      <div class="hint">${tr('betaChoiceDisabledHint')}</div>
      <div class="actions">
        <button class="btn" id="btnPlanFree" type="button" disabled title="${disabledTitle}">${tr('planFreeBtn')}</button>
        <button class="btn" id="btnPlanStarterMonth" type="button" disabled title="${disabledTitle}">${tr('planStarterMonthBtn')}</button>
        <button class="btn" id="btnPlanStarterYear" type="button" disabled title="${disabledTitle}">${tr('planStarterYearBtn')}</button>
        <button class="btn" id="btnPlanProMonth" type="button" disabled title="${disabledTitle}">${tr('planProMonthBtn')}</button>
        <button class="btn" id="btnPlanProYear" type="button" disabled title="${disabledTitle}">${tr('planProYearBtn')}</button>
      </div>
      <div class="msg" id="subscriptionMsg"></div>
    </div>`;
}

async function connectCardHtml() {
  const { status, error } = await LayerPitchConnect.myConnectStatus();

  let btnLabel = tr('connectBtnDefault');

    <div class="card">

      <div class="hint">${tr('connectHint')}</div>
      <div class="status" id="connectStatus">${statusText}</div>
      <div class="actions"><button class="btn" id="btnConnectOnboard" type="button">${btnLabel}</button></div>
      <div class="msg" id="connectMsg"></div>

// Versement et facturation du STUDIO (28/09, chantier profils et permissions, étape 4b) : un studio qui vend l'OST de
// son jeu, ou qui est co-ayant droit « studio », a sa propre identité légale et son propre compte Stripe (une identité
// par profil : un compositeur freelance et son studio sont deux entités différentes). Affichée seulement si le compte a
// un profil studio.
async function studioPayoutCardHtml() {
  const { studioId, name: studioName } = await LayerPitchAuth.getMyStudioId();
  if (!studioId) return '';
  const [{ profile }, { status }] = await Promise.all([LayerPitchConnect.getMyStudioBillingProfile(), LayerPitchConnect.myStudioConnectStatus()]);
  const p = profile || {};
  let stripeText = tr('noStripeStatus'), btnLabel = tr('connectBtnDefault');
  if (status && status.connected) { if (status.chargesEnabled) { stripeText = tr('stripeActiveStatus'); btnLabel = tr('manageBtnLabel'); } else { stripeText = tr('stripeIncompleteStatus'); btnLabel = tr('resumeBtnLabel'); } }
  return `
    <div class="card">
      <h2>${tr('studioPayoutTitle')}</h2>
      <div class="hint">${tr('studioPayoutHint')}</div>
      <label>${tr('statusLabel')}</label>
      <select id="studioBillingStatus">
        <option value="">${tr('statusPlaceholderOption')}</option>
        <option value="professionnel" ${p.billing_status === 'professionnel' ? 'selected' : ''}>${tr('statusProOption')}</option>
        <option value="particulier" ${p.billing_status === 'particulier' ? 'selected' : ''}>${tr('statusParticulierOption')}</option>
      </select>
      <label>${tr('studioNameLabel')}</label>
      <input type="text" id="studioDisplayName" maxlength="80" value="${escapeHtml(studioName || '')}">
      <div class="hint">${tr('studioNameHint')}</div>
      <div class="actions"><button class="btn" id="btnSaveStudioName" type="button">${tr('saveBtn')}</button></div>
      <div class="msg" id="studioNameMsg"></div>
      <label>${tr('legalNameLabel')}</label>
      <input type="text" id="studioBillingLegalName" value="${escapeHtml(p.billing_legal_name || '')}">
      <label>${tr('addressLabel')}</label>
      <input type="text" id="studioBillingAddress" value="${escapeHtml(p.billing_address || '')}">
      <div class="row">
        <div><label>${tr('siretLabel')}</label><input type="text" id="studioBillingSiret" value="${escapeHtml(p.billing_siret || '')}"></div>
        <div><label>${tr('vatNumberLabel')}</label><input type="text" id="studioBillingVatNumber" value="${escapeHtml(p.billing_vat_number || '')}"></div>
      </div>
      <div class="checkbox-row"><input type="checkbox" id="studioBillingVat" ${p.billing_vat_applicable ? 'checked' : ''}><span>${tr('vatApplicableLabel')}</span></div>
      <div class="actions"><button class="btn" id="btnSaveStudioBilling" type="button">${tr('saveBtn')}</button></div>
      <div class="msg" id="studioBillingMsg"></div>
      <div class="status" style="margin-top:14px">${stripeText}</div>
      <div class="actions"><button class="btn" id="btnStudioConnect" type="button">${btnLabel}</button></div>
      <div class="msg" id="studioConnectMsg"></div>
    </div>`;
}
function wireStudioPayoutCard() {
  const saveName = document.getElementById('btnSaveStudioName');
  if (saveName) saveName.addEventListener('click', async () => {
    const msg = document.getElementById('studioNameMsg');
    saveName.disabled = true; msg.textContent = '…';
    const { ok, error } = await LayerPitchStudio.setMyStudioName(document.getElementById('studioDisplayName').value);
    msg.textContent = ok ? tr('savedMsg') : tr('errorPrefix', { message: error });
    saveName.disabled = false;
  });
  const save = document.getElementById('btnSaveStudioBilling');
  if (!save) return;
  save.addEventListener('click', async () => {
    const msg = document.getElementById('studioBillingMsg');
    const status = document.getElementById('studioBillingStatus').value;
    const legalName = document.getElementById('studioBillingLegalName').value.trim();
    const address = document.getElementById('studioBillingAddress').value.trim();
    if (!status) { msg.textContent = tr('chooseStatusAlert'); return; }
    if (!legalName || !address) { msg.textContent = tr('nameAddressRequiredAlert'); return; }
    save.disabled = true; msg.textContent = '…';
    const { ok, error } = await LayerPitchConnect.saveMyStudioBillingProfile({
      status, legalName, address, siret: document.getElementById('studioBillingSiret').value.trim(),
      vatNumber: document.getElementById('studioBillingVatNumber').value.trim(), vatApplicable: document.getElementById('studioBillingVat').checked,
    });
    msg.textContent = ok ? tr('savedMsg') : tr('errorPrefix', { message: error });
    save.disabled = false;
  });
  document.getElementById('btnStudioConnect').addEventListener('click', async () => {
    const msg = document.getElementById('studioConnectMsg');
    msg.textContent = '…';
    const { ok, error } = await LayerPitchConnect.startConnectOnboarding({
      role: 'studio', returnUrl: window.location.origin + '/mon-compte.html?connect=return', refreshUrl: window.location.origin + '/mon-compte.html?connect=refresh',
    });
    if (!ok) msg.textContent = tr('errorPrefix', { message: error });
  });
}

async function invoicesCardHtml() {
  const { invoices, error } = await LayerPitchInvoices.getMyIssuedInvoices();
  if (error) return `<div class="card"><h2>${tr('invoicesTitle')}</h2><div class="msg err">${tr('errorPrefix', { message: error })}</div></div>`;
  const rows = invoices.length
    ? invoices.map(inv => {
        const label = inv.document_type === 'facture' ? tr('invoiceTypeFacture') : tr('invoiceTypeAttestation');
        const date = new Date(inv.created_at).toLocaleDateString(tr('dateLocale'));
        return `<div class="invoice-row"><span>${label} ${inv.invoice_number} — ${date} — ${Number(inv.amount_ttc).toFixed(2)} €</span><button class="btn btn-small" type="button" data-invoice-id="${inv.id}">${tr('downloadBtn')}</button></div>`;
      }).join('')
    : `<div class="hint">${tr('noInvoicesYet')}</div>`;
  return `
    <div class="card">
      <h2>${tr('invoicesTitle')}</h2>
      <div class="hint">${tr('invoicesHint')}</div>
      <div id="issuedInvoicesList">${rows}</div>
    </div>`;
}

function wireSubscriptionCard() {
  // Retour du portail Stripe : le changement arrive par le webhook, parfois quelques secondes après ; on relit une fois.
  if (new URLSearchParams(location.search).get('portal') === '1' && !wireSubscriptionCard.retried) {
    wireSubscriptionCard.retried = true;
    history.replaceState(null, '', location.pathname + '?section=subscription');
    setTimeout(() => render(), 5000);
  }
  const manage = document.getElementById('btnManageSubscription');
  if (manage) manage.addEventListener('click', async () => {
    manage.disabled = true;
    const { ok, error } = await LayerPitchSubscriptions.openBillingPortal('composer', window.location.origin + '/mon-compte.html?section=subscription&portal=1');
    if (!ok) { document.getElementById('subscriptionMsg').textContent = tr('errorPrefix', { message: error }); manage.disabled = false; }
  });
  const planButtons = [
    { id: 'btnPlanFree', plan: 'free', interval: null },
    { id: 'btnPlanStarterMonth', plan: 'starter', interval: 'month' },
    { id: 'btnPlanStarterYear', plan: 'starter', interval: 'year' },
    { id: 'btnPlanProMonth', plan: 'pro', interval: 'month' },
    { id: 'btnPlanProYear', plan: 'pro', interval: 'year' },
  ];
  planButtons.forEach(({ id, plan, interval }) => {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('click', async () => {
      const msg = document.getElementById('subscriptionMsg');
      btn.disabled = true; msg.textContent = '…';
      try {
        if (plan === 'free') {
          const { ok, error } = await LayerPitchSubscriptions.choosePlanFree();
          msg.textContent = ok ? tr('planFreeActivated') : tr('errorPrefix', { message: error });
          if (ok) render();
        } else {
          const successUrl = window.location.origin + '/mon-compte.html?subscribed=1';
          const cancelUrl = window.location.origin + '/mon-compte.html?subscribed=0';
          const { ok, error } = await LayerPitchSubscriptions.subscribeToPlan(plan, interval, { successUrl, cancelUrl });
          if (!ok) msg.textContent = tr('errorPrefix', { message: error });
        }
      } catch (e) { msg.textContent = tr('errorPrefix', { message: e.message }); }
      btn.disabled = false;
    });
  });
}

function wireBillingCard() {
  const btn = document.getElementById('btnSaveBillingProfile');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const msg = document.getElementById('billingMsg');
    const status = document.getElementById('billingStatusSelect').value;
    if (!status) { msg.textContent = tr('chooseStatusAlert'); return; }
    const legalName = document.getElementById('billingLegalName').value.trim();
    const address = document.getElementById('billingAddress').value.trim();
    if (!legalName || !address) { msg.textContent = tr('nameAddressRequiredAlert'); return; }
    btn.disabled = true; msg.textContent = '…';
    try {
      const { ok, error } = await LayerPitchConnect.saveMyBillingProfile({
        status, legalName, address,
        siret: document.getElementById('billingSiret').value.trim(),
        vatNumber: document.getElementById('billingVatNumber').value.trim(),
        vatApplicable: document.getElementById('billingVatApplicable').checked,
      });
      msg.textContent = ok ? tr('savedMsg') : tr('errorPrefix', { message: error });
      if (ok) render();
    } catch (e) { msg.textContent = tr('errorPrefix', { message: e.message }); }
    btn.disabled = false;
  });
}

function wireConnectCard() {
  const btn = document.getElementById('btnConnectOnboard');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const msg = document.getElementById('connectMsg');
    btn.disabled = true; msg.textContent = '…';
    try {
      const returnUrl = window.location.origin + '/mon-compte.html?connect=return';
      const refreshUrl = window.location.origin + '/mon-compte.html?connect=refresh';
      const { ok, error } = await LayerPitchConnect.startConnectOnboarding({ returnUrl, refreshUrl });
      if (!ok) msg.textContent = tr('errorPrefix', { message: error });
    } catch (e) { msg.textContent = tr('errorPrefix', { message: e.message }); }
    btn.disabled = false;
  });
}

function wireInvoicesCard() {
  document.querySelectorAll('button[data-invoice-id]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const { data, error } = await LayerPitchSupabaseClient.getClient()
          .functions.invoke('get-invoice-download-url', { body: { invoiceId: btn.getAttribute('data-invoice-id') } });
        if (error || !data || !data.url) window.LayerPitchNotify.error(tr('errorPrefix', { message: error ? await LayerPitchAuth.describeFunctionError(error) : (data && data.error) || 'unknown' }));
        else window.open(data.url, '_blank', 'noopener');
      } catch (e) { window.LayerPitchNotify.error(tr('errorPrefix', { message: e.message })); }
      btn.disabled = false;
    });
  });
}

async function render() {
  const { session } = await LayerPitchAuth.getSession();
  if (!session) {
    content.innerHTML = `
      <div class="card">
        <div class="hint">${tr('signInPrompt')}</div>
        <div class="hint">${tr('signInHint')}</div>
        <div class="signin-box">
          <input type="email" id="email" placeholder="${tr('emailPlaceholder')}">
          <button class="btn" id="sendBtn" type="button">${tr('sendLinkBtn')}</button>
          <div class="msg" id="msg"></div>
        </div>
        <div class="signin-box" id="codeBox" hidden>
          <label>${tr('codeReceivedLabel')}</label>
          <input type="text" id="code" placeholder="${tr('codePlaceholder')}" inputmode="numeric" autocomplete="one-time-code">
          <button class="btn" id="verifyCodeBtn" type="button">${tr('verifyCodeBtn')}</button>
          <div class="msg" id="codeMsg"></div>
        </div>
      </div>`;
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('msg');
      if (!email) return;
      msg.textContent = '…'; msg.className = 'msg';
      const { ok, error } = await LayerPitchAuth.signInWithMagicLink(email, window.location.href);
      msg.textContent = ok ? tr('linkSentMsg') : tr('errorPrefix', { message: error });
      msg.className = 'msg ' + (ok ? 'ok' : 'err');
      document.getElementById('codeBox').hidden = !ok;
    });
    document.getElementById('verifyCodeBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const code = document.getElementById('code').value.trim();
      const msg = document.getElementById('codeMsg');
      if (!email || !code) return;
      msg.textContent = '…'; msg.className = 'msg';
      const { ok, error } = await LayerPitchAuth.verifyEmailOtp(email, code);
      if (!ok) { msg.textContent = tr('errorPrefix', { message: error }); msg.className = 'msg err'; }
    });
    return;
  }

  // Retour de Stripe Checkout après une souscription payante (même principe que
  // bienvenue.html?subscribed=1) : le webhook Stripe écrit composer_profiles.plan de façon
  // asynchrone, pas forcément déjà fait au moment où Stripe redirige ici.
  if (new URLSearchParams(location.search).get('subscribed') === '1') {
    content.innerHTML = `<div class="card"><div class="hint">${tr('confirmingSubscription')}</div></div>`;
    for (let attempt = 0; attempt < 10; attempt++) {
      const { status } = await LayerPitchSubscriptions.getTrialStatus();
      if (status && status.plan !== 'free') break;
      await new Promise(r => setTimeout(r, 1000));
    }
    window.history.replaceState({}, '', window.location.pathname + '?section=subscription');
  }

  // Rubriques (barre latérale commune, 28/09) : chaque rubrique n'affiche que ses cartes.
  const SECTIONS = {
    profile: async () => identifiantsCardHtml(session) + (await publicAddressCardHtml()) + (await notificationsCardHtml()) + draftCardHtml() + (await directoryCardHtml()) + (await deletionCardHtml()),
    subscription: async () => subscriptionCardHtml(),
    billing: async () => billingCardHtml(),
    sales: async () => (await salesCardHtml()) + (await connectCardHtml()) + (await studioPayoutCardHtml()),
    documents: async () => invoicesCardHtml(),
  };
  const section = SECTIONS[accountSection] ? accountSection : 'profile';
  content.innerHTML = await SECTIONS[section]();
  wirePublicAddressCard(); wireDeletionCard(); wireNotificationsCard(); wireDraftCard(); wireDirectoryCard(); wireSubscriptionCard(); wireBillingCard(); wireConnectCard(); wireStudioPayoutCard(); wireInvoicesCard();
}

// Rubrique demandée (?section=) ; un retour de Stripe (abonnement, portail) ouvre « Abonnement ».
const accountParams = new URLSearchParams(location.search);
const accountSection = accountParams.get('subscribed') || accountParams.get('portal') ? 'subscription' : (accountParams.get('section') || 'profile');
function accountPlaces() {
  const label = shellTr(accountSection === 'sales' ? 'sales' : 'item_account.' + (['profile', 'subscription', 'billing', 'documents'].includes(accountSection) ? accountSection : 'profile'));
  return { active: accountSection === 'sales' ? 'account.sales' : 'account.' + (['subscription', 'billing', 'documents'].includes(accountSection) ? accountSection : 'profile'),
    crumbs: [{ label: tr('h1') }, { label }] };
}
document.getElementById('pageTitle').textContent = accountPlaces().crumbs[1].label;
// Mode tutoriel (?tuto, 26/10) : la page tourne sur le compte FICTIF de Daniel Orcman (api/demo-client.js), jamais sur le vrai compte de la personne.
const tutoReady = (window.LayerPitchTuto && window.LayerPitchTuto.isOn()) ? window.LayerPitchTuto.enter('./mon-compte.html') : Promise.resolve();
tutoReady.then(() => {
  if (window.LayerPitchTuto && window.LayerPitchTuto.isOn()) {
    const bar = document.createElement('div');
    bar.style.cssText = 'background:#e8f0f8;border-bottom:1px solid #b8cfe4;color:#1d3a57;text-align:center;padding:8px 12px;font-size:13px;position:sticky;top:0;z-index:2000';
    bar.textContent = tr('tutoAccountBanner');
    document.body.insertBefore(bar, document.body.firstChild);
  }
  window.LayerPitchShell && window.LayerPitchShell.mount(accountPlaces());
  LayerPitchAuth.onAuthStateChange(() => render());
  // Venu de la leçon « C'est quoi un AdReel ? » (même onglet) : une courte bulle montre la case de l'annuaire, puis ramène au Backstage, sur la leçon suivante.
  if (window.LayerPitchTuto && window.LayerPitchTuto.isOn() && new URLSearchParams(location.search).get('from') === 'adreel-intro' && window.LayerPitchGuide) {
    const bs = k => { const d = (window.LAYERPITCH_I18N || {})[currentLang()] || {}; return (d.backstage && d.backstage[k] != null) ? d.backstage[k] : tr(k); };
    const steps = [
      { selector: () => { const c = document.getElementById('directoryOptInToggle'); return c ? c.closest('.card') : null; }, titleKey: 'accDirTitle', textKey: 'accDirText', clickDone: true },
      { titleKey: 'accBackTitle', textKey: 'accBackText', final: true },
    ];
    const G = window.LayerPitchGuide.create({
      tr: (k, v) => { let s = bs(k); if (v) Object.keys(v).forEach(x => { s = s.split('{' + x + '}').join(v[x]); }); return s; },
      textVars: () => ({}),
      nextLesson: () => ({ lesson: { id: 'adreel', titleKey: 'laTitle' }, n: 2 }),
      startLesson: id => { window.location.href = 'layerpitch-backstage.html?tuto&lesson=' + encodeURIComponent(id) + '&lang=' + currentLang(); },
    });
    let tries = 0;
    const wait = setInterval(() => { tries++; if (document.getElementById('directoryOptInToggle')) { clearInterval(wait); G.open('lesson', steps, 'account-directory'); } else if (tries > 40) clearInterval(wait); }, 250);
  }
});
</script>
