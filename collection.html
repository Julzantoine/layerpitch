<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- Chemin joli par compositeur (/<handle>/collection.html, voir 404.html) — voir le commentaire
     équivalent dans index.html. -->
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">LayerPitch — Collection</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f6f5f3; --bg-card: #ffffff; --border: #e4e1da;
    --text: #262521; --text-dim: #6f6b62; --text-dimmer: #a8a399;
    --accent: #c9713c; --accent-soft: #f3e4d6;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  img { max-width: 100%; height: auto; display: block; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); padding: 56px 24px 60px; }
  .page { max-width: 760px; margin: 0 auto; }
  a { color: var(--accent); }

  .back-link { display: inline-block; margin-bottom: 32px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); text-decoration: none; }
  .back-link:hover { color: var(--accent); }

  .pack-illustration { display: block; max-width: 100%; max-height: 380px; width: auto; height: auto; margin: 0 auto 28px; border-radius: 8px; border: 1px solid var(--border); }
  .pack-illustration.empty { width: 100%; max-height: none; aspect-ratio: 16/7; background: linear-gradient(135deg, #2a2822, #423b30); }

  .pack-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; margin-bottom: 16px; }
  .pack-presentation p { font-size: 14.5px; line-height: 1.7; color: var(--text-dim); margin-bottom: 14px; white-space: pre-wrap; }

  .section-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 18px; margin-top: 48px;
  }

  .buy-section { margin-top: 56px; text-align: center; padding: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); }
  .buy-btn {
    display: inline-block; padding: 14px 32px; border-radius: 6px; background: var(--accent); color: #fff;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    text-decoration: none; border: none; cursor: pointer;
  }
  .buy-btn:hover { opacity: 0.9; }
  .buy-btn.disabled, .buy-btn:disabled { background: var(--border); color: var(--text-dimmer); cursor: not-allowed; pointer-events: none; }
  .buy-hint { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dimmer); margin-top: 10px; }

  /* Liste des packs inclus — vignette + titre, cliquable. Même logique de vignette que le futur bloc
     "Packs" d'un AdReel (cf. thumbnailOf), pour une cohérence visuelle partout où des packs sont listés. */
  .collection-pack-list { display: flex; flex-direction: column; gap: 2px; }
  .collection-pack-row {
    display: flex; align-items: center; gap: 14px; padding: 12px 4px; text-decoration: none; color: inherit;
    border-bottom: 1px solid var(--border);
  }
  .collection-pack-row:hover .collection-pack-row-title { color: var(--accent); }
  .collection-pack-thumb { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
  .collection-pack-thumb.empty { background: linear-gradient(135deg, #2a2822, #423b30); }
  .collection-pack-row-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; transition: color 0.15s ease; }

  .empty { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dimmer); padding: 60px 0; text-align: center; }
  .layerpitch-credit { margin-top: 56px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dimmer); text-align: center; }
  .layerpitch-credit a { color: inherit; text-decoration: none; }
  .layerpitch-credit a:hover { text-decoration: underline; }
  /* Séparateurs entre sections (Chantier Apparence Phase 3) -- désactivé par défaut. */
  #content.show-separators > .pub-section + .pub-section { border-top: var(--separator-width, 1px) solid var(--separator-color, transparent); padding-top: 32px; }
  .contrast-toggle { display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dimmer); margin-top: 40px; cursor: pointer; }
  .contrast-toggle input { width: auto; }

  .share-btn {
    position: fixed; top: 20px; right: 20px; z-index: 50;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-dimmer); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .share-btn:hover { color: var(--accent); border-color: var(--accent); }
  .share-btn:active { transform: scale(0.94); }
  .share-btn svg { width: 18px; height: 18px; }
  .share-btn.copied { color: #2a7; border-color: #2a7; }
</style>
</head>
<body>
<button id="shareBtn" class="share-btn" type="button" aria-label="Share">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 15V4"/>
    <path d="M7.5 8.5L12 4l4.5 4.5"/>
    <path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>
  </svg>
</button>
<div class="page">
  <a class="back-link" href="./index.html" id="backLinkEl" data-i18n="backLink">← Retour</a>
  <div id="content"></div>
  <label class="contrast-toggle"><input type="checkbox" id="nightModeToggle"> <span data-i18n="nightMode">Mode nuit</span></label>
  <label class="contrast-toggle"><input type="checkbox" id="contrastToggle"> <span data-i18n="highContrast">Contraste renforcé</span></label>
</div>

<script src="layerpitch-i18n.js?v=1788440725621"></script>
<script src="layerpitch-help.js?v=1788440725621"></script>
<script src="player.js?v=1788440725621"></script>
<script>
const { escapeHtml, linkify, setupContrastToggle, setupNightModeToggle } = window.LayerPlayerCore;

// Images migrées vers Cloudflare R2 (docs/infrastructure.md, Partie B, Décision 3) — chemins
// conservés à l'identique (images/<filename>), seul le domaine de base change.
const IMAGES_BASE = 'https://media.layerpitch.com/images/';

// Chemin joli par compositeur — voir le commentaire équivalent dans index.html.
(function restorePrettyUrl() {
  const pretty = new URLSearchParams(location.search).get('__pretty');
  if (pretty) history.replaceState(null, '', pretty);
})();
const DEFAULT_OWNER_ID = 'd7b26934-2f7d-43d4-a69e-52611bf4c141';

// Lecture Postgres (Décision 5, séquençage "site public → Postgres", docs/infrastructure.md) —
// validation de parité en isolation, jamais activée par défaut. Comportement inchangé tant que
// ?dataSource=postgres n'est pas explicitement présent dans l'URL.
let postgresReadScriptsLoaded = null;
function loadPostgresReadScripts() {
  if (postgresReadScriptsLoaded) return postgresReadScriptsLoaded;
  // Cache-busting sur les fichiers locaux (api/*.js) uniquement — voir le commentaire équivalent
  // dans index.html (trouvé le 1er septembre, docs/LAYERPITCH_CHANGELOG.md).
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src.startsWith('http') ? src : src + '?v=' + Date.now();
      // s.onerror reçoit un Event DOM (pas de .message) -- reject() explicite avec une vraie Error
      // pour nommer le script en cause plutôt que d'afficher "undefined" (trouvé le 1er septembre).
      s.onload = resolve;
      s.onerror = () => reject(new Error('Échec du chargement de ' + s.src));
      document.head.appendChild(s);
    });
  }
  postgresReadScriptsLoaded = (async () => {
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
    await loadScript('./api/supabase-client.js');
    await loadScript('./api/tracks.js');
    await loadScript('./api/packs.js');
    await loadScript('./api/collections.js');
    await loadScript('./api/sfx.js');
    await loadScript('./api/settings.js');
    await loadScript('./api/adreels.js');
    await loadScript('./api/site-data.js');
    await loadScript('./api/composers.js');
  })();
  return postgresReadScriptsLoaded;
}
// Dernier ownerId résolu par loadSiteData() — voir le commentaire équivalent dans index.html
// (ajouté le 4 septembre pour le tableau de bord analytique compositeur).
let lastResolvedOwnerId = DEFAULT_OWNER_ID;
// Identité de compositeur par handle — voir le commentaire équivalent dans index.html.
async function loadSiteData() {
  const params = new URLSearchParams(location.search);
  const handle = params.get('u');
  const usePostgres = !!handle || params.get('dataSource') === 'postgres';
  if (!usePostgres) {
    lastResolvedOwnerId = DEFAULT_OWNER_ID;
    const res = await fetch('./data.json?v=' + Date.now());
    return res.json();
  }
  await loadPostgresReadScripts();
  let ownerId = DEFAULT_OWNER_ID;
  if (handle) {
    const { ownerId: resolvedId, error } = await window.LayerPitchComposers.resolveHandle(handle);
    if (error) throw new Error(error);
    ownerId = resolvedId || DEFAULT_OWNER_ID;
  }
  lastResolvedOwnerId = ownerId;
  return window.LayerPitchSiteData.loadSiteDataFromPostgres(ownerId);
}

// Presets du palier Free (Chantier Apparence Phase 3, 4 septembre) -- copiés tel quel depuis
// layerpitch-backstage.html/index.html/pack.html, même encodage, même logique.
const THEME_PRESETS = [
  { id: 'default', labelKey: 'themePresetDefault', bgColor: '#FAFAF8', titleColor: '#1A1A1A', contentColor: '#333333', font: 'default', separator: { visible: true, color: '#E0E0DC', thickness: 1 } },
  { id: 'night', labelKey: 'themePresetNight', bgColor: '#121212', titleColor: '#FFFFFF', contentColor: '#C9C9CE', font: 'default', separator: { visible: true, color: '#3A3A40', thickness: 1 } },
  { id: 'amber', labelKey: 'themePresetAmber', bgColor: '#F5EDE0', titleColor: '#A85C1E', contentColor: '#5C4530', font: 'google:Fraunces', separator: { visible: true, color: '#C99A6B', thickness: 3 } },
  { id: 'neon', labelKey: 'themePresetNeon', bgColor: '#1B1035', titleColor: '#FF3EA5', contentColor: '#D9CFFF', font: 'google:Space Grotesk', separator: { visible: true, color: '#7A5FFF', thickness: 1 } },
  { id: 'forest', labelKey: 'themePresetForest', bgColor: '#16321F', titleColor: '#D4AF37', contentColor: '#EDE6D6', font: 'google:Zilla Slab', separator: { visible: true, color: '#8C7A3D', thickness: 1 } },
  { id: 'minimal', labelKey: 'themePresetMinimal', bgColor: '#FFFFFF', titleColor: '#000000', contentColor: '#4D4D4D', font: 'google:Manrope', separator: { visible: false, color: '#E0E0DC', thickness: 1 } }
];
function resolveThemePreset(presetId) {
  return THEME_PRESETS.find(p => p.id === presetId) || THEME_PRESETS[0];
}
const DEFAULT_SEPARATOR = { visible: false, color: '#E4E1DA', thickness: 1 };
// Résout une valeur de police ('default' | 'google:Nom' | 'custom:id') en une déclaration font-family CSS
// utilisable. Retourne null pour 'default' (aucun override -- le body garde son font-family de base).
// Copié tel quel depuis index.html/pack.html (19/08) : même encodage, même logique, pas de duplication.
function fontCssFamily(fontValue, customFonts) {
  if (!fontValue || fontValue === 'default') return null;
  if (fontValue.startsWith('google:')) return `'${fontValue.slice(7)}', sans-serif`;
  if (fontValue.startsWith('custom:')) {
    const id = fontValue.slice(7);
    const font = (customFonts || []).find(f => f.id === id);
    return font ? `'${font.name}', sans-serif` : null;
  }
  return null;
}
// Injecte uniquement l'asset nécessaire à la police effectivement utilisée par cette collection -- jamais
// toute la bibliothèque de polices du compositeur.
const injectedFontAssets = new Set();
function injectFontAssets(usedFontValues, customFonts) {
  usedFontValues.forEach(val => {
    if (!val || val === 'default' || injectedFontAssets.has(val)) return;
    injectedFontAssets.add(val);
    if (val.startsWith('google:')) {
      const family = val.slice(7);
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family).replace(/%20/g, '+')}:wght@400;500;600;700&display=swap`;
      document.head.appendChild(link);
    } else if (val.startsWith('custom:')) {
      const font = (customFonts || []).find(f => f.id === val.slice(7));
      if (!font || !font.file) return;
      const style = document.createElement('style');
      style.textContent = `@font-face { font-family: '${font.name}'; src: url('./fonts/${font.file}'); font-display: swap; }`;
      document.head.appendChild(style);
    }
  });
}

// Langue transmise par l'AdReel/pack qui a mené ici (paramètre ?lang= dans le lien), jamais choisie par
// le visiteur — même principe que pack.html.
const pageLang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
function currentLang() { return pageLang; }
function pickBilingualText(fr, en) {
  return (pageLang === 'en' ? (en || fr) : (fr || en)) || '';
}
// tr('clé') pour le texte généré en JS ; data-i18n pour le HTML statique. Zone "collection" -> zone
// "shared" -> même chose en français -> la clé elle-même.
function tr(key) {
  const I18N = window.LAYERPITCH_I18N || { fr: { shared: {}, collection: {} }, en: { shared: {}, collection: {} } };
  const dict = I18N[currentLang()] || I18N.fr;
  const dictFr = I18N.fr;
  return (dict.collection && dict.collection[key]) || (dict.shared && dict.shared[key])
    || (dictFr.collection && dictFr.collection[key]) || (dictFr.shared && dictFr.shared[key]) || key;
}
function applyI18n() {
  document.documentElement.lang = currentLang();
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = tr(el.dataset.i18n); if (v) el.textContent = v; });
}
window.LayerPlayerCore.setLang(pageLang);
applyI18n();

// Umami (analytics) — même principe que pack.html/index.html, dupliqué à l'identique (chaque script a sa
// propre closure). Jamais bloquant, silencieux si Umami n'est pas chargé.
function trackPublicEvent(name, detail) {
  try {
    if (window.umami && typeof window.umami.track === 'function') {
      window.umami.track(name, Object.assign({}, detail, window.__lpTrackContext || {}));
    }
  } catch (e) { /* silencieux */ }
}

async function init() {
  const container = document.getElementById('content');
  const id = new URLSearchParams(location.search).get('id');
  window.__lpTrackContext = { type: 'collection', id: id };
  try {
    const data = await loadSiteData();
    window.__lpTrackContext.ownerId = lastResolvedOwnerId;
    const collection = (data.collections || []).find(c => c.id === id);
    if (!collection) {
      container.innerHTML = `<div class="empty">${tr('collectionNotFound')}</div>`;
      return;
    }
    // collection.effectivePlan est figé une fois pour toutes à la publication (Chantier Apparence Phase
    // 3) -- absent = collection publiée avant cette Phase 3 -> traité comme Starter.
    const tier = collection.effectivePlan || 'starter';
    // Style de forme d'onde (Chantier Apparence, palier Pro, 05/09) : réglage global du compositeur
    // (data.waveformStyle), pas un champ de collection -- gating identique au reste de l'apparence Pro
    // (voir player.js et index.html, même logique).
    window.LayerPlayerCore.setWaveformStyle(tier === 'pro' ? (data.waveformStyle || 'bars') : 'bars');
    // Thème de la carte des chemins (Chantier Apparence, palier Pro, 06/09) : réglage global du
    // compositeur (data.seqMapTheme), même gating que le reste de l'apparence Pro ci-dessus.
    window.LayerPlayerCore.setSeqMapTheme(tier === 'pro' ? (data.seqMapTheme || 'light') : 'light');
    const theme = tier === 'free'
      ? resolveThemePreset(collection.presetId)
      : { bgColor: collection.bgColor, titleColor: collection.textColor, contentColor: collection.textColor, font: collection.font };
    if (theme.bgColor) document.documentElement.style.setProperty('--bg', theme.bgColor);
    if (theme.contentColor) document.documentElement.style.setProperty('--text', theme.contentColor);
    if (theme.font) {
      injectFontAssets([theme.font], data.customFonts || []);
      document.documentElement.style.setProperty('--font-body', fontCssFamily(theme.font, data.customFonts || []) || "'Inter', sans-serif");
    }
    const separator = tier === 'free' ? theme.separator : Object.assign({}, DEFAULT_SEPARATOR, collection.separator || {});
    document.documentElement.style.setProperty('--separator-color', separator.color);
    document.documentElement.style.setProperty('--separator-width', separator.thickness + 'px');
    container.classList.toggle('show-separators', !!separator.visible);
    setupContrastToggle('contrastToggle', theme.bgColor, theme.contentColor);
    setupNightModeToggle('nightModeToggle', theme.bgColor, theme.contentColor);
    const packsById = {};
    (data.packs || []).forEach(p => { packsById[p.id] = p; });
    const includedPacks = (collection.packIds || []).map(pid => packsById[pid]).filter(Boolean);

    // ← Retour + chaînage vers les packs (4 septembre, même chantier que pack.html) : une collection
    // n'a pas d'équivalent de pack.linkedAdReelId (pas configurée en backstage) -- seul le paramètre
    // `from` dynamique (déposé par adReelFromParam(), index.html) permet de savoir par quel AdReel
    // cette collection a été ouverte. handleParam et fromParam sont propagés vers chaque pack listé
    // pour que SON "← Retour" revienne ici (fromCollection) plutôt que de sauter directement à
    // l'AdReel -- la collection reste elle-même capable de continuer la chaîne jusqu'à l'AdReel.
    const fromAdReelId = new URLSearchParams(location.search).get('from');
    const handle = new URLSearchParams(location.search).get('u');
    const handleParam = handle ? `&u=${encodeURIComponent(handle)}` : '';
    const fromParam = fromAdReelId ? `&from=${encodeURIComponent(fromAdReelId)}` : '';
    const linkedAdReel = fromAdReelId ? (data.adReels || []).find(a => a.id === fromAdReelId) : null;
    const backLinkEl = document.getElementById('backLinkEl');
    if (linkedAdReel) {
      const adReelHref = (linkedAdReel.id === 'main' ? `./index.html?lang=${pageLang}` : `./index.html?adreel=${encodeURIComponent(linkedAdReel.id)}&lang=${pageLang}`) + handleParam;
      if (backLinkEl) backLinkEl.href = adReelHref;
    } else if (backLinkEl && handle) {
      // Aucun AdReel d'origine résolvable (visite directe, lien de collection partagé isolément),
      // mais le handle du compositeur est connu (URL de la collection elle-même, ?u=<handle>) --
      // même raisonnement que pack.html : "Retour" n'a pas de sens ici, remplacé par un lien vers
      // l'AdReel principal du compositeur.
      const mainAdReel = (data.adReels || []).find(a => a.id === 'main');
      const composerName = (mainAdReel && mainAdReel.profile && mainAdReel.profile.title) || tr('linkedAdReelFallbackName');
      backLinkEl.href = `./index.html?lang=${pageLang}${handleParam}`;
      backLinkEl.textContent = tr('backToComposerLink').replace('{name}', composerName);
    } else if (backLinkEl && window.history.length > 1) {
      // Handle totalement inconnu (visite directe sans ?u=, cas hérité pré-multi-compositeur) --
      // retour navigateur plutôt que de forcer index.html (retomberait sur DEFAULT_OWNER_ID faute de
      // vraie page d'accueil générique, docs/infrastructure.md).
      backLinkEl.addEventListener('click', (e) => { e.preventDefault(); window.history.back(); });
    }

    container.innerHTML = `
      <div class="pub-section">
        ${collection.illustration ? `<img class="pack-illustration" src="${IMAGES_BASE}${collection.illustration}" alt="">` : `<div class="pack-illustration empty"></div>`}
        <div class="pack-title">${escapeHtml(collection.title)}</div>
        <div class="pack-presentation">${pickBilingualText(collection.presentationFr, collection.presentationEn).split('\n\n').map(p => `<p>${linkify(p)}</p>`).join('')}</div>
        <div class="section-label">${tr('packsInCollectionLabel')}</div>
        <div class="collection-pack-list">
          ${includedPacks.length ? includedPacks.map(p => `
            <a class="collection-pack-row" href="./pack.html?id=${encodeURIComponent(p.id)}&lang=${pageLang}&fromCollection=${encodeURIComponent(id)}${fromParam}${handleParam}">
              ${p.illustration ? `<img class="collection-pack-thumb" src="${IMAGES_BASE}${p.illustration}" alt="" loading="lazy">` : `<div class="collection-pack-thumb empty"></div>`}
              <span class="collection-pack-row-title">${escapeHtml(p.title)}</span>
            </a>
          `).join('') : `<div class="empty">${tr('noPacksInCollectionYet')}</div>`}
        </div>
      </div>
    `;

    const libraryById = {};
    (data.library || []).forEach(t => { t.publishedAt = data.publishedAt; libraryById[t.id] = t; });
    // Morceaux de tous les packs inclus, dédupliqués — un même morceau pourrait apparaître dans
    // plusieurs packs d'une même collection, il ne doit figurer qu'une fois dans le zip.
    const seenTrackIds = new Set();
    const allTracks = [];
    includedPacks.forEach(p => (p.trackIds || []).forEach(tid => {
      if (seenTrackIds.has(tid)) return;
      seenTrackIds.add(tid);
      const t = libraryById[tid];
      if (t) allTracks.push(t);
    }));

    const buySection = document.createElement('div');
    buySection.className = 'buy-section pub-section';
    // Même principe que pack.html : téléchargement gratuit réel dès aujourd'hui, vente toujours affichée
    // grisée pendant la bêta (quel que soit buyUrl), pour ne jamais laisser croire à un vrai système de
    // paiement qui n'existe pas encore.
    let buyHtml = '';
    if (collection.freeDownloadEnabled) {
      buyHtml += `<button class="buy-btn" id="freeDownloadBtn" type="button">${tr('freeDownloadBtn')}</button>`;
    }
    buyHtml += `<div style="margin-top:${collection.freeDownloadEnabled ? '14px' : '0'}"><span class="buy-btn disabled">${tr('comingSoon')}</span><div class="buy-hint">${tr('notForSaleYet')}</div></div>`;
    buySection.innerHTML = buyHtml;
    container.appendChild(buySection);
    if (collection.freeDownloadEnabled) {
      document.getElementById('freeDownloadBtn').addEventListener('click', async () => {
        const btn = document.getElementById('freeDownloadBtn');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = tr('downloadPreparing');
        try {
          await window.LayerPlayerCore.downloadTracksAsZip(collection.title, allTracks);
        } catch (e) {
          console.error('LayerPitch — échec du téléchargement de la collection :', e);
          alert(tr('downloadError'));
        } finally {
          btn.disabled = false;
          btn.textContent = original;
        }
      });
    }

    // Filigrane "propulsé par LayerPitch" (Chantier Apparence Phase 3) : affiché sur Free et Starter,
    // retiré sur Pro, cliquable vers la landing LayerPitch -- même logique que index.html/pack.html.
    if (tier !== 'pro') {
      const credit = document.createElement('div');
      credit.className = 'layerpitch-credit';
      const creditLink = document.createElement('a');
      creditLink.href = 'https://layerpitch.com';
      creditLink.target = '_blank';
      creditLink.rel = 'noopener';
      creditLink.textContent = tr('creditLine').replace('{title}', collection.title);
      credit.appendChild(creditLink);
      document.getElementById('content').appendChild(credit);
    }
  } catch (e) {
    console.error('LayerPitch — échec du chargement de la collection :', e);
    container.innerHTML = `<div class="empty">${tr('loadError')}</div>`;
  }
}
(function setupShareButton() {
  const btn = document.getElementById('shareBtn');
  if (!btn) return;
  btn.setAttribute('aria-label', tr('shareBtn'));
  btn.title = tr('shareBtn');
  btn.addEventListener('click', async () => {
    const result = await window.LayerPlayerCore.shareOrCopy(location.href, document.title);
    if (result === 'copied') {
      btn.classList.add('copied');
      btn.title = tr('linkCopiedToast');
      setTimeout(() => { btn.classList.remove('copied'); btn.title = tr('shareBtn'); }, 1500);
    }
  });
})();
window.addEventListener('load', init);
</script>
</body>
