<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LayerPitch — Pack</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f6f5f3; --bg-card: #ffffff; --border: #e4e1da;
    --text: #262521; --text-dim: #6f6b62; --text-dimmer: #a8a399;
    --accent: #c9713c; --accent-soft: #f3e4d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  img { max-width: 100%; height: auto; display: block; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 56px 24px 60px; }
  .page { max-width: 760px; margin: 0 auto; }
  a { color: var(--accent); }

  .back-link { display: inline-block; margin-bottom: 32px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); text-decoration: none; }
  .back-link:hover { color: var(--accent); }

  .pack-illustration { width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 28px; }
  .pack-illustration.empty { aspect-ratio: 16/7; background: linear-gradient(135deg, #2a2822, #423b30); }

  .pack-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; margin-bottom: 16px; }
  .pack-presentation p { font-size: 14.5px; line-height: 1.7; color: var(--text-dim); margin-bottom: 14px; white-space: pre-wrap; }

  .block { margin-bottom: 56px; margin-top: 48px; }
  .section-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 18px;
  }

  .track { border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); padding: 26px; margin-bottom: 16px; }
  .track-intensity-block { margin-top: 16px; }
  .track-intensity-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dimmer); margin-bottom: 6px; }
  .intensity-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .intensity-chip {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 3px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; line-height: 1.6;
  }
  .intensity-chip:hover { border-color: var(--accent); color: var(--accent); }
  .intensity-chip.active { background: var(--accent); border-color: var(--accent); color: var(--bg, #fff); }

  .track-row-wrapper { border-bottom: 1px solid var(--border); }
  .track-row { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; padding: 12px 0; }
  .play-btn {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; color: var(--text-dim);
  }
  .play-btn:hover { border-color: var(--accent); color: var(--accent); }
  .play-btn svg { width: 12px; height: 12px; }
  .track-row-title { display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; }
  .track-row-title .name { font-family: 'Space Grotesk', sans-serif; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mode-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.04em; color: var(--text-dimmer);
    border: 1px dashed var(--border); border-radius: 4px; padding: 1px 6px; flex-shrink: 0; white-space: nowrap;
  }
  .track-row-details { padding: 0 0 18px 38px; }
  .track-desc { font-size: 13px; line-height: 1.6; color: var(--text-dim); margin-bottom: 16px; white-space: pre-wrap; }
  .status { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dimmer); margin-bottom: 10px; min-height: 14px; }

  .progress-wrap { position: relative; height: 24px; margin-bottom: 6px; cursor: pointer; }
  .progress-track { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); height: 3px; background: var(--border); border-radius: 2px; pointer-events: none; }
  .progress-fill { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 3px; background: var(--accent); border-radius: 2px; width: 0%; pointer-events: none; }
  .progress-head { position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%); width: 9px; height: 9px; background: var(--accent); border-radius: 50%; pointer-events: none; }
  .time-row { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-dimmer); }

  .stingers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .stinger-btn {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; cursor: pointer;
  }
  .stinger-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .stinger-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .stinger-btn svg { width: 10px; height: 10px; }

  .placeholder-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dimmer); border: 1px dashed var(--border); border-radius: 4px; padding: 8px 12px; display: inline-block; }
  .track.disabled { opacity: 0.5; }

  .empty { font-size: 13px; color: var(--text-dim); text-align: center; padding: 20px 0; }

  .buy-section { margin-top: 56px; text-align: center; padding: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); }
  .buy-btn {
    display: inline-block; padding: 14px 32px; border-radius: 6px; background: var(--accent); color: #fff;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    text-decoration: none; border: none; cursor: pointer;
  }
  .buy-btn:hover { opacity: 0.9; }
  .buy-btn.disabled { background: var(--border); color: var(--text-dimmer); cursor: not-allowed; pointer-events: none; }
  .buy-hint { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dimmer); margin-top: 10px; }
</style>
</head>
<body>
<div class="page">
  <a class="back-link" href="./index.html">← Retour</a>
  <div id="content"></div>
</div>

<script>
let ctx = null;
let activeTrackId = null;
const trackCollapsers = {};
const trackStingerKillers = {};

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}
function cumulativeProfiles(n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(Array.from({ length: n }, (_, j) => (j <= i ? 1 : 0)));
  return out;
}
function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function linkify(s) { return escapeHtml(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>'); }

const MODE_LABELS = {
  static: 'statique',
  vertical: 'layering vertical',
  'vertical-random': 'layering vertical randomisé',
  sequential: 'séquentiel',
  branching: 'embranchement'
};
const PLAYABLE_MODES = ['static', 'vertical'];

function section(label, innerHTML) {
  const el = document.createElement('div');
  el.className = 'block';
  el.innerHTML = (label ? `<div class="section-label">${label}</div>` : '') + innerHTML;
  return el;
}

function renderTracksBlock(container, tracks) {
  const el = section('Musique du pack', '');
  container.appendChild(el);
  if (!tracks || tracks.length === 0) {
    el.innerHTML += '<div class="empty">Aucun morceau dans ce pack.</div>';
    return;
  }
  tracks.forEach(track => {
    const row = buildTrackRow(track);
    el.appendChild(row);
    initTrackPlayer(track, row);
  });
}

function buildTrackRow(track) {
  const supported = PLAYABLE_MODES.includes(track.mode);
  const isStatic = track.mode === 'static';
  const hasFiles = supported && track.base && track.layers[0] && track.layers[0].file &&
    (isStatic || track.layers.every(l => l.file));

  const wrapper = document.createElement('div');
  wrapper.className = 'track-row-wrapper';

  let intensityBlockHtml = '';
  if (!isStatic && supported) {
    const n = track.layers.length;
    const chips = Array.from({ length: n }, (_, i) => {
      const label = (track.layers[i] && track.layers[i].label) ? track.layers[i].label : String(i + 1);
      return `<button type="button" class="intensity-chip${i === 0 ? ' active' : ''}" data-level="${i}">${escapeHtml(label)}</button>`;
    }).join('');
    intensityBlockHtml = `
      <div class="track-intensity-block">
        <div class="track-intensity-label">Intensité</div>
        <div class="intensity-picker" data-role="slider">${chips}</div>
      </div>
    `;
  }

  wrapper.innerHTML = `
    <div class="track-row">
      <button class="play-btn" data-role="playBtn" ${hasFiles ? '' : 'disabled'} aria-label="Lecture">
        <svg data-role="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="track-row-title" data-role="titleToggle">
        <span class="name">${escapeHtml(track.title)}</span>
        <span class="mode-tag">${MODE_LABELS[track.mode] || track.mode}</span>
      </div>
    </div>
    <div class="track-row-details" data-role="details" style="display:none">
      <div class="track-desc">${linkify(track.description || '')}</div>
      ${!supported ? `<span class="placeholder-tag">Mode "${track.mode}" pas encore supporté</span>` :
        !hasFiles ? `<span class="placeholder-tag">Fichiers audio manquants</span>` : `
        <div class="status" data-role="status">Chargement…</div>
        <div class="progress-wrap" data-role="progressWrap">
          <div class="progress-track"></div>
          <div class="progress-fill" data-role="progressFill"></div>
          <div class="progress-head" data-role="progressHead"></div>
        </div>
        <div class="time-row"><span data-role="timeCurrent">0:00</span><span>${formatTime(track.duration)}</span></div>
        ${isStatic && track.stingers && track.stingers.length ? `
          <div class="stingers" data-role="stingers">
            ${track.stingers.map((s, i) => `<button class="stinger-btn" data-stinger="${i}" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>${escapeHtml(s.label || ('Stinger ' + (i + 1)))}</button>`).join('')}
          </div>
        ` : ''}
      `}
      ${intensityBlockHtml}
    </div>
  `;
  return wrapper;
}

function initTrackPlayer(track, wrapper) {
  const isStatic = track.mode === 'static';
  const supported = PLAYABLE_MODES.includes(track.mode);
  const hasFiles = supported && track.base && track.layers[0] && track.layers[0].file &&
    (isStatic || track.layers.every(l => l.file));
  if (!hasFiles) return;

  const layersToLoad = isStatic ? [track.layers[0]] : track.layers;
  const profiles = isStatic ? [[1]] : cumulativeProfiles(track.layers.length);
  const loops = !isStatic || !!track.loopable;
  const useQuantizedLoop = loops && track.loopEngine === 'quantized';
  const stingerDefs = track.stingers ? track.stingers.filter(s => s.file) : [];

  const bpm = track.bpm || 120;
  const beatsPerBar = track.beatsPerBar || 4;
  const secondsPerBeat = 60 / bpm;
  const loopInSec = (track.loopInBeat || 0) * secondsPerBeat;
  const loopOutSec = Math.max(loopInSec + secondsPerBeat, (track.loopOutBeat || beatsPerBar * 4) * secondsPerBeat);
  const cycleLength = loopOutSec - loopInSec;

  const playBtn = wrapper.querySelector('[data-role="playBtn"]');
  const playIcon = wrapper.querySelector('[data-role="playIcon"]');
  const details = wrapper.querySelector('[data-role="details"]');
  const statusEl = wrapper.querySelector('[data-role="status"]');
  const wrap = wrapper.querySelector('[data-role="progressWrap"]');
  const fill = wrapper.querySelector('[data-role="progressFill"]');
  const head = wrapper.querySelector('[data-role="progressHead"]');
  const timeCurrent = wrapper.querySelector('[data-role="timeCurrent"]');
  const notchDots = [...wrapper.querySelectorAll('.intensity-chip')];
  const stingerBtns = [...wrapper.querySelectorAll('.stinger-btn')];

  let buffers = [], sources = [], gains = [];
  let activeGenSources = [];
  let currentGainNodes = [];
  let schedulerTimer = null;
  let latestGenStartCtxTime = 0, latestGenBufferOffset = 0, nextGenStartCtxTime = 0, nextGenBufferOffset = 0;

  let stingerBuffers = [];
  let activeStingerSources = [];
  let level = 0, playing = false, startedAt = 0, offsetAt = 0, rafId = null, manualStop = false, ready = false;

  const PLAY_SVG = '<path d="M8 5v14l11-7z"/>';
  const PAUSE_SVG = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  function updateStingerAvailability() {
    const expanded = details.style.display !== 'none';
    setStingerButtonsEnabled(expanded && ready);
  }
  function setStingerButtonsEnabled(enabled) { stingerBtns.forEach(b => { b.disabled = !enabled; }); }
  function killStingers() {
    activeStingerSources.forEach(s => { try { s.stop(); } catch(e){} });
    activeStingerSources = [];
  }
  trackCollapsers[track.id] = () => { details.style.display = 'none'; updateStingerAvailability(); };
  trackStingerKillers[track.id] = killStingers;

  function updateProgressAt(elapsed) {
    if (!wrap) return;
    const pct = (elapsed / track.duration) * 100;
    fill.style.width = pct + '%'; head.style.left = pct + '%';
    timeCurrent.textContent = formatTime(elapsed);
  }
  function tick() {
    if (!playing) return;
    const elapsed = useQuantizedLoop
      ? Math.min(latestGenBufferOffset + (ctx.currentTime - latestGenStartCtxTime), track.duration)
      : (loops ? (ctx.currentTime - startedAt) % track.duration : Math.min(ctx.currentTime - startedAt, track.duration));
    updateProgressAt(elapsed);
    rafId = requestAnimationFrame(tick);
  }
  function setStoppedUI() {
    playIcon.innerHTML = PLAY_SVG;
    if (statusEl) statusEl.textContent = 'En pause';
  }

  function stopSimple(keepPosition) {
    manualStop = true;
    if (loops && keepPosition !== false) offsetAt = (ctx.currentTime - startedAt) % track.duration;
    sources.forEach(s => { if (s) { try { s.stop(); } catch(e){} } });
    sources = []; gains = [];
    manualStop = false;
  }
  function playSimple() {
    startedAt = ctx.currentTime - offsetAt;
    const p = profiles[level] || profiles[0];
    for (let i = 0; i < buffers.length; i++) {
      const src = ctx.createBufferSource();
      src.buffer = buffers[i];
      if (loops) { src.loop = true; src.loopStart = 0; src.loopEnd = track.duration; }
      const g = ctx.createGain();
      g.gain.setValueAtTime(p[i] || 0, ctx.currentTime);
      src.connect(g); g.connect(ctx.destination);
      src.start(0, offsetAt % track.duration);
      sources[i] = src; gains[i] = g;
      if (isStatic && !loops) src.onended = () => { if (!manualStop) naturalEnd(); };
    }
  }

  function scheduleGeneration(ctxStartTime, bufferOffset) {
    const p = profiles[level] || profiles[0];
    const gensThisRound = [];
    for (let i = 0; i < buffers.length; i++) {
      if (!buffers[i]) continue;
      const src = ctx.createBufferSource();
      src.buffer = buffers[i];
      const g = ctx.createGain();
      g.gain.setValueAtTime(p[i] || 0, ctxStartTime);
      src.connect(g); g.connect(ctx.destination);
      src.start(ctxStartTime, bufferOffset);
      activeGenSources.push({ src, gain: g });
      gensThisRound[i] = g;
    }
    currentGainNodes = gensThisRound;
    latestGenStartCtxTime = ctxStartTime;
    latestGenBufferOffset = bufferOffset;
  }
  function schedulerTick() {
    const lookahead = 1.0;
    while (nextGenStartCtxTime < ctx.currentTime + lookahead) {
      scheduleGeneration(nextGenStartCtxTime, nextGenBufferOffset);
      nextGenStartCtxTime += cycleLength;
      nextGenBufferOffset = loopInSec;
    }
  }
  function stopQuantized() {
    if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
    activeGenSources.forEach(({ src }) => { try { src.stop(); } catch(e){} });
    activeGenSources = [];
  }
  function playQuantized(fromOffsetSec) {
    stopQuantized();
    const now = ctx.currentTime;
    scheduleGeneration(now, fromOffsetSec);
    let timeUntilNext;
    if (fromOffsetSec < loopInSec) {
      timeUntilNext = loopOutSec - fromOffsetSec;
    } else {
      const positionInLoop = (fromOffsetSec - loopInSec) % cycleLength;
      timeUntilNext = cycleLength - positionInLoop;
    }
    nextGenStartCtxTime = now + Math.max(0.02, timeUntilNext);
    nextGenBufferOffset = loopInSec;
    schedulerTimer = setInterval(schedulerTick, 200);
  }

  function stopAllSources(keepPosition) {
    playing = false;
    if (useQuantizedLoop) {
      if (keepPosition !== false) offsetAt = Math.min(latestGenBufferOffset + (ctx.currentTime - latestGenStartCtxTime), track.duration);
      stopQuantized();
    } else {
      stopSimple(keepPosition);
    }
    cancelAnimationFrame(rafId);
    setStoppedUI();
  }
  function naturalEnd() {
    playing = false;
    cancelAnimationFrame(rafId);
    offsetAt = 0;
    updateProgressAt(0);
    setStoppedUI();
    if (activeTrackId === track.id) activeTrackId = null;
  }
  function playThisTrack() {
    if (activeTrackId && activeTrackId !== track.id) {
      document.dispatchEvent(new CustomEvent('stop-track', { detail: activeTrackId }));
      if (trackStingerKillers[activeTrackId]) trackStingerKillers[activeTrackId]();
    }
    Object.keys(trackCollapsers).forEach(id => { if (id !== track.id) trackCollapsers[id](); });
    activeTrackId = track.id;
    details.style.display = 'block';
    updateStingerAvailability();
    if (ctx.state === 'suspended') ctx.resume();
    playing = true;
    if (useQuantizedLoop) {
      playQuantized(offsetAt % track.duration);
    } else {
      playSimple();
    }
    playIcon.innerHTML = PAUSE_SVG;
    if (statusEl) statusEl.textContent = 'Lecture en cours';
    tick();
  }

  const titleToggle = wrapper.querySelector('[data-role="titleToggle"]');
  if (titleToggle) titleToggle.addEventListener('click', updateStingerAvailability);

  document.addEventListener('stop-track', (e) => { if (e.detail === track.id) stopAllSources(); });
  playBtn.addEventListener('click', () => { playing ? stopAllSources() : playThisTrack(); });

  if (wrap) {
    wrap.addEventListener('click', (e) => {
      const rect = wrap.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const seekTo = pct * track.duration;
      if (playing) { stopAllSources(false); offsetAt = seekTo; playThisTrack(); }
      else { offsetAt = seekTo; updateProgressAt(offsetAt); }
    });
  }

  notchDots.forEach(dot => {
    dot.addEventListener('click', () => {
      level = parseInt(dot.dataset.level, 10);
      notchDots.forEach(d => d.classList.toggle('active', d === dot));
      if (!playing) return;
      const p = profiles[level];
      const now = ctx.currentTime;
      const gainsToRamp = useQuantizedLoop ? currentGainNodes : gains;
      gainsToRamp.forEach((g, i) => {
        if (!g) return;
        g.gain.cancelScheduledValues(now);
        g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(p[i] || 0, now + 1.4);
      });
    });
  });

  stingerBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const idx = parseInt(btn.dataset.stinger, 10);
      const buf = stingerBuffers[idx];
      if (!buf) return;
      if (ctx.state === 'suspended') ctx.resume();
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.setValueAtTime(1, ctx.currentTime);
      src.connect(g); g.connect(ctx.destination);
      src.start(0);
      activeStingerSources.push(src);
      src.onended = () => { activeStingerSources = activeStingerSources.filter(s => s !== src); };
    });
  });

  (async () => {
    let loaded = 0;
    const total = layersToLoad.length + stingerDefs.length;
    for (let i = 0; i < layersToLoad.length; i++) {
      try {
        const res = await fetch(track.base + encodeURIComponent(layersToLoad[i].file));
        const ab = await res.arrayBuffer();
        buffers[i] = await ctx.decodeAudioData(ab);
        loaded++;
        if (statusEl) statusEl.textContent = `Chargement… ${loaded}/${total}`;
      } catch (e) { if (statusEl) statusEl.textContent = 'Erreur de chargement'; return; }
    }
    for (let i = 0; i < stingerDefs.length; i++) {
      try {
        const res = await fetch(track.base + encodeURIComponent(stingerDefs[i].file));
        const ab = await res.arrayBuffer();
        stingerBuffers[i] = await ctx.decodeAudioData(ab);
        loaded++;
        if (statusEl) statusEl.textContent = `Chargement… ${loaded}/${total}`;
      } catch (e) { /* stinger manquant : pas bloquant */ }
    }
    if (statusEl) statusEl.textContent = 'Prêt';
    playBtn.disabled = false;
    ready = true;
    updateStingerAvailability();
  })();
}

async function init() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const container = document.getElementById('content');
  const id = new URLSearchParams(location.search).get('id');
  try {
    const res = await fetch('./data.json');
    const data = await res.json();
    const pack = (data.packs || []).find(p => p.id === id);
    if (pack && pack.bgColor) document.documentElement.style.setProperty('--bg', pack.bgColor);
    if (pack && pack.textColor) document.documentElement.style.setProperty('--text', pack.textColor);
    if (!pack) {
      container.innerHTML = '<div class="empty">Pack introuvable.</div>';
      return;
    }
    container.innerHTML = `
      ${pack.illustration ? `<img class="pack-illustration" src="./images/${pack.illustration}" alt="">` : `<div class="pack-illustration empty"></div>`}
      <div class="pack-title">${escapeHtml(pack.title)}</div>
      <div class="pack-presentation">${(pack.presentation || '').split('\n\n').map(p => `<p>${linkify(p)}</p>`).join('')}</div>
    `;
    const musicContainer = document.createElement('div');
    container.appendChild(musicContainer);
    const libraryById = {};
    (data.library || []).forEach(t => { libraryById[t.id] = t; });
    const packTracks = (pack.trackIds || []).map(id => libraryById[id]).filter(Boolean);
    renderTracksBlock(musicContainer, packTracks);

    const buySection = document.createElement('div');
    buySection.className = 'buy-section';
    if (pack.buyable && pack.buyUrl) {
      buySection.innerHTML = `<a class="buy-btn" href="${pack.buyUrl}" target="_blank" rel="noopener">Acheter et télécharger ce pack</a>`;
    } else {
      buySection.innerHTML = `<span class="buy-btn disabled">Bientôt disponible</span><div class="buy-hint">Ce pack n'est pas encore proposé à l'achat.</div>`;
    }
    container.appendChild(buySection);
  } catch (e) {
    container.innerHTML = '<div class="empty">Impossible de charger data.json</div>';
  }
}
