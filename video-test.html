<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title data-i18n="pageTitle">Test gameplay — LayerPitch</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden; }
  #player-wrap, #yt-target { position: fixed; inset: 0; width: 100%; height: 100%; }
  #player-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  #error-box {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: #eee; font-family: system-ui, sans-serif;
    padding: 24px; text-align: center; background: #111;
  }
  #error-box.visible { display: flex; }
  #error-box .msg { font-size: 15px; }
  #error-box .hint { font-size: 13px; color: #999; max-width: 360px; }
</style>
</head>
<body>
<div id="player-wrap"><div id="yt-target"></div></div>
<div id="error-box">
  <div class="msg" data-i18n="errorMsg">Impossible de charger cette vidéo ici.</div>
  <div class="hint" data-i18n="errorHint">Vérifie qu'elle est publique et intégrable (pas restreinte "propriétaire uniquement" côté YouTube, ou "à mots de passe" côté Vimeo).</div>
</div>
<script src="layerpitch-i18n.js"></script>
<script>
// Fenêtre transitoire (ouverte par pack.html) : pas d'interrupteur de langue ici, on hérite simplement
// de la langue transmise par pack.html via l'URL. Dictionnaire dans layerpitch-i18n.js (zone "videoTest").
// Langue transmise par pack.html (paramètre ?lang=) — même AdReel, même langue, jamais de choix ici.
function currentLang() { return new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr'; }
function applyI18n() {
  const I18N = window.LAYERPITCH_I18N || { fr: { videoTest: {} }, en: { videoTest: {} } };
  const dict = (I18N[currentLang()] || I18N.fr).videoTest || {};
  const dictFr = (I18N.fr || {}).videoTest || {};
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const v = dict[key] || dictFr[key];
    if (v) el.textContent = v;
  });
}
applyI18n();

function showError() {
  document.getElementById('player-wrap').style.display = 'none';
  document.getElementById('error-box').classList.add('visible');
}

const params = new URLSearchParams(location.search);
const service = params.get('service');
const id = params.get('id');

if (!service || !id) {
  showError();
} else if (service === 'youtube') {
  // Filet de sécurité : si l'API ne répond jamais (script bloqué, réseau), on n'attend pas indéfiniment.
  const safetyTimer = setTimeout(showError, 8000);
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = showError;
  document.body.appendChild(tag);
  window.onYouTubeIframeAPIReady = function () {
    new YT.Player('yt-target', {
      videoId: id,
      width: '100%',
      height: '100%',
      playerVars: { autoplay: 1, mute: 1, playsinline: 1 },
      events: {
        onReady: function (e) { clearTimeout(safetyTimer); e.target.mute(); e.target.playVideo(); },
        onError: function () { clearTimeout(safetyTimer); showError(); }
      }
    });
  };
} else if (service === 'vimeo') {
  const safetyTimer = setTimeout(showError, 8000);
  const tag = document.createElement('script');
  tag.src = 'https://player.vimeo.com/api/player.js';
  tag.onerror = showError;
  tag.onload = function () {
    document.getElementById('yt-target').outerHTML =
      '<iframe id="vimeoIframe" src="https://player.vimeo.com/video/' + encodeURIComponent(id) +
      '?autoplay=1&muted=1&playsinline=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
    const iframe = document.getElementById('vimeoIframe');
    const player = new Vimeo.Player(iframe);
    player.setVolume(0).catch(function () {});
    player.ready().then(function () { clearTimeout(safetyTimer); }).catch(function () { clearTimeout(safetyTimer); showError(); });
    player.on('error', function () { clearTimeout(safetyTimer); showError(); });
  };
  document.body.appendChild(tag);
} else {
  showError();
}
</script>
</body>
</html>
