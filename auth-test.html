<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LayerPitch — Test auth Supabase</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #262521; }
  h1 { font-size: 18px; }
  input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 10px 18px; border: none; border-radius: 4px; background: #c9713c; color: #fff; cursor: pointer; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #status { margin: 20px 0; padding: 12px; background: #f6f5f3; border-radius: 4px; font-size: 13px; white-space: pre-wrap; }
  #adminSection { margin-top: 32px; padding-top: 20px; border-top: 1px solid #e4e1da; display: none; }
  .msg { font-size: 13px; margin-top: 8px; }
  .msg.err { color: #b5442e; }
  .msg.ok { color: #2a7; }
</style>
</head>
<body>
<h1>LayerPitch — Test isolé de l'authentification Supabase</h1>
<p style="font-size:13px;color:#6f6b62;">Page de test autonome (étape 2, docs/infrastructure.md) — n'affecte pas le site public ni le backstage.</p>

<div id="status">Chargement de l'état de session…</div>

<div id="signedOutSection">
  <input type="email" id="emailInput" placeholder="ton@email.com">
  <button id="sendLinkBtn">Envoyer le lien magique</button>
  <div id="signInMsg" class="msg"></div>
</div>

<div id="signedInSection" style="display:none;">
  <button id="signOutBtn">Se déconnecter</button>
</div>

<div id="adminSection">
  <h2 style="font-size:15px;">Inviter un·e testeur·euse</h2>
  <input type="email" id="inviteEmailInput" placeholder="testeur@email.com">
  <button id="inviteBtn">Envoyer l'invitation</button>
  <div id="inviteMsg" class="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="api/auth.js"></script>
<script>
const statusEl = document.getElementById('status');
const signedOutSection = document.getElementById('signedOutSection');
const signedInSection = document.getElementById('signedInSection');
const adminSection = document.getElementById('adminSection');

function render(session) {
  if (session) {
    statusEl.textContent = 'Connecté : ' + session.user.email;
    signedOutSection.style.display = 'none';
    signedInSection.style.display = 'block';
    adminSection.style.display = 'block'; // le vrai contrôle d'accès est côté Edge Function
  } else {
    statusEl.textContent = 'Non connecté.';
    signedOutSection.style.display = 'block';
    signedInSection.style.display = 'none';
    adminSection.style.display = 'none';
  }
}

LayerPitchAuth.onAuthStateChange((_event, session) => render(session));

document.getElementById('sendLinkBtn').addEventListener('click', async () => {
  const email = document.getElementById('emailInput').value.trim();
  const msg = document.getElementById('signInMsg');
  if (!email) { msg.textContent = 'Adresse email requise.'; msg.className = 'msg err'; return; }
  msg.textContent = 'Envoi…'; msg.className = 'msg';
  const { ok, error } = await LayerPitchAuth.signInWithMagicLink(email, window.location.href);
  msg.textContent = ok ? 'Lien envoyé — vérifie ta boîte mail.' : ('Erreur : ' + error);
  msg.className = ok ? 'msg ok' : 'msg err';
});

document.getElementById('signOutBtn').addEventListener('click', async () => {
  await LayerPitchAuth.signOut();
});

document.getElementById('inviteBtn').addEventListener('click', async () => {
  const email = document.getElementById('inviteEmailInput').value.trim();
  const msg = document.getElementById('inviteMsg');
  if (!email) { msg.textContent = 'Adresse email requise.'; msg.className = 'msg err'; return; }
  msg.textContent = 'Envoi…'; msg.className = 'msg';
  const { ok, error } = await LayerPitchAuth.inviteTester(email);
  msg.textContent = ok ? 'Invitation envoyée.' : ('Erreur : ' + error);
  msg.className = ok ? 'msg ok' : 'msg err';
});
</script>
</body>
</html>
