<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LayerPitch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f6f5f3; --bg-card: #ffffff; --border: #e4e1da;
    --text: #262521; --text-dim: #6f6b62; --text-dimmer: #a8a399;
    --accent: #c9713c; --accent-soft: #f3e4d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 56px 24px 60px; }
  .page { max-width: 760px; margin: 0 auto; }
  a { color: var(--accent); }

  .header { text-align: center; margin-bottom: 56px; }
  .logo-img { max-height: clamp(60px, 12vw, 140px); max-width: clamp(180px, 40vw, 420px); width: auto; height: auto; }
  .logo-fallback { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(24px, 5vw, 40px); font-style: italic; }
  .logo-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-top: 10px; }

  .block { margin-bottom: 56px; }
  .section-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 18px;
  }

  .testimonial { border-left: 2px solid var(--accent); padding: 4px 0 4px 20px; margin-bottom: 22px; }
  .testimonial p { font-size: 14.5px; line-height: 1.7; font-style: italic; margin-bottom: 8px; }
  .testimonial cite { font-family: 'JetBrains Mono', monospace; font-style: normal; font-size: 11px; color: var(--text-dim); }

  .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .video-card {
    position: relative; aspect-ratio: 16/9; border-radius: 6px; border: 1px solid var(--border);
    background: linear-gradient(135deg, #2a2822, #423b30);
    display: flex; align-items: flex-end; padding: 14px; color: #f6f5f3;
    text-decoration: none; overflow: hidden; transition: transform 0.15s;
  }
  .video-card:hover { transform: translateY(-2px); }
  .video-card .vt { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.3; }
  .video-card .play-dot {
    position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center;
  }
  .video-card .play-dot::after { content: ''; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
  .video-card.disabled { pointer-events: none; opacity: 0.4; color: var(--text-dim); background: repeating-linear-gradient(45deg, #ddd8cf, #ddd8cf 6px, #e8e4dd 6px, #e8e4dd 12px); }
  .video-card.disabled .vt { color: var(--text-dim); }

  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .gallery-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  @media (max-width: 540px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }

  .bio { display: grid; grid-template-columns: 180px 1fr; gap: 28px; align-items: start; }
  .bio-photo { width: 100%; aspect-ratio: 1; border-radius: 6px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border); }
  .bio-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bio-photo svg { width: 40%; height: 40%; opacity: 0.35; }
  .bio-text p { font-size: 14px; line-height: 1.7; color: var(--text-dim); margin-bottom: 14px; white-space: pre-wrap; }
  @media (max-width: 540px) { .bio { grid-template-columns: 1fr; } .bio-photo { max-width: 160px; } }

  .track { border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); padding: 26px; margin-bottom: 16px; }
  .track-title { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 18px; margin-bottom: 4px; }
  .track-desc { font-size: 13px; line-height: 1.6; color: var(--text-dim); margin-bottom: 20px; white-space: pre-wrap; }
  .status { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dimmer); margin-bottom: 12px; min-height: 14px; }

  .progress-wrap { position: relative; height: 24px; margin-bottom: 6px; cursor: pointer; }
  .progress-track { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); height: 3px; background: var(--border); border-radius: 2px; pointer-events: none; }
  .progress-fill { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 3px; background: var(--accent); border-radius: 2px; width: 0%; pointer-events: none; }
  .progress-head { position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%); width: 9px; height: 9px; background: var(--accent); border-radius: 50%; pointer-events: none; }
  .time-row { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-dimmer); margin-bottom: 20px; }

  .control-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .transport { display: flex; gap: 8px; }
  .btn { padding: 9px 18px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .intensity-btns { display: flex; gap: 6px; margin-left: auto; }
  .btn-int { padding: 8px 14px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--text-dimmer); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .btn-int:hover:not(:disabled) { border-color: var(--text-dim); color: var(--text-dim); }
  .btn-int:disabled { opacity: 0.25; cursor: not-allowed; }
  .btn-int.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .placeholder-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dimmer); border: 1px dashed var(--border); border-radius: 4px; padding: 8px 12px; display: inline-block; }
  .track.disabled { opacity: 0.5; }

  @media (max-width: 480px) { .intensity-btns { margin-left: 0; width: 100%; } .btn-int { flex: 1; } }

  .contact { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dimmer); letter-spacing: 0.03em; line-height: 1.8; padding-top: 24px; border-top: 1px solid var(--border); }
  .empty { font-size: 13px; color: var(--text-dim); text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="page">
  <div id="blocksContainer"></div>
  <div class="contact" id="contact"></div>
</div>

<script>
let ctx = null;
let activeTrackId = null;

const DEFAULT_BLOCK_ORDER = ['header', 'testimonials', 'videos', 'gallery', 'bio', 'tracks'];

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}
function cumulativeProfiles(n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(Array.from({ length: n }, (_, j) => (j <= i ? 1 : 0)));
  return out;
}
function section(label, innerHTML) {
  const el = document.createElement('div');
  el.className = 'block';
  el.innerHTML = (label ? `<div class="section-label">${label}</div>` : '') + innerHTML;
  return el;
}
function escapeHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
// Convertit [texte](url) en vrai lien cliquable, après échappement HTML de base
function linkify(s) {
  return escapeHtml(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

/* ---------------- Blocs ---------------- */
function renderHeaderBlock(container, profile) {
  const el = document.createElement('div');
  el.className = 'header';
  el.innerHTML = `
    ${profile.logo ? `<img class="logo-img" src="./images/${profile.logo}" alt="Logo">` : `<div class="logo-fallback">LayerPitch</div>`}
    ${profile.tagline ? `<div class="logo-tag">${escapeHtml(profile.tagline)}</div>` : ''}
  `;
  container.appendChild(el);
  return true;
}
function renderGalleryBlock(container, gallery) {
  if (!gallery || gallery.length === 0) return false;
  const imgs = gallery.map(g => `<img src="./images/${g.file}" alt="">`).join('');
  container.appendChild(section('Galerie', `<div class="gallery-grid">${imgs}</div>`));
  return true;
}
function renderBioBlock(container, profile) {
  if (!profile.bio && !profile.photo) return false;
  const textHtml = (profile.bio || '').split('\n\n').map(p => `<p>${linkify(p)}</p>`).join('');
  const photoHtml = profile.photo
    ? `<img src="./images/${profile.photo}" alt="Photo">`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>`;
  container.appendChild(section('À propos', `<div class="bio"><div class="bio-photo">${photoHtml}</div><div class="bio-text">${textHtml}</div></div>`));
  return true;
}
function renderTestimonialsBlock(container, list) {
  if (!list || list.length === 0) return false;
  const inner = list.map(t => `<div class="testimonial"><p>« ${linkify(t.text)} »</p><cite>${escapeHtml(t.author)}</cite></div>`).join('');
  container.appendChild(section('Ils en parlent', inner));
  return true;
}
function renderVideosBlock(container, list) {
  if (!list || list.length === 0) return false;
  const cards = list.map(v => {
    const hasUrl = !!v.url;
    const tag = hasUrl ? 'a' : 'div';
    return `<${tag} class="video-card${hasUrl ? '' : ' disabled'}" ${hasUrl ? `href="${v.url}" target="_blank"` : ''}>
      <div class="vt">${escapeHtml(v.title)}</div>${hasUrl ? '<div class="play-dot"></div>' : ''}
    </${tag}>`;
  }).join('');
  container.appendChild(section('Vidéos', `<div class="video-grid">${cards}</div>`));
  return true;
}
function renderTracksBlock(container, tracks) {
  const wrap = document.createElement('div');
  const el = section('Musique adaptative — écoute interactive', '');
  el.appendChild(wrap);
  container.appendChild(el);
  if (!tracks || tracks.length === 0) {
    wrap.innerHTML = '<div class="empty">Aucun morceau publié pour l\'instant.</div>';
  } else {
    tracks.forEach(track => {
      const card = buildTrackCard(track);
      wrap.appendChild(card);
      initTrackPlayer(track, card);
    });
  }
  return true;
}

const BLOCK_RENDERERS = {
  header: (c, data) => renderHeaderBlock(c, data.profile || {}),
  gallery: (c, data) => renderGalleryBlock(c, data.gallery),
  bio: (c, data) => renderBioBlock(c, data.profile || {}),
  testimonials: (c, data) => renderTestimonialsBlock(c, data.testimonials),
  videos: (c, data) => renderVideosBlock(c, data.videos),
  tracks: (c, data) => renderTracksBlock(c, data.tracks),
};

/* ---------------- Lecteur adaptatif ---------------- */
function buildTrackCard(track) {
  const supported = track.mode === 'vertical';
  const hasFiles = supported && track.base && track.layers.every(l => l.file);
  const el = document.createElement('div');
  el.className = 'track' + (hasFiles ? '' : ' disabled');
  const intBtns = track.layers.map((l, i) => `<button class="btn-int${i===0?' active':''}" data-level="${i}" disabled>${escapeHtml(l.label)}</button>`).join('');
  el.innerHTML = `
    <div class="track-title">${escapeHtml(track.title)}</div>
    <div class="track-desc">${linkify(track.description || '')}</div>
    ${!supported ? `<span class="placeholder-tag">Mode "${track.mode}" pas encore supporté</span>` :
      !hasFiles ? `<span class="placeholder-tag">Fichiers audio manquants</span>` : `
      <div class="status" data-role="status">Chargement…</div>
      <div class="progress-wrap" data-role="progressWrap">
        <div class="progress-track"></div>
        <div class="progress-fill" data-role="progressFill"></div>
        <div class="progress-head" data-role="progressHead"></div>
      </div>
      <div class="time-row"><span data-role="timeCurrent">0:00</span><span>${formatTime(track.duration)}</span></div>
      <div class="control-row">
        <div class="transport">
          <button class="btn" data-role="btnPlay" disabled>Play</button>
          <button class="btn" data-role="btnStop" disabled>Stop</button>
        </div>
        <div class="intensity-btns" data-role="intensityBtns">${intBtns}</div>
      </div>
    `}
  `;
  return el;
}

function initTrackPlayer(track, el) {
  if (track.mode !== 'vertical' || !track.base || !track.layers.every(l => l.file)) return;
  const profiles = cumulativeProfiles(track.layers.length);
  const statusEl = el.querySelector('[data-role="status"]');
  const wrap = el.querySelector('[data-role="progressWrap"]');
  const fill = el.querySelector('[data-role="progressFill"]');
  const head = el.querySelector('[data-role="progressHead"]');
  const timeCurrent = el.querySelector('[data-role="timeCurrent"]');
  const btnPlay = el.querySelector('[data-role="btnPlay"]');
  const btnStop = el.querySelector('[data-role="btnStop"]');
  const intBtns = [...el.querySelectorAll('[data-role="intensityBtns"] .btn-int')];

  let buffers = [], sources = [], gains = [];
  let level = 0, playing = false, startedAt = 0, offsetAt = 0, rafId = null;

  function updateProgressAt(elapsed) {
    const pct = (elapsed / track.duration) * 100;
    fill.style.width = pct + '%'; head.style.left = pct + '%';
    timeCurrent.textContent = formatTime(elapsed);
  }
  function tick() {
    if (!playing) return;
    updateProgressAt((ctx.currentTime - startedAt) % track.duration);
    rafId = requestAnimationFrame(tick);
  }
  function stopAllSources() {
    playing = false;
    offsetAt = (ctx.currentTime - startedAt) % track.duration;
    sources.forEach(s => { if (s) { try { s.stop(); } catch(e){} } });
    sources = []; gains = [];
    cancelAnimationFrame(rafId);
    statusEl.textContent = 'En pause';
    btnPlay.disabled = false; btnStop.disabled = true;
  }
  function stopThisTrack() { if (activeTrackId === track.id) activeTrackId = null; stopAllSources(); }
  function playThisTrack() {
    if (activeTrackId && activeTrackId !== track.id) document.dispatchEvent(new CustomEvent('stop-track', { detail: activeTrackId }));
    activeTrackId = track.id;
    if (ctx.state === 'suspended') ctx.resume();
    playing = true;
    startedAt = ctx.currentTime - offsetAt;
    const p = profiles[level];
    for (let i = 0; i < buffers.length; i++) {
      const src = ctx.createBufferSource();
      src.buffer = buffers[i]; src.loop = true; src.loopStart = 0; src.loopEnd = track.duration;
      const g = ctx.createGain();
      g.gain.setValueAtTime(p[i] || 0, ctx.currentTime);
      src.connect(g); g.connect(ctx.destination);
      src.start(0, offsetAt % track.duration);
      sources[i] = src; gains[i] = g;
    }
    statusEl.textContent = 'Lecture en cours';
    btnPlay.disabled = true; btnStop.disabled = false;
    tick();
  }

  document.addEventListener('stop-track', (e) => { if (e.detail === track.id) stopAllSources(); });
  btnPlay.addEventListener('click', playThisTrack);
  btnStop.addEventListener('click', stopThisTrack);
  wrap.addEventListener('click', (e) => {
    const rect = wrap.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const seekTo = pct * track.duration;
    if (playing) { stopAllSources(); offsetAt = seekTo; playThisTrack(); }
    else { offsetAt = seekTo; updateProgressAt(offsetAt); }
  });
  intBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      level = parseInt(btn.dataset.level, 10);
      intBtns.forEach(b => b.classList.toggle('active', b === btn));
      if (!playing) return;
      const p = profiles[level];
      const now = ctx.currentTime;
      gains.forEach((g, i) => {
        if (!g) return;
        g.gain.cancelScheduledValues(now);
        g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(p[i] || 0, now + 1.4);
      });
    });
  });

  (async () => {
    let loaded = 0;
    for (let i = 0; i < track.layers.length; i++) {
      try {
        const res = await fetch(track.base + encodeURIComponent(track.layers[i].file));
        const ab = await res.arrayBuffer();
        buffers[i] = await ctx.decodeAudioData(ab);
        loaded++;
        statusEl.textContent = `Chargement… ${loaded}/${track.layers.length}`;
      } catch (e) { statusEl.textContent = 'Erreur de chargement'; return; }
    }
    statusEl.textContent = 'Prêt';
    btnPlay.disabled = false;
    intBtns.forEach(b => b.disabled = false);
  })();
}

/* ---------------- Init ---------------- */
async function init() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const container = document.getElementById('blocksContainer');
  try {
    const res = await fetch('./data.json');
    const data = await res.json();
    const order = (data.blocks && data.blocks.length) ? data.blocks : DEFAULT_BLOCK_ORDER;

    order.forEach(type => {
      const renderer = BLOCK_RENDERERS[type];
      if (renderer) renderer(container, data);
    });

    const profile = data.profile || {};
    if (profile.contactUrl || profile.contactEmail) {
      document.getElementById('contact').innerHTML = [
        profile.contactUrl ? `<a href="${profile.contactUrl}" target="_blank">${profile.contactUrl.replace(/^https?:\/\//, '')}</a>` : '',
        profile.contactEmail ? `<a href="mailto:${profile.contactEmail}">${profile.contactEmail}</a>` : ''
      ].filter(Boolean).join(' &nbsp;/&nbsp; ');
    }
  } catch (e) {
    container.innerHTML = '<div class="empty">Impossible de charger data.json</div>';
  }
}
window.addEventListener('load', init);
</script>
</body>
</html>
