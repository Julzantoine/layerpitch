<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LayerPitch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f6f5f3; --bg-card: #ffffff; --border: #e4e1da;
    --text: #262521; --text-dim: #6f6b62; --text-dimmer: #a8a399;
    --accent: #c9713c; --accent-soft: #f3e4d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  img { max-width: 100%; height: auto; display: block; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 56px 24px 60px; }
  .page { max-width: 760px; margin: 0 auto; }
  a { color: var(--accent); }

  .header { text-align: center; margin-bottom: 56px; }
  .logo-img { width: clamp(200px, 28vw, 360px); height: auto; display: block; margin: 0 auto; }
  .logo-fallback { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(24px, 5vw, 40px); font-style: italic; }
  .logo-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-top: 10px; }

  .block { margin-bottom: 56px; }
  .section-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 18px;
  }

  .testimonial { border-left: 2px solid var(--accent); padding: 4px 0 4px 20px; margin-bottom: 22px; }
  .testimonial p { font-size: 14.5px; line-height: 1.7; font-style: italic; margin-bottom: 8px; }
  .testimonial cite { font-family: 'JetBrains Mono', monospace; font-style: normal; font-size: 11px; color: var(--text-dim); }

  .video-card {
    position: relative; aspect-ratio: 16/9; border-radius: 6px; border: 1px solid var(--border);
    background: linear-gradient(135deg, #2a2822, #423b30);
    display: flex; align-items: flex-end; padding: 14px; color: #f6f5f3;
    text-decoration: none; overflow: hidden; transition: transform 0.15s; max-width: 420px;
  }
  .video-card:hover { transform: translateY(-2px); }
  .video-card .vt { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.3; }
  .video-card .play-dot {
    position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center;
  }
  .video-card .play-dot::after { content: ''; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
  .video-card.disabled { pointer-events: none; opacity: 0.4; color: var(--text-dim); background: repeating-linear-gradient(45deg, #ddd8cf, #ddd8cf 6px, #e8e4dd 6px, #e8e4dd 12px); }
  .video-card.disabled .vt { color: var(--text-dim); }

  .photo-block-single { display: flex; }
  .photo-block-single img { max-width: 420px; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .photo-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  @media (max-width: 540px) { .photo-grid { grid-template-columns: repeat(2, 1fr); } }
  .video-grid-multi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

  .text-block p { font-size: 14px; line-height: 1.7; color: var(--text-dim); margin-bottom: 12px; white-space: pre-wrap; }
  .text-block p:last-child { margin-bottom: 0; }

  .bio { display: grid; grid-template-columns: 180px 1fr; gap: 28px; align-items: start; }
  .bio-photo { width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .bio-photo img { width: 100%; height: auto; display: block; }
  .bio-photo.empty { aspect-ratio: 1; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; }
  .bio-photo.empty svg { width: 40%; height: 40%; opacity: 0.35; }
  .bio-text p { font-size: 14px; line-height: 1.7; color: var(--text-dim); margin-bottom: 14px; white-space: pre-wrap; }
  @media (max-width: 540px) { .bio { grid-template-columns: 1fr; } .bio-photo { max-width: 220px; } }

  .music-header { display: grid; grid-template-columns: 1fr 140px; align-items: end; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .music-header-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dimmer); text-align: center; margin-bottom: 4px; }
  .music-header-notches { display: grid; font-size: 11px; color: var(--text-dim); text-align: center; }

  .track-row-wrapper { border-bottom: 1px solid var(--border); }
  .track-row { display: grid; grid-template-columns: auto 1fr 140px; align-items: center; gap: 10px; padding: 12px 0; }
  .play-btn {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; color: var(--text-dim);
  }
  .play-btn:hover { border-color: var(--accent); color: var(--accent); }
  .play-btn svg { width: 12px; height: 12px; }
  .track-row-title { display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; }
  .track-row-title .name { font-family: 'Space Grotesk', sans-serif; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mode-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.04em; color: var(--text-dimmer);
    border: 1px dashed var(--border); border-radius: 4px; padding: 1px 6px; flex-shrink: 0; white-space: nowrap;
  }
  .slider-col { display: grid; align-items: center; height: 20px; }
  .notch-cell { position: relative; display: flex; align-items: center; justify-content: center; }
  .notch-line { position: absolute; left: 50%; width: 100%; height: 2px; background: var(--border); }
  .notch-dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--bg-card); border: 1.5px solid var(--border-dim, var(--text-dimmer)); cursor: pointer; }
  .notch-dot.active { width: 12px; height: 12px; background: var(--accent); border-color: var(--accent); }
  .dash-col { text-align: center; color: var(--text-dimmer); font-size: 13px; }

  .track-row-details { padding: 0 0 18px 38px; }
  .track-desc { font-size: 13px; line-height: 1.6; color: var(--text-dim); margin-bottom: 16px; white-space: pre-wrap; }
  .status { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dimmer); margin-bottom: 10px; min-height: 14px; }

  .progress-wrap { position: relative; height: 24px; margin-bottom: 6px; cursor: pointer; }
  .progress-track { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); height: 3px; background: var(--border); border-radius: 2px; pointer-events: none; }
  .progress-fill { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 3px; background: var(--accent); border-radius: 2px; width: 0%; pointer-events: none; }
  .progress-head { position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%); width: 9px; height: 9px; background: var(--accent); border-radius: 50%; pointer-events: none; }
  .time-row { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-dimmer); }

  .stingers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .stinger-btn {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; cursor: pointer;
  }
  .stinger-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .stinger-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .stinger-btn svg { width: 10px; height: 10px; }

  .placeholder-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dimmer); border: 1px dashed var(--border); border-radius: 4px; padding: 8px 12px; display: inline-block; }

  @media (max-width: 480px) {
    .track-row { grid-template-columns: auto 1fr; }
    .slider-col, .dash-col { grid-column: 1 / -1; margin-left: 38px; margin-top: -4px; }
    .music-header { grid-template-columns: 1fr; }
    .music-header-notches, .music-header-label { display: none; }
  }

  .contact { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dimmer); letter-spacing: 0.03em; line-height: 1.8; padding-top: 24px; border-top: 1px solid var(--border); }
  .empty { font-size: 13px; color: var(--text-dim); text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="page">
  <div id="blocksContainer"></div>
  <div class="contact" id="contact"></div>
</div>

<script>
let ctx = null;
let activeTrackId = null;
const trackCollapsers = {};
const trackStingerKillers = {};

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}
function cumulativeProfiles(n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(Array.from({ length: n }, (_, j) => (j <= i ? 1 : 0)));
  return out;
}
function section(label, innerHTML) {
  const el = document.createElement('div');
  el.className = 'block';
  el.innerHTML = (label ? `<div class="section-label">${label}</div>` : '') + innerHTML;
  return el;
}
function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function linkify(s) { return escapeHtml(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>'); }
function genId() { return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------------- Migration (anciens formats de data.json) ---------------- */
function migrateBlocks(data) {
  let blocks = data.blocks;
  if (!Array.isArray(blocks) || blocks.length === 0 || typeof blocks[0] !== 'object') {
    const legacy = Array.isArray(blocks) ? blocks : ['header', 'testimonials', 'videos', 'gallery', 'bio', 'tracks'];
    const out = [];
    legacy.forEach(type => {
      const t = type === 'photo' ? 'gallery' : type;
      if (t === 'gallery') out.push({ id: genId(), type: 'photo', align: 'left', images: (data.gallery || []).map(g => ({ file: g.file })) });
      else if (t === 'videos') out.push({ id: genId(), type: 'video', videos: (data.videos || []).map(v => ({ title: v.title, url: v.url })) });
      else if (['header', 'bio', 'testimonials', 'tracks'].includes(t)) out.push({ id: genId(), type: t });
    });
    blocks = out;
  }
  blocks.forEach(b => {
    if (b.type === 'photo' && !b.images) b.images = b.file ? [{ file: b.file }] : [];
    if (b.type === 'video' && !b.videos) b.videos = (b.title || b.url) ? [{ title: b.title || '', url: b.url || '' }] : [];
  });
  ['header', 'testimonials', 'tracks'].forEach(t => {
    if (!blocks.some(b => b.type === t)) blocks.push({ id: genId(), type: t });
  });
  return blocks;
}

/* ---------------- Blocs ---------------- */
function renderHeaderBlock(container, profile) {
  const el = document.createElement('div');
  el.className = 'header';
  el.innerHTML = `
    ${profile.logo ? `<img class="logo-img" src="./images/${profile.logo}" alt="Logo">` : `<div class="logo-fallback">LayerPitch</div>`}
    ${profile.tagline ? `<div class="logo-tag">${escapeHtml(profile.tagline)}</div>` : ''}
  `;
  container.appendChild(el);
}
function renderBioBlock(container, profile) {
  if (!profile.bio && !profile.photo) return;
  const textHtml = (profile.bio || '').split('\n\n').map(p => `<p>${linkify(p)}</p>`).join('');
  const photoHtml = profile.photo
    ? `<div class="bio-photo"><img src="./images/${profile.photo}" alt="Photo"></div>`
    : `<div class="bio-photo empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></div>`;
  container.appendChild(section('À propos', `<div class="bio">${photoHtml}<div class="bio-text">${textHtml}</div></div>`));
}
function renderTestimonialsBlock(container, list) {
  if (!list || list.length === 0) return;
  const inner = list.map(t => `<div class="testimonial"><p>« ${linkify(t.text)} »</p><cite>${escapeHtml(t.author)}</cite></div>`).join('');
  container.appendChild(section('Ils en parlent', inner));
}
function renderTextBlockItem(container, block) {
  if (!block.content) return;
  const align = ['left', 'center', 'right'].includes(block.align) ? block.align : 'left';
  const html = block.content.split('\n\n').map(p => `<p>${linkify(p)}</p>`).join('');
  const el = document.createElement('div');
  el.className = 'block text-block';
  el.style.textAlign = align;
  el.innerHTML = html;
  container.appendChild(el);
}
function renderPhotoBlockItem(container, block) {
  if (!block.images || block.images.length === 0) return;
  const align = block.align === 'center' ? 'center' : block.align === 'right' ? 'flex-end' : 'flex-start';
  const el = document.createElement('div');
  el.className = 'block';
  if (block.images.length === 1) {
    el.innerHTML = `<div class="photo-block-single" style="justify-content:${align}"><img src="./images/${block.images[0].file}" alt=""></div>`;
  } else {
    const imgs = block.images.map(g => `<img src="./images/${g.file}" alt="">`).join('');
    el.innerHTML = `<div class="photo-grid">${imgs}</div>`;
  }
  container.appendChild(el);
}
function renderVideoBlockItem(container, block) {
  if (!block.videos || block.videos.length === 0) return;
  const makeCard = (v) => {
    const hasUrl = !!v.url;
    const tag = hasUrl ? 'a' : 'div';
    const bg = v.thumbnail
      ? `background-image:linear-gradient(rgba(0,0,0,0.1),rgba(0,0,0,0.55)), url('./images/${v.thumbnail}'); background-size:cover; background-position:center;`
      : '';
    return `<${tag} class="video-card${hasUrl ? '' : ' disabled'}" style="${bg}" ${hasUrl ? `href="${v.url}" target="_blank"` : ''}>
      <div class="vt">${escapeHtml(v.title || '')}</div>${hasUrl ? '<div class="play-dot"></div>' : ''}
    </${tag}>`;
  };
  const el = document.createElement('div');
  el.className = 'block';
  if (block.videos.length === 1) {
    el.innerHTML = makeCard(block.videos[0]);
  } else {
    el.innerHTML = `<div class="video-grid-multi">${block.videos.map(makeCard).join('')}</div>`;
  }
  container.appendChild(el);
}
function renderTracksBlock(container, tracks) {
  const el = section('Musique', '');
  container.appendChild(el);
  if (!tracks || tracks.length === 0) {
    el.innerHTML += '<div class="empty">Aucun morceau publié pour l\'instant.</div>';
    return;
  }
  const adaptive = tracks.filter(t => t.mode === 'vertical');
  const maxLayers = adaptive.reduce((n, t) => Math.max(n, t.layers.length), 0);

  if (maxLayers > 0) {
    const header = document.createElement('div');
    header.className = 'music-header';
    const notches = Array.from({ length: maxLayers }, (_, i) => `<span>${i + 1}</span>`).join('');
    header.innerHTML = `<div></div><div><div class="music-header-label">Intensité</div><div class="music-header-notches" style="grid-template-columns:repeat(${maxLayers},1fr)">${notches}</div></div>`;
    el.appendChild(header);
  }

  tracks.forEach(track => {
    const row = buildTrackRow(track, maxLayers);
    el.appendChild(row);
    initTrackPlayer(track, row);
  });
}

const MODE_LABELS = {
  static: 'statique',
  vertical: 'layering vertical',
  'vertical-random': 'layering vertical randomisé',
  sequential: 'séquentiel',
  branching: 'embranchement'
};
const PLAYABLE_MODES = ['static', 'vertical'];

function buildTrackRow(track, maxLayers) {
  const supported = PLAYABLE_MODES.includes(track.mode);
  const isStatic = track.mode === 'static';
  const hasFiles = supported && track.base && track.layers[0] && track.layers[0].file &&
    (isStatic || track.layers.every(l => l.file));

  const wrapper = document.createElement('div');
  wrapper.className = 'track-row-wrapper';

  let sliderHtml;
  if (isStatic) {
    sliderHtml = `<div class="dash-col">—</div>`;
  } else if (supported) {
    const cells = Array.from({ length: maxLayers }, (_, i) => {
      if (i >= track.layers.length) return '<div class="notch-cell"></div>';
      const isLast = i === track.layers.length - 1;
      return `<div class="notch-cell">${i < track.layers.length - 1 ? '<div class="notch-line"></div>' : ''}<div class="notch-dot${i===0?' active':''}" data-level="${i}"></div></div>`;
    }).join('');
    sliderHtml = `<div class="slider-col" style="grid-template-columns:repeat(${maxLayers},1fr)" data-role="slider">${cells}</div>`;
  } else {
    sliderHtml = `<div class="dash-col">—</div>`;
  }

  wrapper.innerHTML = `
    <div class="track-row">
      <button class="play-btn" data-role="playBtn" ${hasFiles ? '' : 'disabled'} aria-label="Lecture">
        <svg data-role="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="track-row-title" data-role="titleToggle">
        <span class="name">${escapeHtml(track.title)}</span>
        <span class="mode-tag">${MODE_LABELS[track.mode] || track.mode}</span>
      </div>
      ${sliderHtml}
    </div>
    <div class="track-row-details" data-role="details" style="display:none">
      <div class="track-desc">${linkify(track.description || '')}</div>
      ${!supported ? `<span class="placeholder-tag">Mode "${track.mode}" pas encore supporté</span>` :
        !hasFiles ? `<span class="placeholder-tag">Fichiers audio manquants</span>` : `
        <div class="status" data-role="status">Chargement…</div>
        <div class="progress-wrap" data-role="progressWrap">
          <div class="progress-track"></div>
          <div class="progress-fill" data-role="progressFill"></div>
          <div class="progress-head" data-role="progressHead"></div>
        </div>
        <div class="time-row"><span data-role="timeCurrent">0:00</span><span>${formatTime(track.duration)}</span></div>
        ${track.stingers && track.stingers.length ? `
          <div class="stingers" data-role="stingers">
            ${track.stingers.map((s, i) => `<button class="stinger-btn" data-stinger="${i}" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>${escapeHtml(s.label || ('Stinger ' + (i + 1)))}</button>`).join('')}
          </div>
        ` : ''}
      `}
    </div>
  `;

  wrapper.querySelector('[data-role="titleToggle"]').addEventListener('click', () => {
    const details = wrapper.querySelector('[data-role="details"]');
    details.style.display = details.style.display === 'none' ? 'block' : 'none';
  });

  return wrapper;
}

function initTrackPlayer(track, wrapper) {
  const isStatic = track.mode === 'static';
  const supported = PLAYABLE_MODES.includes(track.mode);
  const hasFiles = supported && track.base && track.layers[0] && track.layers[0].file &&
    (isStatic || track.layers.every(l => l.file));
  if (!hasFiles) return;

  const layersToLoad = isStatic ? [track.layers[0]] : track.layers;
  const profiles = isStatic ? [[1]] : cumulativeProfiles(track.layers.length);
  const loops = !isStatic || !!track.loopable;
  const stingerDefs = track.stingers ? track.stingers.filter(s => s.file) : [];

  const playBtn = wrapper.querySelector('[data-role="playBtn"]');
  const playIcon = wrapper.querySelector('[data-role="playIcon"]');
  const details = wrapper.querySelector('[data-role="details"]');
  const statusEl = wrapper.querySelector('[data-role="status"]');
  const wrap = wrapper.querySelector('[data-role="progressWrap"]');
  const fill = wrapper.querySelector('[data-role="progressFill"]');
  const head = wrapper.querySelector('[data-role="progressHead"]');
  const timeCurrent = wrapper.querySelector('[data-role="timeCurrent"]');
  const notchDots = [...wrapper.querySelectorAll('.notch-dot')];
  const stingerBtns = [...wrapper.querySelectorAll('.stinger-btn')];

  let buffers = [], sources = [], gains = [];
  let stingerBuffers = [];
  let activeStingerSources = [];
  let level = 0, playing = false, startedAt = 0, offsetAt = 0, rafId = null, manualStop = false, ready = false;

  const PLAY_SVG = '<path d="M8 5v14l11-7z"/>';
  const PAUSE_SVG = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  function updateStingerAvailability() {
    const expanded = details.style.display !== 'none';
    setStingerButtonsEnabled(expanded && ready);
  }

  function setStingerButtonsEnabled(enabled) {
    stingerBtns.forEach(b => { b.disabled = !enabled; });
  }
  function killStingers() {
    activeStingerSources.forEach(s => { try { s.stop(); } catch(e){} });
    activeStingerSources = [];
  }
  trackCollapsers[track.id] = () => { details.style.display = 'none'; updateStingerAvailability(); };
  trackStingerKillers[track.id] = killStingers;

  function updateProgressAt(elapsed) {
    if (!wrap) return;
    const pct = (elapsed / track.duration) * 100;
    fill.style.width = pct + '%'; head.style.left = pct + '%';
    timeCurrent.textContent = formatTime(elapsed);
  }
  function tick() {
    if (!playing) return;
    const elapsed = loops
      ? (ctx.currentTime - startedAt) % track.duration
      : Math.min(ctx.currentTime - startedAt, track.duration);
    updateProgressAt(elapsed);
    rafId = requestAnimationFrame(tick);
  }
  function setStoppedUI() {
    playIcon.innerHTML = PLAY_SVG;
    if (statusEl) statusEl.textContent = 'En pause';
  }
  function stopAllSources(keepPosition) {
    playing = false;
    manualStop = true;
    if (loops && keepPosition !== false) {
      offsetAt = (ctx.currentTime - startedAt) % track.duration;
    }
    sources.forEach(s => { if (s) { try { s.stop(); } catch(e){} } });
    sources = []; gains = [];
    cancelAnimationFrame(rafId);
    setStoppedUI();
    manualStop = false;
  }
  function naturalEnd() {
    playing = false;
    cancelAnimationFrame(rafId);
    offsetAt = 0;
    updateProgressAt(0);
    setStoppedUI();
    if (activeTrackId === track.id) activeTrackId = null;
  }
  function playThisTrack() {
    if (activeTrackId && activeTrackId !== track.id) {
      document.dispatchEvent(new CustomEvent('stop-track', { detail: activeTrackId }));
      if (trackStingerKillers[activeTrackId]) trackStingerKillers[activeTrackId]();
    }
    Object.keys(trackCollapsers).forEach(id => {
      if (id !== track.id) trackCollapsers[id]();
    });
    activeTrackId = track.id;
    details.style.display = 'block';
    updateStingerAvailability();
    if (ctx.state === 'suspended') ctx.resume();
    playing = true;
    startedAt = ctx.currentTime - offsetAt;
    const p = profiles[level] || profiles[0];
    for (let i = 0; i < buffers.length; i++) {
      const src = ctx.createBufferSource();
      src.buffer = buffers[i];
      if (loops) { src.loop = true; src.loopStart = 0; src.loopEnd = track.duration; }
      const g = ctx.createGain();
      g.gain.setValueAtTime(p[i] || 0, ctx.currentTime);
      src.connect(g); g.connect(ctx.destination);
      src.start(0, offsetAt % track.duration);
      sources[i] = src; gains[i] = g;
      if (isStatic && !loops) {
        src.onended = () => { if (!manualStop) naturalEnd(); };
      }
    }
    playIcon.innerHTML = PAUSE_SVG;
    if (statusEl) statusEl.textContent = 'Lecture en cours';
    tick();
  }

  const titleToggle = wrapper.querySelector('[data-role="titleToggle"]');
  if (titleToggle) titleToggle.addEventListener('click', updateStingerAvailability);

  document.addEventListener('stop-track', (e) => { if (e.detail === track.id) stopAllSources(); });
  playBtn.addEventListener('click', () => { playing ? stopAllSources() : playThisTrack(); });

  if (wrap) {
    wrap.addEventListener('click', (e) => {
      const rect = wrap.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const seekTo = pct * track.duration;
      if (playing) { stopAllSources(false); offsetAt = seekTo; playThisTrack(); }
      else { offsetAt = seekTo; updateProgressAt(offsetAt); }
    });
  }

  notchDots.forEach(dot => {
    dot.addEventListener('click', () => {
      level = parseInt(dot.dataset.level, 10);
      notchDots.forEach(d => d.classList.toggle('active', d === dot));
      if (!playing) return;
      const p = profiles[level];
      const now = ctx.currentTime;
      gains.forEach((g, i) => {
        if (!g) return;
        g.gain.cancelScheduledValues(now);
        g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(p[i] || 0, now + 1.4);
      });
    });
  });

  stingerBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const idx = parseInt(btn.dataset.stinger, 10);
      const buf = stingerBuffers[idx];
      if (!buf) return;
      if (ctx.state === 'suspended') ctx.resume();
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.setValueAtTime(1, ctx.currentTime);
      src.connect(g); g.connect(ctx.destination);
      src.start(0);
      activeStingerSources.push(src);
      src.onended = () => { activeStingerSources = activeStingerSources.filter(s => s !== src); };
    });
  });

  (async () => {
    let loaded = 0;
    const total = layersToLoad.length + stingerDefs.length;
    for (let i = 0; i < layersToLoad.length; i++) {
      try {
        const res = await fetch(track.base + encodeURIComponent(layersToLoad[i].file));
        const ab = await res.arrayBuffer();
        buffers[i] = await ctx.decodeAudioData(ab);
        loaded++;
        if (statusEl) statusEl.textContent = `Chargement… ${loaded}/${total}`;
      } catch (e) { if (statusEl) statusEl.textContent = 'Erreur de chargement'; return; }
    }
    for (let i = 0; i < stingerDefs.length; i++) {
      try {
        const res = await fetch(track.base + encodeURIComponent(stingerDefs[i].file));
        const ab = await res.arrayBuffer();
        stingerBuffers[i] = await ctx.decodeAudioData(ab);
        loaded++;
        if (statusEl) statusEl.textContent = `Chargement… ${loaded}/${total}`;
      } catch (e) { /* un stinger manquant ne bloque pas la lecture principale */ }
    }
    if (statusEl) statusEl.textContent = 'Prêt';
    playBtn.disabled = false;
    ready = true;
    updateStingerAvailability();
  })();
}

/* ---------------- Init ---------------- */
async function init() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const container = document.getElementById('blocksContainer');
  try {
    const res = await fetch('./data.json');
    const data = await res.json();
    const blocks = migrateBlocks(data);
    const profile = data.profile || {};

    blocks.forEach(block => {
      switch (block.type) {
        case 'header': renderHeaderBlock(container, profile); break;
        case 'bio': renderBioBlock(container, profile); break;
        case 'testimonials': renderTestimonialsBlock(container, data.testimonials); break;
        case 'text': renderTextBlockItem(container, block); break;
        case 'photo': renderPhotoBlockItem(container, block); break;
        case 'video': renderVideoBlockItem(container, block); break;
        case 'tracks': renderTracksBlock(container, data.tracks); break;
      }
    });

    if (profile.contactUrl || profile.contactEmail) {
      document.getElementById('contact').innerHTML = [
        profile.contactUrl ? `<a href="${profile.contactUrl}" target="_blank">${profile.contactUrl.replace(/^https?:\/\//, '')}</a>` : '',
        profile.contactEmail ? `<a href="mailto:${profile.contactEmail}">${profile.contactEmail}</a>` : ''
      ].filter(Boolean).join(' &nbsp;/&nbsp; ');
    }
  } catch (e) {
    container.innerHTML = '<div class="empty">Impossible de charger data.json</div>';
  }
}
window.addEventListener('load', init);
</script>
