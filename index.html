<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">LayerPitch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f6f5f3; --bg-card: #ffffff; --border: #e4e1da;
    --text: #262521; --text-title: #262521; --text-dim: #6f6b62; --text-dimmer: #a8a399;
    --accent: #c9713c; --accent-soft: #f3e4d6;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  img { max-width: 100%; height: auto; display: block; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); padding: 56px 24px 60px; }
  .page { max-width: 1100px; margin: 0 auto; }
  a { color: var(--accent); }

  .header { text-align: center; margin-bottom: 56px; }
  .logo-img { width: clamp(200px, 28vw, 360px); height: auto; display: block; margin: 0 auto; }
  .header-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(24px, 5vw, 40px); font-style: italic; color: var(--text-title); margin-top: 14px; }
  .header-subtitle { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); margin-top: 10px; }

  .block { margin-bottom: 56px; }
  .section-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 18px;
  }

  .testimonial { border-left: 2px solid var(--accent); padding: 4px 0 4px 20px; margin-bottom: 22px; }
  .testimonial p { font-size: 14.5px; line-height: 1.7; font-style: italic; margin-bottom: 8px; }
  .testimonial cite { font-family: 'JetBrains Mono', monospace; font-style: normal; font-size: 11px; color: var(--text-dim); }

  .video-card {
    position: relative; aspect-ratio: 16/9; border-radius: 6px; border: 1px solid var(--border);
    background: linear-gradient(135deg, #2a2822, #423b30);
    display: flex; align-items: flex-end; padding: 14px; color: #f6f5f3;
    text-decoration: none; overflow: hidden; transition: transform 0.15s;
  }
  .video-card:hover { transform: translateY(-2px); }
  .video-card .vt { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.3; text-shadow: 0 1px 4px rgba(0,0,0,0.75), 0 0 12px rgba(0,0,0,0.4); }
  .video-card .play-dot {
    position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center;
  }
  .video-card .play-dot::after { content: ''; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
  .video-card.disabled { pointer-events: none; opacity: 0.4; color: var(--text-dim); background: repeating-linear-gradient(45deg, #ddd8cf, #ddd8cf 6px, #e8e4dd 6px, #e8e4dd 12px); }
  .video-card.disabled .vt { color: var(--text-dim); }
  .video-embed-frame { width: 100%; aspect-ratio: 16/9; border-radius: 6px; border: 1px solid var(--border); }

  .photo-block-single { display: flex; }
  .photo-block-single img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .photo-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .video-grid-multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .video-comment { font-size: 12px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; text-align: center; font-style: italic; }
  .packs-list { display: flex; flex-direction: column; }
  .packs-list-item { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: var(--text); }
  .packs-list-item:last-child { border-bottom: none; }
  .packs-list-item-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
  .packs-list-item-thumb.empty { background: linear-gradient(135deg, #2a2822, #423b30); }
  .packs-list-item-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; flex: 1; }
  .packs-list-item-arrow { color: var(--text-dimmer); font-family: 'JetBrains Mono', monospace; transition: transform 0.15s ease, color 0.15s ease; flex-shrink: 0; }
  .packs-list-item:hover .packs-list-item-arrow { transform: translateX(3px); color: var(--accent); }

  /* ---------------- Lecteur Sfx ---------------- */
  /* Ligne compacte + repli : réutilise .track-row-wrapper/.track-row/.track-row-details (voir plus bas).
     Seules les variations RR (affichées dans le repli, en-dessous de la forme d'onde principale) ont
     encore besoin de classes propres. */
  .sfx-rr-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .sfx-rr-block {
    position: relative; flex: 1 1 64px; min-width: 64px; height: 40px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent; cursor: pointer; overflow: hidden;
    padding: 0; font-family: inherit;
  }
  .sfx-rr-block.active { border-color: var(--accent); }
  .sfx-rr-wave-bg, .sfx-rr-wave-fg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sfx-rr-wave-fg { opacity: 0; transition: opacity 0.15s ease; }
  .sfx-rr-block.active .sfx-rr-wave-fg { opacity: 1; }
  .sfx-rr-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.03em; color: var(--text-dim);
    z-index: 1; padding: 0 4px; text-align: center;
    text-shadow: 0 0 4px var(--bg-card, #fff), 0 0 4px var(--bg-card, #fff), 0 0 4px var(--bg-card, #fff);
  }
  .sfx-play-btn {
    display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
    border-radius: 50%; border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  .sfx-play-btn svg { width: 16px; height: 16px; }
  .sfx-play-btn:hover { opacity: 0.9; }

  .share-btn {
    position: fixed; top: 20px; right: 20px; z-index: 50;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .share-btn:hover { color: var(--accent); border-color: var(--accent); }
  .share-btn:active { transform: scale(0.94); }
  .share-btn svg { width: 18px; height: 18px; }
  .share-btn.copied { color: #2a7; border-color: #2a7; }
  .contact-form { display: flex; flex-direction: column; max-width: 480px; }
  .contact-form label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dimmer); margin-top: 14px; margin-bottom: 5px; }
  .contact-form input, .contact-form textarea {
    font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg-card); color: var(--text);
  }
  .contact-form textarea { resize: vertical; min-height: 100px; font-family: inherit; }
  .contact-form button {
    margin-top: 18px; align-self: flex-start; padding: 11px 26px; border-radius: 6px; border: none;
    background: var(--accent); color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  }
  .contact-form button:hover { opacity: 0.9; }
  .contact-form button:disabled { opacity: 0.5; cursor: not-allowed; }
  .contact-form-status { margin-top: 10px; font-size: 13px; color: var(--text-dim); min-height: 16px; }
  .contact-form-status.success { color: #2f9e44; font-family: 'Space Grotesk', sans-serif; font-size: 16px; margin-top: 0; }
  .contact-form-status.error { color: #c0392b; }

  .text-block p { font-size: 14px; line-height: 1.7; color: var(--text-dim); margin-bottom: 12px; white-space: pre-wrap; }
  .text-block p:last-child { margin-bottom: 0; }

  .bio { display: grid; grid-template-columns: 180px 1fr; gap: 28px; align-items: start; }
  .bio-photo { width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .bio-photo img { width: 100%; height: auto; display: block; }
  .bio-photo.empty { aspect-ratio: 1; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; }
  .bio-photo.empty svg { width: 40%; height: 40%; opacity: 0.35; }

  .photo-block-single img, .photo-grid img, .bio-photo img { cursor: zoom-in; }

  .lightbox-overlay {
    display: none; position: fixed; inset: 0; z-index: 200; background: rgba(10, 9, 7, 0.92);
    align-items: center; justify-content: center; padding: 40px;
  }
  .lightbox-overlay.open { display: flex; }
  .lightbox-overlay img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 4px; cursor: default; }
  .lightbox-close, .lightbox-prev, .lightbox-next {
    position: fixed; background: rgba(255,255,255,0.12); color: #fff; border: none; border-radius: 50%;
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer; transition: background 0.15s ease;
  }
  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { background: rgba(255,255,255,0.25); }
  .lightbox-close { top: 20px; right: 20px; }
  .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }
  .lightbox-next { right: 20px; top: 50%; transform: translateY(-50%); }
  @media (max-width: 640px) { .lightbox-prev, .lightbox-next { width: 38px; height: 38px; font-size: 17px; } }
  .bio-text p { font-size: 14px; line-height: 1.7; color: var(--text-dim); margin-bottom: 14px; white-space: pre-wrap; }
  @media (max-width: 540px) { .bio { grid-template-columns: 1fr; } .bio-photo { max-width: 220px; } }

  .track-intensity-block { margin-top: 16px; }
  .voice-graph { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .voice-graph-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dimmer); margin-bottom: 8px; }
  .voice-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
  .voice-row-label { color: var(--text-dim); min-width: 130px; flex-shrink: 0; }
  .voice-row-current { font-family: 'JetBrains Mono', monospace; color: var(--text-dim); font-style: italic; min-width: 130px; flex-shrink: 0; }
  .voice-meter { width: 20px; height: 8px; border-radius: 2px; background: var(--border); flex-shrink: 0; }
  .voice-meter-bar { position: relative; width: 70px; height: 8px; border-radius: 2px; background: var(--border); overflow: hidden; flex-shrink: 0; }
  .voice-meter-bar-fill { position: absolute; inset: 0; width: 0%; background: var(--accent); transition: width 0.18s ease-out; }
  .wwise-graph { position: relative; display: flex; align-items: stretch; gap: 24px; padding: 12px 4px 6px; min-height: 60px; }
  .wwise-graph-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .wwise-line { fill: none; stroke: var(--border); stroke-width: 1.5px; }
  .wwise-col { display: flex; flex-direction: column; justify-content: center; gap: 10px; position: relative; z-index: 1; }
  .wwise-col-voices { justify-content: space-around; align-items: center; flex: 1; }
  .wwise-node { background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px; padding: 6px 10px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-dim); white-space: nowrap; text-align: center; }
  .wwise-node-source, .wwise-node-bus { font-weight: 600; color: var(--text); }
  .wwise-node-voice { display: flex; flex-direction: column; gap: 5px; align-items: center; width: 220px; flex-shrink: 0; }
  .wwise-node-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
  .wwise-node-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; text-align: left; }
  .wwise-node-controls { display: flex; gap: 3px; flex-shrink: 0; }
  .voice-ctrl-btn { width: 18px; height: 18px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-dimmer); font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; line-height: 1; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  .voice-ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
  .voice-ctrl-btn[data-voice-action="solo"].active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .voice-ctrl-btn[data-voice-action="mute"].active { background: #b5442e; border-color: #b5442e; color: #fff; }
  /* Volume par voix : slider continu sous la ligne existante (label + vumètre + S/M en vertical
     classique, ligne du haut en vertical-random), aligné sous le vumètre pour rester dans le même
     champ visuel plutôt qu'un ajout qui semblerait étranger au reste du mixer. */
  .voice-row-wrap { padding: 3px 0; }
  .voice-row-wrap .voice-row { padding: 0; }
  .voice-volume-row { display: flex; align-items: center; gap: 6px; padding-left: 138px; }
  .wwise-node-voice .voice-volume-row { padding-left: 0; margin-top: 2px; }
  .voice-volume-row input[type="range"] { flex: 1; max-width: 160px; -webkit-appearance: none; appearance: none; height: 3px; border-radius: 2px; background: var(--border); outline: none; cursor: pointer; }
  .voice-volume-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  .voice-volume-row input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }
  .voice-volume-value { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--text-dimmer); min-width: 32px; text-align: right; flex-shrink: 0; }
  .wwise-node-wave { position: relative; width: 100%; height: 30px; border-radius: 3px; overflow: hidden; background: var(--bg); }
  .wwise-wave-bg, .wwise-wave-fg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wwise-wave-fg { clip-path: inset(0 100% 0 0); }
  .voice-meter.pulse { background: var(--accent); animation: voice-meter-fade 0.5s ease-out forwards; }
  @keyframes voice-meter-fade { 0% { opacity: 1; } 100% { opacity: 0.35; } }
  .voice-refresh-btn { margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 3px 9px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; }
  .voice-refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .voice-refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .seq-blocks { display: flex; gap: 6px; margin-top: 8px; margin-bottom: 4px; }
  .seq-block { flex: 1; height: 34px; border-radius: 4px; border: 1px solid var(--border); position: relative; overflow: hidden; background: transparent; touch-action: none; }
  .seq-block-wave-bg, .seq-block-wave-fg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .seq-block-wave-fg { clip-path: inset(0 100% 0 0); }
  .vr-block-fill { position: absolute; inset: 0; width: 0%; background: var(--accent); opacity: 0.28; }
  .seq-block.active { border-color: var(--accent); cursor: pointer; }
  .seq-block-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.03em; color: var(--text-dim); z-index: 1; padding: 0 4px; text-align: center; text-shadow: 0 0 4px var(--bg-card, #fff), 0 0 4px var(--bg-card, #fff), 0 0 4px var(--bg-card, #fff); }
  .track-intensity-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dimmer); margin-bottom: 6px; }
  .intensity-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .intensity-chip {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 3px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; line-height: 1.6;
  }
  .intensity-chip:hover { border-color: var(--accent); color: var(--accent); }
  .intensity-chip.active { background: var(--accent); border-color: var(--accent); color: var(--bg, #fff); }
  .intensity-chip-num { opacity: 0.55; margin-right: 5px; }

  /* Boutons nommés d'embranchement-vertical : même gabarit que intensity-chip (classe distincte pour ne
     pas hériter du sélecteur de niveau d'intensité) — état désactivé pendant qu'un détour (boucle plus
     courte que la référence) est en cours de lecture. */
  .embr-loop-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 3px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; line-height: 1.6;
  }
  .embr-loop-btn:hover { border-color: var(--accent); color: var(--accent); }
  .embr-loop-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg, #fff); }
  .embr-loop-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Boutons d'embranchement séquentiel (nextOptions) : "pending" = choix en attente de bascule au
     prochain point de quantification, visuellement distinct de "active" (qui n'existe pas ici — aucune
     de ces options n'est celle en train de jouer, seul le segment courant l'est). */
  .seq-branch-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .seq-branch-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 3px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; line-height: 1.6;
  }
  .seq-branch-btn:hover { border-color: var(--accent); color: var(--accent); }
  .seq-branch-btn.pending { border-color: var(--accent); border-style: dashed; color: var(--accent); }
  .seq-pending-indicator { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.04em; color: var(--accent); margin-top: 6px; font-style: italic; }

  .loop-count-block { margin-top: 14px; }
  .loop-count-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dimmer); margin-bottom: 6px; }
  .loop-count-block select { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-dim); }

  .track-row-wrapper { border-bottom: 1px solid var(--border); }
  .track-row { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; padding: 12px 0; }
  .play-btn {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; color: var(--text-dim);
  }
  .play-btn:hover { border-color: var(--accent); color: var(--accent); }
  .play-btn svg { width: 12px; height: 12px; }
  .play-btn svg.loading-icon { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; animation: layerpitch-spin 0.8s linear infinite; transform-origin: center; }
  .play-btn svg.error-icon { fill: none; stroke: currentColor; stroke-width: 2; }
  @keyframes layerpitch-spin { to { transform: rotate(360deg); } }
  .track-row-title { display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; }
  .track-row-title .name { font-family: 'Space Grotesk', sans-serif; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mode-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.04em; color: var(--text-dimmer);
    border: 1px dashed var(--border); border-radius: 4px; padding: 1px 6px; flex-shrink: 0; white-space: nowrap;
  }
  .no-ai-badge {
    display: inline-flex; align-items: center; color: var(--accent); opacity: 0.75; cursor: help; flex-shrink: 0;
  }
  .no-ai-badge:hover { opacity: 1; }
  .no-ai-badge-collective { margin-left: 6px; }
  .loop-icon { display: inline-flex; flex-shrink: 0; color: var(--text-dimmer); }
  .loop-icon svg { width: 11px; height: 11px; }
  .track-row-details { max-height: 0; overflow: hidden; transition: max-height 0.28s ease; }
  .track-row-details-inner { padding: 0 0 18px 38px; }
  .pack-link { margin-bottom: 12px; }
  .pack-link a { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .track-desc { font-size: 13px; line-height: 1.6; color: var(--text-dim); margin-bottom: 16px; white-space: pre-wrap; }
  .status { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dimmer); margin-bottom: 10px; min-height: 14px; }

  .progress-wrap { position: relative; height: 24px; margin-bottom: 6px; cursor: pointer; touch-action: none; }
  .progress-wrap.waveform-mode { height: 44px; }
  .waveform-bg, .waveform-fg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .waveform-fg { clip-path: inset(0 100% 0 0); }
  .progress-track { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); height: 3px; background: var(--border); border-radius: 2px; pointer-events: none; }

<!-- Décodeur Ogg Vorbis de secours (Safari/iOS, qui ne sait pas décoder l'Ogg nativement) — chargé en
     differé, n'est utilisé que si le décodage natif échoue, voir decodeAudioDataCompat dans player.js -->
<script defer src="https://unpkg.com/@wasm-audio-decoders/ogg-vorbis/dist/ogg-vorbis-decoder.min.js"></script>

<script>
const { section, escapeHtml, linkify, renderTracksBlock, setupContrastToggle } = window.LayerPlayerCore;

// Traductions de l'habillage LayerPitch (pas le contenu des AdReels/morceaux, qui reste dans sa langue
// d'origine). Vit dans layerpitch-i18n.js (zones "shared" + "index"), édité via l'outil dédié.
// Langue fixée par le compositeur pour cet AdReel (champ adReel.lang dans data.json), jamais par le
// visiteur — déterminée une fois l'AdReel trouvé, voir init(). 'fr' tant que rien n'est encore connu.
let pageLang = 'fr';
function currentLang() { return pageLang; }
// tr('clé') pour le texte généré en JS ; data-i18n pour le HTML statique. Un même dictionnaire pour les
// deux. Ordre de repli : zone index -> zone shared -> même chose en français -> la clé elle-même.
function tr(key) {
  const I18N = window.LAYERPITCH_I18N || { fr: { shared: {}, index: {} }, en: { shared: {}, index: {} } };
  const dict = I18N[currentLang()] || I18N.fr;
  const dictFr = I18N.fr;
  return (dict.index && dict.index[key]) || (dict.shared && dict.shared[key])
    || (dictFr.index && dictFr.index[key]) || (dictFr.shared && dictFr.shared[key]) || key;
}
function applyI18n() {
  document.documentElement.lang = currentLang();
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = tr(el.dataset.i18n); if (v) el.textContent = v; });
}

// Même petit repère que dans player.js — dupliqué ici car ce script inline est un fichier séparé,
// sans accès direct à l'intérieur de la fonction IIFE de player.js.
// Contexte déposé sur window.__lpTrackContext une fois l'AdReel identifié plus bas — voir player.js
// pour l'explication complète du mécanisme.
function trackPublicEvent(name, detail) {
  try {
    if (!window.umami) return;
    const ctx = window.__lpTrackContext || {};
    window.umami.track(name, Object.assign({}, detail, ctx.type ? { [ctx.type]: ctx.id } : {}));
  } catch (e) { /* jamais bloquant */ }
}

function genId() { return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------------- Migration (anciens formats de data.json) ---------------- */
function migrateBlocks(data) {
  let blocks = data.blocks;
  if (!Array.isArray(blocks) || blocks.length === 0 || typeof blocks[0] !== 'object') {
    const legacy = Array.isArray(blocks) ? blocks : ['header', 'testimonials', 'videos', 'gallery', 'bio', 'tracks'];
    const out = [];
    legacy.forEach(type => {
      const t = type === 'photo' ? 'gallery' : type;
      if (t === 'gallery') out.push({ id: genId(), type: 'photo', align: 'left', images: (data.gallery || []).map(g => ({ file: g.file })) });
      else if (t === 'videos') out.push({ id: genId(), type: 'video', videos: (data.videos || []).map(v => ({ title: v.title, url: v.url })) });
      else if (['header', 'bio', 'testimonials', 'tracks'].includes(t)) out.push({ id: genId(), type: t });
    });
    blocks = out;
  }
  blocks.forEach(b => {
    if (b.type === 'photo' && !b.images) b.images = b.file ? [{ file: b.file }] : [];
    if (b.type === 'video' && !b.videos) b.videos = (b.title || b.url) ? [{ title: b.title || '', url: b.url || '' }] : [];
  });
  ['header', 'testimonials', 'tracks'].forEach(t => {
    if (!blocks.some(b => b.type === t)) blocks.push({ id: genId(), type: t });
  });
  return blocks;
}

/* ---------------- Blocs ---------------- */
function renderHeaderBlock(container, profile) {
  const el = document.createElement('div');
  el.className = 'header';
  // Rétrocompatibilité : un AdReel publié avant ce changement n'a qu'un tagline (jamais de subtitle),
  // repris ici comme repli. Le titre n'a pas d'équivalent antérieur — repli sur "LayerPitch" seulement
  // si vraiment rien n'a jamais été configuré, comme au tout premier chargement d'un AdReel neuf.
  const subtitle = (profile.subtitle != null && profile.subtitle !== '') ? profile.subtitle : (profile.tagline || '');
  const title = profile.title || (profile.logo ? '' : 'LayerPitch');
  el.innerHTML = `
    ${profile.logo ? `<img class="logo-img" src="./images/${profile.logo}" alt="${tr('logoAlt')}">` : ''}
    ${title ? `<div class="header-title">${escapeHtml(title)}</div>` : ''}
    ${subtitle ? `<div class="header-subtitle">${escapeHtml(subtitle)}</div>` : ''}
  `;
  container.appendChild(el);
}
function renderBioBlock(container, profile) {
  if (!profile.bio && !profile.photo) return;
  const textHtml = (profile.bio || '').split('\n\n').map(p => `<p>${linkify(p)}</p>`).join('');
  const photoHtml = profile.photo
    ? `<div class="bio-photo"><img src="./images/${profile.photo}" alt="${tr('photoAlt')}" loading="lazy"></div>`
    : `<div class="bio-photo empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></div>`;
  const el = section(tr('aboutSection'), `<div class="bio">${photoHtml}<div class="bio-text">${textHtml}</div></div>`);
  container.appendChild(el);
  if (profile.photo) {
    const bioImg = el.querySelector('.bio-photo img');
    const url = `./images/${profile.photo}`;
    bioImg.addEventListener('click', () => openLightbox([url], 0));
  }
}
function renderTestimonialsBlock(container, list) {
  if (!list || list.length === 0) return;
  const inner = list.map(t => `<div class="testimonial"><p>« ${linkify(t.text)} »</p><cite>${escapeHtml(t.author)}</cite></div>`).join('');
  container.appendChild(section(tr('testimonialsSection'), inner));
}
function renderTextBlockItem(container, block) {
  if (!block.content) return;
  const align = ['left', 'center', 'right'].includes(block.align) ? block.align : 'left';
  const html = block.content.split('\n\n').map(p => `<p>${linkify(p)}</p>`).join('');
  const el = document.createElement('div');
  el.className = 'block text-block';
  el.style.textAlign = align;
  el.innerHTML = html;
  container.appendChild(el);
}
function renderPhotoBlockItem(container, block) {
  if (!block.images || block.images.length === 0) return;
  const align = block.align === 'center' ? 'center' : block.align === 'right' ? 'flex-end' : 'flex-start';
  const el = document.createElement('div');
  el.className = 'block';
  const urls = block.images.map(g => `./images/${g.file}`);
  if (block.images.length === 1) {
    el.innerHTML = `<div class="photo-block-single" style="justify-content:${align}"><img src="${urls[0]}" alt="" loading="lazy"></div>`;
  } else {
    const imgs = urls.map(u => `<img src="${u}" alt="" loading="lazy">`).join('');
    el.innerHTML = `<div class="photo-grid">${imgs}</div>`;
  }
  container.appendChild(el);
  el.querySelectorAll('img').forEach((img, i) => {
    img.addEventListener('click', () => openLightbox(urls, i));
  });
}
function extractYouTubeId(url) {
  if (!url) return null;
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, '');
    if (host === 'youtu.be') {
      return u.pathname.slice(1).split('/')[0] || null;
    }
    if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com') {
      if (u.pathname === '/watch') return u.searchParams.get('v');
      if (u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2] || null;
      if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2] || null;
    }
  } catch (e) { /* URL invalide, on ignore */ }
  return null;
}

function renderPacksBlockItem(container, block, packsById) {
  const selected = (block.packIds || []).map(id => packsById[id]).filter(Boolean);
  if (!selected.length) return;
  const el = section(tr('packsSection'), '');
  const list = document.createElement('div');
  list.className = 'packs-list';
  selected.forEach(p => {
    const a = document.createElement('a');
    a.className = 'packs-list-item';
    a.href = `./pack.html?id=${encodeURIComponent(p.id)}&lang=${pageLang}`;
    a.innerHTML = `${p.illustration ? `<img class="packs-list-item-thumb" src="./images/${p.illustration}" alt="" loading="lazy">` : `<div class="packs-list-item-thumb empty"></div>`}<span class="packs-list-item-title">${escapeHtml(p.title)}</span><span class="packs-list-item-arrow">→</span>`;
    list.appendChild(a);
  });
  el.appendChild(list);
  container.appendChild(el);
}

function renderCollectionsBlockItem(container, block, collectionsById) {
  const selected = (block.collectionIds || []).map(id => collectionsById[id]).filter(Boolean);
  if (!selected.length) return;
  const el = section(tr('collectionsSection'), '');
  const list = document.createElement('div');
  list.className = 'packs-list';
  selected.forEach(c => {
    const a = document.createElement('a');
    a.className = 'packs-list-item';
    a.href = `./collection.html?id=${encodeURIComponent(c.id)}&lang=${pageLang}`;
    a.innerHTML = `${c.illustration ? `<img class="packs-list-item-thumb" src="./images/${c.illustration}" alt="" loading="lazy">` : `<div class="packs-list-item-thumb empty"></div>`}<span class="packs-list-item-title">${escapeHtml(c.title)}</span><span class="packs-list-item-arrow">→</span>`;
    list.appendChild(a);
  });
  el.appendChild(list);
  container.appendChild(el);
}

function renderSfxBlockItem(container, block, sfxById) {
  const selected = (block.sfxIds || []).map(id => sfxById[id]).filter(Boolean);
  if (!selected.length) return;
  const el = section(tr('sfxSection'), '');
  selected.forEach(s => { el.appendChild(window.LayerPlayerCore.buildSfxPlayer(s)); });
  container.appendChild(el);
}

// Résout une valeur de police ('default' | 'google:Nom' | 'custom:id') en une déclaration font-family CSS
// utilisable. Retourne null pour 'default' (aucun override — le body garde son font-family de base).
function fontCssFamily(fontValue, customFonts) {
  if (!fontValue || fontValue === 'default') return null;
  if (fontValue.startsWith('google:')) return `'${fontValue.slice(7)}', sans-serif`;
  if (fontValue.startsWith('custom:')) {
    const id = fontValue.slice(7);
    const font = (customFonts || []).find(f => f.id === id);
    return font ? `'${font.name}', sans-serif` : null;
  }
  return null;
}
// Injecte uniquement les assets nécessaires aux polices réellement utilisées sur cette page (thème
// général + réglages par bloc de cet AdReel précis) — jamais toute la bibliothèque de polices du
// compositeur, ni deux fois le même lien/@font-face si plusieurs blocs partagent la même police.
const injectedFontAssets = new Set();
function injectFontAssets(usedFontValues, customFonts) {
  usedFontValues.forEach(val => {
    if (!val || val === 'default' || injectedFontAssets.has(val)) return;
    injectedFontAssets.add(val);
    if (val.startsWith('google:')) {
      const family = val.slice(7);
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family).replace(/%20/g, '+')}:wght@400;500;600;700&display=swap`;
      document.head.appendChild(link);
    } else if (val.startsWith('custom:')) {
      const font = (customFonts || []).find(f => f.id === val.slice(7));
      if (!font || !font.file) return;
      const style = document.createElement('style');
      style.textContent = `@font-face { font-family: '${font.name}'; src: url('./fonts/${font.file}'); font-display: swap; }`;
      document.head.appendChild(style);
    }
  });
}
// Applique le réglage d'apparence par bloc (block.appearance), s'il existe, par-dessus le thème général —
// un bloc sans override n'est jamais touché (transparent, hérite entièrement du thème). Un bloc avec une
// couleur de fond personnalisée devient visuellement une "carte" (fond + marge intérieure) puisqu'il se
// détache alors du fond de page ; sans override de fond, aucun style de boîte n'est ajouté.
function applyBlockAppearance(el, block, customFonts) {
  const ov = block.appearance;
  if (!ov) return;
  if (ov.bgColor) {
    el.style.background = ov.bgColor;
    el.style.borderRadius = '10px';
    el.style.padding = '28px';
    el.style.margin = '12px 0';
  }
  if (ov.titleColor) el.style.setProperty('--text-title', ov.titleColor);
  if (ov.contentColor) el.style.setProperty('--text', ov.contentColor);
  if (ov.font) {
    const family = fontCssFamily(ov.font, customFonts);
    if (family) el.style.setProperty('--font-body', family);
  }
  // Image de fond propre à CE bloc : un calque interne en arrière-plan (position absolue, opacité
  // réglable) plutôt que de mettre l'opacité sur le bloc entier — sans ça, le texte du bloc deviendrait
  // lui aussi transparent, ce qui n'est jamais l'effet recherché.
  // IMPORTANT : on déplace les vrais nœuds DOM existants (pas une copie via innerHTML) pour ne jamais
  // perdre les gestionnaires d'événements déjà attachés par le rendu du bloc (formulaire de contact,
  // lecteur de morceaux, etc.) — une simple copie de innerHTML les aurait silencieusement détruits.
  if (ov.bgImage) {
    const inner = document.createElement('div');
    inner.style.position = 'relative';
    inner.style.zIndex = '1';
    while (el.firstChild) inner.appendChild(el.firstChild);
    const bgLayer = document.createElement('div');
    const opacity = (ov.bgImageOpacity != null) ? ov.bgImageOpacity : 1;
    bgLayer.style.cssText = `position:absolute;inset:0;background-image:url('./images/${ov.bgImage}');background-size:cover;background-position:center;opacity:${opacity};border-radius:inherit;`;
    el.style.position = 'relative';
    el.style.overflow = 'hidden';
    if (!ov.bgColor) { el.style.borderRadius = '10px'; el.style.padding = '28px'; el.style.margin = '12px 0'; }
    el.appendChild(bgLayer);
    el.appendChild(inner);
  }
}

function renderContactBlockItem(container, profile) {
  const endpoint = profile && profile.formspreeEndpoint && profile.formspreeEndpoint.trim();
  if (!endpoint) return; // pas configuré côté backstage : ce bloc ne s'affiche simplement pas
  const el = section(tr('contactSection'), '');
  el.innerHTML += `
    <form data-role="contactForm" class="contact-form">
      <label>${tr('formName')}</label>
      <input type="text" name="name" required>
      <label>${tr('formEmail')}</label>
      <input type="email" name="email" required>
      <label>${tr('formMessage')}</label>
      <textarea name="message" required rows="5"></textarea>
      <button type="submit" data-role="contactSubmit">${tr('send')}</button>
      <div class="contact-form-status" data-role="contactStatus"></div>
    </form>
  `;
  container.appendChild(el);
  const form = el.querySelector('[data-role="contactForm"]');
  const submitBtn = el.querySelector('[data-role="contactSubmit"]');
  const statusEl = el.querySelector('[data-role="contactStatus"]');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    statusEl.textContent = tr('sending');
    statusEl.className = 'contact-form-status';
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { Accept: 'application/json' },
        body: new FormData(form)
      });
      if (res.ok) {
        trackPublicEvent('contact_submit', {});
        form.innerHTML = `<div class="contact-form-status success">${tr('sent')}</div>`;
      } else {
        const data = await res.json().catch(() => ({}));
        statusEl.textContent = (data.errors && data.errors.map(er => er.message).join(', ')) || tr('genericError');
        statusEl.className = 'contact-form-status error';
        submitBtn.disabled = false;
      }
    } catch (err) {
      statusEl.textContent = tr('networkError');
      statusEl.className = 'contact-form-status error';
      submitBtn.disabled = false;
    }
  });
}

function renderVideoBlockItem(container, block) {
  if (!block.videos || block.videos.length === 0) return;
  const makeCard = (v) => {
    const ytId = extractYouTubeId(v.url);
    const thumbUrl = v.thumbnail ? `./images/${v.thumbnail}` : (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : null);
    const bg = thumbUrl ? `background-image:url('${thumbUrl}'); background-size:cover; background-position:center;` : '';

    if (ytId) {
      // Vignette cliquable : la vidéo YouTube ne se charge (iframe) qu'au clic — plus rapide et plus respectueux
      // de la vie privée du visiteur que d'intégrer YouTube dès l'affichage de la page.
      const card = document.createElement('div');
      card.className = 'video-card';
      card.style.cssText = bg;
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.innerHTML = `<div class="vt">${escapeHtml(v.title || '')}</div><div class="play-dot"></div>`;
      const activate = () => {
        const iframe = document.createElement('iframe');
        iframe.className = 'video-embed-frame';
        iframe.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0`;
        iframe.title = v.title || tr('videoFallbackTitle');
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        card.replaceWith(iframe);
      };
      card.addEventListener('click', activate, { once: true });
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } }, { once: true });
      return card;
    }

    // Repli : URL non reconnue comme YouTube (Vimeo, autre) -> comportement existant, lien externe.
    const hasUrl = !!v.url;
    const el = document.createElement(hasUrl ? 'a' : 'div');
    el.className = 'video-card' + (hasUrl ? '' : ' disabled');
    el.style.cssText = bg;
    if (hasUrl) { el.href = v.url; el.target = '_blank'; el.rel = 'noopener'; }
    el.innerHTML = `<div class="vt">${escapeHtml(v.title || '')}</div>${hasUrl ? '<div class="play-dot"></div>' : ''}`;
    return el;
  };
  const makeItem = (v) => {
    const wrap = document.createElement('div');
    wrap.className = 'video-item';
    wrap.appendChild(makeCard(v));
    if (v.comment && v.comment.trim()) {
      const p = document.createElement('div');
      p.className = 'video-comment';
      p.textContent = v.comment;
      wrap.appendChild(p);
    }
    return wrap;
  };
  const el = document.createElement('div');
  el.className = 'block';
  if (block.videos.length === 1) {
    el.appendChild(makeItem(block.videos[0]));
  } else {
    const grid = document.createElement('div');
    grid.className = 'video-grid-multi';
    block.videos.forEach(v => grid.appendChild(makeItem(v)));
    el.appendChild(grid);
  }
  container.appendChild(el);
}
// Applique les surcharges de texte propres à cet AdReel (titre/description/labels de couche/labels de
// stinger) par-dessus le morceau tel qu'il vit dans la Bibliothèque — sans jamais modifier ce dernier.
// Absent = le texte de la Bibliothèque reste affiché tel quel.
function applyTrackOverride(track, ov) {
  if (!ov) return track;
  const merged = { ...track };
  if (ov.title !== undefined) merged.title = ov.title;
  if (ov.description !== undefined) merged.description = ov.description;
  if (ov.layers && Object.keys(ov.layers).length) {
    const key = track.mode === 'vertical-random' ? 'fixedLayers' : 'layers';
    merged[key] = (track[key] || []).map((l, i) => (ov.layers[i] !== undefined ? { ...l, label: ov.layers[i] } : l));
  }
  // Contrairement aux couches (propres au morceau), un Sfx est une entrée de bibliothèque partagée —
  // on ne peut pas réécrire son titre directement sans affecter tous les autres morceaux qui le
  // référencent aussi. La surcharge est donc portée à part (sfxLabelOverrides), lue par le rendu du
  // bouton Sfx du morceau (buildTrackRow / initTrackPlayer, player.js) plutôt que d'être fusionnée dans
  // une copie de l'entrée Sfx elle-même.
  if (ov.sfx && Object.keys(ov.sfx).length) merged.sfxLabelOverrides = ov.sfx;
  return merged;
}
async function init() {
  const container = document.getElementById('blocksContainer');
  const adreelId = new URLSearchParams(location.search).get('adreel') || 'main';
  window.__lpTrackContext = { type: 'adreel', id: adreelId };
  try {
    const res = await fetch('./data.json?v=' + Date.now());
    const data = await res.json();
    const adReel = (data.adReels || []).find(a => a.id === adreelId);
    if (!adReel) {
      container.innerHTML = `<div class="empty">${tr('adreelNotFound')}</div>`;
      return;
    }
    pageLang = adReel.lang || 'fr';
    window.LayerPlayerCore.setLang(pageLang);
    applyI18n();
    const blocks = migrateBlocks(adReel);
    const profile = adReel.profile || {};
    // profile.theme remplace les anciens champs bgColor/textColor (gardés en lecture seule pour les
    // AdReels publiés avant ce changement, tant qu'ils n'ont pas été republiés depuis le backstage).
    const theme = profile.theme
      ? Object.assign({ bgColor: '#f6f5f3', titleColor: '#262521', contentColor: '#262521', font: 'default', bgImage: null, bgImageOpacity: 1 }, profile.theme)
      : { bgColor: profile.bgColor || '#f6f5f3', titleColor: profile.textColor || '#262521', contentColor: profile.textColor || '#262521', font: 'default', bgImage: null, bgImageOpacity: 1 };
    document.documentElement.style.setProperty('--bg', theme.bgColor);
    document.documentElement.style.setProperty('--text', theme.contentColor);
    document.documentElement.style.setProperty('--text-title', theme.titleColor);
    // Polices : n'injecte (lien Google Fonts / @font-face) que ce qui est réellement utilisé par ce
    // thème général et les éventuels réglages par bloc de CET AdReel — jamais toute la bibliothèque de
    // polices personnalisées du compositeur, pour ne pas charger des fichiers inutiles à ce visiteur.
    const usedFontValues = new Set([theme.font].filter(Boolean));
    (adReel.blocks || []).forEach(b => { if (b.appearance && b.appearance.font) usedFontValues.add(b.appearance.font); });
    injectFontAssets(usedFontValues, data.customFonts || []);
    document.documentElement.style.setProperty('--font-body', fontCssFamily(theme.font, data.customFonts || []) || "'Inter', sans-serif");
    setupContrastToggle('contrastToggle', theme.bgColor, theme.contentColor, theme.titleColor);
    // Image de fond générale : calque plein écran fixe, sous le contenu — reste indépendante de l'opacité
    // du texte, qui n'est jamais affectée par ce réglage.
    if (theme.bgImage) {
      const bgLayer = document.createElement('div');
      bgLayer.style.cssText = `position:fixed;inset:0;z-index:-1;background-image:url('./images/${theme.bgImage}');background-size:cover;background-position:center;opacity:${theme.bgImageOpacity != null ? theme.bgImageOpacity : 1};`;
      document.body.appendChild(bgLayer);
    }

    const libraryById = {};
    (data.library || []).forEach(t => { t.publishedAt = data.publishedAt; libraryById[t.id] = t; });
    const packsByTrackId = {};
    (data.packs || []).forEach(p => {
      (p.trackIds || []).forEach(tid => {
        (packsByTrackId[tid] = packsByTrackId[tid] || []).push(p);
      });
    });
    const packsById = {};
    (data.packs || []).forEach(p => { packsById[p.id] = p; });
    const collectionsById = {};
    (data.collections || []).forEach(c => { collectionsById[c.id] = c; });
    const sfxById = {};
    (data.sfxLibrary || []).forEach(s => { s.publishedAt = data.publishedAt; sfxById[s.id] = s; });
    window.LayerPlayerCore.setSfxLibrary(sfxById); // avant tout rendu de morceau, qui résout track.sfxIds via cette table

    blocks.forEach(block => {
      const beforeCount = container.children.length;
      switch (block.type) {
        case 'header': renderHeaderBlock(container, profile); break;
        case 'bio': renderBioBlock(container, profile); break;
        case 'testimonials': renderTestimonialsBlock(container, adReel.testimonials); break;
        case 'text': renderTextBlockItem(container, block); break;
        case 'photo': renderPhotoBlockItem(container, block); break;
        case 'video': renderVideoBlockItem(container, block); break;
        case 'packs': renderPacksBlockItem(container, block, packsById); break;
        case 'collections': renderCollectionsBlockItem(container, block, collectionsById); break;
        case 'sfx': renderSfxBlockItem(container, block, sfxById); break;
        case 'contact': renderContactBlockItem(container, profile); break;
        case 'tracks': {
          const orderedTracks = (adReel.trackIds || []).map(id => libraryById[id]).filter(Boolean)
            .map(t => applyTrackOverride(t, (adReel.trackOverrides || {})[t.id]));
          renderTracksBlock(container, orderedTracks, packsByTrackId, data.noAiCertifiedGlobal);
          break;
        }
      }
      // Un bloc peut ne rien avoir ajouté au DOM (contenu vide — cf. les nombreux early-return des
      // fonctions render*BlockItem) : dans ce cas, container.children n'a pas grandi, rien à styliser.
      if (container.children.length > beforeCount) {
        applyBlockAppearance(container.children[container.children.length - 1], block, data.customFonts || []);
      }
    });

    if (profile.contactUrl || profile.contactEmail) {
      document.getElementById('contact').innerHTML = [
        profile.contactUrl ? `<a href="${profile.contactUrl}" target="_blank">${profile.contactUrl.replace(/^https?:\/\//, '')}</a>` : '',
        profile.contactEmail ? `<a href="mailto:${profile.contactEmail}">${profile.contactEmail}</a>` : ''
      ].filter(Boolean).join(' &nbsp;/&nbsp; ');
    }
    document.getElementById('layerpitchCredit').textContent = tr('creditLine').replace('{label}', adReel.label || adReel.id);
  } catch (e) {
    container.innerHTML = `<div class="empty">${tr('loadError')}</div>`;
  }
}
// Bouton "Partager" : Web Share API si le navigateur la propose (menu natif — WhatsApp, Discord,
// Messages...), repli sur la copie du lien sinon (essentiellement desktop). Câblé une seule fois, pas
// besoin d'attendre init() puisque le bouton partage toujours l'URL courante de la page.
(function setupShareButton() {
  const btn = document.getElementById('shareBtn');
  if (!btn) return;
  btn.setAttribute('aria-label', tr('shareBtn'));
  btn.title = tr('shareBtn');
  btn.addEventListener('click', async () => {
    const result = await window.LayerPlayerCore.shareOrCopy(location.href, document.title);
    if (result === 'copied') {
      btn.classList.add('copied');
      btn.title = tr('linkCopiedToast');
      setTimeout(() => { btn.classList.remove('copied'); btn.title = tr('shareBtn'); }, 1500);
    }
  });
})();

// Visionneuse plein écran (lightbox) pour les photos — bloc Photo (simple et galerie) et photo de la
// Bio. openLightbox(urls, startIndex) est appelé par chaque fonction de rendu concernée, qui connaît
// déjà l'ensemble des images de son propre groupe (pour la navigation précédent/suivant au sein d'une
// même galerie — jamais mélangée avec les photos d'un autre bloc).
let lightboxImages = [];
let lightboxIndex = 0;
function updateLightboxImage() {
  document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
  const multi = lightboxImages.length > 1;
  document.querySelector('.lightbox-prev').style.display = multi ? '' : 'none';
  document.querySelector('.lightbox-next').style.display = multi ? '' : 'none';
}
function openLightbox(urls, index) {
  lightboxImages = urls;
  lightboxIndex = index;
  updateLightboxImage();
  document.getElementById('lightboxOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightboxOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('lightboxOverlay').addEventListener('click', e => {
  if (e.target.id === 'lightboxOverlay') closeLightbox();
});
document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
document.querySelector('.lightbox-prev').addEventListener('click', () => {
  lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
  updateLightboxImage();
});
document.querySelector('.lightbox-next').addEventListener('click', () => {
  lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
  updateLightboxImage();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightboxOverlay').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') document.querySelector('.lightbox-prev').click();
  else if (e.key === 'ArrowRight') document.querySelector('.lightbox-next').click();
});

window.addEventListener('load', init);
</script>
