<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LayerPitch</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --bg: #16181c; --card: #1e2126; --border: #2e3239; --text: #e8eaed; --dim: #9aa0a8; --accent: #2f80c0; --ok: #3a9d6a; --warn: #d9822b; }
  @media (prefers-color-scheme: light) { :root { --bg: #f3f4f6; --card: #fff; --border: #d9dce1; --text: #1d2026; --dim: #667; --accent: #2f80c0; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .page { max-width: 880px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--dim); }
  .vwrap { position: relative; background: #000; border-radius: 10px; overflow: hidden; }
  .vwrap video { display: block; width: 100%; max-height: 62vh; background: #000; }
  .strip { position: relative; height: 22px; margin: 6px 2px 0; border-radius: 4px; background: var(--card); border: 1px solid var(--border); }
  .strip .dot { position: absolute; top: 3px; width: 12px; height: 14px; margin-left: -6px; padding: 0; border: 0; border-radius: 3px 3px 3px 0; background: var(--accent); cursor: pointer; }
  .strip .dot.resolved { background: var(--dim); opacity: .6; }
  .strip .dot.sel { outline: 2px solid var(--text); }
  .strip .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); opacity: .75; pointer-events: none; }
  .lp-video-versions { margin: 10px 0 4px; }
  .status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; font-size: 13px; color: var(--dim); }
  .pill { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--text); font-size: 12px; }
  .pill.sent { border-color: var(--accent); }
  .pill.changes_requested { border-color: var(--warn); color: var(--warn); }
  .pill.approved { border-color: var(--ok); color: var(--ok); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text], textarea { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; width: 100%; }
  textarea { min-height: 64px; resize: vertical; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 7px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ok { border-color: var(--ok); color: var(--ok); }
  button.warn { border-color: var(--warn); color: var(--warn); }
  button:disabled { opacity: .5; cursor: default; }
  .cm { padding: 9px 0; border-top: 1px solid var(--border); }
  .cm:first-of-type { border-top: 0; }
  .cm.resolved { opacity: .55; }
  .cm .meta { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
  .cm .meta .t { color: var(--accent); background: none; border: 0; padding: 0; font-weight: 600; }
  .cm .meta .who { color: var(--text); font-weight: 600; }
  .cm .body { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cm .reply { margin: 8px 0 0 14px; padding-left: 10px; border-left: 2px solid var(--border); }
  .cm .rform { margin: 8px 0 0 14px; }
  .linkbtn { background: none; border: 0; color: var(--accent); padding: 0; font-size: 12px; }
  .err { color: var(--warn); font-size: 13px; margin-top: 6px; min-height: 1em; }
  .foot { text-align: center; color: var(--dim); font-size: 12px; margin-top: 36px; }
  .foot a { color: inherit; }
</style>
</head>
<body>
<div class="page" id="page"><div class="empty">…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="layerpitch-i18n.js?v=1794515471694"></script>
<script src="api/supabase-client.js?v=1794515471694"></script>
<script src="layerpitch-video-versions.js?v=1794515471694"></script>
<script>
// relecture.html — page de relecture d'un montage vidéo pour un CLIENT, sans compte (9/11/2026, idée Pibox ; décisions de Jules-Antoine :
// un lien par montage, tout porteur du lien peut commenter en donnant un prénom, le client peut valider ou demander des modifs).
//   /relecture/<nom>#k=<clé>   adresse lisible (404.html → relecture.html?s=<nom>) ; la clé « magique » est après le # : elle ne part
//                              jamais vers un serveur. Pour un lien protégé par mot de passe, pas de clé : la page le demande.
// Même principe que les AdReels privés (migration 20261006010000) : seule l'empreinte du secret est gardée côté serveur, frein à
// 10 essais ratés par 10 minutes. Désactivé ou renouvelé, l'ancien lien affiche simplement « plus actif ».
// Page PUBLIQUE : jamais de compte demandé, jamais derrière un accès protégé (règle du 06/09). Tout passe par les fonctions serveur
// get_video_review_access / get_video_review / add_video_review_comment / set_video_review_decision (migration 20261109030000).
const params = new URLSearchParams(location.search);
const SLUG = params.get('s') || '';
// Restaure la belle adresse dans la barre (404.html l'a passée en __pretty), clé comprise.
if (params.get('__pretty')) { try { history.replaceState(null, '', params.get('__pretty') + location.hash); } catch (e) { /* tant pis */ } }
let SECRET = (/[#&]k=([^&]+)/.exec(location.hash) || [])[1] || '';
try { SECRET = decodeURIComponent(SECRET); } catch (e) { /* clé telle quelle */ }
const pageLang = params.get('lang') === 'en' || (!params.get('lang') && /^en/i.test(navigator.language || '')) ? 'en' : 'fr';
document.documentElement.lang = pageLang;
function tr(key, vars) {
  const I18N = window.LAYERPITCH_I18N || { fr: {}, en: {} };
  const d = I18N[pageLang] || I18N.fr, f = I18N.fr || {};
  let s = (d.review && d.review[key]) || (d.shared && d.shared[key]) || (f.review && f.review[key]) || (f.shared && f.shared[key]) || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = t => { t = Math.max(0, Number(t) || 0); const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0'); };
const rpc = async (name, args) => {
  const { data, error } = await window.LayerPitchSupabaseClient.getClient().rpc(name, args);
  if (error) throw error;
  return data;
};
// Prénom retenu d'une visite à l'autre (confort seulement : le stockage peut être bloqué).
const NAME_KEY = 'layerpitch_review_name';
const getName = () => { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } };
const setName = n => { try { localStorage.setItem(NAME_KEY, n); } catch (e) { /* tant pis */ } };

const root = document.getElementById('page');
let data = null, video = null, wrap = null, mounted = null, selectedId = null, busy = false;
// Une ancienne révision (« key@rang ») s'écoute comme une version, mais remarques et décisions vont à sa version (le serveur ne connaît que celle-là).
const baseKey = k => String(k || 'original').split('@')[0];
const versionKey = () => baseKey(mounted && mounted.current() ? mounted.current().key : 'original');
const versionInfo = key => (data.versions || []).find(v => v.key === key) || {};
const statusLabel = st => tr('reviewStatus_' + st);

// Révisions (10/11) : chaque envoi au client est figé (#2.1, #2.2…). Le client voit la dernière ; les précédentes sont des entrées en plus du menu.
function withRevisions(d) {
  if (!d || !Array.isArray(d.versions)) return d;
  const out = [];
  d.versions.forEach(v => {
    const revs = v.revisions || [];
    const main = Object.assign({}, v);
    if (v.key !== 'original' && v.seq) main.title = (v.title || tr('reviewAltName', { n: v.n })) + ' · #' + v.n + '.' + v.seq;
    out.push(main);
    revs.filter(r => r.seq !== v.seq).forEach(r => out.push({ key: v.key + '@' + r.seq, title: (v.key === 'original' ? tr('reviewAltName', { n: 1 }) : (v.title || tr('reviewAltName', { n: v.n }))) + ' · #' + v.n + '.' + r.seq + ' (' + tr('reviewOlderRevision') + ')',
      url: r.url, kind: r.kind, cues: r.cues, status: null, statusBy: null, n: v.n, seq: r.seq }));
  });
  return Object.assign({}, d, { versions: out });
}
async function load() { return withRevisions(await rpc('get_video_review', { p_slug: SLUG, p_secret: SECRET })); }

// Lien protégé par mot de passe : un petit formulaire, le mot de passe n'est gardé qu'en mémoire (jamais dans l'adresse).
function askPassword(msg) {
  root.innerHTML = `<div class="card"><h2>${esc(tr('reviewPasswordLabel'))}</h2><div class="sub">${esc(tr('reviewPasswordPrompt'))}</div>
    <form id="pwForm" class="row"><input type="password" id="pwInput" autocomplete="current-password" style="flex:1;min-width:160px;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:inherit">
    <button type="submit" class="primary">${esc(tr('reviewPasswordGo'))}</button></form><div class="err" id="pwErr">${esc(msg || '')}</div></div>`;
  const input = document.getElementById('pwInput'); input.focus();
  document.getElementById('pwForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    if (!input.value) return;
    SECRET = input.value;
    const err = document.getElementById('pwErr');
    let d = null;
    try { d = await load(); } catch (e) { err.textContent = /essais|throttled/i.test((e && (e.message + (e.hint || ''))) || '') ? tr('reviewThrottled') : tr('reviewSendFailed', { error: e.message }); return; }
    if (!d || !(d.versions || []).length) { err.textContent = tr('reviewPasswordWrong'); input.select(); return; }
    data = d; await show();
  });
}

async function start() {
  document.title = 'LayerPitch';
  const unavailable = key => { root.innerHTML = `<div class="empty">${esc(tr(key || 'reviewUnavailable'))}</div>`; };
  if (!SLUG) { unavailable(); return; }
  let access = null;
  try { access = await rpc('get_video_review_access', { p_slug: SLUG }); } catch (e) { access = null; }
  if (!access) { unavailable(); return; }
  if (access.mode === 'password') { askPassword(); return; }
  if (!SECRET) { unavailable('reviewKeyMissing'); return; }
  try { data = await load(); } catch (e) { data = null; }
  if (!data || !(data.versions || []).length) { unavailable(); return; }
  await show();
}

async function show() {
  document.title = tr('reviewPageTitle').replace('{title}', data.title || 'LayerPitch');
  root.innerHTML = `
    <h1>${esc(data.title || '')}</h1>
    <div class="sub">${esc(tr('reviewIntro'))}</div>
    <div class="vwrap" id="vwrap"><video id="vid" controls playsinline preload="auto"></video></div>
    <div class="strip" id="strip"></div>
    <div class="status" id="status"></div>
    <div class="card" id="decision"></div>
    <div class="card" id="form"></div>
    <div class="card"><h2>${esc(tr('reviewComments'))}</h2><div id="list"></div></div>
    <div class="foot">${esc(tr('reviewFooter'))} <a href="https://layerpitch.com" target="_blank" rel="noopener">LayerPitch</a></div>`;
  video = document.getElementById('vid'); wrap = document.getElementById('vwrap');
  // Même lecteur que les pages publiques : vidéo muette + son de la version choisie, synchronisés, menu de version, bascule A/B, étiquettes.
  mounted = await window.LayerPitchVideoVersions.mount(video, wrap, {
    montageId: SLUG, defaultKey: 'original', tr, ab: true, load: async () => data,
    onVersionChange: () => { selectedId = null; renderAll(); }
  });
  if (!mounted) { root.innerHTML = `<div class="empty">${esc(tr('reviewUnavailable'))}</div>`; return; }
  // Touche B : bascule A/B (sauf pendant qu'on écrit une remarque).
  document.addEventListener('keydown', ev => {
    if ((ev.key || '').toLowerCase() !== 'b' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const t = ev.target && ev.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || (ev.target && ev.target.isContentEditable)) return;
    ev.preventDefault(); mounted.toggleAB();
  });
  video.addEventListener('timeupdate', moveHead);
  renderAll();
  // Les remarques des autres relecteurs et les réponses arrivent sans recharger la page.
  setInterval(async () => { if (busy || document.hidden) return; try { const d = await load(); if (d) { data = d; renderAll(); } } catch (e) { /* hors ligne : on réessaiera */ } }, 20000);
}

function renderAll() { renderStatus(); renderDecision(); renderForm(); renderList(); renderStrip(); }

function commentsOfVersion() { return (data.comments || []).filter(c => c.versionKey === versionKey()); }

function renderStrip() {
  const strip = document.getElementById('strip');
  const dur = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 0;
  const top = commentsOfVersion().filter(c => !c.parentId);
  const total = Math.max(dur, ...top.map(c => Number(c.t) + 1), 5);
  strip.dataset.total = total;
  strip.innerHTML = top.map(c => `<button type="button" class="dot${c.resolved ? ' resolved' : ''}${c.id === selectedId ? ' sel' : ''}" data-id="${esc(c.id)}" style="left:${(Number(c.t) / total * 100).toFixed(2)}%" title="${esc(c.author)} — ${fmt(c.t)}"></button>`).join('') + '<div class="head" id="head"></div>';
  strip.querySelectorAll('.dot').forEach(b => b.addEventListener('click', () => focusComment(b.dataset.id)));
  moveHead();
}
function moveHead() {
  const strip = document.getElementById('strip'), head = document.getElementById('head');
  if (!strip || !head) return;
  const total = Number(strip.dataset.total) || 5;
  head.style.left = Math.min(100, (video.currentTime || 0) / total * 100) + '%';
  if (Number.isFinite(video.duration) && video.duration > 0 && Math.abs(video.duration - total) > 0.5 && video.duration > total) renderStrip();
}
function focusComment(id) {
  const c = (data.comments || []).find(x => x.id === id);
  if (!c) return;
  selectedId = id;
  try { video.currentTime = Number(c.t); } catch (e) { /* pas encore chargée */ }
  renderStrip(); renderList();
  const el = document.querySelector('.cm[data-id="' + id + '"]');
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function renderStatus() {
  const info = versionInfo(versionKey());
  const el = document.getElementById('status');
  if (!info.status) { el.innerHTML = `<span>${esc(tr('reviewOriginalNote'))}</span>`; return; }
  el.innerHTML = `<span class="pill ${esc(info.status)}">${esc(statusLabel(info.status))}</span>` + (info.statusBy ? `<span>${esc(tr('reviewStatusBy', { name: info.statusBy }))}</span>` : '');
}

function renderDecision() {
  const el = document.getElementById('decision');
  const info = versionInfo(versionKey());
  if (!info.status) { el.hidden = true; return; } // la musique d'origine : pas de validation, seulement des remarques
  el.hidden = false;
  el.innerHTML = `<h2>${esc(tr('reviewDecisionTitle'))}</h2><div class="row">
    <button type="button" class="ok" data-d="approved" ${info.status === 'approved' ? 'disabled' : ''}>${esc(tr('reviewApprove'))}</button>
    <button type="button" class="warn" data-d="changes_requested" ${info.status === 'changes_requested' ? 'disabled' : ''}>${esc(tr('reviewChanges'))}</button></div>
    <div class="err" id="decErr"></div>`;
  el.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => decide(b.dataset.d)));
}
async function decide(decision) {
  const name = getName().trim();
  const err = document.getElementById('decErr');
  if (!name) { err.textContent = tr('reviewNameNeeded'); const n = document.getElementById('nameInput'); if (n) n.focus(); return; }
  busy = true;
  try { const r = await rpc('set_video_review_decision', { p_slug: SLUG, p_secret: SECRET, p_version_id: versionKey(), p_decision: decision, p_author: name }); if (r && r.ok === false) throw new Error(tr('reviewUnavailable')); data = (await load()) || data; err.textContent = ''; }
  catch (e) { err.textContent = tr('reviewSendFailed', { error: e.message }); }
  busy = false; renderAll();
}

function renderForm() {
  const el = document.getElementById('form');
  if (el.dataset.ready) { document.getElementById('atBtn').textContent = tr('reviewCommentAt', { t: fmt(video.currentTime) }); return; }
  el.dataset.ready = '1';
  el.innerHTML = `<div class="row" style="margin-bottom:8px"><label for="nameInput" style="color:var(--dim);font-size:13px">${esc(tr('reviewYourName'))}</label>
      <input type="text" id="nameInput" maxlength="40" autocomplete="given-name" placeholder="${esc(tr('reviewNamePlaceholder'))}" value="${esc(getName())}" style="max-width:220px"></div>
    <textarea id="cmText" maxlength="2000" placeholder="${esc(tr('reviewCommentPlaceholder'))}"></textarea>
    <div class="row" style="margin-top:8px"><button type="button" class="primary" id="atBtn"></button><span class="err" id="cmErr"></span></div>`;
  document.getElementById('atBtn').textContent = tr('reviewCommentAt', { t: fmt(video.currentTime) });
  document.getElementById('nameInput').addEventListener('input', e => setName(e.target.value));
  const upd = () => { const b = document.getElementById('atBtn'); if (b) b.textContent = tr('reviewCommentAt', { t: fmt(video.currentTime) }); };
  video.addEventListener('timeupdate', upd); video.addEventListener('seeked', upd);
  document.getElementById('atBtn').addEventListener('click', async () => {
    const name = document.getElementById('nameInput').value.trim(), text = document.getElementById('cmText').value.trim(), err = document.getElementById('cmErr');
    if (!name) { err.textContent = tr('reviewNameNeeded'); document.getElementById('nameInput').focus(); return; }
    if (!text) { err.textContent = tr('reviewCommentEmpty'); return; }
    busy = true; err.textContent = '';
    try {
      const r = await rpc('add_video_review_comment', { p_slug: SLUG, p_secret: SECRET, p_version_key: versionKey(), p_t: Math.round((video.currentTime || 0) * 100) / 100, p_author: name, p_body: text, p_parent_id: null });
      if (r && r.ok === false) throw new Error(tr('reviewUnavailable'));
      document.getElementById('cmText').value = '';
      data = (await load()) || data;
    } catch (e) { err.textContent = tr('reviewSendFailed', { error: e.message }); }
    busy = false; renderAll();
  });
}

function renderList() {
  const el = document.getElementById('list');
  const all = data.comments || [];
  const top = commentsOfVersion().filter(c => !c.parentId).sort((a, b) => Number(a.t) - Number(b.t) || String(a.createdAt).localeCompare(String(b.createdAt)));
  if (!top.length) { el.innerHTML = `<div style="color:var(--dim)">${esc(tr('reviewNoComments'))}</div>`; return; }
  const draft = {}; el.querySelectorAll('.rform textarea').forEach(t => { draft[t.dataset.for] = t.value; }); // texte en cours de réponse : conservé quand la liste se rafraîchit
  el.innerHTML = top.map(c => {
    const replies = all.filter(r => r.parentId === c.id);
    return `<div class="cm${c.resolved ? ' resolved' : ''}" data-id="${esc(c.id)}">
      <div class="meta"><button type="button" class="t" data-seek="${esc(c.id)}">${fmt(c.t)}</button><span class="who">${esc(c.author)}</span>${c.resolved ? `<span>✓ ${esc(tr('reviewResolved'))}</span>` : ''}</div>
      <div class="body">${esc(c.body)}</div>
      ${replies.map(r => `<div class="reply"><div class="meta"><span class="who">${esc(r.author)}</span></div><div class="body">${esc(r.body)}</div></div>`).join('')}
      <div style="margin-top:4px"><button type="button" class="linkbtn" data-reply="${esc(c.id)}">${esc(tr('reviewReply'))}</button></div>
      <div class="rform" data-form="${esc(c.id)}" ${draft[c.id] != null ? '' : 'hidden'}><textarea data-for="${esc(c.id)}" maxlength="2000" placeholder="${esc(tr('reviewReplyPlaceholder'))}">${esc(draft[c.id] || '')}</textarea>
        <div class="row" style="margin-top:6px"><button type="button" class="primary" data-send="${esc(c.id)}">${esc(tr('reviewSend'))}</button><span class="err" data-err="${esc(c.id)}"></span></div></div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-seek]').forEach(b => b.addEventListener('click', () => focusComment(b.dataset.seek)));
  el.querySelectorAll('[data-reply]').forEach(b => b.addEventListener('click', () => { const f = el.querySelector('[data-form="' + b.dataset.reply + '"]'); f.hidden = !f.hidden; if (!f.hidden) f.querySelector('textarea').focus(); }));
  el.querySelectorAll('[data-send]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.send, ta = el.querySelector('textarea[data-for="' + id + '"]'), err = el.querySelector('[data-err="' + id + '"]');
    const name = getName().trim(), text = ta.value.trim();
    if (!name) { err.textContent = tr('reviewNameNeeded'); const n = document.getElementById('nameInput'); if (n) n.focus(); return; }
    if (!text) return;
    busy = true;
    try { const r = await rpc('add_video_review_comment', { p_slug: SLUG, p_secret: SECRET, p_version_key: versionKey(), p_t: 0, p_author: name, p_body: text, p_parent_id: id }); if (r && r.ok === false) throw new Error(tr('reviewUnavailable')); data = (await load()) || data; }
    catch (e) { err.textContent = tr('reviewSendFailed', { error: e.message }); busy = false; return; }
    busy = false; renderAll();
  }));
}

start();
</script>
</body>
</html>
