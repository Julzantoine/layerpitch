<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">LayerPitch — Ma bibliothèque</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg: #f6f5f3; --bg-card: #ffffff; --border: #e4e1da;
    --text: #262521; --text-dim: #6f6b62; --text-dimmer: #a8a399;
    --accent: #c9713c; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  img { max-width: 100%; height: auto; display: block; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); padding: 56px 24px 60px; }
  .page { max-width: 760px; margin: 0 auto; }
  a { color: var(--accent); }
  .back-link { display: inline-block; margin-bottom: 32px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); text-decoration: none; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 24px; margin-bottom: 32px; }
  .empty { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dimmer); padding: 60px 0; text-align: center; }
  .purchase-list { display: flex; flex-direction: column; gap: 2px; }
  .purchase-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 4px; text-decoration: none; color: inherit;
    border-bottom: 1px solid var(--border);
  }
  .purchase-row:hover .purchase-row-title { color: var(--accent); }
  .purchase-row-thumb { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); background: linear-gradient(135deg, #2a2822, #423b30); }
  .purchase-row-info { flex: 1; }
  .purchase-row-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; transition: color 0.15s ease; }
  .purchase-row-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dimmer); margin-top: 3px; }
  .signin-box { max-width: 340px; margin: 0 auto; text-align: center; }
  .signin-box input { width: 100%; padding: 10px; margin: 12px 0; border: 1px solid var(--border); border-radius: 4px; font-family: 'Inter', sans-serif; }
  .signin-box button { padding: 10px 24px; border: none; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
  .signin-msg { font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-top: 10px; }
  .signin-msg.err { color: #b5442e; }
  .signin-msg.ok { color: #2a7; }
</style>
</head>
<body>
<div class="page">
  <a class="back-link" href="./index.html" data-i18n="backLink">← Retour</a>
  <h1 data-i18n="libraryTitle">Ma bibliothèque</h1>
  <div id="content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="layerpitch-i18n.js?v=1788020257757"></script>
<script src="api/supabase-client.js"></script>
<script src="api/auth.js"></script>
<script src="api/purchases.js"></script>
<script>
const pageLang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
function currentLang() { return pageLang; }
function tr(key) {
  const I18N = window.LAYERPITCH_I18N || { fr: { shared: {}, library: {} }, en: { shared: {}, library: {} } };
  const dict = I18N[currentLang()] || I18N.fr;
  const dictFr = I18N.fr;
  return (dict.library && dict.library[key]) || (dict.shared && dict.shared[key])
    || (dictFr.library && dictFr.library[key]) || (dictFr.shared && dictFr.shared[key]) || key;
}
document.documentElement.lang = currentLang();

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const content = document.getElementById('content');

async function render() {
  const { session } = await LayerPitchAuth.getSession();
  if (!session) {
    content.innerHTML = `
      <div class="signin-box">
        <div>${tr('libraryNotSignedIn')}</div>
        <input type="email" id="email" placeholder="${tr('emailPlaceholder')}">
        <button id="sendBtn" type="button">${tr('sendMagicLinkBtn')}</button>
        <div class="signin-msg" id="msg"></div>
      </div>`;
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('msg');
      if (!email) return;
      msg.textContent = '…'; msg.className = 'signin-msg';
      const { ok, error } = await LayerPitchAuth.signInWithMagicLink(email, window.location.href);
      msg.textContent = ok ? tr('magicLinkSentMsg') : tr('errorMsg').replace('{error}', error);
      msg.className = 'signin-msg ' + (ok ? 'ok' : 'err');
    });
    return;
  }

  const { purchases, error } = await LayerPitchPurchases.myPurchases();
  if (error) { content.innerHTML = `<div class="empty">${tr('errorMsg').replace('{error}', error)}</div>`; return; }
  if (!purchases || !purchases.length) { content.innerHTML = `<div class="empty">${tr('libraryEmpty')}</div>`; return; }

  const IMAGES_BASE = 'https://media.layerpitch.com/images/';
  content.innerHTML = `<div class="purchase-list">${purchases.map(p => `
    <a class="purchase-row" href="./pack.html?id=${encodeURIComponent(p.packId)}&lang=${pageLang}">
      ${p.pack && p.pack.illustration
        ? `<img class="purchase-row-thumb" src="${IMAGES_BASE}${p.pack.illustration}" alt="">`
        : `<div class="purchase-row-thumb"></div>`}
      <div class="purchase-row-info">
        <div class="purchase-row-title">${escapeHtml(p.pack ? p.pack.title : p.packId)}</div>
        <div class="purchase-row-meta">${new Date(p.purchasedAt).toLocaleDateString(pageLang)} — $${p.pricePaid}</div>
      </div>
    </a>`).join('')}</div>`;
}

LayerPitchAuth.onAuthStateChange(() => render());
</script>
</body>
</html>
