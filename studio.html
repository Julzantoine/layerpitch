<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">LayerPitch — Espace studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="player.css?v=1794646220644">
<style>
  :root {
    --bg: #f5f6f8; --bg-card: #ffffff; --border: #e2e2e6;
    --text: #24262b; --text-dim: #5f636b; --text-dimmer: #9a9ea6;
    --accent: #2f80c0; --accent-soft: #e6eef8; --on-accent: #ffffff;
    --seq-map-success: #2f8f5b; --seq-map-choice: #b8862e;
    --font-body: 'Inter', system-ui, sans-serif; --font-title: 'Space Grotesk', 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; padding: 32px 16px 60px; }
  .page { max-width: 820px; margin: 0 auto; }
  a { color: var(--accent); }
  .top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .top-links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; }
  h1 { font-family: var(--font-title); font-size: 26px; margin: 0; }
  h2 { font-family: var(--font-title); font-size: 16px; margin: 0 0 8px; }
  .plan-badge { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .atelier-frame { display: block; width: 100%; height: calc(100vh - 200px); min-height: 640px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
  .hint { font-size: 12.5px; line-height: 1.6; color: var(--text-dim); margin: 0 0 10px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .tab { border: 1px solid var(--border); background: var(--bg-card); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--text); }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn { border: 1px solid var(--border); background: var(--bg-card); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--text); }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.danger:hover:not(:disabled) { border-color: #b5442e; color: #b5442e; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .row:first-child { border-top: none; }
  .row-main { flex: 1 1 220px; min-width: 0; }
  .row-title { font-family: var(--font-title); font-size: 15px; overflow-wrap: anywhere; }
  .row-sub { font-size: 12px; color: var(--text-dimmer); margin-top: 2px; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); background: linear-gradient(135deg, #23262d, #3a3f48); flex-shrink: 0; }
  .empty { color: var(--text-dimmer); font-size: 13px; padding: 20px 0; text-align: center; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 4px; }
  input[type="text"], input[type="email"], select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font: inherit; background: var(--bg-card); color: var(--text); }
  .msg { font-family: var(--font-mono); font-size: 11.5px; margin-top: 8px; min-height: 1em; }
  .msg.err { color: #b5442e; } .msg.ok { color: #2a7; }
  .quota { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 13px; }
  .quota dt { color: var(--text-dim); } .quota dd { margin: 0; font-family: var(--font-mono); text-align: right; }
  .item-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .item-row:first-child { border-top: none; }
  .item-kind { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dimmer); text-transform: uppercase; width: 44px; flex-shrink: 0; }
  .item-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item-row input[type="text"] { width: 160px; padding: 4px 8px; font-size: 12px; }
  .icon-btn { border: 1px solid var(--border); background: var(--bg-card); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; color: var(--text-dim); }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .player-box { margin-top: 12px; }
  .section-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dimmer); margin: 16px 0 4px; }
  /* Accueil (14/11) : peu de cadres, la hiérarchie vient de l'espace, de la taille et de la graisse (comme l'Accueil du Backstage). */
  .sh-home header { margin-bottom: 22px; }
  .sh-greeting { font-size: 22px; margin: 0 0 4px; }
  .sh-question { margin-bottom: 26px; }
  .sh-choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .sh-block { margin-bottom: 26px; }
  .sh-block h2, .sh-question h2 { font-size: 15px; margin: 0 0 10px; }
  .sh-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .sh-head h2 { margin: 0; }
  .sh-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 32px; }
  .sh-empty { color: var(--text-dimmer); font-size: 13px; padding: 4px 0 8px; }
  .sh-link { border: 0; background: none; padding: 4px 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 12.5px; }
  .sh-mail-item { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); color: var(--text); text-decoration: none; cursor: pointer; }
  .sh-mail-item:first-of-type { border-top: 0; }
  .sh-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; background: transparent; }
  .sh-mail-item.unread .sh-dot { background: var(--accent); }
  .sh-mail-body { flex: 1; min-width: 0; }
  .sh-mail-line { display: flex; justify-content: space-between; gap: 10px; }
  .sh-mail-line small { color: var(--text-dimmer); white-space: nowrap; }
  .sh-mail-text { display: block; font-size: 12.5px; color: var(--text-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sh-mail-item.expanded .sh-mail-text { white-space: normal; overflow-wrap: anywhere; }
  .sh-recent { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 0; cursor: pointer; font: inherit; color: var(--text); }
  .sh-recent:hover span { color: var(--accent); }
  .sh-recent small { display: block; color: var(--text-dimmer); font-size: 11.5px; }
  .sh-plan-name { font-family: var(--font-title); font-size: 20px; }
  .sh-plan-line { font-size: 12.5px; color: var(--text-dim); margin-bottom: 4px; }
  .sh-news { display: flex; flex-direction: column; gap: 2px; padding: 4px 0 8px; font-size: 12.5px; color: var(--text-dim); }
  .sh-news small { color: var(--text-dimmer); } .sh-news b { color: var(--text); font-size: 13.5px; }
  .sh-quick { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
  .sh-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .sh-seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 12.5px; color: var(--text); }
  .sh-seg button.on { background: var(--accent); color: var(--on-accent); }
  @media (max-width: 520px) { .item-row { flex-wrap: wrap; } .item-row input[type="text"] { width: 100%; } }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1 id="pageTitle" data-i18n="h1">Espace studio</h1>
  </div>
  <div id="content"></div>
</div>

<script src="https://unpkg.com/@wasm-audio-decoders/ogg-vorbis/dist/ogg-vorbis-decoder.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="layerpitch-i18n.js?v=1794646220644"></script>
<script src="layerpitch-notify.js?v=1794646220644"></script>
<script src="player.js?v=1794646220644"></script>
<script src="api/supabase-client.js?v=1794646220644"></script>
<script src="api/auth.js?v=1794646220644"></script>
<script src="layerpitch-appearance.js?v=1794646220644"></script>
<script src="layerpitch-album-shared.js?v=1794646220644"></script>
<script src="layerpitch-album-editor.js?v=1794646220644"></script>
<script src="layerpitch-shell.js?v=1794646220644"></script>
<script src="api/purchases.js?v=1794646220644"></script>
<script src="api/tracks.js?v=1794646220644"></script>
<script src="api/sfx.js?v=1794646220644"></script>
<script src="api/subscriptions.js?v=1794646220644"></script>
<script src="api/albums.js?v=1794646220644"></script>
<script src="layerpitch-studio-albums.js?v=1794646220644"></script>
<script src="api/studio.js?v=1794646220644"></script>
<script>
// studio.html — Espace studio (chantier profils et permissions, étape 3, 28/09 ; D2, D9, D13, D33 du cadrage
// layerpitch-docs/2026-09-27-cadrage-profils-permissions.md). Espace DÉDIÉ au studio, distinct du Backstage compositeur ;
// un compte qui a les deux profils passe de l'un à l'autre par les liens du haut. Droits lus dans la matrice
// (my_entitlements) ; tout contrôle réel est refait côté serveur. Feu vert 'studio_space' : admin seulement pendant la bêta.
const pageLang = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('layerpitch_lang') || 'fr') === 'en' ? 'en' : 'fr';
function currentLang() { return pageLang; }
function tr(key, vars) {
  const I18N = window.LAYERPITCH_I18N || { fr: { shared: {}, studio: {} }, en: { shared: {}, studio: {} } };
  const dict = I18N[currentLang()] || I18N.fr, dictFr = I18N.fr;
  let str = (dict.studio && dict.studio[key]) || (dict.shared && dict.shared[key]) || (dictFr.studio && dictFr.studio[key]) || (dictFr.shared && dictFr.shared[key]) || key;
  if (vars) Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  return str;
}
document.documentElement.lang = pageLang;
document.title = tr('pageTitle');
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
if (window.LayerPlayerCore && window.LayerPlayerCore.setLang) window.LayerPlayerCore.setLang(pageLang);

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IMAGES_BASE = 'https://media.layerpitch.com/images/';
const eur = cents => new Intl.NumberFormat(pageLang === 'en' ? 'en-GB' : 'fr-FR', { style: 'currency', currency: 'EUR' }).format((Number(cents) || 0) / 100);
const PLAN_NAMES = { solodev: 'SoloDev', indie: 'Indie', aa: 'AA', aaa: 'AAA' };

// Retour de Stripe : après un abonnement (?subscribed=1, avec un message) ou depuis le portail « Gérer mon abonnement »
// (?tab=plan&portal=1), on ouvre directement « Mon palier ». ?tab= choisit aussi l'onglet dans les autres cas.
const startParams = new URLSearchParams(location.search);
const justSubscribed = startParams.get('subscribed') === '1';
const fromPortal = startParams.get('portal') === '1';
const startTabAsked = ['home', 'library', 'custom', 'video', 'albums', 'team', 'plan'].includes(startParams.get('tab')) ? startParams.get('tab') : null; // adresse avec ?tab= valide
const startTab = justSubscribed ? 'plan' : (startTabAsked || 'library');
if (justSubscribed || fromPortal) history.replaceState(null, '', location.pathname + '?tab=plan' + (pageLang === 'en' ? '&lang=en' : ''));
const state = { tab: startTab, ent: {}, flags: {}, purchases: [], owned: [], customPacks: [], editing: null, playing: null };
const content = $('content');

function quotaText(e) {
  if (!e || !e.allowed) return tr('quotaNone');
  if (e.amount == null) return e.level ? tr('level_' + e.level) : tr('quotaUnlimited');
  return String(e.amount);
}

// Barre latérale commune (28/09) : les onglets de l'espace studio sont ses entrées « Studio » ; le fil d'Ariane et
// le titre suivent l'onglet choisi. Un lien de la barre vers cette même page change d'onglet sans rechargement.
const STUDIO_TABS = ['home', 'library', 'custom', 'video', 'albums', 'team', 'plan'];
function shellPlaces() {
  return { active: 'studio.' + state.tab, crumbs: [{ label: tr('h1') }, { label: tr('tab_' + state.tab) }] };
}
function selectTab(tab) {
  if (!STUDIO_TABS.includes(tab)) return false;
  state.tab = tab; state.editing = null; stopPlayback(); state.playing = null;
  history.replaceState(null, '', location.pathname + '?tab=' + tab + (pageLang === 'en' ? '&lang=en' : ''));
  $('pageTitle').textContent = tr('tab_' + tab);
  if (window.LayerPitchShell) window.LayerPitchShell.update(shellPlaces());
  if ($('panel')) renderPanel();
  return true;
}
if (window.LayerPitchShell) window.LayerPitchShell.onNavigate(url => selectTab(url.searchParams.get('tab') || 'library'));

function signInHtml() {
  return `<div class="card">
    <p class="hint">${esc(tr('signInPrompt'))}</p>
    <input type="email" id="email" placeholder="${esc(tr('emailPlaceholder'))}">
    <div style="margin-top:10px"><button class="btn primary" id="sendBtn" type="button">${esc(tr('sendLinkBtn'))}</button></div>
    <div class="msg" id="msg"></div>
    <div id="codeBox" hidden>
      <label>${esc(tr('codeLabel'))}</label>
      <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code">
      <div style="margin-top:10px"><button class="btn primary" id="verifyBtn" type="button">${esc(tr('verifyCodeBtn'))}</button></div>
      <div class="msg" id="codeMsg"></div>
    </div>
  </div>`;
}
function wireSignIn() {
  $('sendBtn').onclick = async () => {
    const email = $('email').value.trim(); if (!email) return;
    $('msg').textContent = '…';
    const { ok, error } = await LayerPitchAuth.signInWithMagicLink(email, location.href);
    $('msg').textContent = ok ? tr('linkSent') : tr('errorPrefix', { message: error });
    $('msg').className = 'msg ' + (ok ? 'ok' : 'err');
    $('codeBox').hidden = !ok;
  };
  $('verifyBtn').onclick = async () => {
    const { ok, error } = await LayerPitchAuth.verifyEmailOtp($('email').value.trim(), $('code').value.trim());
    if (!ok) { $('codeMsg').textContent = tr('errorPrefix', { message: error }); $('codeMsg').className = 'msg err'; }
  };
}

async function render() {
  const { session } = await LayerPitchAuth.getSession();
  if (!session) { $('pageTitle').textContent = tr('h1'); content.innerHTML = signInHtml(); wireSignIn(); return; }
  const [{ composerId }, { studioId }] = await Promise.all([LayerPitchAuth.getMyComposerId(), LayerPitchAuth.getMyStudioId()]);
  $('pageTitle').textContent = studioId ? tr('tab_' + state.tab) : tr('h1');
  if (!studioId) {
    // Admin en « Voir en tant que » compositeur ou fan : la casquette studio est masquée, pas d'activation proposée.
    const preview = await LayerPitchAuth.getAdminPreview();
    if (preview && (preview.role === 'composer' || preview.role === 'fan')) {
      content.innerHTML = `<div class="card"><p class="hint">${esc(tr('previewMasked'))}</p></div>`;
      return;
    }
    content.innerHTML = `<div class="card">
      <h2>${esc(tr('activateTitle'))}</h2>
      <p class="hint">${esc(tr('activateHint'))}</p>
      <button class="btn primary" id="activateBtn" type="button">${esc(tr('activateBtn'))}</button>
      <div class="msg" id="activateMsg"></div>
    </div>`;
    $('activateBtn').onclick = async () => {
      $('activateBtn').disabled = true;
      const { error } = await LayerPitchAuth.ensureMyStudioProfile();
      if (error) { $('activateMsg').textContent = tr('errorPrefix', { message: error }); $('activateMsg').className = 'msg err'; $('activateBtn').disabled = false; return; }
      render();
    };
    return;
  }
  const [ent, flags] = await Promise.all([LayerPitchStudio.myEntitlements(), LayerPitchStudio.myFeatureFlags()]);
  state.ent = ent.entitlements || {};
  state.flags = flags.flags || {};
  if (!state.flags.studio_space) {
    content.innerHTML = `<div class="card"><h2>${esc(tr('comingSoonTitle'))}</h2><p class="hint">${esc(tr('comingSoonHint'))}</p>
      <p class="hint"><a href="./shop.html?tab=assets&lang=${pageLang}">${esc(tr('catalogLink'))}</a></p></div>`;
    return;
  }
  // Accueil (14/11, feu vert « studio_home ») : page d'arrivée par défaut, sauf si l'adresse demande un onglet (?tab=…) ou au retour de Stripe.
  // Feu vert fermé : l'onglet n'existe pas, on retombe sur « Mes achats ».
  if (!state.flags.studio_home && state.tab === 'home') state.tab = 'library';
  else if (state.flags.studio_home && !startTabAsked && !justSubscribed && !render.arrived) state.tab = 'home';
  render.arrived = true;
  $('pageTitle').textContent = tr('tab_' + state.tab);
  if (window.LayerPitchShell) window.LayerPitchShell.update(shellPlaces());
  const planEnt = Object.values(state.ent).find(e => e.kind === 'studio');
  const plan = planEnt ? planEnt.plan : 'solodev';
  content.innerHTML = `
    <div class="top" style="margin-bottom:12px"><span class="plan-badge">${esc(tr('planBadge', { plan: PLAN_NAMES[plan] || plan }))}${planEnt && planEnt.source !== 'plan' ? ' · ' + esc(tr('source_' + planEnt.source)) : ''}</span></div>
    <div id="panel"></div>`;
  await loadData();
  renderPanel();
}

async function loadData() {
  const [p, o, c, t] = await Promise.all([LayerPitchStudio.myTeamPurchases(), LayerPitchStudio.myOwnedAssets(), LayerPitchStudio.myCustomPacks(), LayerPitchStudio.myTeam()]);
  state.purchases = p.purchases || [];
  state.team = t.team || null;
  state.owned = o.assets || [];
  state.customPacks = c.customPacks || [];
}

// ---- Albums (vente d'OST, 29/09) : layerpitch-studio-albums.js ----
function renderAlbumsTab(panel) {
  if (!state.flags.sell_albums) { panel.innerHTML = `<div class="card"><h2>${esc(tr('comingSoonTitle'))}</h2><p class="hint">${esc(tr('alb_locked'))}</p></div>`; return; }
  // Morceaux dont le studio dispose (ceux de ses packs), uniques.
  const seen = new Set();
  const ownedTracks = state.owned.filter(a => a.kind === 'track' && !seen.has(a.id) && seen.add(a.id)).map(a => ({ id: a.id, title: a.title, packTitle: a.pack_title }));
  LayerPitchStudioAlbums.mount(panel, { tr, esc, lang: pageLang, ownedTracks, notify: window.LayerPitchNotify });
}

function renderPanel() {
  if (state.tab !== 'albums' && window.LayerPitchStudioAlbums) LayerPitchStudioAlbums.unmount();
  const panel = $('panel');
  if (state.tab === 'home') return renderHome(panel);
  if (state.tab === 'library') return renderLibrary(panel);
  if (state.tab === 'custom') return state.editing ? renderEditor(panel) : renderCustomList(panel);
  if (state.tab === 'albums') return renderAlbumsTab(panel);
  if (state.tab === 'video') return renderVideoTab(panel);
  if (state.tab === 'team') return renderTeam(panel);
  return renderPlan(panel);
}

// ---- Accueil (14/11, feu vert « studio_home », admin seulement jusqu'à ouverture) ----
// Page d'arrivée de l'Espace studio : salutation, « Que veux-tu faire aujourd'hui ? », boîte aux lettres (les mêmes messages que la cloche),
// puis des repères discrets : Continuer (derniers montages vidéo), Ton palier, Nouveautés, Réglages rapides. Rien n'est écrit en base : tout est lu
// dans ce qui existe déjà (palier, crédits, montages du studio, cloche). Pendant la bêta : CHAQUE nouveauté est validée par Jules-Antoine avant ajout.
const STUDIO_NEWS = [ // { date: 'AAAA-MM-JJ', fr: { title, text }, en: { title, text } }
  { date: '2026-11-12', fr: { title: 'Projets', text: "Réunis ton équipe autour d'un projet avec Moodboard, discussion et invités, pour piloter une production au même endroit." }, en: { title: 'Projects', text: 'Bring your team together around a project with a Moodboard, chat and guests, to run a production in one place.' } },
];
const homeState = { inbox: null, inboxWired: false, mailAll: false, montages: null, credits: null };
function homeChoicesHtml() {
  const btn = (act, key) => `<button class="btn" type="button" data-sh-do="${act}">${esc(tr(key))}</button>`;
  return [btn('catalog', 'sh_doCatalog'), btn('library', 'sh_doLibrary'), btn('custom', 'sh_doCustom'), btn('video', 'sh_doVideo'), btn('team', 'sh_doTeam'),
    state.flags.projects ? btn('projects', 'sh_doProjects') : '', state.flags.sell_albums ? btn('albums', 'sh_doAlbums') : ''].join('');
}
function homeMailHtml() {
  const items = homeState.inbox || [];
  const unread = items.filter(it => it.unread).length;
  const shown = homeState.mailAll ? items : items.slice(0, 3);
  const rel = iso => (window.LayerPitchShell && window.LayerPitchShell.relTime ? window.LayerPitchShell.relTime(iso) : '');
  const rows = shown.map((it, i) => `<${it.href ? `a href="${esc(it.href)}"` : 'div'} class="sh-mail-item${it.unread ? ' unread' : ''}" data-sh-mail="${i}">
      <span class="sh-dot" aria-hidden="true"></span>
      <span class="sh-mail-body"><span class="sh-mail-line"><b>${esc(it.title)}</b><small>${esc(rel(it.createdAt))}</small></span>${it.text ? `<span class="sh-mail-text">${esc(it.text)}</span>` : ''}</span>
    </${it.href ? 'a' : 'div'}>`).join('');
  const more = items.length > 3 ? `<button class="sh-link" type="button" data-sh-do="mail-toggle">${esc(tr(homeState.mailAll ? 'sh_mailLess' : 'sh_mailMore'))}</button>` : '';

// ---- Vidéos du studio (21/10, migration 20261021060000) ----
// Les membres d'un studio sont les parties d'une seule entité : un montage (outil « Capturer une prise » d'un pack acheté) appartient
// au STUDIO, tout membre le retouche, il reste au studio si son auteur part. Ses vidéos muettes et ses sons comptent dans le stockage
// du studio. Ici : la liste des montages (ouvrir dans l'outil, supprimer), la bibliothèque vidéo, le stockage et le nettoyage des historiques.
async function renderVideoTab(panel) {
  // Atelier vidéo (21/10) : l'outil de capture et de Versioning, au nom du studio (?studio=1), packs achetés par l'équipe. Même page que
  // dans le Backstage (atelier.html), dans un cadre. Les listes en dessous se redessinent seules après un enregistrement dans l'atelier
  // (message « changed »), sans recharger le cadre.
  panel.innerHTML = `<div class="card">
      <h2>${esc(tr('sv_atelierTitle'))}</h2>
      <p class="hint">${esc(tr('sv_atelierIntro'))}</p>
      <iframe id="svAtelier" class="atelier-frame" title="${esc(tr('sv_atelierTitle'))}" allow="autoplay; fullscreen" src="${esc(svAtelierUrl())}"></iframe>
    </div>
    <div id="svLists"><div class="card"><div class="empty">${esc(tr('sv_loading'))}</div></div></div>`;
  await renderVideoLists($('svLists'));
}
const svAtelierUrl = (packId, montageId) => './atelier.html?' + new URLSearchParams(Object.assign({ studio: '1', lang: pageLang }, packId ? { id: packId } : {}, montageId ? { montage: montageId } : {})).toString();
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.source !== 'lp-atelier' || e.data.type !== 'changed') return;
  const host = $('svLists');
  if (host) renderVideoLists(host);
});
async function renderVideoLists(host) {
  const client = window.LayerPitchSupabaseClient.getClient();
  const [caps, lib, hist] = await Promise.all([
    client.rpc('list_my_video_captures', { p_pack_id: null, p_studio: true }),
    client.rpc('list_my_videos', { p_studio: true }),
    client.rpc('my_video_history_usage', { p_studio: true }),
  ]);
  const montages = caps.data || [], videos = (lib.data && lib.data.videos) || [], usage = hist.data || { count: 0, bytes: 0 };
  const mo = n => (Number(n || 0) / 1048576).toFixed(1) + ' Mo';
  const quota = lib.data && lib.data.quotaGb != null ? tr('sv_storage', { used: (Number(lib.data.usedBytes || 0) / 1073741824).toFixed(2), quota: lib.data.quotaGb }) : '';
  host.innerHTML = `<div class="card">
      <h2>${esc(tr('sv_montagesTitle'))}</h2>
      <p class="hint">${esc(tr('sv_montagesIntro'))}</p>
      ${montages.length ? montages.map(c => `<div class="row"><div class="row-main"><div class="row-title">${esc(c.title || tr('sv_untitled'))}</div>
          <div class="row-sub">${esc(new Date(c.updatedAt).toLocaleDateString(pageLang))}${c.lastExportVideoId ? '' : ' — ' + esc(tr('sv_notPublished'))}</div></div>
          <div class="row-actions"><button class="btn" type="button" data-atelier-pack="${esc(c.packId)}" data-atelier-montage="${esc(c.id)}">${esc(tr('sv_open'))}</button>
          <button class="btn" type="button" data-delmontage="${esc(c.id)}">${esc(tr('sv_delete'))}</button></div></div>`).join('') : `<div class="empty">${esc(tr('sv_noMontages'))}</div>`}
    </div>
    <div class="card">
      <h2>${esc(tr('sv_libraryTitle'))}</h2>
      ${quota ? `<p class="hint">${esc(quota)}</p>` : ''}
      ${videos.length ? videos.map(v => `<div class="row"><div class="row-main"><div class="row-title">${esc(v.title || v.originalName || v.file)}</div><div class="row-sub">${esc(mo(v.sizeBytes))}</div></div>
          <div class="row-actions"><a class="btn" href="${esc(v.base + v.file)}" target="_blank" rel="noopener">${esc(tr('sv_view'))}</a></div></div>`).join('') : `<div class="empty">${esc(tr('sv_noVideos'))}</div>`}
      ${usage.count ? `<div class="row"><div class="row-main"><div class="row-sub">${esc(tr('sv_history', { n: usage.count, size: mo(usage.bytes) }))}</div></div>
          <div class="row-actions"><button class="btn" type="button" id="svClearHistory">${esc(tr('sv_clearHistory'))}</button></div></div>` : ''}
      <div class="msg" id="svMsg"></div>
    </div>`;
  const dropFiles = async removed => {
    for (const r of (removed || [])) {
      try {
        const { data } = await client.functions.invoke('create-media-signed-url', { body: { path: r.path, method: 'DELETE', asStudio: true } });
        if (data && data.url && !data.kept) await fetch(data.url, { method: 'DELETE' });
      } catch (e) { console.warn('effacement ' + r.path, e); }
    }
  };
  host.querySelectorAll('[data-atelier-montage]').forEach(b => b.onclick = () => {
    const frame = $('svAtelier');
    frame.src = svAtelierUrl(b.dataset.atelierPack, b.dataset.atelierMontage);
    if (frame.scrollIntoView) frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  host.querySelectorAll('[data-delmontage]').forEach(b => b.onclick = async () => {
    if (!(await window.LayerPitchNotify.confirm(tr('sv_deleteConfirm'), { danger: true }))) return;
    const { error } = await client.rpc('delete_video_capture', { p_id: b.dataset.delmontage, p_studio: true });
    if (error) return window.LayerPitchNotify.error(error.message);
    renderVideoLists(host);
  });
  const clr = $('svClearHistory');
  if (clr) clr.onclick = async () => {
    if (!(await window.LayerPitchNotify.confirm(tr('sv_clearConfirm'), { danger: true }))) return;
    const { data, error } = await client.rpc('clear_video_export_history', { p_studio: true });
    if (error) return window.LayerPitchNotify.error(error.message);
    await dropFiles(data && data.removed);
    renderVideoLists(host);
  };
}

function customQuota() { return state.ent.custom_packs || { allowed: false, amount: 0 }; }
function renderCustomList(panel) {
  const q = customQuota();
  const used = state.customPacks.length;
  const full = !q.allowed || (q.amount != null && used >= q.amount);
  let html = `<div class="card">
    <div class="top" style="margin-bottom:6px">
      <h2 style="margin:0">${esc(tr('customTitle'))}</h2>
      <span class="plan-badge">${esc(tr('customUsed', { used, max: q.amount == null ? '∞' : q.amount }))}</span>
    </div>
    <p class="hint">${esc(tr('customIntro'))}</p>
    <button class="btn primary" id="newCustomBtn" type="button" ${full || !state.owned.length ? 'disabled' : ''}>${esc(tr('customNew'))}</button>
    ${full && q.allowed ? `<p class="hint" style="margin-top:8px">${esc(tr('customLimitHint'))}</p>` : ''}
    ${!state.owned.length ? `<p class="hint" style="margin-top:8px">${esc(tr('customNeedsPurchase'))}</p>` : ''}
    <div class="msg" id="customMsg"></div>
  </div>`;
  if (state.customPacks.length) {
    html += `<div class="card">${state.customPacks.map(c => `
      <div class="row" data-id="${esc(c.id)}">
        <div class="row-main"><div class="row-title">${esc(c.name || tr('customUntitled'))}</div>
          <div class="row-sub">${esc(tr('customCount', { n: c.items.length }))}</div></div>
        <div class="row-actions">
          <button class="btn" data-act="play" type="button">${esc(state.playing === c.id ? tr('customHide') : tr('customListen'))}</button>
          <button class="btn" data-act="edit" type="button">${esc(tr('customEdit'))}</button>
          <button class="btn" data-act="duplicate" type="button" ${full ? 'disabled' : ''}>${esc(tr('customDuplicate'))}</button>
          <button class="btn danger" data-act="delete" type="button">${esc(tr('customDelete'))}</button>
        </div>
        ${state.playing === c.id ? `<div class="player-box" style="flex-basis:100%" id="player-${esc(c.id)}"></div>` : ''}
      </div>`).join('')}</div>`;
  }
  panel.innerHTML = html;
  $('newCustomBtn').onclick = () => { state.editing = { id: null, name: '', items: [] }; renderPanel(); };
  panel.querySelectorAll('.row[data-id]').forEach(row => {
    const c = state.customPacks.find(x => x.id === row.dataset.id);
    row.querySelector('[data-act="play"]').onclick = () => { stopPlayback(); state.playing = state.playing === c.id ? null : c.id; renderPanel(); if (state.playing) mountPlayers(c); };
    row.querySelector('[data-act="edit"]').onclick = () => { stopPlayback(); state.editing = JSON.parse(JSON.stringify(c)); renderPanel(); };
    row.querySelector('[data-act="duplicate"]').onclick = async () => {
      const r = await LayerPitchStudio.saveCustomPack({ name: tr('customCopyOf', { name: c.name || tr('customUntitled') }), items: c.items });
      if (!r.ok) { $('customMsg').textContent = tr('errorPrefix', { message: r.error }); $('customMsg').className = 'msg err'; return; }
      await loadData(); renderPanel();
    };
    row.querySelector('[data-act="delete"]').onclick = async () => {
      const ok = await window.LayerPitchNotify.confirm(tr('customDeleteConfirm', { name: c.name || tr('customUntitled') }), { okLabel: tr('customDelete'), danger: true });
      if (!ok) return;
      const r = await LayerPitchStudio.deleteCustomPack(c.id);
      if (!r.ok) { $('customMsg').textContent = tr('errorPrefix', { message: r.error }); $('customMsg').className = 'msg err'; return; }
      if (state.playing === c.id) { stopPlayback(); state.playing = null; }
      await loadData(); renderPanel();
    };
  });
  if (state.playing) { const c = state.customPacks.find(x => x.id === state.playing); if (c) mountPlayers(c); }
}

const ownedKey = (kind, id) => kind + ':' + id;
function ownedLabel(kind, id) { const o = state.owned.find(a => a.kind === kind && a.id === id); return o ? o.title : id; }
function renderEditor(panel) {
  const ed = state.editing;
  const inPack = new Set(ed.items.map(i => ownedKey(i.kind, i.refId)));
  const byPack = {};
  state.owned.forEach(a => { if (!inPack.has(ownedKey(a.kind, a.id))) (byPack[a.pack_title] = byPack[a.pack_title] || []).push(a); });
  panel.innerHTML = `<div class="card">
    <h2>${esc(ed.id ? tr('customEditTitle') : tr('customNewTitle'))}</h2>
    <label>${esc(tr('customNameLabel'))}</label>
    <input type="text" id="edName" maxlength="120" value="${esc(ed.name)}" placeholder="${esc(tr('customNamePlaceholder'))}">
    <div class="section-label">${esc(tr('customItemsLabel'))}</div>
    <div id="edItems">${ed.items.length ? ed.items.map((it, i) => `
      <div class="item-row">
        <span class="item-kind">${esc(tr('kind_' + it.kind))}</span>
        <span class="item-name">${esc(ownedLabel(it.kind, it.refId))}</span>

        <button class="icon-btn" data-up="${i}" type="button" ${i === 0 ? 'disabled' : ''} aria-label="${esc(tr('moveUp'))}">↑</button>
        <button class="icon-btn" data-down="${i}" type="button" ${i === ed.items.length - 1 ? 'disabled' : ''} aria-label="${esc(tr('moveDown'))}">↓</button>
        <button class="icon-btn" data-remove="${i}" type="button" aria-label="${esc(tr('customRemove'))}">✕</button>
      </div>`).join('') : `<div class="empty">${esc(tr('customItemsEmpty'))}</div>`}</div>
    <label>${esc(tr('customAddLabel'))}</label>
    <select id="edAdd"><option value="">${esc(tr('customAddPlaceholder'))}</option>
      ${Object.keys(byPack).map(p => `<optgroup label="${esc(p)}">${byPack[p].map(a => `<option value="${esc(ownedKey(a.kind, a.id))}">${esc(tr('kind_' + a.kind))} — ${esc(a.title)}</option>`).join('')}</optgroup>`).join('')}
    </select>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      <button class="btn primary" id="edSave" type="button">${esc(tr('customSave'))}</button>
      <button class="btn" id="edCancel" type="button">${esc(tr('cancel'))}</button>
    </div>
    <div class="msg" id="edMsg"></div>
  </div>`;
  $('edName').oninput = e => { ed.name = e.target.value; };
  panel.querySelectorAll('[data-label]').forEach(inp => inp.oninput = e => { ed.items[+inp.dataset.label].label = e.target.value; });
  const move = (i, d) => { const j = i + d; [ed.items[i], ed.items[j]] = [ed.items[j], ed.items[i]]; renderPanel(); };
  panel.querySelectorAll('[data-up]').forEach(b => b.onclick = () => move(+b.dataset.up, -1));
  panel.querySelectorAll('[data-down]').forEach(b => b.onclick = () => move(+b.dataset.down, 1));

  $('edAdd').onchange = e => {
    const v = e.target.value; if (!v) return;

  $('edSave').onclick = async () => {
    $('edSave').disabled = true; $('edMsg').textContent = '…'; $('edMsg').className = 'msg';
    const r = await LayerPitchStudio.saveCustomPack({ id: ed.id || undefined, name: ed.name.trim() || tr('customUntitled'), items: ed.items.map(i => ({ kind: i.kind, refId: i.refId, label: i.label || '' })) });
    if (!r.ok) { $('edMsg').textContent = tr('errorPrefix', { message: r.error }); $('edMsg').className = 'msg err'; $('edSave').disabled = false; return; }
    state.editing = null;
    await loadData(); renderPanel();
  };
}

// Écoute d'un pack custom : le lecteur du site public (player.js), morceaux puis Sfx déclenchables à la main
// (extensions-roadmap.md §5.3 : pas de timeline, les Sfx se jouent librement pendant que la musique tourne).
function stopPlayback() {
  if (!state.playing) return;
  const c = state.customPacks.find(x => x.id === state.playing);
  if (c) c.items.filter(i => i.kind === 'track').forEach(i => document.dispatchEvent(new CustomEvent('stop-track', { detail: i.refId })));
}
async function mountPlayers(c) {
  const host = $('player-' + c.id);
  if (!host) return;
  host.innerHTML = `<div class="empty">${esc(tr('loading'))}</div>`;
  const trackIds = c.items.filter(i => i.kind === 'track').map(i => i.refId);
  const sfxIds = c.items.filter(i => i.kind === 'sfx').map(i => i.refId);
  const [t, s] = await Promise.all([LayerPitchTracks.listTracksByIds(trackIds), LayerPitchSfx.listSfxByIds(sfxIds)]);
  if (t.error || s.error) { host.innerHTML = `<div class="msg err">${esc(tr('errorPrefix', { message: t.error || s.error }))}</div>`; return; }
  host.innerHTML = '';
  const P = window.LayerPlayerCore;
  if (trackIds.length) host.insertAdjacentHTML('beforeend', `<div class="section-label">${esc(tr('customMusic'))}</div>`);
  trackIds.forEach(id => {
    const track = (t.tracks || []).find(x => x.id === id); if (!track) return;
    const row = P.buildTrackRow(track, null, false);
    host.appendChild(row);
    P.initTrackPlayer(track, row);
  });
  if (sfxIds.length) host.insertAdjacentHTML('beforeend', `<div class="section-label">${esc(tr('customSfx'))}</div>`);
  c.items.filter(i => i.kind === 'sfx').forEach(i => {
    const sfx = (s.sfx || []).find(x => x.id === i.refId); if (!sfx) return;
    host.appendChild(P.buildSfxPlayer(i.label ? Object.assign({}, sfx, { title: i.label }) : sfx));
  });
}

// ---- Équipe (étape 5a, 28/09 ; D14, D37) : propriétaire + membres égaux ; seul le propriétaire invite, retire et transfère. ----
function renderTeam(panel) {
  const t = state.team;
  if (!t) { panel.innerHTML = `<div class="card"><div class="empty">${esc(tr('teamUnavailable'))}</div></div>`; return; }
  const used = 1 + t.members.length;
  const full = t.quota != null && used >= t.quota;
  panel.innerHTML = `<div class="card">
    <div class="top" style="margin-bottom:6px"><h2 style="margin:0">${esc(tr('teamTitle'))}</h2>
      <span class="plan-badge">${esc(tr('customUsed', { used, max: t.quota == null ? '∞' : t.quota }))}</span></div>
    <p class="hint">${esc(tr('teamIntro'))}</p>
    <div class="row"><div class="row-main"><div class="row-title">${esc(t.owner.email || '')}${t.owner.me ? ' ' + esc(tr('teamYou')) : ''}</div><div class="row-sub">${esc(tr('teamOwner'))}</div></div></div>
    ${t.members.map(m => `<div class="row" data-member="${esc(m.id)}">
      <div class="row-main"><div class="row-title">${esc(m.email)}${m.me ? ' ' + esc(tr('teamYou')) : ''}</div>
        <div class="row-sub">${esc(tr(m.status === 'active' ? 'teamActive' : 'teamInvited'))}</div></div>
      <div class="row-actions">
        ${t.isOwner && m.status === 'invited' ? `<button class="btn" data-act="resend" type="button">${esc(tr('teamResend'))}</button>` : ''}
        ${t.isOwner && m.status === 'active' ? `<button class="btn" data-act="transfer" type="button">${esc(tr('teamTransfer'))}</button>` : ''}
        ${t.isOwner || m.me ? `<button class="btn danger" data-act="remove" type="button">${esc(tr(m.me ? 'teamLeave' : 'teamRemove'))}</button>` : ''}
      </div></div>`).join('')}
    ${t.isOwner ? `
      <label>${esc(tr('teamInviteLabel'))}</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="email" id="teamEmail" placeholder="${esc(tr('emailPlaceholder'))}" style="flex:1 1 220px" ${full || !t.allowed ? 'disabled' : ''}>
        <button class="btn primary" id="teamInviteBtn" type="button" ${full || !t.allowed ? 'disabled' : ''}>${esc(tr('teamInviteBtn'))}</button></div>
      ${full ? `<p class="hint" style="margin-top:8px">${esc(tr('teamLimitHint'))}</p>` : ''}` : `<p class="hint" style="margin-top:10px">${esc(tr('teamMemberHint'))}</p>`}
    <div class="msg" id="teamMsg"></div>
  </div>`;
  const msg = (text, ok) => { $('teamMsg').textContent = text; $('teamMsg').className = 'msg ' + (ok ? 'ok' : 'err'); };
  const redirect = location.origin + '/invitation.html';
  const reload = async () => { const r = await LayerPitchStudio.myTeam(); state.team = r.team; renderPanel(); };
  const inviteBtn = $('teamInviteBtn');
  if (inviteBtn) inviteBtn.onclick = async () => {
    const email = $('teamEmail').value.trim(); if (!email) return;
    inviteBtn.disabled = true;
    const r = await LayerPitchStudio.inviteTeamMember(email, redirect);
    await reload();
    if (!r.ok) msg(tr('errorPrefix', { message: r.error }), false);
    else if (r.emailError) msg(tr('teamInviteNoEmail', { error: r.emailError, link: r.actionLink || '' }), false);
    else msg(tr('teamInviteSent'), true);
  };
  panel.querySelectorAll('[data-member]').forEach(row => {
    const id = row.dataset.member, m = t.members.find(x => x.id === id);
    const b = act => row.querySelector(`[data-act="${act}"]`);
    if (b('resend')) b('resend').onclick = async () => { const r = await LayerPitchStudio.resendTeamInvitation(id, redirect); msg(r.ok ? tr('teamInviteSent') : tr('teamInviteNoEmail', { error: r.error, link: r.actionLink || '' }), r.ok); };
    if (b('transfer')) b('transfer').onclick = async () => {
      if (!(await window.LayerPitchNotify.confirm(tr('teamTransferConfirm', { email: m.email }), { okLabel: tr('teamTransfer') }))) return;
      const r = await LayerPitchStudio.transferOwnership(id); if (!r.ok) return msg(tr('errorPrefix', { message: r.error }), false); render();
    };
    if (b('remove')) b('remove').onclick = async () => {
      if (!(await window.LayerPitchNotify.confirm(tr(m.me ? 'teamLeaveConfirm' : 'teamRemoveConfirm', { email: m.email }), { okLabel: tr(m.me ? 'teamLeave' : 'teamRemove'), danger: true }))) return;
      const r = await LayerPitchStudio.removeTeamMember(id); if (!r.ok) return msg(tr('errorPrefix', { message: r.error }), false);
      if (m.me) { render(); return; } await reload();
    };
  });
}

// ---- Mon palier ----
function renderPlan(panel) {
  const e = state.ent;
  const lines = [
    ['team_members', 'planMembers'], ['monthly_credits', 'planCredits'], ['custom_packs', 'planCustomPacks'],
    ['studio_test_in_game', 'planTestInGame'], ['saved_montages', 'planMontages'], ['studio_versioning', 'planVersioning'],
    ['studio_projects', 'planProjects'], ['studio_commission_rate', 'planCommission'],
  ];
  panel.innerHTML = `<div class="card">
    <h2>${esc(tr('planTitle'))}</h2>
    <p class="hint">${esc(tr('planIntro'))}</p>
    <dl class="quota">${lines.map(([f, k]) => {
      const x = e[f];
      const val = f === 'studio_commission_rate' ? (x && x.amount != null ? Math.round(x.amount * 100) + ' %' : '—')
        : f === 'studio_no_watermark' ? '' : quotaText(x);
      return `<dt>${esc(tr(k))}</dt><dd>${esc(val)}</dd>`;
    }).join('')}
      <dt>${esc(tr('planWatermark'))}</dt><dd>${esc(e.studio_no_watermark && e.studio_no_watermark.allowed ? tr('no') : tr('yes'))}</dd>
    </dl>
  </div>
  <div class="card" id="creditsCard"><h2>${esc(tr('creditsTitle'))}</h2><div class="empty">${esc(tr('loading'))}</div></div>
  <div class="card" id="upgradeCard"></div>`;
  renderCredits();
  renderUpgrade();
}
// Crédits (D15, D18) : solde de l'équipe, dotation mensuelle, historique ; les packs se prennent depuis le catalogue.
async function renderCredits() {
  const box = $('creditsCard'); if (!box) return;
  const { credits } = await LayerPitchStudio.myCredits();
  // Les crédits arrivent par le webhook Stripe, parfois quelques secondes après le retour sur la page : on relit une fois.
  if (justSubscribed && !renderCredits.retried) { renderCredits.retried = true; setTimeout(renderCredits, 6000); }
  const notice = justSubscribed ? `<p class="msg ok">${esc(tr('subscribedNotice'))}</p>` : '';
  if (!credits) { box.innerHTML = `<h2>${esc(tr('creditsTitle'))}</h2><p class="hint">${esc(tr('creditsUnavailable'))}</p>`; return; }
  box.innerHTML = `<h2>${esc(tr('creditsTitle'))}</h2>${notice}
    <p class="hint">${esc(tr('creditsIntro'))}</p>
    <div class="quota"><dt>${esc(tr('creditsBalance'))}</dt><dd>${esc(credits.balance)}</dd><dt>${esc(tr('creditsMonthly'))}</dt><dd>${esc(credits.monthly == null ? '—' : credits.monthly)}</dd></div>
    <p class="hint" style="margin-top:10px"><a href="./shop.html?tab=assets&lang=${pageLang}">${esc(tr('creditsUseInCatalog'))}</a></p>
    ${credits.history.length ? `<div class="section-label">${esc(tr('creditsHistory'))}</div>` + credits.history.map(h => `<div class="row"><div class="row-main"><div class="row-sub">${esc(new Date(h.createdAt).toLocaleDateString(pageLang))} — ${esc(tr('credit_' + h.reason, { pack: h.packTitle || '', who: h.actorEmail || '' }))}</div></div><div class="row-actions" style="font-family:var(--font-mono)">${h.delta > 0 ? '+' : ''}${esc(h.delta)}</div></div>`).join('') : ''}`;
}
// Palier (D16) : Indie / AA en libre-service (propriétaire seulement), AAA sur devis.
async function renderUpgrade() {
  const box = $('upgradeCard'); if (!box) return;
  const team = state.team;
  const isOwner = !team || team.isOwner;
  const { billing } = await LayerPitchSubscriptions.myBilling();
  const sub = billing && billing.studio;
  // Retour du portail : le changement (résiliation, palier) arrive par le webhook Stripe, parfois quelques secondes après.
  if (fromPortal && !renderUpgrade.retried) { renderUpgrade.retried = true; setTimeout(() => { renderUpgrade(); renderCredits(); }, 5000); }
  // Abonnement en cours : un seul abonnement par studio ; changer de palier, résilier, carte et reçus passent par le
  // portail client Stripe (28/09). Sinon : souscrire (Indie / AA en libre-service, AAA sur devis).
  if (sub && sub.active) {
    const cancelLine = sub.cancelAt ? `<p class="hint">${esc(tr('subscriptionEnds', { date: new Date(sub.cancelAt).toLocaleDateString(pageLang) }))}</p>` : '';
    box.innerHTML = `<h2>${esc(tr('subscriptionCardTitle'))}</h2>
      <p class="hint">${esc(tr('subscriptionCurrent', { plan: PLAN_NAMES[sub.plan] || sub.plan }))} <a href="./tarifs.html?lang=${pageLang}" target="_blank" rel="noopener">${esc(tr('pricingLink'))}</a></p>
      ${cancelLine}
      ${sub.canManage ? `<button class="btn primary" type="button" id="manageBtn">${esc(tr('manageSubscription'))}</button>
        <p class="hint" style="margin-top:8px">${esc(tr('manageSubscriptionHint'))}</p>` : `<p class="hint">${esc(tr('upgradeOwnerOnly'))}</p>`}
      <div class="msg" id="upgradeMsg"></div>`;
    const mb = $('manageBtn');
    if (mb) mb.onclick = async () => {
      mb.disabled = true;
      const r = await LayerPitchSubscriptions.openBillingPortal('studio', location.origin + '/studio.html?tab=plan&portal=1' + (pageLang === 'en' ? '&lang=en' : ''));
      if (!r.ok) { $('upgradeMsg').textContent = tr('errorPrefix', { message: r.error }); $('upgradeMsg').className = 'msg err'; mb.disabled = false; }
    };
    return;
  }
  box.innerHTML = `<h2>${esc(tr('upgradeTitle'))}</h2><p class="hint">${esc(tr('upgradeIntro'))} <a href="./tarifs.html?lang=${pageLang}" target="_blank" rel="noopener">${esc(tr('pricingLink'))}</a></p>
    ${isOwner ? `<div style="display:flex;flex-wrap:wrap;gap:8px">
      ${['indie', 'aa'].map(p => `<button class="btn primary" type="button" data-plan="${p}" data-interval="month">${esc(tr('upgradeTo', { plan: PLAN_NAMES[p], period: tr('monthly') }))}</button>
        <button class="btn" type="button" data-plan="${p}" data-interval="year">${esc(tr('upgradeTo', { plan: PLAN_NAMES[p], period: tr('yearly') }))}</button>`).join('')}
      <a class="btn" href="mailto:contact@layerpitch.com?subject=LayerPitch%20AAA">${esc(tr('aaaContact'))}</a></div>` : `<p class="hint">${esc(tr('upgradeOwnerOnly'))}</p>`}
    <div class="msg" id="upgradeMsg"></div>`;
  box.querySelectorAll('[data-plan]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const r = await LayerPitchSubscriptions.subscribeToPlan(b.dataset.plan, b.dataset.interval, { role: 'studio', successUrl: location.origin + '/studio.html?subscribed=1', cancelUrl: location.href });
    if (!r.ok) { $('upgradeMsg').textContent = tr('errorPrefix', { message: r.error }); $('upgradeMsg').className = 'msg err'; b.disabled = false; }
  });
}

window.LayerPitchShell && window.LayerPitchShell.mount(shellPlaces());
// Appelé tout de suite avec l'état courant, puis à chaque évènement de connexion. On ne redessine que si le COMPTE change (connexion,
// déconnexion, autre compte) : un simple rafraîchissement de session -- que l'atelier vidéo, chargé dans un cadre de cette page, provoque
// lui-même en se connectant -- redessinait tout, rechargeait l'atelier, qui en provoquait un autre… l'image sautait en boucle (21/10).
let lastAuthUserId;
LayerPitchAuth.onAuthStateChange((_event, session) => {
  const userId = (session && session.user && session.user.id) || null;
  if (userId === lastAuthUserId) return;
  lastAuthUserId = userId;
  render();
});
</script>
