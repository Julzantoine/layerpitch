<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- Adresse jolie /vitrine/<nom> (404.html) : les ressources relatives se résolvent depuis la racine du site. -->
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LayerPitch</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="player.css?v=1790711129023">
<link rel="stylesheet" href="reel.css?v=1790711129023">
<style>
  /* Propre aux vitrines (le reste vient de reel.css, comme un AdReel). */
  .vitrine-notice { max-width: 760px; margin: 0 auto 18px; padding: 8px 14px; border-radius: 8px; background: var(--bg-card, #fff); border: 1px dashed var(--border); font-size: 13px; color: var(--text); }
  .vitrine-foot { text-align: center; font-size: 12px; color: var(--text-dimmer, #9a9ea6); margin: 48px 0 24px; }
  .vitrine-foot a { color: inherit; }
  /* Diapositives : un bloc par page plein écran, défilement aimanté, flèches et clavier. */
  html.slides, html.slides body { height: 100%; }
  html.slides body { overflow: hidden; padding: 0; }
  html.slides .page { max-width: none; margin: 0; padding: 0; }
  html.slides #blocksContainer { height: 100vh; overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
  html.slides #blocksContainer > * { min-height: 100vh; scroll-snap-align: start; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center;
    padding: 48px max(24px, calc((100vw - 900px) / 2)); margin: 0; border: 0; }
  .slides-nav { position: fixed; right: 18px; bottom: 18px; display: none; gap: 8px; z-index: 50; }
  html.slides .slides-nav { display: flex; }
  .slides-nav button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-card, #fff); color: var(--text); font-size: 18px; cursor: pointer; }
  .slides-count { position: fixed; left: 18px; bottom: 26px; font-size: 12px; color: var(--text-dimmer, #9a9ea6); display: none; z-index: 50; }
  html.slides .slides-count { display: block; }
</style>
</head>
<body>
<div class="page">
  <div id="notice"></div>
  <div id="blocksContainer"><div class="empty">…</div></div>
  <div class="vitrine-foot" id="foot"></div>
</div>
<div class="slides-nav"><button type="button" id="prevSlide" aria-label="Précédent">↑</button><button type="button" id="nextSlide" aria-label="Suivant">↓</button></div>
<div class="slides-count" id="slidesCount"></div>
<script src="https://unpkg.com/@wasm-audio-decoders/ogg-vorbis/dist/ogg-vorbis-decoder.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="layerpitch-i18n.js?v=1790711129023"></script>
<script src="public-page.js?v=1790711129023"></script>
<script src="player.js?v=1790711129023"></script>
<script src="layerpitch-social-icons.js?v=1790711129023"></script>
<script src="reel.js?v=1790711129023"></script>
<script src="api/supabase-client.js?v=1790711129023"></script>
<script src="api/tracks.js?v=1790711129023"></script>
<script src="api/projects.js?v=1790711129023"></script>
<script>
// vitrine.html — vitrine d'un Projet (espace Projet, étape 6, 28/09 ; cadrage 2026-09-28-cadrage-reserve-projet-et-vitrines.md
// §4 et §8). Même moteur d'affichage que les AdReels (reel.js : thème, blocs, apparence), données du Projet :
//   /vitrine/<nom>          vitrine PUBLIQUE publiée (joueurs) — jamais de compte demandé ;
//   vitrine.html?k=<secret> vitrine ÉDITEUR (lien secret révocable, sans compte), publiée ou non ;
//   vitrine.html?id=<id>    aperçu d'un brouillon pour un membre du Projet connecté.
// Les fichiers privés du Projet (images, captures, ébauches audio) sont lus par URL signée (project-file-url), accordée
// seulement s'ils figurent dans une vitrine publiée ou dans celle dont on présente le lien secret.
const params = new URLSearchParams(location.search);
if (params.get('__pretty')) { try { history.replaceState(null, '', params.get('__pretty')); } catch (e) {} }
let pageLang = params.get('lang') === 'en' ? 'en' : 'fr';
function currentLang() { return pageLang; }
function tr(key, vars) {
  const I18N = window.LAYERPITCH_I18N || { fr: {}, en: {} };
  const d = I18N[pageLang] || I18N.fr, f = I18N.fr || {};
  let s = (d.index && d.index[key]) || (d.projects && d.projects[key]) || (d.shared && d.shared[key])
    || (f.index && f.index[key]) || (f.projects && f.projects[key]) || (f.shared && f.shared[key]) || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
const { section, escapeHtml, linkify } = window.LayerPlayerCore;
window.LayerPlayerCore.setLang(pageLang);
const IMAGES_BASE = 'https://media.layerpitch.com/images/';
// Images : fichier du Projet (« vf:<id> », URL signée résolue avant l'affichage), adresse complète (vignette d'un
// service), sinon média public LayerPitch (illustrations des packs).
const signedUrls = {};
function resolveImageUrl(file) {
  if (!file) return '';
  if (String(file).startsWith('vf:')) return signedUrls[file.slice(3)] || '';
  if (/^https:\/\//.test(file)) return file;
  return IMAGES_BASE + file;
}
function openLightbox(urls, index) { if (urls[index]) window.open(urls[index], '_blank', 'noopener'); }
const container = document.getElementById('blocksContainer');
const slug = params.get('s'), token = params.get('k'), previewId = params.get('id');

async function loadPacks(ids) {
  if (!ids.length) return {};
  try {
    const { data } = await window.LayerPitchSupabaseClient.getClient().from('packs').select('id, title, illustration').in('id', ids);
    return Object.fromEntries((data || []).map(p => [p.id, p]));
  } catch (e) { return {}; }
}

(async () => {
  window.__lpTrackContext = { type: 'vitrine', id: slug || token || previewId || '', sessionId: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) };
  const { data: v, error } = await window.LayerPitchProjects.getVitrine({ slug, token, id: previewId });
  if (error || !v) { container.innerHTML = `<div class="empty">${escapeHtml(tr('showcaseUnavailable'))}</div>`; return; }
  document.title = v.title || v.projectTitle || 'LayerPitch';
  const assets = v.assets || {};
  // Fichiers privés : URL signées, en parallèle, avant l'affichage.
  const fileIds = [...new Set(Object.values(assets).map(a => a.fileId).filter(Boolean))];
  await Promise.all(fileIds.map(async id => { const r = await window.LayerPitchProjects.fileUrl(id, token || undefined); if (!r.error && r.data) signedUrls[id] = r.data; }));
  // Blocs de la vitrine (objets de la réserve) -> blocs d'AdReel que le moteur sait afficher.
  const trackIds = [], packIds = [];
  const blocks = [];
  (v.blocks || []).forEach((b, i) => {
    const list = (b.assetIds || []).map(id => Object.assign({ id }, assets[id])).filter(a => a.kind);
    const id = b.id || 'b' + i;
    if (b.type === 'tracks') {
      const ids = list.filter(a => a.kind === 'track' && a.trackId).map(a => a.trackId);
      trackIds.push(...ids);
      if (ids.length) blocks.push({ id, type: 'tracks', trackIds: ids, appearance: b.appearance });
      const files = list.filter(a => a.kind === 'audio' && signedUrls[a.fileId]).map(a => ({ title: a.title, url: signedUrls[a.fileId] }));
      if (files.length) blocks.push({ id: id + '-audio', type: 'audio', files, appearance: b.appearance });
    } else if (b.type === 'video') {
      blocks.push({ id, type: 'video', appearance: b.appearance, videos: list.map(a => a.fileId
        ? { title: a.title, source: 'library', url: signedUrls[a.fileId] || '' }
        : { title: a.title || (a.preview && a.preview.title) || '', url: a.url, thumbnail: (a.preview && a.preview.thumbnail) || null }) });
    } else if (b.type === 'photo') {
      blocks.push({ id, type: 'photo', align: b.align, caption: b.caption, appearance: b.appearance, images: list.filter(a => a.fileId).map(a => ({ file: 'vf:' + a.fileId })) });
    } else if (b.type === 'packs') {
      const ids = list.filter(a => a.packId).map(a => a.packId); packIds.push(...ids);
      blocks.push({ id, type: 'packs', packIds: ids, presentation: b.presentation || '', appearance: b.appearance });
    } else blocks.push(b); // header, text, links : même format que l'AdReel
  });
  const [tracksRes, packsById] = await Promise.all([
    trackIds.length ? window.LayerPitchTracks.listTracksByIds([...new Set(trackIds)]) : Promise.resolve({ tracks: [] }),
    loadPacks([...new Set(packIds)]),
  ]);
  const libraryById = Object.fromEntries((tracksRes.tracks || []).map(t => [t.id, t]));
  const logo = v.logoAssetId && assets[v.logoAssetId] && assets[v.logoAssetId].fileId ? 'vf:' + assets[v.logoAssetId].fileId : null;
  // Image de fond : une image du Projet (bgAssetId), lue par URL signée comme le logo.
  const bgFile = v.bgAssetId && assets[v.bgAssetId] && assets[v.bgAssetId].fileId;
  const themeIn = Object.assign({}, v.theme || {}, bgFile ? { bgImage: 'vf:' + bgFile } : {});
  const profile = { title: v.title, subtitle: v.subtitle, logo, theme: Object.keys(themeIn).length ? themeIn : null };
  // Apparence complète pour toutes les vitrines (décision Q8 du 28/09) : même rendu que le palier le plus haut.
  const tier = 'pro';
  container.innerHTML = '';
  const { theme, separator } = reelResolveTheme(profile, tier);
  reelApplyTheme(theme, separator, container, { tier, blocks, customFonts: [] });
  window.LayerPlayerCore.setSeqMapDensity('roomy');
  // Bloc Contact : le message du visiteur arrive dans la discussion du Projet (submit_vitrine_message).
  const onContactSubmit = async ({ name, email, message }) => {
    const { error } = await window.LayerPitchSupabaseClient.getClient().rpc('submit_vitrine_message', { p_vitrine_id: v.id, p_name: name, p_email: email, p_message: message, p_token: token || null });
    return error ? { ok: false, error: error.message } : { ok: true };
  };
  reelRenderBlocks(container, blocks, { profile, tier, customFonts: [], libraryById, packsByTrackId: {}, packsById, collectionsById: {}, sfxById: {}, socials: [], onContactSubmit });
  if (!v.published) document.getElementById('notice').innerHTML = `<div class="vitrine-notice">${escapeHtml(tr(v.audience === 'publisher' ? 'vitrineSecretNotice' : 'showcaseDraftNotice'))}</div>`;
  // Mention « Présenté avec LayerPitch » : toujours, discrète (décision Q9).
  document.getElementById('foot').innerHTML = `${escapeHtml(tr('showcaseFooter'))} <a href="https://layerpitch.com" target="_blank" rel="noopener">LayerPitch</a>`;
  if (v.display === 'slides') setupSlides();
  startVitrineStats(v.id);
})();

// Statistiques (étape 6b, décision Q10) : ouverture, écoutes et autres actions du lecteur (mêmes événements que sur un
// AdReel, relayés par le lecteur via « layerpitch-capture-mark »), clics sur les liens. Identifiant de visite aléatoire,
// type d'appareil : aucune donnée personnelle. Les visites des membres du Projet ne comptent pas (serveur).
const VITRINE_EVENTS = new Set(['track_play', 'track_stop', 'intensity_change', 'seq_branch_select', 'go_to_end_click', 'go_to_next_section_click', 'stinger_play', 'fx_trigger', 'social_click']);
function startVitrineStats(vitrineId) {
  const ctx = window.__lpTrackContext;
  const device = typeof lpDeviceType === 'function' ? lpDeviceType() : null;
  const send = (name, detail) => { try { window.LayerPitchProjects.logVitrineEvent(vitrineId, ctx.sessionId, name, detail || {}, device); } catch (e) { /* jamais bloquant */ } };
  send('page_open');
  document.addEventListener('layerpitch-capture-mark', e => {
    const d = e.detail || {};
    if (VITRINE_EVENTS.has(d.name)) send(d.name, { trackId: d.detail && d.detail.trackId || null });
  });
  container.addEventListener('click', e => {
    const a = e.target.closest('a.links-list-item');
    if (a) send('link_click', { label: a.textContent.slice(0, 80) });
  });
}

// Diapositives : une page par bloc ; flèches, clavier (↓ ↑, Page suivante/précédente, espace), compteur.
function setupSlides() {
  document.documentElement.classList.add('slides');
  const slides = () => [...container.children];
  // Diapositive courante : celle dont le haut est le plus proche du haut de l'écran (une diapositive peut être plus
  // haute que l'écran, on ne compte donc pas en « hauteurs d'écran »).
  const current = () => { const top = container.getBoundingClientRect().top; let best = 0, d = Infinity;
    slides().forEach((el, i) => { const x = Math.abs(el.getBoundingClientRect().top - top); if (x < d) { d = x; best = i; } }); return best; };
  const go = i => { const list = slides(); const j = Math.max(0, Math.min(list.length - 1, i)); if (!list[j]) return;
    container.scrollTop += list[j].getBoundingClientRect().top - container.getBoundingClientRect().top;
    document.getElementById('slidesCount').textContent = (j + 1) + ' / ' + list.length; };
  const count = () => { document.getElementById('slidesCount').textContent = (current() + 1) + ' / ' + slides().length; };
  document.getElementById('prevSlide').onclick = () => go(current() - 1);
  document.getElementById('nextSlide').onclick = () => go(current() + 1);
  container.addEventListener('scroll', count, { passive: true });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(current() + 1); }
    if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(current() - 1); }
  });
  count();
}
</script>
</body>
</html>
