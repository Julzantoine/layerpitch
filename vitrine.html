<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LayerPitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="player.css?v=1790612259917">
<style>
  :root {
    --bg: #14161a; --bg-card: #1d2025; --border: #30343b;
    --text: #eceef2; --text-dim: #a3a8b0; --text-dimmer: #737880;
    --accent: #5aa2e0; --accent-soft: #1f3346; --on-accent: #0d1620;
    --seq-map-success: #4fb57e; --seq-map-choice: #d4a64c;
    --font-body: 'Inter', system-ui, sans-serif; --font-title: 'Space Grotesk', 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; padding: 40px 16px 60px; }
  .page { max-width: 820px; margin: 0 auto; }
  h1 { font-family: var(--font-title); font-size: clamp(30px, 6vw, 52px); line-height: 1.05; margin: 0 0 14px; overflow-wrap: anywhere; }
  .intro { color: var(--text-dim); line-height: 1.7; white-space: pre-wrap; max-width: 62ch; }
  .steam { display: inline-block; margin: 18px 0 8px; padding: 11px 22px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
  .section { margin-top: 34px; }
  .section h2 { font-family: var(--font-title); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dimmer); margin: 0 0 10px; }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; margin-bottom: 14px; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .gallery img { width: 100%; border-radius: 8px; display: block; object-fit: cover; aspect-ratio: 16 / 10; }
  .empty { color: var(--text-dimmer); text-align: center; padding: 80px 0; }
  .foot { margin-top: 48px; font-size: 12px; color: var(--text-dimmer); }
  .foot a { color: var(--text-dim); }
</style>
</head>
<body>
<div class="page" id="page"><div class="empty">…</div></div>
<script src="https://unpkg.com/@wasm-audio-decoders/ogg-vorbis/dist/ogg-vorbis-decoder.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="layerpitch-i18n.js?v=1790612259917"></script>
<script src="player.js?v=1790612259917"></script>
<script src="api/supabase-client.js?v=1790612259917"></script>
<script src="api/tracks.js?v=1790612259917"></script>
<script src="api/projects.js?v=1790612259917"></script>
<script>
// vitrine.html — vitrine PUBLIQUE d'un Projet (chantier profils et permissions, étape 5, 28/09 ; cadrage du 11/09 §5.3) :
// la page que le studio met en lien depuis sa page Steam ou son site, pour faire écouter la musique du jeu aux joueurs.
// Aucune connexion (règle « pages publiques jamais verrouillées »). Contenu choisi par l'administrateur du Projet
// (save_project_showcase) : morceaux du tableau, vidéos YouTube/Vimeo, images ; rien d'autre du Projet n'est exposé.
// À faire ensuite (11/09 §5.3) : un mode d'écoute grand public (gros boutons « Calme / Exploration / Combat ») à la place
// des contrôles techniques du lecteur.
const params = new URLSearchParams(location.search);
const pageLang = params.get('lang') === 'en' ? 'en' : 'fr';
function tr(key, vars) {
  const I18N = window.LAYERPITCH_I18N || { fr: { shared: {}, projects: {} }, en: { shared: {}, projects: {} } };
  const dict = I18N[pageLang] || I18N.fr, dictFr = I18N.fr;
  let str = (dict.projects && dict.projects[key]) || (dict.shared && dict.shared[key]) || (dictFr.projects && dictFr.projects[key]) || key;
  if (vars) Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  return str;
}
document.documentElement.lang = pageLang;
if (window.LayerPlayerCore && window.LayerPlayerCore.setLang) window.LayerPlayerCore.setLang(pageLang);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const page = document.getElementById('page');
const youtubeId = url => { const m = String(url || '').match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/); return m ? m[1] : null; };
const vimeoId = url => { const m = String(url || '').match(/vimeo\.com\/(\d+)/); return m ? m[1] : null; };

(async () => {
  const { data: sc } = await window.LayerPitchProjects.showcase(params.get('id'));
  if (!sc) { page.innerHTML = `<div class="empty">${esc(tr('showcaseUnavailable'))}</div>`; return; }
  document.title = sc.title || 'LayerPitch';
  const tracks = sc.entries.filter(e => e.kind === 'track');
  const videos = sc.entries.filter(e => e.kind === 'video');
  const images = sc.entries.filter(e => e.kind === 'image');
  page.innerHTML = `
    ${sc.published ? '' : `<p class="intro">${esc(tr('showcaseDraftNotice'))}</p>`}
    <h1>${esc(sc.title || '')}</h1>
    ${sc.intro ? `<div class="intro">${esc(sc.intro)}</div>` : ''}
    ${sc.steamUrl ? `<a class="steam" href="${esc(sc.steamUrl)}" target="_blank" rel="noopener noreferrer">${esc(tr('showcaseSteamBtn'))}</a>` : ''}
    ${tracks.length ? `<div class="section"><h2>${esc(tr('showcaseMusic'))}</h2><div id="tracks"></div></div>` : ''}
    ${videos.length ? `<div class="section"><h2>${esc(tr('showcaseVideos'))}</h2>${videos.map(v => {
      const y = youtubeId(v.url), vm = vimeoId(v.url);
      const src = y ? `https://www.youtube-nocookie.com/embed/${esc(y)}` : vm ? `https://player.vimeo.com/video/${esc(vm)}` : '';
      return src ? `<div class="video"><iframe src="${src}" title="${esc(v.title || '')}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>` : '';
    }).join('')}</div>` : ''}
    ${images.length ? `<div class="section"><h2>${esc(tr('showcaseImages'))}</h2><div class="gallery" id="gallery"></div></div>` : ''}
    <div class="foot">${esc(tr('showcaseFooter'))} <a href="./landing.html" target="_blank" rel="noopener">LayerPitch</a></div>`;
  if (tracks.length) {
    const { tracks: list } = await window.LayerPitchTracks.listTracksByIds(tracks.map(t => t.refId));
    const host = document.getElementById('tracks');
    const P = window.LayerPlayerCore;
    tracks.forEach(t => {
      const track = (list || []).find(x => x.id === t.refId); if (!track) return;
      const row = P.buildTrackRow(track, null, false);
      host.appendChild(row); P.initTrackPlayer(track, row);
    });
  }
  if (images.length) {
    const g = document.getElementById('gallery');
    for (const im of images) {
      const r = await window.LayerPitchProjects.fileUrl(im.fileId);
      if (r.data) g.insertAdjacentHTML('beforeend', `<img src="${esc(r.data)}" alt="${esc(im.title || '')}" loading="lazy">`);
    }
  }
})();
</script>
</body>
</html>
