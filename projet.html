<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">LayerPitch — Projet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="player.css?v=1790681161335">
<style>
  :root {
    --bg: #f5f6f8; --bg-card: #ffffff; --border: #e2e2e6;
    --text: #24262b; --text-dim: #5f636b; --text-dimmer: #9a9ea6;
    --accent: #2f80c0; --accent-soft: #e6eef8; --on-accent: #ffffff;
    --seq-map-success: #2f8f5b; --seq-map-choice: #b8862e;
    --font-body: 'Inter', system-ui, sans-serif; --font-title: 'Space Grotesk', 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; padding: 24px 16px 60px; }
  .page { max-width: 1320px; margin: 0 auto; }
  a { color: var(--accent); }
  .top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .top-links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; }
  h1 { font-family: var(--font-title); font-size: 26px; margin: 0; overflow-wrap: anywhere; }
  h2 { font-family: var(--font-title); font-size: 16px; margin: 0 0 8px; }
  .desc { color: var(--text-dim); line-height: 1.6; white-space: pre-wrap; margin: 4px 0 12px; }
  .presence { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--text-dim); }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; border: 2px solid #2f8f5b; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
  .tab { border: 1px solid var(--border); background: var(--bg-card); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--text); }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .hint { font-size: 12.5px; line-height: 1.6; color: var(--text-dim); margin: 0 0 8px; }
  .btn { border: 1px solid var(--border); background: var(--bg-card); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-size: 12.5px; color: var(--text); text-decoration: none; display: inline-block; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.danger:hover:not(:disabled) { border-color: #b5442e; color: #b5442e; }
  .btn:disabled { opacity: .5; cursor: default; }
  .icon-btn { border: 1px solid var(--border); background: var(--bg-card); border-radius: 6px; min-width: 28px; height: 28px; cursor: pointer; color: var(--text-dim); font-size: 12px; }
  .icon-btn.on { color: var(--accent); border-color: var(--accent); }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }
  input[type="text"], input[type="email"], input[type="search"], input[type="url"], textarea, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font: inherit; background: var(--bg-card); color: var(--text); }
  textarea { min-height: 64px; resize: vertical; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .msg { font-family: var(--font-mono); font-size: 11.5px; margin-top: 8px; min-height: 1em; overflow-wrap: anywhere; }
  .msg.err { color: #b5442e; } .msg.ok { color: #2a7; }
  .empty { color: var(--text-dimmer); text-align: center; padding: 18px 0; }
  .meta { font-size: 11.5px; color: var(--text-dimmer); }
  /* Discussion : colonne à droite (étape 3), repliable ; panneau plein écran sur téléphone. */
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
  .workspace.chat-closed { grid-template-columns: minmax(0, 1fr) 44px; }
  .chat { position: sticky; top: 12px; height: calc(100vh - 170px); min-height: 420px; display: flex; flex-direction: column; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; min-width: 0; }
  .workspace.chat-closed .chat { padding: 0; border: none; background: transparent; }
  .chat.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
  .chat-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .chat-rail { width: 44px; min-height: 160px; border: 1px solid var(--border); background: var(--bg-card); border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; font-size: 16px; color: var(--text); }
  .chat-rail-label { writing-mode: vertical-rl; font-size: 12.5px; color: var(--text-dim); }
  .badge { background: var(--accent); color: var(--on-accent); font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 1px 6px; }
  .chat-fab { display: none; }
  .composer { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
  .pending { display: flex; flex-wrap: wrap; gap: 4px; }
  .pending-chip { font-size: 11.5px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 4px 2px 9px; }
  .pending-chip button { border: 0; background: none; color: inherit; cursor: pointer; }
  .att-img { display: block; max-width: 100%; max-height: 220px; border-radius: 6px; margin-top: 6px; }
  .att-audio { width: 100%; margin-top: 6px; }
  .chip-btn { border: 1px solid var(--border); background: var(--bg-card); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--text); margin: 4px 4px 0 0; }
  .chip-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .new-divider { align-self: stretch; text-align: center; font-size: 11px; color: var(--accent); border-top: 1px solid var(--accent); padding-top: 3px; margin: 4px 0; }
  .rangebar { border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 4px; }
  .range-row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 12px; }
  .range-row .chip-btn { margin: 2px 0; }
  .range-done { font-size: 11.5px; color: #2f8f5b; }
  @media (max-width: 900px) {
    .workspace, .workspace.chat-closed { grid-template-columns: minmax(0, 1fr); }
    .chat { display: none; }
    .chat.phone-open { display: flex; position: fixed; inset: 0; top: 0; height: 100vh; z-index: 1100; border-radius: 0; }
    .chat-fab { display: inline-flex; gap: 6px; align-items: center; position: fixed; right: 16px; bottom: 16px; z-index: 1050; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.2); cursor: pointer; }
    .chat-fab .badge { background: #fff; color: var(--accent); }
  }
  /* Fil */
  .thread { display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px; }
  .bubble { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; max-width: 85%; }
  .bubble.mine { align-self: flex-end; background: var(--accent-soft); border-color: transparent; }
  .bubble-body { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
  /* Tableau */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .item.pitch { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .item-kind { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dimmer); }
  .item-title { font-family: var(--font-title); font-size: 15px; overflow-wrap: anywhere; }
  .item-body { font-size: 13px; color: var(--text-dim); white-space: pre-wrap; overflow-wrap: anywhere; }
  .item img { width: 100%; border-radius: 6px; object-fit: cover; max-height: 200px; }
  .item audio { width: 100%; }
  /* Aperçu d'un lien (étape 2) : vignette cliquable -> lecteur officiel du service, dans la carte. */
  .preview-thumb { position: relative; display: block; width: 100%; padding: 0; border: 0; background: #111; border-radius: 6px; overflow: hidden; cursor: pointer; }
  .preview-thumb img { display: block; width: 100%; max-height: 200px; object-fit: cover; border-radius: 0; }
  .preview-thumb .play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 34px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .preview-embed { width: 100%; border: 0; border-radius: 6px; background: var(--bg); }
  .preview-meta { font-size: 12px; color: var(--text-dim); overflow-wrap: anywhere; }
  .item-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
  /* Glisser-déposer par poignée (28/09, retour de l'essai : plus de flèches) : même principe que le Backstage. La poignée
     arme le déplacement ; l'élément déplacé devient transparent ; un trait bleu marque la destination ; pendant le
     déplacement, les espaces entre éléments sont marqués en pointillés. */
  .drag-handle { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 26px; color: var(--text-dimmer); cursor: grab; flex: 0 0 auto; border-radius: 4px; }
  .drag-handle:hover { color: var(--accent); background: var(--accent-soft); }
  .drag-handle svg { width: 14px; height: 14px; }
  [data-sortable] > * { position: relative; }
  [data-sortable] > .dragging { opacity: .4; }
  [data-sortable].is-reordering > *:not(.dragging) { outline: 2px dashed color-mix(in srgb, var(--accent) 30%, transparent); outline-offset: 3px; }
  [data-sortable] > .drop-before::before, [data-sortable] > .drop-after::after { content: ''; position: absolute; background: var(--accent); border-radius: 2px; z-index: 5; pointer-events: none; }
  [data-sortable="list"] > .drop-before::before { left: 0; right: 0; top: -6px; height: 3px; }
  [data-sortable="list"] > .drop-after::after { left: 0; right: 0; bottom: -6px; height: 3px; }
  [data-sortable="grid"] > .drop-before::before { top: 0; bottom: 0; left: -8px; width: 3px; }
  [data-sortable="grid"] > .drop-after::after { top: 0; bottom: 0; right: -8px; width: 3px; }
  .notes { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .note { font-size: 12.5px; }
  .note.resolved { opacity: .55; }
  .note-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .time-chip { font-family: var(--font-mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); border: none; border-radius: 999px; padding: 1px 7px; cursor: pointer; }
  /* Vidéos */
  .video-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #111; border-radius: 8px; overflow: hidden; }
  .video-wrap video, .video-wrap iframe, .video-wrap > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .timeline { position: relative; height: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; margin: 10px 0; cursor: pointer; }
  .timeline-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text-dim); }
  .marker { position: absolute; top: 2px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-card); }
  .marker.resolved { background: var(--text-dimmer); }
  .list-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .list-row:first-child { border-top: none; }
  .list-main { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
  .pill { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .choice { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; }
  .choice input { width: auto; margin: 0; }
  @media (max-width: 560px) { .bubble { max-width: 100%; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="page">
  <div class="top"><div class="presence" id="presence" style="margin-left:auto"></div></div>
  <div id="content"></div>
</div>
<script src="https://unpkg.com/@wasm-audio-decoders/ogg-vorbis/dist/ogg-vorbis-decoder.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="layerpitch-i18n.js?v=1790681161335"></script>
<script src="layerpitch-notify.js?v=1790681161335"></script>
<script src="player.js?v=1790681161335"></script>
<script src="api/supabase-client.js?v=1790681161335"></script>
<script src="api/auth.js?v=1790681161335"></script>
<script src="layerpitch-appearance.js?v=1790681161335"></script>
<script src="layerpitch-shell.js?v=1790681161335"></script>
<script src="api/tracks.js?v=1790681161335"></script>
<script src="api/packs.js?v=1790681161335"></script>
<script src="api/albums.js?v=1790681161335"></script>
<script src="api/studio.js?v=1790681161335"></script>
<script src="api/adreels.js?v=1790681161335"></script>
<script src="api/projects.js?v=1790681161335"></script>
<script>
const shellTr = k => (window.LayerPitchShell ? window.LayerPitchShell.tr(k) : k); // libellés de la barre commune
// projet.html — espace de travail d'un Projet (chantier profils et permissions, étape 5, 28/09 ; cadrage du 11/09 et D35-D39).
// Onglets : Discussion (tchat + recherche), Moodboard (épingles sur la réserve de contenus du Projet : liens, images, audio,
// vidéos, documents, notes, morceaux, packs ; sélection ★ pour la pré-vitrine ; versions), Vidéos (tous les objets vidéo
// du Projet : fichier privé ou YouTube/Vimeo, annotations horodatées façon SoundCloud), Musique (packs partagés / offerts,
// albums, morceaux et audio du Projet), Vitrine (page publique pour les joueurs), Activité, Membres. Réserve unique depuis
// le 28/09 (migration 20260928130000) : un objet par chose réelle, les sections n'en sont que des vues.
// Présence et mises à jour en direct : canal Supabase Realtime (présence + messages « a changé », sans lire les tables,
// qui restent fermées : tout passe par les RPC). Tous les droits sont vérifiés côté serveur.
const params = new URLSearchParams(location.search);
const projectId = params.get('id');
const pageLang = (params.get('lang') || localStorage.getItem('layerpitch_lang') || 'fr') === 'en' ? 'en' : 'fr';
function tr(key, vars) {
  const I18N = window.LAYERPITCH_I18N || { fr: { shared: {}, projects: {} }, en: { shared: {}, projects: {} } };
  const dict = I18N[pageLang] || I18N.fr, dictFr = I18N.fr;
  let str = (dict.projects && dict.projects[key]) || (dict.shared && dict.shared[key]) || (dictFr.projects && dictFr.projects[key]) || (dictFr.shared && dictFr.shared[key]) || key;
  if (vars) Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  return str;
}
document.documentElement.lang = pageLang;
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
if (window.LayerPlayerCore && window.LayerPlayerCore.setLang) window.LayerPlayerCore.setLang(pageLang);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const PJ = window.LayerPitchProjects;
const clock = s => { s = Math.max(0, Math.floor(Number(s) || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const content = $('content');
const S = { tab: 'board', project: null, content: null, messages: [], query: '', activity: [], snapshots: [], openNotes: {}, notes: {},
  video: null, videoNotes: [], fileUrls: {}, myComposerId: null, myPacks: [], myAlbums: [], channel: null, me: null };

function say(id, text, ok) { const m = $(id); if (m) { m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); } }
function memberOptions(selected) {
  return `<option value="">${esc(tr('noAddressee'))}</option><option value="${PJ.PRIVATE}"${selected === PJ.PRIVATE ? ' selected' : ''}>${esc(tr('notePrivate'))}</option>` + (S.project.members || []).filter(m => m.profileId && m.status === 'active' && !m.me)
    .map(m => `<option value="${esc(m.profileId)}"${selected === m.profileId ? ' selected' : ''}>${esc(m.email || '')}</option>`).join('');
}
async function fileUrl(fileId) {
  if (!fileId) return null;
  const cached = S.fileUrls[fileId];
  if (cached && cached.until > Date.now()) return cached.url;
  const r = await PJ.fileUrl(fileId);
  if (r.error) return null;
  S.fileUrls[fileId] = { url: r.data, until: Date.now() + 50 * 60 * 1000 };
  return r.data;
}

// ---- Chargement et direct ----
async function load() {
  const { session } = await LayerPitchAuth.getSession();
  if (!session) { content.innerHTML = `<div class="card"><p class="hint">${esc(tr('signInPrompt'))} <a href="./studio.html?lang=${pageLang}">${esc(tr('signInLink'))}</a></p></div>`; return; }
  S.me = session.user;
  const p = await PJ.get(projectId);
  if (p.error) { content.innerHTML = `<div class="card"><p class="hint">${esc(tr('errorPrefix', { message: p.error }))}</p></div>`; return; }
  S.project = p.data;
  if (window.LayerPitchShell) window.LayerPitchShell.update({ crumbs: [{ label: shellTr('item_projects'), href: 'projets.html' }, { label: p.data.title }] });
  document.title = tr('pageTitleProject', { title: S.project.title });
  const [c, composer] = await Promise.all([PJ.content(projectId), LayerPitchAuth.getMyComposerId()]);
  S.content = c.data || { assets: [], moodboard: [], packs: [], albums: [] };
  S.myComposerId = composer.composerId || null;
  PJ.markRead(projectId);
  markProjectSeen();
  await loadMessages();
  computeUnread();
  joinChannel();
  render();
}
async function reloadContent() { const c = await PJ.content(projectId); if (!c.error) S.content = c.data; }
function joinChannel() {
  if (S.channel) return;
  try {
    const client = window.LayerPitchSupabaseClient.getClient();
    S.channel = client.channel('project:' + projectId, { config: { presence: { key: S.me.id } } });
    S.channel.on('presence', { event: 'sync' }, renderPresence);
    S.channel.on('broadcast', { event: 'changed' }, async ({ payload }) => {
      markProjectSeen();
      if (payload.what === 'messages') {
        await loadMessages();
        if (!chatVisible()) { S.unread++; if (!S.firstUnreadId && S.messages[0] && !S.messages[0].mine) S.firstUnreadId = S.messages[0].id; }
        renderChat();
      }
      else if (payload.what === 'content') { await reloadContent(); if (S.video) S.video = assetById(S.video.id) || null; if (['board', 'videos', 'images', 'music', 'showcase'].includes(S.tab) && !(S.tab === 'showcase' && S.vitrineDraft)) renderPanel(); /* jamais pendant l'édition d'une vitrine */ }
      else if (payload.what === 'notes' && S.video) { await loadVideoNotes(); renderPanel(); }
    });
    S.channel.subscribe(status => { if (status === 'SUBSCRIBED') S.channel.track({ email: S.me.email }); });
  } catch (e) { console.warn('temps réel indisponible', e); }
}
// Tant que la page est ouverte et visible, tu vois tout ce qui arrive : ta « dernière visite » avance (la cloche des autres
// pages ne te signale donc que ce qui s'est passé en ton absence). Mise à jour au plus toutes les 30 s.
let lastSeenPush = 0;
function markProjectSeen(force) {
  if (!S.project || (document.hidden && !force)) return;
  if (!force && Date.now() - lastSeenPush < 30000) return;
  lastSeenPush = Date.now(); PJ.markSeen(projectId);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) markProjectSeen(true); else markProjectSeen(); });
window.addEventListener('pagehide', () => markProjectSeen(true));
function broadcast(what) { try { if (S.channel) S.channel.send({ type: 'broadcast', event: 'changed', payload: { what } }); } catch (e) {} }
function renderPresence() {
  if (!S.channel) return;
  const state = S.channel.presenceState();
  const people = Object.values(state).map(v => v[0]).filter(Boolean);
  $('presence').innerHTML = people.length ? `<span>${esc(tr('online'))}</span>` + people.map(p => `<span class="dot" title="${esc(p.email || '')}">${esc((p.email || '?').slice(0, 2))}</span>`).join('') : '';
}

// ---- Rendu ----
const TABS = ['board', 'videos', 'images', 'music', 'showcase', 'activity', 'members']; // la Discussion est dans la colonne de droite
function render() {
  const p = S.project;
  content.innerHTML = `
    <div class="top"><h1 id="pTitle">${esc(p.title)}</h1>
      <div class="bar">${S.content.openAnnotations ? `<button class="btn" id="openNotesBtn" type="button" title="${esc(tr('openNotesHint'))}">💬 ${esc(tr('openNotes', { n: S.content.openAnnotations }))}</button>` : ''}${p.archived ? `<span class="pill">${esc(tr('archived'))}</span>` : ''}
        <button class="btn" id="editBtn" type="button">${esc(tr('editProject'))}</button>
        ${p.role === 'admin' ? `<button class="btn" id="archiveBtn" type="button">${esc(tr(p.archived ? 'restoreProject' : 'archiveProject'))}</button>
        <button class="btn danger" id="deleteBtn" type="button">${esc(tr('deleteProject'))}</button>` : ''}</div></div>
    ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ''}
    <div class="tabs" role="tablist">${TABS.map(t => `<button class="tab" role="tab" type="button" data-tab="${t}" aria-selected="${S.tab === t}">${esc(tr('tab_' + t))}</button>`).join('')}</div>
    <div id="openNotesBox"></div>

// ---- Discussion : colonne à droite (étape 3 du 28/09) ----
// Toujours visible à côté des onglets, repliable (choix mémorisé par le navigateur, compteur de nouveaux messages quand
// elle est repliée) ; sur téléphone, un bouton flottant l'ouvre en panneau. Liens cliquables ; pièces jointes (trombone,
// glisser-déposer, coller une image) qui deviennent des objets du Projet à l'envoi ; sous chaque message qui contient un
// lien ou une pièce jointe, une barre « Ranger dans : Moodboard / Vidéos » (sur décision d'un membre, jamais automatique).
const CHAT_KEY = 'layerpitch_project_chat_open';
const isPhone = () => window.matchMedia('(max-width: 900px)').matches;
S.chatOpen = (() => { try { return localStorage.getItem(CHAT_KEY) !== '0'; } catch (e) { return true; } })();
S.chatPhoneOpen = false; S.unread = 0; S.pending = [];
const VIDEO_URL = /^https:\/\/(www\.|m\.)?(youtube\.com\/watch\?v=|youtu\.be\/|vimeo\.com\/)/i;
const URL_RE = /https?:\/\/[^\s<>"']+/g;
const trimUrl = u => u.replace(/[.,;:!?)\]}»”'"]+$/, '');
function messageUrls(body) { return [...new Set((String(body || '').match(URL_RE) || []).map(trimUrl))]; }
function linkifyText(body) {
  return esc(body).replace(/https?:\/\/[^\s<>"']+/g, raw => {
    const u = trimUrl(raw.replace(/&amp;/g, '&')); const rest = raw.slice(esc(u).length);
    return `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>${rest}`;
  });
}
async function loadMessages(older) {
  const before = older && S.messages.length ? S.messages[S.messages.length - 1].createdAt : null;
  const r = await PJ.messages(projectId, before, S.query);

  S.messages = older ? S.messages.concat(list) : list;
  S.moreMessages = list.length === 50;

// Messages arrivés depuis ta dernière visite (28/09) : repère gardé par le navigateur (date du dernier message vu, par
// Projet). Compteur sur la colonne repliée / le bouton du téléphone, repère « Nouveaux messages » dans le fil, et nombre
// dans le titre de l'onglet du navigateur.
const SEEN_KEY = 'layerpitch_project_seen_' + projectId;
function lastSeen() { try { return localStorage.getItem(SEEN_KEY); } catch (e) { return null; } }
function computeUnread() {
  const seen = lastSeen();
  const news = seen ? S.messages.filter(m => !m.mine && m.createdAt > seen) : [];
  S.unread = news.length;
  S.firstUnreadId = news.length ? news[news.length - 1].id : null;
}
function markSeen() {
  if (S.query) return; // pendant une recherche, la liste n'est pas le fil complet
  const newest = S.messages[0];
  if (newest) { try { localStorage.setItem(SEEN_KEY, newest.createdAt); } catch (e) {} }
  S.unread = 0; updateTitle();
}
function updateTitle() { if (S.project) document.title = (S.unread ? '(' + S.unread + ') ' : '') + tr('pageTitleProject', { title: S.project.title }); }
function setChatOpen(open) {
  if (isPhone()) S.chatPhoneOpen = open; else { S.chatOpen = open; try { localStorage.setItem(CHAT_KEY, open ? '1' : '0'); } catch (e) {} }
  if (open) S.unread = 0;
  renderChat();
}
// Passage ordinateur <-> téléphone (fenêtre redimensionnée) : la colonne devient panneau, et inversement.
window.matchMedia('(max-width: 900px)').addEventListener('change', () => renderChat());
function chatVisible() { return isPhone() ? S.chatPhoneOpen : S.chatOpen; }
function renderChatFab() {

}
// Ce qu'on peut ranger depuis un message : ses liens et ses pièces jointes, avec leur état dans le Projet.
function rangeItems(m) {
  const assets = S.content.assets || [];
  const links = messageUrls(m.body).map(url => ({ url, asset: assets.find(a => a.url === url), label: (() => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url; } })() }));
  const files = (m.attachments || []).map(x => ({ assetId: x.assetId, asset: assets.find(a => a.id === x.assetId) || { id: x.assetId, kind: x.kind }, label: x.title || x.fileName || '' }));
  return links.concat(files);
}
function rangeBarHtml(m, items) {

    const a = it.asset; const isVideo = (a && a.kind === 'video') || (it.url && VIDEO_URL.test(it.url));

    return `<div class="range-row"><span class="meta">${esc(tr('rangeInto', { what: it.label }))}</span> ${btns}${done.length ? `<span class="range-done">✓ ${esc(done.join(' · '))}</span>` : ''}</div>`;
  }).join('')}</div>`;
}
function attachmentsHtml(m) {

    if (x.kind === 'audio') return `<audio class="att-audio" controls preload="none" data-file="${esc(x.fileId)}"></audio><div class="meta">${esc(x.title || x.fileName || '')}</div>`;
    if (x.kind === 'video') return `<button class="chip-btn" type="button" data-watch="${esc(x.assetId)}">🎬 ${esc(x.title || x.fileName || '')} · ${esc(tr('openInVideos'))}</button>`;

    $('chatOpenBtn').onclick = () => setChatOpen(true);

    return;
  }
  const msgs = S.messages.slice().reverse();
  aside.innerHTML = `<div class="chat-head"><strong>${esc(tr('tab_thread'))}</strong><button class="icon-btn" id="chatCloseBtn" type="button" title="${esc(tr('chatClose'))}">${isPhone() ? '✕' : '»'}</button></div>
    <div class="bar" style="margin-bottom:8px"><input type="search" id="q" placeholder="${esc(tr('searchPlaceholder'))}" value="${esc(S.query)}" style="flex:1 1 120px">
      ${S.query ? `<button class="btn" id="clearSearch" type="button">${esc(tr('clearSearch'))}</button>` : ''}</div>
    ${S.moreMessages ? `<div style="text-align:center;margin-bottom:6px"><button class="btn" id="olderBtn" type="button">${esc(tr('olderMessages'))}</button></div>` : ''}
    <div class="thread" id="thread">${msgs.length ? msgs.map(m => `${m.id === S.firstUnreadId ? `<div class="new-divider">${esc(tr('newMessages'))}</div>` : ''}<div class="bubble${m.mine ? ' mine' : ''}" data-id="${esc(m.id)}">
        <div class="meta">${esc(m.authorEmail || '')} · ${esc(new Date(m.createdAt).toLocaleString(pageLang))}${m.editedAt ? ' · ' + esc(tr('edited')) : ''}</div>
        ${m.body ? `<div class="bubble-body">${linkifyText(m.body)}</div>` : ''}
        ${attachmentsHtml(m)}

        ${m.mine ? `<div class="bar" style="margin-top:4px"><button class="icon-btn" data-act="edit" type="button" title="${esc(tr('edit'))}">✎</button><button class="icon-btn" data-act="delete" type="button" title="${esc(tr('delete'))}">✕</button></div>` : ''}
      </div>`).join('') : `<div class="empty">${esc(tr(S.query ? 'noSearchResult' : 'noMessages'))}</div>`}</div>
    ${S.query ? '' : `<div class="composer" id="composer">
      <div class="pending" id="pending">${S.pending.map((f, i) => `<span class="pending-chip">${esc(f.name)} <button type="button" data-unpend="${i}" title="${esc(tr('delete'))}">×</button></span>`).join('')}</div>
      <textarea id="newMsg" placeholder="${esc(tr('messagePlaceholder'))}"></textarea>
      <div class="bar" style="margin-top:6px"><button class="icon-btn" id="attachBtn" type="button" title="${esc(tr('attachFile'))}">📎</button>
        <input type="file" id="attachInput" multiple hidden accept="image/jpeg,image/png,image/webp,image/gif,audio/*,video/mp4,video/webm,video/quicktime,.mov,application/pdf">

  const th = $('thread');
  const divider = th.querySelector('.new-divider');
  if (divider) th.scrollTop = Math.max(0, divider.offsetTop - th.offsetTop - 8); else th.scrollTop = th.scrollHeight;
  markSeen();
  $('chatCloseBtn').onclick = () => setChatOpen(false);
  const doSearch = async () => { S.query = $('q').value.trim(); await loadMessages(); renderChat(); };
  $('q').onkeydown = e => { if (e.key === 'Enter') doSearch(); };
  if ($('clearSearch')) $('clearSearch').onclick = async () => { S.query = ''; await loadMessages(); renderChat(); };
  if ($('olderBtn')) $('olderBtn').onclick = async () => { await loadMessages(true); renderChat(); };
  // Fichiers signés (images, audio) chargés après coup.
  aside.querySelectorAll('[data-file]').forEach(async el => { const u = await fileUrl(el.dataset.file); if (u) el.src = u; });
  aside.querySelectorAll('[data-watch]').forEach(b => b.onclick = async () => { await reloadContent(); openInVideos(b.dataset.watch); if (isPhone()) setChatOpen(false); });

      const bodyEl = b.querySelector('.bubble-body'); if (bodyEl) bodyEl.replaceWith(holder); else b.insertBefore(holder, b.children[1]);

      const r = await PJ.deleteMessage(m.id); if (r.error) return say('threadMsg', tr('errorPrefix', { message: r.error }));
      await loadMessages(); renderChat(); broadcast('messages');

}
function wireComposer(aside) {
  const addFiles = files => { const list = [...files].filter(f => f && f.size); if (!list.length) return; const draft = $('newMsg').value; S.pending = S.pending.concat(list).slice(0, 10); renderChat(); $('newMsg').value = draft; $('newMsg').focus(); };
  $('attachBtn').onclick = () => $('attachInput').click();
  $('attachInput').onchange = e => addFiles(e.target.files);
  aside.querySelectorAll('[data-unpend]').forEach(b => b.onclick = () => { const draft = $('newMsg').value; S.pending.splice(Number(b.dataset.unpend), 1); renderChat(); $('newMsg').value = draft; });
  $('newMsg').addEventListener('paste', e => { const files = [...(e.clipboardData && e.clipboardData.files || [])]; if (files.length) { e.preventDefault(); addFiles(files); } });
  aside.ondragover = e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); aside.classList.add('drop'); } };
  aside.ondragleave = e => { if (!aside.contains(e.relatedTarget)) aside.classList.remove('drop'); };
  aside.ondrop = e => { e.preventDefault(); aside.classList.remove('drop'); addFiles(e.dataTransfer.files); };
  const send = async () => {
    const body = $('newMsg').value.trim(); if (!body && !S.pending.length) return;
    $('sendBtn').disabled = true;
    const attachments = [];
    for (const f of S.pending) {
      say('threadMsg', tr('uploadingNamed', { name: f.name }), true);
      const up = await uploadOrReuse(f);
      if (up.error) { say('threadMsg', tr('errorPrefix', { message: f.name + ' : ' + up.error })); $('sendBtn').disabled = false; return; }
      attachments.push({ fileId: up.data.fileId, title: f.name });
    }
    const r = await PJ.post(projectId, body, attachments);
    if (r.error) { say('threadMsg', tr('errorPrefix', { message: r.error })); $('sendBtn').disabled = false; return; }
    S.pending = [];
    await Promise.all([loadMessages(), attachments.length ? reloadContent() : null]);
    renderChat(); broadcast('messages'); if (attachments.length) broadcast('content');
  };
  $('sendBtn').onclick = send;
  $('newMsg').onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(); };
}

function noteHtml(n, withTime, canSeek) {

  const chip = withTime && label ? ((canSeek === undefined || !!canSeek) && n.atSeconds != null ? `<button class="time-chip" type="button" data-seek="${esc(n.atSeconds)}">${esc(label)}</button>` : `<span class="time-chip">${esc(label)}</span>`) : '';
  return `<div class="note${n.resolved ? ' resolved' : ''}" data-note="${esc(n.id)}">
    <div class="note-head">${chip}
      <strong>${esc(n.authorEmail || '')}</strong>${n.addresseeEmail ? ` → ${esc(n.addresseeEmail)}` : ''}${n.private ? ` <span class="meta">🔒 ${esc(tr('notePrivateShort'))}</span>` : ''}
      <label class="choice" style="margin:0 0 0 auto"><input type="checkbox" data-role="resolve" ${n.resolved ? 'checked' : ''}> ${esc(tr('resolved'))}</label>
      ${n.mine ? `<button class="icon-btn" type="button" data-role="delNote" title="${esc(tr('delete'))}">✕</button>` : ''}</div>
    <div>${esc(n.body)}</div></div>`;
}
// Instant et partie affichés par le lecteur LayerPitch d'un morceau (compteur de temps, partie en cours : carte des
// chemins, bloc séquentiel ou section active). Lecture de l'affichage : rien à changer dans le lecteur.
function trackPosition(host) {
  const t = host && host.querySelector('[data-role="timeCurrent"]');
  const parts = String(t ? t.textContent : '0:00').trim().split(':').map(Number);
  const seconds = parts.reduce((acc, x) => acc * 60 + (Number.isFinite(x) ? x : 0), 0);
  const cur = host && host.querySelector('.seq-map-node.current .seq-map-node-label, .seq-block.active .seq-block-label, .wwise-node.active .wwise-node-label, [class*="vr-block"].active');
  return { seconds, part: cur ? cur.textContent.replace(/\s+/g, ' ').trim().slice(0, 80) : '' };
}
function mediaFor(el, a) {
  if (a.kind === 'audio') {
    const au = el.querySelector('audio');
    return au ? { now: () => ({ seconds: au.currentTime }), seek: t => { au.currentTime = t; au.play().catch(() => {}); }, hasParts: false } : null;
  }
  if (a.kind === 'track') {
    const host = el.querySelector('[data-role="player"]');
    return { now: () => trackPosition(host), seek: null, hasParts: true };
  }
  return null;
}
function wireNotes(box, list, refresh) {
  box.querySelectorAll('[data-note]').forEach(row => {
    const id = row.dataset.note;
    row.querySelector('[data-role="resolve"]').onchange = async e => { await PJ.resolve(id, e.target.checked); refresh(); broadcast('notes'); };
    const d = row.querySelector('[data-role="delNote"]'); if (d) d.onclick = async () => { await PJ.deleteAnnotation(id); refresh(); broadcast('notes'); };
  });
}

// Lecteur : fichier privé (<video>, URL signée) ou YouTube / Vimeo (leurs API donnent l'instant courant).
const V = { get: () => 0, seek: () => {}, duration: () => 0, pause: () => {} };
function loadScriptOnce(src, globalName) {
  if (window[globalName]) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = () => res(); s.onerror = rej; document.head.appendChild(s); });
}
async function openVideo() { await loadVideoNotes(); }
async function loadVideoNotes() { const id = S.video.id; const r = await PJ.annotations(projectId, 'asset', id); S.videoNotes = r.data || []; S.videoNotesFor = id; }
async function renderVideoStage() {
  const stage = $('videoStage'); if (!stage) return;
  const v = S.video;
  stage.innerHTML = `<div class="card"><h2>${esc(v.title || tr('untitledVideo'))}</h2>
    <div class="video-wrap" id="vWrap"></div>
    <div class="timeline" id="vTimeline" title="${esc(tr('timelineHint'))}"><div class="timeline-now" id="vNow"></div></div>
    <div class="bar"><button class="btn primary" id="noteHere" type="button">${esc(tr('noteHere'))}</button><span class="meta" id="vClock">0:00</span></div>
    <div id="noteForm" hidden><textarea id="vNoteBody" placeholder="${esc(tr('notePlaceholder'))}"></textarea>
      <div class="bar" style="margin-top:6px"><select id="vNoteTo" style="flex:1 1 160px">${memberOptions()}</select><button class="btn primary" id="vNoteSave" type="button">${esc(tr('addNote'))}</button></div></div>
    <div id="vNotes" style="margin-top:10px"></div></div>`;
  const wrap = $('vWrap');
  if (v.fileId) {
    const u = await fileUrl(v.fileId);
    wrap.innerHTML = `<video controls preload="metadata" src="${esc(u || '')}"></video>`;
    const el = wrap.querySelector('video');
    // Format que ce navigateur ne sait pas lire (souvent un .mov dans Firefox) : on le dit et on propose de télécharger,
    // plutôt qu'un cadre noir.
    el.addEventListener('error', () => {
      wrap.innerHTML = `<div style="display:grid;place-items:center;color:#fff;text-align:center;padding:16px;line-height:1.6">${esc(tr('videoCannotPlay'))}<br><a class="btn" style="margin-top:8px;background:#fff" href="${esc(u || '')}" target="_blank" rel="noopener" download>${esc(tr('downloadVideo'))}</a></div>`;
    }, { once: true });
    Object.assign(V, { get: () => el.currentTime, seek: t => { el.currentTime = t; }, duration: () => el.duration || 0, pause: () => el.pause() });
  } else if (/youtu/.test(v.url)) {
    wrap.innerHTML = `<div id="ytHost"></div>`;
    await loadScriptOnce('https://www.youtube.com/iframe_api', 'YT');
    await new Promise(res => { if (window.YT && window.YT.Player) return res(); window.onYouTubeIframeAPIReady = res; });
    const yt = new YT.Player('ytHost', { videoId: youtubeId(v.url), playerVars: { rel: 0 } });
    Object.assign(V, { get: () => (yt.getCurrentTime ? yt.getCurrentTime() : 0), seek: t => yt.seekTo && yt.seekTo(t, true), duration: () => (yt.getDuration ? yt.getDuration() : 0), pause: () => yt.pauseVideo && yt.pauseVideo() });
  } else {
    wrap.innerHTML = `<div id="vmHost"></div>`;
    await loadScriptOnce('https://player.vimeo.com/api/player.js', 'Vimeo');
    const vm = new Vimeo.Player('vmHost', { url: v.url, responsive: true });
    let now = 0, dur = 0;
    vm.on('timeupdate', d => { now = d.seconds; dur = d.duration; });
    Object.assign(V, { get: () => now, seek: t => vm.setCurrentTime(t), duration: () => dur, pause: () => vm.pause() });
  }
  drawTimeline();
  clearInterval(S.clockTimer);
  S.clockTimer = setInterval(() => { if (!$('vClock')) return clearInterval(S.clockTimer); $('vClock').textContent = clock(V.get()); drawNow(); }, 250);
  $('vTimeline').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); const d = V.duration(); if (d) V.seek(((e.clientX - r.left) / r.width) * d); };
  $('noteHere').onclick = () => { V.pause(); S.noteAt = V.get(); $('noteForm').hidden = false; $('vNoteBody').focus(); $('noteHere').textContent = tr('noteAt', { t: clock(S.noteAt) }); };
  $('vNoteSave').onclick = async () => {
    const body = $('vNoteBody').value.trim(); if (!body) return;
    const r = await PJ.annotate(projectId, 'asset', v.id, Math.round((S.noteAt || 0) * 10) / 10, body, $('vNoteTo').value || null, location.href);
    if (r.error) return window.LayerPitchNotify.error(tr('errorPrefix', { message: r.error }));
    $('vNoteBody').value = ''; $('noteForm').hidden = true; $('noteHere').textContent = tr('noteHere');
    await loadVideoNotes(); renderVideoNotes(); drawTimeline(); broadcast('notes');
  };
  renderVideoNotes();
}
function drawNow() { const d = V.duration(); const n = $('vNow'); if (n && d) n.style.left = (100 * V.get() / d) + '%'; }
function drawTimeline() {
  const tl = $('vTimeline'); if (!tl) return;
  tl.querySelectorAll('.marker').forEach(m => m.remove());
  const d = V.duration();
  if (!d) { setTimeout(drawTimeline, 500); return; }
  S.videoNotes.filter(n => n.atSeconds != null).forEach(n => {
    const m = document.createElement('span');
    m.className = 'marker' + (n.resolved ? ' resolved' : '');
    m.style.left = Math.min(100, 100 * n.atSeconds / d) + '%';
    m.title = clock(n.atSeconds) + ' — ' + n.body;
    m.onclick = e => { e.stopPropagation(); V.seek(Number(n.atSeconds)); };
    tl.appendChild(m);
  });
}
function renderVideoNotes() {
  const box = $('vNotes'); if (!box) return;
  box.innerHTML = S.videoNotes.length ? `<div class="notes">${S.videoNotes.map(n => noteHtml(n, true)).join('')}</div>` : `<div class="meta">${esc(tr('noVideoNotes'))}</div>`;
  box.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => V.seek(Number(b.dataset.seek)));
  wireNotes(box, S.videoNotes, async () => { await loadVideoNotes(); renderVideoNotes(); drawTimeline(); });
}

  const max = Math.max(1, ...(st.byDay || []).map(d => d.opens));
  const evName = n => tr('vev_' + n) !== 'vev_' + n ? tr('vev_' + n) : n;
  box.innerHTML = `<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px">

      ${(st.byDay || []).length ? `<div style="display:flex;align-items:flex-end;gap:3px;height:60px">${st.byDay.map(d => `<div title="${esc(d.day)} : ${esc(d.opens)}" style="flex:1;max-width:16px;background:var(--accent);opacity:.8;border-radius:2px 2px 0 0;height:${Math.round(100 * d.opens / max)}%"></div>`).join('')}</div>` : ''}
      ${st.level === 'advanced' ? `<div class="bar" style="align-items:flex-start;gap:28px;margin-top:10px">
        <div><strong style="font-size:12.5px">${esc(tr('vitrineActions'))}</strong>${(st.events || []).length ? st.events.map(e => `<div class="meta">${esc(evName(e.name))} : ${esc(e.count)}</div>`).join('') : `<div class="meta">—</div>`}</div>

        <div><strong style="font-size:12.5px">${esc(tr('vitrineDevices'))}</strong>${Object.entries(st.devices || {}).map(([k, n]) => `<div class="meta">${esc(tr('device_' + k) !== 'device_' + k ? tr('device_' + k) : k)} : ${esc(n)}</div>`).join('') || `<div class="meta">—</div>`}</div></div>` : ''}

      : st.level === 'basic' ? `<p class="hint" style="margin-top:8px">${esc(tr('vitrineStatsBasic'))} <a href="tarifs.html?lang=${pageLang}">${esc(tr('seePricing'))}</a></p>` : ''}

// Lit les champs des blocs (texte, liens) dans le brouillon.
function syncVitrineBlocks(panel) {
  const v = S.vitrineDraft;
  panel.querySelectorAll('[data-vb]').forEach(row => {
    const b = v.blocks.find(x => x.id === row.dataset.vb); if (!b) return;
    if (b.type === 'text') { b.title = row.querySelector('[data-f="title"]').value; b.content = row.querySelector('[data-f="content"]').value; b.align = row.querySelector('[data-f="align"]').value; }
    if (b.type === 'links') b.links = [...row.querySelectorAll('[data-link]')].map(l => ({ label: l.querySelector('[data-f="label"]').value.trim(), url: l.querySelector('[data-f="url"]').value.trim() }));
    if (b.type === 'photo') b.caption = row.querySelector('[data-f="caption"]').value;
    // Apparence de ce bloc : seulement les réglages cochés (un bloc sans réglage suit le thème de la vitrine).
    const ap = {};
    row.querySelectorAll('[data-ap]').forEach(i => { const on = row.querySelector(`[data-apon="${i.dataset.ap}"]`); if (on && on.checked && i.value) ap[i.dataset.ap] = i.value; });
    if (Object.keys(ap).length) b.appearance = ap; else delete b.appearance;
  });
}
// Réglages d'apparence d'UN bloc (même format que l'AdReel : fond, titres, texte, petits titres, police).

}
function renderVitrineBlocks(panel) {
  const v = S.vitrineDraft;
  const host = $('vBlocks');
  const assets = S.content.assets || [];
  const isPrivate = a => !!a.fileId; // fichier envoyé dans le Projet : pas public aujourd'hui (Q7 : autorisé, avec avertissement)
  host.innerHTML = v.blocks.length ? v.blocks.map((b, i) => {
    let body = '';
    if (b.type === 'header') body = `<div class="meta">${esc(tr('vblockHeaderHint'))}</div>`;
    if (b.type === 'contact') body = `<div class="meta">${esc(tr('vblockContactHint'))}</div>`;
    if (b.type === 'text') body = `<input type="text" data-f="title" placeholder="${esc(tr('itemTitle'))}" value="${esc(b.title || '')}"><textarea data-f="content" style="margin-top:6px">${esc(b.content || '')}</textarea>
      <select data-f="align" style="max-width:160px;margin-top:6px">${['left', 'center', 'right'].map(x => `<option value="${x}"${(b.align || 'left') === x ? ' selected' : ''}>${esc(tr('align_' + x))}</option>`).join('')}</select>`;
    if (VITRINE_KINDS[b.type]) {
      const pool = assets.filter(a => VITRINE_KINDS[b.type].includes(a.kind));
      const chosen = b.assetIds || [];
      body = pool.length ? pool.map(a => `<label class="choice"><input type="checkbox" data-pick="${esc(a.id)}" ${chosen.includes(a.id) ? 'checked' : ''}> ${assetThumbHtml(a)} ${esc(assetTitle(a))}
          ${isPrivate(a) && v.audience === 'players' && chosen.includes(a.id) ? `<span class="meta" style="color:#b8862e">⚠ ${esc(tr('privateInPublicWarning'))}</span>` : isPrivate(a) ? `<span class="meta">· ${esc(tr('privateFile'))}</span>` : ''}</label>`).join('')
        : `<div class="meta">${esc(tr('vblockNothing_' + b.type))}</div>`;
      if (b.type === 'photo') body += `<input type="text" data-f="caption" placeholder="${esc(tr('photoCaption'))}" value="${esc(b.caption || '')}" style="margin-top:6px">`;
    }
    body += blockAppearanceHtml(b);
    if (b.type === 'links') body = (b.links || []).map((l, j) => `<div class="bar" data-link="${j}" style="margin-bottom:6px"><input type="text" data-f="label" placeholder="${esc(tr('linkLabel'))}" value="${esc(l.label || '')}" style="flex:1 1 140px"><input type="url" data-f="url" placeholder="https://" value="${esc(l.url || '')}" style="flex:2 1 220px"><button class="icon-btn" type="button" data-dellink="${j}">✕</button></div>`).join('')
      + `<button class="btn" type="button" data-addlink>+ ${esc(tr('addLink'))}</button>`;
    return `<div class="card" data-vb="${esc(b.id)}" style="margin-bottom:8px;padding:10px 12px"><div class="bar" style="justify-content:space-between;margin-bottom:6px"><strong>${esc(tr('vblock_' + b.type))}</strong>
      <span style="display:inline-flex;gap:4px;align-items:center">${v.blocks.length > 1 ? dragHandle() : ''}<button class="icon-btn" type="button" data-bdel title="${esc(tr('delete'))}">✕</button></span></div>${body}</div>`;
  }).join('') : `<div class="meta">${esc(tr('vblockNone'))}</div>`;
  fillThumbs(host);
  host.dataset.sortable = 'list';
  if (!host._sortable) { // une seule fois : le conteneur reste, seul son contenu est redessiné
    host._sortable = true;
    makeSortable(host, (f, t) => { syncVitrineBlocks(panel); const bl = S.vitrineDraft.blocks; bl.splice(t, 0, bl.splice(f, 1)[0]); renderVitrineBlocks(panel); });
  }
  host.querySelectorAll('[data-vb]').forEach(row => {
    const b = v.blocks.find(x => x.id === row.dataset.vb); const i = v.blocks.indexOf(b);
    const redo = () => { syncVitrineBlocks(panel); renderVitrineBlocks(panel); };
    row.querySelector('[data-bdel]').onclick = () => { syncVitrineBlocks(panel); v.blocks.splice(i, 1); renderVitrineBlocks(panel); };
    // Ordre des objets = ordre dans lequel on les coche.
    row.querySelectorAll('[data-pick]').forEach(c => c.onchange = () => { const id = c.dataset.pick; b.assetIds = (b.assetIds || []).filter(x => x !== id); if (c.checked) b.assetIds.push(id); redo(); });
    const add = row.querySelector('[data-addlink]'); if (add) add.onclick = () => { syncVitrineBlocks(panel); b.links.push({ label: '', url: '' }); renderVitrineBlocks(panel); };
    row.querySelectorAll('[data-dellink]').forEach(x => x.onclick = () => { syncVitrineBlocks(panel); b.links.splice(Number(x.dataset.dellink), 1); renderVitrineBlocks(panel); });
  });
}

  const admin = p.role === 'admin';
  const redirect = location.origin + '/invitation.html';
  panel.innerHTML = `<div class="card"><h2>${esc(tr('membersTitle'))}</h2><p class="hint">${esc(tr('membersIntro'))}</p>
    ${(p.members || []).map(m => `<div class="list-row" ${m.id ? `data-member="${esc(m.id)}"` : ''}><div class="list-main">${esc(m.email || '')}${m.me ? ' ' + esc(tr('you')) : ''}
        <span class="meta">· ${esc(tr('src_' + m.source))}${m.status === 'invited' ? ' · ' + esc(tr('invitedStatus')) : ''}${m.role === 'admin' ? ' · ' + esc(tr('role_admin')) : ''}</span></div>
        ${m.id && admin && m.status === 'invited' ? `<button class="btn" type="button" data-act="resend">${esc(tr('resend'))}</button>` : ''}
        ${m.id && (admin || m.me) ? `<button class="btn danger" type="button" data-act="remove">${esc(tr(m.me ? 'leave' : 'remove'))}</button>` : ''}</div>`).join('')}
    ${admin ? `<label>${esc(tr('inviteLabel'))}</label><div class="bar"><input type="email" id="invEmail" placeholder="${esc(tr('emailPlaceholder'))}" style="flex:1 1 220px"><button class="btn primary" id="invBtn" type="button">${esc(tr('invite'))}</button></div>
      <p class="hint" style="margin-top:6px">${esc(tr('inviteFreeHint'))}</p>` : ''}
    <div class="msg" id="memMsg"></div></div>`;
  if ($('invBtn')) $('invBtn').onclick = async () => {
    const email = $('invEmail').value.trim(); if (!email) return;
    const r = await PJ.invite(projectId, email, redirect);
    if (r.error) return say('memMsg', tr('errorPrefix', { message: r.error }));
    say('memMsg', r.emailError ? tr('inviteNoEmail', { error: r.emailError, link: r.actionLink || '' }) : tr('inviteSent'), !r.emailError);
    const g = await PJ.get(projectId); if (!g.error) { S.project = g.data; setTimeout(() => renderMembers(panel), 1200); }
  };
  panel.querySelectorAll('[data-member]').forEach(row => {
    const id = row.dataset.member, m = p.members.find(x => x.id === id);
    const b = a => row.querySelector(`[data-act="${a}"]`);
    if (b('resend')) b('resend').onclick = async () => { const r = await PJ.resendInvite(id, redirect); say('memMsg', r.error ? tr('inviteNoEmail', { error: r.error, link: (r.data && r.data.actionLink) || '' }) : tr('inviteSent'), !r.error); };
    if (b('remove')) b('remove').onclick = async () => {
      if (!(await window.LayerPitchNotify.confirm(tr(m.me ? 'leaveConfirm' : 'removeConfirm', { email: m.email }), { okLabel: tr(m.me ? 'leave' : 'remove'), danger: true }))) return;
      const r = await PJ.removeMember(id); if (r.error) return say('memMsg', tr('errorPrefix', { message: r.error }));
      if (m.me) { location.href = './projets.html?lang=' + pageLang; return; }
      const g = await PJ.get(projectId); if (!g.error) { S.project = g.data; renderMembers(panel); }
    };
  });
}

window.LayerPitchShell && window.LayerPitchShell.mount({ active: 'projects', crumbs: [{ label: shellTr('item_projects'), href: 'projets.html' }, { label: '…' }] });
if (!projectId) content.innerHTML = `<div class="card"><p class="hint">${esc(tr('noProject'))}</p></div>`;
else LayerPitchAuth.onAuthStateChange((event) => { if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || !S.project) load(); });
</script>
</body>
</html>
