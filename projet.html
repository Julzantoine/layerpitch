<style>

  .sec-acts .icon-btn { padding: 2px 4px; font-size: 12px; }

  @media (max-width: 900px) { .sec-layout { grid-template-columns: minmax(0, 1fr); } .sec-nav { position: static; max-height: none; } }
  /* Tableau */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .item.pitch { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

  .item img { width: 100%; border-radius: 6px; object-fit: cover; max-height: 200px; }
  .item audio { width: 100%; }

  .preview-thumb { position: relative; display: block; width: 100%; padding: 0; border: 0; background: #111; border-radius: 6px; overflow: hidden; cursor: pointer; }

  .preview-thumb .play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 34px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .preview-embed { width: 100%; border: 0; border-radius: 6px; background: var(--bg); }
  .preview-meta { font-size: 12px; color: var(--text-dim); overflow-wrap: anywhere; }
  .item-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
  /* Glisser-déposer par poignée (28/09, retour de l'essai : plus de flèches) : même principe que le Backstage. La poignée
     arme le déplacement ; l'élément déplacé devient transparent ; un trait bleu marque la destination ; pendant le
     déplacement, les espaces entre éléments sont marqués en pointillés. */
  .drag-handle { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 26px; color: var(--text-dimmer); cursor: grab; flex: 0 0 auto; border-radius: 4px; }
  .drag-handle:hover { color: var(--accent); background: var(--accent-soft); }
  .drag-handle svg { width: 14px; height: 14px; }
  [data-sortable] > * { position: relative; }
  [data-sortable] > .dragging { opacity: .4; }
  [data-sortable].is-reordering > *:not(.dragging) { outline: 2px dashed color-mix(in srgb, var(--accent) 30%, transparent); outline-offset: 3px; }
  [data-sortable] > .drop-before::before, [data-sortable] > .drop-after::after { content: ''; position: absolute; background: var(--accent); border-radius: 2px; z-index: 5; pointer-events: none; }
  [data-sortable="list"] > .drop-before::before { left: 0; right: 0; top: -6px; height: 3px; }
  [data-sortable="list"] > .drop-after::after { left: 0; right: 0; bottom: -6px; height: 3px; }
  [data-sortable="grid"] > .drop-before::before { top: 0; bottom: 0; left: -8px; width: 3px; }
  [data-sortable="grid"] > .drop-after::after { top: 0; bottom: 0; right: -8px; width: 3px; }
  .notes { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; display: flex; flex-direction: column; gap: 6px; }

  .note-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .time-chip { font-family: var(--font-mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); border: none; border-radius: 999px; padding: 1px 7px; cursor: pointer; }
  /* Vidéos */
  .video-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #111; border-radius: 8px; overflow: hidden; }
  .video-wrap video, .video-wrap iframe, .video-wrap > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .timeline { position: relative; height: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; margin: 10px 0; cursor: pointer; }
  .timeline-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text-dim); }
  .marker { position: absolute; top: 2px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-card); }
  .marker.resolved { background: var(--text-dimmer); }
  .list-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .list-row:first-child { border-top: none; }
  .list-main { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
  .pill { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .choice { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; }
  .choice input { width: auto; margin: 0; }
  @media (max-width: 560px) { .bubble { max-width: 100%; } .grid { grid-template-columns: 1fr; } }

  .demo-banner { background: var(--accent-soft); border: 1px solid var(--accent); color: var(--text); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }

  .demo-shell b { display: block; font-family: var(--font-title); font-size: 17px; margin-bottom: 14px; }
  .demo-shell small { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dimmer); margin: 14px 0 4px; }
  .demo-shell span { display: block; padding: 6px 8px; border-radius: 6px; }
  .demo-shell span.on { background: #fff; color: var(--accent); font-weight: 600; }
  body.demo .page { margin-left: 232px; max-width: none; }
  @media (max-width: 900px) { .demo-shell { display: none; } body.demo .page { margin-left: auto; } }
  [data-demo-locked] { opacity: .5; cursor: not-allowed; }
</style>

<script>
const shellTr = k => (window.LayerPitchShell ? window.LayerPitchShell.tr(k) : k); // libellés de la barre commune
// projet.html — espace de travail d'un Projet (chantier profils et permissions, étape 5, 28/09 ; cadrage du 11/09 et D35-D39).
// Onglets : Discussion (tchat + recherche), Moodboard (épingles sur la réserve de contenus du Projet : liens, images, audio,
// vidéos, documents, notes, morceaux, packs ; sélection ★ pour la pré-vitrine ; versions), Vidéos (tous les objets vidéo
// du Projet : fichier privé ou YouTube/Vimeo, annotations horodatées façon SoundCloud), Musique (packs partagés / offerts,
// albums, morceaux et audio du Projet), Vitrine (page publique pour les joueurs), Activité, Membres. Réserve unique depuis
// le 28/09 (migration 20260928130000) : un objet par chose réelle, les sections n'en sont que des vues.
// Présence et mises à jour en direct : canal Supabase Realtime (présence + messages « a changé », sans lire les tables,
// qui restent fermées : tout passe par les RPC). Tous les droits sont vérifiés côté serveur.
const params = new URLSearchParams(location.search);
const DEMO = params.has('demo'); // Projet de démonstration public, en lecture seule
const projectId = params.get('id') || (DEMO ? 'demo' : null);
const pageLang = (params.get('lang') || localStorage.getItem('layerpitch_lang') || 'fr') === 'en' ? 'en' : 'fr';
function tr(key, vars) {
  const I18N = window.LAYERPITCH_I18N || { fr: { shared: {}, projects: {} }, en: { shared: {}, projects: {} } };
  const dict = I18N[pageLang] || I18N.fr, dictFr = I18N.fr;
  let str = (dict.projects && dict.projects[key]) || (dict.shared && dict.shared[key]) || (dictFr.projects && dictFr.projects[key]) || (dictFr.shared && dictFr.shared[key]) || key;
  if (vars) Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  return str;
}
document.documentElement.lang = pageLang;
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
if (window.LayerPlayerCore && window.LayerPlayerCore.setLang) window.LayerPlayerCore.setLang(pageLang);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const realPJ = window.LayerPitchProjects;
// En démonstration, toute écriture est refusée ici (et, de toute façon, en base : aucun compte, aucune fonction d'écriture ouverte).
function demoBlocked() { if (window.LayerPitchNotify) window.LayerPitchNotify.info(tr('demoReadOnly')); return { data: null, error: tr('demoReadOnly') }; }
function demoProjects() {
  const names = m => Object.assign({}, m, { authorEmail: m.authorName, actorEmail: m.actorName, mine: false });
  const reads = {
    get: async () => ({ data: S.demoProject, error: null }),
    content: async () => ({ data: S.demo.content, error: null }),
    messages: async () => ({ data: (S.demo.messages || []).map(names), error: null }),
    activity: async () => ({ data: (S.demo.activity || []).map(names), error: null }),

  setTimeout(() => URL.revokeObjectURL(a.href), 60000);

}

// Glisser un objet (image, vidéo, morceau) sur une section de la colonne pour l'y ranger (sans le retirer d'ailleurs) ; si l'objet
// fait partie d'une sélection, toute la sélection suit. Glisser une section sur une autre : au milieu de la ligne = elle devient
// sa sous-section, en haut / en bas = elle se place avant / après.
content.addEventListener('dragstart', e => {
  if (!S.sections) return;
  const sd = e.target.closest && e.target.closest('[data-secdrag]');
  if (sd) { e.dataTransfer.setData('text/x-lp-section', sd.dataset.secdrag); e.dataTransfer.effectAllowed = 'move'; return; }
  const el = e.target.closest && e.target.closest('[data-dragasset]'); if (!el) return;
  e.dataTransfer.setData('text/x-lp-asset', el.dataset.dragasset); e.dataTransfer.effectAllowed = 'copy';
});
const dropRow = e => e.target.closest && e.target.closest('[data-dropsec]');
const dragTypes = e => [...((e.dataTransfer && e.dataTransfer.types) || [])];
function dropZone(e, row) { // 'before' | 'inside' | 'after' d'après la position du pointeur dans la ligne
  const r = row.getBoundingClientRect(); if (!r.height) return 'inside';
  const y = (e.clientY - r.top) / r.height; return y < 0.25 ? 'before' : y > 0.75 ? 'after' : 'inside';
}
function clearDropMarks() { content.querySelectorAll('.sec-row.drop-over, .sec-row.drop-before, .sec-row.drop-after').forEach(x => x.classList.remove('drop-over', 'drop-before', 'drop-after')); }
content.addEventListener('dragover', e => {
  const r = dropRow(e); clearDropMarks();
  if (!r || !e.dataTransfer) return;
  const t = dragTypes(e);
  if (t.includes('text/x-lp-asset')) { e.preventDefault(); r.classList.add('drop-over'); }
  else if (t.includes('text/x-lp-section')) { e.preventDefault(); r.classList.add('drop-' + (dropZone(e, r) === 'inside' ? 'over' : dropZone(e, r))); }
});
content.addEventListener('dragleave', e => { const r = dropRow(e); if (r && !r.contains(e.relatedTarget)) r.classList.remove('drop-over', 'drop-before', 'drop-after'); });
// Place une section par rapport à une autre : zone 'inside' = au bout des sous-sections de la cible, sinon avant / après elle.
async function moveSectionNear(id, targetId, zone) {
  if (id === targetId || secDescendants(id).includes(targetId)) return;
  const target = secById(targetId); if (!target) return;
  if (zone === 'inside') { if (secError(await PJ.moveSection(id, targetId, null))) return; return sectionsChanged(); }
  const parent = target.parentId || null, sibs = secKids(parent).filter(x => x.id !== id), idx = sibs.findIndex(x => x.id === targetId);
  if (secError(await PJ.moveSection(id, parent, zone === 'before' ? idx : idx + 1))) return;
  await sectionsChanged();
}
content.addEventListener('drop', async e => {
  const r = dropRow(e); if (!r) return;
  const secId = e.dataTransfer.getData('text/x-lp-section'), zone = secId ? dropZone(e, r) : null;
  const id = e.dataTransfer.getData('text/x-lp-asset'); clearDropMarks();
  if (secId) { e.preventDefault(); return moveSectionNear(secId, r.dataset.dropsec, zone); }
  if (!id) return;
  e.preventDefault();
  const ids = S.selMode && S.selected.has(id) ? [...S.selected] : [id];
  if (secError(await PJ.addAssetsToSection(r.dataset.dropsec, ids))) return;
  window.LayerPitchNotify.info(tr('secDropped', { title: secById(r.dataset.dropsec).title }));
  await sectionsChanged();
});

async function fileUrl(fileId) {

  const r = await PJ.fileUrl(fileId);

}

async function reloadContent() { const c = await PJ.content(projectId); if (!c.error) S.content = c.data; await loadSections(); if ($('secNav')) renderSecNav(); }
function joinChannel() {
  if (S.channel) return;
  try {
    const client = window.LayerPitchSupabaseClient.getClient();
    S.channel = client.channel('project:' + projectId, { config: { presence: { key: S.me.id } } });
    S.channel.on('presence', { event: 'sync' }, renderPresence);
    S.channel.on('broadcast', { event: 'changed' }, async ({ payload }) => {
      markProjectSeen();
      if (payload.what === 'messages') {
        await loadMessages();
        if (!chatVisible()) { S.unread++; if (!S.firstUnreadId && S.messages[0] && !S.messages[0].mine) S.firstUnreadId = S.messages[0].id; }
        renderChat();
      }
      else if (payload.what === 'content') { await reloadContent(); if (S.video) S.video = assetById(S.video.id) || null; if (['board', 'videos', 'images', 'music', 'showcase'].includes(S.tab) && !(S.tab === 'showcase' && S.vitrineDraft)) renderPanel(); /* jamais pendant l'édition d'une vitrine */ }
      else if (payload.what === 'appearance') { const ap = await PJ.appearance(projectId); if (!ap.error) { S.appearance = ap.data || {}; applyProjectAppearance(); } }
      else if (payload.what === 'secmessages') {
        await loadSections();
        if (S.chan && S.chan === payload.sectionId) { await loadSecMessages(); if (chatVisible()) await PJ.markSectionRead(S.chan); await loadSections(); }
        if ($('secNav')) renderSecNav();

      else if (payload.what === 'sections') { await loadSections(); if (SECTION_TABS.includes(S.tab) && !S.secEdit) renderPanel(); }
      else if (payload.what === 'maps' && S.tab === 'map') { if (!(S.mapView && S.mapView.state.dirty)) renderPanel(); }
      else if (payload.what === 'notes' && S.video) { await loadVideoNotes(); renderPanel(); }
    });
    S.channel.subscribe(status => { if (status === 'SUBSCRIBED') S.channel.track({ email: S.me.email }); });
  } catch (e) { console.warn('temps réel indisponible', e); }
}

// ---- Dépôt en vrac (8/10) : on glisse des fichiers (ou des liens) depuis le Mac sur l'onglet ; chacun est envoyé puis rangé tout
// seul d'après son type (image, audio, vidéo, document ; lien vidéo YouTube / Vimeo ou lien simple) et apparaît dans le bon onglet.
// Sur le Moodboard, il y est aussi épinglé (celui de la section choisie, ou le général) ; si une section est choisie, il y est rangé.
const DROP_KIND = f => /^image\/(jpeg|png|webp|gif)$/.test(f.type) ? 'image' : /^audio\//.test(f.type) ? 'audio' : /^video\/(mp4|webm|quicktime)$/.test(f.type) || /\.mov$/i.test(f.name) ? 'video' : f.type === 'application/pdf' ? 'file' : null;
const dropHasContent = e => { const t = [...((e.dataTransfer && e.dataTransfer.types) || [])]; return t.includes('Files') || t.includes('text/uri-list'); };
function wireBulkDrop(host) {
  host.ondragover = e => { if (!dropHasContent(e)) return; e.preventDefault(); host.classList.add('drop-files'); };
  host.ondragleave = e => { if (!host.contains(e.relatedTarget)) host.classList.remove('drop-files'); };
  host.ondrop = e => {
    host.classList.remove('drop-files');
    if (!dropHasContent(e) || e.target.closest('[data-dropsec]')) return;
    e.preventDefault();
    const files = [...e.dataTransfer.files], uris = files.length ? [] : (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '').split(/\r?\n/).map(x => x.trim()).filter(x => /^https?:\/\//i.test(x));
    dropIntoProject(files, uris);
  };
}
async function dropIntoProject(files, urls) {
  const pin = S.tab === 'board', also = !!($('alsoGeneral') && $('alsoGeneral').checked), N = window.LayerPitchNotify;
  let added = 0;
  for (const f of files) {
    const kind = DROP_KIND(f);
    if (!kind) { N.error(tr('dropRejected', { name: f.name })); continue; }
    N.info(tr('uploadingNamed', { name: f.name }));
    const up = await uploadOrReuse(f);
    if (up.error) { N.error(tr('errorPrefix', { message: f.name + ' : ' + up.error })); continue; }
    const r = await addAsset(projectId, { kind, fileId: up.data.fileId, title: f.name, origin: 'own' }, pin);
    if (r.error) { N.error(tr('errorPrefix', { message: f.name + ' : ' + r.error })); continue; }
    if (also && pin && r.data && r.data.id) await PJ.pin(r.data.id, true);
    added++;
  }
  for (const url of urls) {
    const r = await addAsset(projectId, VIDEO_URL.test(url) ? { kind: 'video', url } : { kind: 'link', url }, pin);
    if (r.error) { N.error(tr('errorPrefix', { message: url + ' : ' + r.error })); continue; }
    if (also && pin && r.data && r.data.id) await PJ.pin(r.data.id, true);
    added++;
  }
  if (added) { N.info(tr('dropDone', { n: added })); await reloadContent(); renderPanel(); broadcast('content'); if (S.sections) broadcast('sections'); }
}

function wireComposer(aside) {
  const addFiles = files => { const list = [...files].filter(f => f && f.size); if (!list.length) return; const draft = $('newMsg').value; S.pending = S.pending.concat(list).slice(0, 10); renderChat(); $('newMsg').value = draft; $('newMsg').focus(); };
  $('attachBtn').onclick = () => $('attachInput').click();
  $('attachInput').onchange = e => addFiles(e.target.files);
  aside.querySelectorAll('[data-unpend]').forEach(b => b.onclick = () => { const draft = $('newMsg').value; S.pending.splice(Number(b.dataset.unpend), 1); renderChat(); $('newMsg').value = draft; });
  $('newMsg').addEventListener('paste', e => { const files = [...(e.clipboardData && e.clipboardData.files || [])]; if (files.length) { e.preventDefault(); addFiles(files); } });
  aside.ondragover = e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); aside.classList.add('drop'); } };
  aside.ondragleave = e => { if (!aside.contains(e.relatedTarget)) aside.classList.remove('drop'); };
  aside.ondrop = e => { e.preventDefault(); aside.classList.remove('drop'); addFiles(e.dataTransfer.files); };
  const send = async () => {
    const body = $('newMsg').value.trim(); if (!body && !S.pending.length) return;
    $('sendBtn').disabled = true;
    const attachments = [];
    for (const f of S.pending) {
      say('threadMsg', tr('uploadingNamed', { name: f.name }), true);
      const up = await uploadOrReuse(f);
      if (up.error) { say('threadMsg', tr('errorPrefix', { message: f.name + ' : ' + up.error })); $('sendBtn').disabled = false; return; }
      attachments.push({ fileId: up.data.fileId, title: f.name });
    }
    const r = S.chan ? await PJ.postSectionMessage(S.chan, body, attachments) : await PJ.post(projectId, body, attachments);
    if (r.error) { say('threadMsg', tr('errorPrefix', { message: r.error })); $('sendBtn').disabled = false; return; }
    S.pending = [];
    if (S.chan) {
      await Promise.all([loadSecMessages(), attachments.length ? reloadContent() : loadSections()]);
      renderChat(); if ($('secNav')) renderSecNav(); if (SECTION_TABS.includes(S.tab) && attachments.length) renderPanel();
      broadcast('secmessages', { sectionId: S.chan }); if (attachments.length) { broadcast('content'); broadcast('sections'); }
      return;
    }
    await Promise.all([loadMessages(), attachments.length ? reloadContent() : null]);
    renderChat(); broadcast('messages'); if (attachments.length) broadcast('content');
  };
  $('sendBtn').onclick = send;
  $('newMsg').onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(); };
}

async function addItem() {
  const kind = $('addKind').value;
  const val = id => ($(id) ? $(id).value.trim() : '');
  $('addBtn').disabled = true;
  const also = !!($('alsoGeneral') && $('alsoGeneral').checked); // Moodboard d'une section : épingler aussi au général
  const done = async (r, assetId) => {
    if (r.error) { say('boardMsg', tr('errorPrefix', { message: r.error })); $('addBtn').disabled = false; return; }
    const id = assetId || (r.data && r.data.id);
    if (also && id) { const g = await PJ.pin(id, true); if (g.error) { say('boardMsg', tr('errorPrefix', { message: g.error })); $('addBtn').disabled = false; return; } }
    if (r.data && r.data.existed) window.LayerPitchNotify.info(tr('alreadyInProject'));
    await reloadContent(); renderPanel(); broadcast('content');
  };
  if (kind === 'fromProject') return done(boardSection() ? await PJ.pinInSection(boardSection(), val('fAsset'), true) : await PJ.pin(val('fAsset'), true), val('fAsset'));
  let payload;
  if (kind === 'upload') {
    const file = $('fFile').files[0];
    if (!file) { say('boardMsg', tr('chooseFile')); $('addBtn').disabled = false; return; }
    say('boardMsg', tr('uploading'), true);
    const up = await uploadOrReuse(file);
    if (up.error) { say('boardMsg', tr('errorPrefix', { message: up.error })); $('addBtn').disabled = false; return; }
    const k = file.type.startsWith('image/') ? 'image' : file.type.startsWith('audio/') ? 'audio' : file.type.startsWith('video/') ? 'video' : 'file';
    payload = { kind: k, fileId: up.data.fileId, title: val('fTitle') || file.name, body: val('fBody'), origin: $('fReference').checked ? 'external' : 'own' };
  } else if (kind === 'link') payload = { kind, url: val('fUrl'), title: val('fTitle'), body: val('fBody') };
  else if (kind === 'note') payload = { kind, title: val('fTitle'), body: val('fBody') };
  else if (kind === 'track') payload = { kind, trackId: val('fTrack'), body: val('fBody') };
  else payload = { kind, packId: val('fPack'), body: val('fBody') };
  done(await addAsset(projectId, payload, true));
}
// Aperçus (étape 2) : services connus seulement, même liste que l'Edge Function link-preview. Le lecteur n'est inséré que
// si son adresse commence par l'un de ces préfixes (défense en profondeur : link-preview les vérifie déjà).
const PREVIEW_HOSTS = /^https?:\/\/(www\.|m\.|music\.|on\.|open\.|link\.)?(youtube\.com|youtu\.be|vimeo\.com|soundcloud\.com|spotify\.com|deezer\.com|deezer\.page\.link|[a-z0-9-]+\.bandcamp\.com)\//i;
const EMBED_PREFIXES = ['https://www.youtube-nocookie.com/embed/', 'https://player.vimeo.com/video/', 'https://w.soundcloud.com/player/', 'https://open.spotify.com/embed/', 'https://widget.deezer.com/widget/', 'https://bandcamp.com/EmbeddedPlayer/'];
const PROVIDER_NAMES = { youtube: 'YouTube', vimeo: 'Vimeo', soundcloud: 'SoundCloud', spotify: 'Spotify', deezer: 'Deezer', bandcamp: 'Bandcamp' };
S.previewTried = new Set();
// Objet avec lien d'un service connu mais sans aperçu : on le demande une fois par visite, puis on rafraîchit.
function requestPreview(a) {
  if (!a.url || a.preview || S.previewTried.has(a.id) || !PREVIEW_HOSTS.test(a.url)) return;
  S.previewTried.add(a.id);
  PJ.preview(a.id).then(async r => { if (!r.error && r.data && r.data.preview && !r.data.preview.failed) { await reloadContent(); if (S.tab === 'board') renderPanel(); broadcast('content'); } });
}
function previewHtml(a) {
  const p = a.preview;
  if (!p || p.failed) return '';
  const embed = p.embedUrl && EMBED_PREFIXES.some(x => p.embedUrl.startsWith(x)) ? p.embedUrl : null;
  const thumb = p.thumbnail && /^https:\/\//.test(p.thumbnail) ? p.thumbnail : null;
  const name = PROVIDER_NAMES[p.provider] || '';
  return (thumb || embed ? `<button class="preview-thumb" type="button" data-act="play" ${embed ? '' : 'disabled'} title="${esc(tr('playHere'))}">${thumb ? `<img src="${esc(thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<div style="height:90px"></div>'}${embed ? '<span class="play">▶</span>' : ''}</button>` : '')
    + `<div class="preview-meta">${p.author ? esc(p.author) + ' · ' : ''}<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(tr('openOn', { service: name }))} ↗</a></div>`;
}
// Remplace la vignette par le lecteur officiel du service (iframe isolée, sans accès à la page).
function playPreview(el, a) {
  const p = a.preview; const btn = el.querySelector('[data-act="play"]');
  if (!p || !btn || !p.embedUrl || !EMBED_PREFIXES.some(x => p.embedUrl.startsWith(x))) return;
  const f = document.createElement('iframe');
  f.className = 'preview-embed'; f.src = p.embedUrl + (p.provider === 'youtube' || p.provider === 'vimeo' ? (p.embedUrl.includes('?') ? '&' : '?') + 'autoplay=1' : '');
  f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture'; f.allowFullscreen = true; f.loading = 'lazy'; f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-presentation');
  if (p.embedHeight) f.style.height = p.embedHeight + 'px'; else f.style.aspectRatio = '16 / 9';

function makeSortable(host, onMove) {
  const grid = host.dataset.sortable === 'grid';
  const items = () => [...host.children].filter(el => el.querySelector(':scope .drag-handle'));
  let from = -1;
  const clear = () => items().forEach(el => el.classList.remove('drop-before', 'drop-after'));
  host.addEventListener('pointerdown', e => { const h = e.target.closest('.drag-handle'); const it = h && items().find(el => el.contains(h)); if (it) it.draggable = true; });
  host.addEventListener('dragstart', e => {
    const it = items().find(el => el === e.target); if (!it) return;
    from = items().indexOf(it); it.classList.add('dragging'); host.classList.add('is-reordering');
    e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(from)); } catch (x) {}
  });
  host.addEventListener('dragover', e => {
    if (from < 0) return;
    const it = items().find(el => el.contains(e.target)); if (!it) return;
    e.preventDefault(); clear();
    const r = it.getBoundingClientRect();
    const before = grid ? e.clientX < r.left + r.width / 2 : e.clientY < r.top + r.height / 2;
    it.classList.add(before ? 'drop-before' : 'drop-after');
  });
  host.addEventListener('drop', e => {
    if (from < 0) return; e.preventDefault();
    const list = items(); const target = list.find(el => el.classList.contains('drop-before') || el.classList.contains('drop-after'));
    let to = from;
    if (target) { to = list.indexOf(target) + (target.classList.contains('drop-after') ? 1 : 0); if (to > from) to--; }
    const f = from; from = -1; clear();
    if (to !== f) onMove(f, to);
  });
  host.addEventListener('dragend', () => { from = -1; clear(); host.classList.remove('is-reordering'); items().forEach(el => { el.classList.remove('dragging'); el.draggable = false; }); });
}

// Notes d'un objet. media (facultatif, étape 4) : { now() -> { seconds, part }, seek(t) } pour noter « à cet instant » un
// fichier audio ou un morceau : instant (et partie d'un morceau adaptatif, modifiable avant d'enregistrer) ; un clic sur
// l'instant d'une note y ramène le lecteur quand c'est possible (fichier audio).
async function renderNotes(box, targetType, targetId, media) {
  const r = await PJ.annotations(projectId, targetType, targetId);

  box.innerHTML = list.map(n => noteHtml(n, !!media, media && media.seek)).join('') + `
    ${media ? `<div class="bar"><button class="btn" type="button" data-role="noteHere">${esc(tr('noteHere'))}</button>

    <textarea data-role="noteBody" placeholder="${esc(tr('notePlaceholder'))}" style="min-height:48px"></textarea>
    <div class="bar"><select data-role="noteTo" style="flex:1 1 140px">${memberOptions()}</select><button class="btn" type="button" data-role="noteAdd">${esc(tr('addNote'))}</button></div>`;
  wireNotes(box, list, () => renderNotes(box, targetType, targetId, media));
  let at = null;
  const here = box.querySelector('[data-role="noteHere"]');
  if (here) here.onclick = () => {
    const now = media.now() || {};
    at = { seconds: Math.round((Number(now.seconds) || 0) * 10) / 10, part: now.part || '' };
    box.querySelector('[data-role="noteAtLabel"]').textContent = tr('noteAt', { t: clock(at.seconds) });
    const partInput = box.querySelector('[data-role="notePart"]');

    box.querySelector('[data-role="noteBody"]').focus();

  box.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => media && media.seek && media.seek(Number(b.dataset.seek)));
  box.querySelector('[data-role="noteAdd"]').onclick = async () => {
    const body = box.querySelector('[data-role="noteBody"]').value.trim(); if (!body) return;
    const to = box.querySelector('[data-role="noteTo"]').value || null;
    const part = at && media.hasParts ? box.querySelector('[data-role="notePart"]').value.trim() : null;
    const res = await PJ.annotate(projectId, targetType, targetId, at ? at.seconds : null, body, to, location.href, part);
    if (res.error) return window.LayerPitchNotify.error(tr('errorPrefix', { message: res.error }));

}
function noteHtml(n, withTime, canSeek) {
  const label = [n.atPart, n.atSeconds != null ? clock(n.atSeconds) : null].filter(Boolean).join(' · ');
  const chip = withTime && label ? ((canSeek === undefined || !!canSeek) && n.atSeconds != null ? `<button class="time-chip" type="button" data-seek="${esc(n.atSeconds)}">${esc(label)}</button>` : `<span class="time-chip">${esc(label)}</span>`) : '';
  return `<div class="note${n.resolved ? ' resolved' : ''}" data-note="${esc(n.id)}">
    <div class="note-head">${chip}
      <strong>${esc(n.authorEmail || '')}</strong>${n.addresseeEmail ? ` → ${esc(n.addresseeEmail)}` : ''}${n.private ? ` <span class="meta">🔒 ${esc(tr('notePrivateShort'))}</span>` : ''}

// Instant et partie affichés par le lecteur LayerPitch d'un morceau (compteur de temps, partie en cours : carte des
// chemins, bloc séquentiel ou section active). Lecture de l'affichage : rien à changer dans le lecteur.
function trackPosition(host) {
  const t = host && host.querySelector('[data-role="timeCurrent"]');
  const parts = String(t ? t.textContent : '0:00').trim().split(':').map(Number);
  const seconds = parts.reduce((acc, x) => acc * 60 + (Number.isFinite(x) ? x : 0), 0);
  const cur = host && host.querySelector('.seq-map-node.current .seq-map-node-label, .seq-block.active .seq-block-label, .wwise-node.active .wwise-node-label, [class*="vr-block"].active');
  return { seconds, part: cur ? cur.textContent.replace(/\s+/g, ' ').trim().slice(0, 80) : '' };
}
function mediaFor(el, a) {
  if (a.kind === 'audio') {
    const au = el.querySelector('audio');
    return au ? { now: () => ({ seconds: au.currentTime }), seek: t => { au.currentTime = t; au.play().catch(() => {}); }, hasParts: false } : null;
  }
  if (a.kind === 'track') {
    const host = el.querySelector('[data-role="player"]');
    return { now: () => trackPosition(host), seek: null, hasParts: true };
  }
  return null;
}
function wireNotes(box, list, refresh) {

    const id = row.dataset.note;

    const d = row.querySelector('[data-role="delNote"]'); if (d) d.onclick = async () => { await PJ.deleteAnnotation(id); refresh(); broadcast('notes'); };
  });
}

function drawNow() { const d = V.duration(); const n = $('vNow'); if (n && d) n.style.left = (100 * V.get() / d) + '%'; }
function drawTimeline() {
  const tl = $('vTimeline'); if (!tl) return;

  const d = V.duration();
  if (!d) { setTimeout(drawTimeline, 500); return; }
  S.videoNotes.filter(n => n.atSeconds != null).forEach(n => {

    m.style.left = Math.min(100, 100 * n.atSeconds / d) + '%';

    m.onclick = e => { e.stopPropagation(); V.seek(Number(n.atSeconds)); };
    tl.appendChild(m);
  });
}

// ---- Musique : packs partagés / offerts, albums ----
// ---- Carte de niveau (6/10, migration 20261006020000) : dessiner un niveau puis y déposer des sons de la bibliothèque ----
// Éditeur et fonctions pures : projet-carte.js. Sons proposés : morceaux et Sfx de la bibliothèque du compositeur, et l'audio du Projet.
// Lecture de la carte : les sons de la bibliothèque jouent avec le vrai lecteur (morceaux adaptatifs, plusieurs EN MÊME TEMPS : fond
// d'ambiance, morceau en cours, morceau qui entre) ; Sfx et audio du Projet sont décodés et bouclés. Les lecteurs de morceaux sont montés
// hors de l'écran, une seule fois par morceau.
function mapAudioEnv() {
  const P = window.LayerPlayerCore;
  if (!P || !window.LayerPitchLevelMapAudio) return null;
  let rack = $('mapAudioRack');
  if (!rack) { rack = document.createElement('div'); rack.id = 'mapAudioRack'; rack.setAttribute('aria-hidden', 'true'); rack.style.cssText = 'position:absolute;left:-9999px;top:0;width:640px;pointer-events:none'; document.body.appendChild(rack); }
  const factory = window.LayerPitchLevelMapAudio.createVoiceFactory({
    audioContext: () => P.audioContext(),
    fetchBytes: url => P.fetchAudioBytes(url),
    decode: bytes => P.decodeAudioCompat(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength)),
    resolve: async ref => {
      if (ref.kind === 'sfx') {
        const r = await LayerPitchSfx.listSfxByIds([ref.id]);
        const sfx = r.sfx && r.sfx[0];
        const alts = (sfx && sfx.alternatives || []).filter(a => a.file);
        if (!alts.length || !sfx.base) return null;
        return { type: 'url', url: sfx.base + encodeURIComponent(alts[Math.floor(Math.random() * alts.length)].file), loop: true };
      }
      if (ref.kind === 'asset') {
        const a = assetById(ref.id);
        if (!a) return null;
        if (a.kind === 'track') { const r = await LayerPitchTracks.listTracksByIds([a.trackId]); return r.tracks && r.tracks[0] ? { type: 'track', track: r.tracks[0] } : null; }
        const url = await fileUrl(a.fileId);
        return url ? { type: 'url', url, loop: true } : null;
      }
      const r = await LayerPitchTracks.listTracksByIds([ref.id]);
      return r.tracks && r.tracks[0] ? { type: 'track', track: r.tracks[0] } : null;
    },
    mountTrackControl: async track => {
      const row = P.buildTrackRow(track, null, false);
      rack.appendChild(row);
      P.initTrackPlayer(track, row, null, { concurrent: true });
      return row.lpControl;
    },
  });
  const pending = new Set();
  return {
    voiceFactory: async ref => { try { await P.resumeAudio(); return await factory(ref); } catch (e) { console.warn('carte : son indisponible', ref, e); return null; } },
    now: () => P.audioNow(),
    // Minuterie : à `at` (horloge audio, en secondes) ; rend la fonction qui l'annule.
    schedule: (fn, at) => { const id = setTimeout(() => { pending.delete(id); fn(); }, Math.max(0, (at - P.audioNow()) * 1000)); pending.add(id); return () => { clearTimeout(id); pending.delete(id); }; },
  };
}

// Lit les champs des blocs (texte, liens) dans le brouillon.
function syncVitrineBlocks(panel) {
  const v = S.vitrineDraft;
  panel.querySelectorAll('[data-vb]').forEach(row => {
    const b = v.blocks.find(x => x.id === row.dataset.vb); if (!b) return;
    if (b.type === 'text') { b.title = row.querySelector('[data-f="title"]').value; b.content = row.querySelector('[data-f="content"]').value; b.align = row.querySelector('[data-f="align"]').value; }
    if (b.type === 'links') b.links = [...row.querySelectorAll('[data-link]')].map(l => ({ label: l.querySelector('[data-f="label"]').value.trim(), url: l.querySelector('[data-f="url"]').value.trim() }));
    if (b.type === 'photo') b.caption = row.querySelector('[data-f="caption"]').value;
    // Apparence de ce bloc : seulement les réglages cochés (un bloc sans réglage suit le thème de la vitrine).
    const ap = {};
    row.querySelectorAll('[data-ap]').forEach(i => { const on = row.querySelector(`[data-apon="${i.dataset.ap}"]`); if (on && on.checked && i.value) ap[i.dataset.ap] = i.value; });
    if (Object.keys(ap).length) b.appearance = ap; else delete b.appearance;
  });
}

function renderVitrineBlocks(panel) {
  const v = S.vitrineDraft;
  const host = $('vBlocks');

  const isPrivate = a => !!a.fileId; // fichier envoyé dans le Projet : pas public aujourd'hui (Q7 : autorisé, avec avertissement)
  host.innerHTML = v.blocks.length ? v.blocks.map((b, i) => {
    let body = '';
    if (b.type === 'header') body = `<div class="meta">${esc(tr('vblockHeaderHint'))}</div>`;
    if (b.type === 'contact') body = `<div class="meta">${esc(tr('vblockContactHint'))}</div>`;
    if (b.type === 'text') body = `<input type="text" data-f="title" placeholder="${esc(tr('itemTitle'))}" value="${esc(b.title || '')}"><textarea data-f="content" style="margin-top:6px">${esc(b.content || '')}</textarea>
      <select data-f="align" style="max-width:160px;margin-top:6px">${['left', 'center', 'right'].map(x => `<option value="${x}"${(b.align || 'left') === x ? ' selected' : ''}>${esc(tr('align_' + x))}</option>`).join('')}</select>`;
    if (VITRINE_KINDS[b.type]) {
      const pool = assets.filter(a => VITRINE_KINDS[b.type].includes(a.kind));
      const chosen = b.assetIds || [];
      body = pool.length ? pool.map(a => `<label class="choice"><input type="checkbox" data-pick="${esc(a.id)}" ${chosen.includes(a.id) ? 'checked' : ''}> ${assetThumbHtml(a)} ${esc(assetTitle(a))}
          ${isPrivate(a) && v.audience === 'players' && chosen.includes(a.id) ? `<span class="meta" style="color:#b8862e">⚠ ${esc(tr('privateInPublicWarning'))}</span>` : isPrivate(a) ? `<span class="meta">· ${esc(tr('privateFile'))}</span>` : ''}</label>`).join('')
        : `<div class="meta">${esc(tr('vblockNothing_' + b.type))}</div>`;
      if (b.type === 'photo') body += `<input type="text" data-f="caption" placeholder="${esc(tr('photoCaption'))}" value="${esc(b.caption || '')}" style="margin-top:6px">`;
    }
    body += blockAppearanceHtml(b);
    if (b.type === 'links') body = (b.links || []).map((l, j) => `<div class="bar" data-link="${j}" style="margin-bottom:6px"><input type="text" data-f="label" placeholder="${esc(tr('linkLabel'))}" value="${esc(l.label || '')}" style="flex:1 1 140px"><input type="url" data-f="url" placeholder="https://" value="${esc(l.url || '')}" style="flex:2 1 220px"><button class="icon-btn" type="button" data-dellink="${j}">✕</button></div>`).join('')
      + `<button class="btn" type="button" data-addlink>+ ${esc(tr('addLink'))}</button>`;
    return `<div class="card" data-vb="${esc(b.id)}" style="margin-bottom:8px;padding:10px 12px"><div class="bar" style="justify-content:space-between;margin-bottom:6px"><strong>${esc(tr('vblock_' + b.type))}</strong>
      <span style="display:inline-flex;gap:4px;align-items:center">${v.blocks.length > 1 ? dragHandle() : ''}<button class="icon-btn" type="button" data-bdel title="${esc(tr('delete'))}">✕</button></span></div>${body}</div>`;
  }).join('') : `<div class="meta">${esc(tr('vblockNone'))}</div>`;
  fillThumbs(host);
  host.dataset.sortable = 'list';
  if (!host._sortable) { // une seule fois : le conteneur reste, seul son contenu est redessiné
    host._sortable = true;
    makeSortable(host, (f, t) => { syncVitrineBlocks(panel); const bl = S.vitrineDraft.blocks; bl.splice(t, 0, bl.splice(f, 1)[0]); renderVitrineBlocks(panel); });
  }
  host.querySelectorAll('[data-vb]').forEach(row => {
    const b = v.blocks.find(x => x.id === row.dataset.vb); const i = v.blocks.indexOf(b);
    const redo = () => { syncVitrineBlocks(panel); renderVitrineBlocks(panel); };
    row.querySelector('[data-bdel]').onclick = () => { syncVitrineBlocks(panel); v.blocks.splice(i, 1); renderVitrineBlocks(panel); };
    // Ordre des objets = ordre dans lequel on les coche.
    row.querySelectorAll('[data-pick]').forEach(c => c.onchange = () => { const id = c.dataset.pick; b.assetIds = (b.assetIds || []).filter(x => x !== id); if (c.checked) b.assetIds.push(id); redo(); });
    const add = row.querySelector('[data-addlink]'); if (add) add.onclick = () => { syncVitrineBlocks(panel); b.links.push({ label: '', url: '' }); renderVitrineBlocks(panel); };
    row.querySelectorAll('[data-dellink]').forEach(x => x.onclick = () => { syncVitrineBlocks(panel); b.links.splice(Number(x.dataset.dellink), 1); renderVitrineBlocks(panel); });
  });
}
